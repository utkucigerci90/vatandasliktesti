<style>
/* ---------- Tokens (light) ---------- */
:root {
  --bg: #FBF6EF;
  --surface: #FFFFFF;
  --surface-2: #F4ECE1;
  --fg: #1F1A17;
  --muted: #6B5F55;
  --line: #EADFD2;
  --line-strong: #CDBFAE;
  --accent: #1F5FAD;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EFFA;
  --accent-soft-ink: #1A4A86;
  --cta: #C2410C;
  --cta-ink: #FFFFFF;
  --warm-soft: #FFEBDD;
  --warm-ink: #7A2E0A;
  --mark: #F2CF3B;
  --mark-ink: #3A2E00;
  --ok: #1B7F4C;
  --ok-soft: #DCF2E4;
  --ok-ink: #0F5A33;
  --bad: #B4231C;
  --bad-soft: #FBE4E0;
  --bad-ink: #7E1812;
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 10px 30px rgba(60, 40, 20, .08);
  --on-status: #FFFFFF;
  --knob: #FFFFFF;
  --knob-shadow: rgba(20, 26, 31, .3);
  --scrim: rgba(25, 18, 12, .55);
  --hover-tint: rgba(31, 26, 23, .07);
  --font-body: "Public Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-display: "Nunito", "Public Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --r-card: 16px;
  --r-ctl: 12px;
  --r-box: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17130F;
    --surface: #211B16;
    --surface-2: #2A231D;
    --fg: #F3ECE4;
    --muted: #B5A797;
    --line: #3A3129;
    --line-strong: #5A4D41;
    --accent: #8DB6EE;
    --accent-ink: #0B1E3A;
    --accent-soft: #1C2A3D;
    --accent-soft-ink: #C3D7F3;
    --cta: #F08A4B;
    --cta-ink: #1F1006;
    --warm-soft: #3A2416;
    --warm-ink: #FFD3B5;
    --mark: #E0C34A;
    --mark-ink: #2A2100;
    --ok: #5CC489;
    --ok-soft: #12301F;
    --ok-ink: #A9E6C2;
    --bad: #F08A80;
    --bad-soft: #3A1715;
    --bad-ink: #F7C2BC;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    --on-status: #17130F;
    --knob: #F3ECE4;
    --knob-shadow: rgba(0, 0, 0, .5);
    --scrim: rgba(0, 0, 0, .65);
    --hover-tint: rgba(243, 236, 228, .1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17130F;
  --surface: #211B16;
  --surface-2: #2A231D;
  --fg: #F3ECE4;
  --muted: #B5A797;
  --line: #3A3129;
  --line-strong: #5A4D41;
  --accent: #8DB6EE;
  --accent-ink: #0B1E3A;
  --accent-soft: #1C2A3D;
  --accent-soft-ink: #C3D7F3;
  --cta: #F08A4B;
  --cta-ink: #1F1006;
  --warm-soft: #3A2416;
  --warm-ink: #FFD3B5;
  --mark: #E0C34A;
  --mark-ink: #2A2100;
  --ok: #5CC489;
  --ok-soft: #12301F;
  --ok-ink: #A9E6C2;
  --bad: #F08A80;
  --bad-soft: #3A1715;
  --bad-ink: #F7C2BC;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  --on-status: #17130F;
  --knob: #F3ECE4;
  --knob-shadow: rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .65);
  --hover-tint: rgba(243, 236, 228, .1);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.5;
  overflow-x: hidden;
  min-height: 100vh;
}
/* Fixed band that paints the status-bar area (notch) in the header colour */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0;
  height: env(safe-area-inset-top, 0px);
  background: var(--surface);
  z-index: 40;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 .75rem; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
img { max-width: 100%; height: auto; display: block; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: var(--r-ctl); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- Layout ---------- */
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(2rem + env(safe-area-inset-bottom, 0px));
}
.col { max-width: 640px; margin: 0 auto; }
.prose { max-width: 65ch; }

/* ---------- Header ---------- */
.hdr {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hdr-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; min-height: 48px; max-width: 640px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: .45rem; text-decoration: none; color: var(--fg); min-height: 44px; align-items: center; }
.brand-mark { width: 26px; height: 26px; border: 2px solid var(--fg); border-radius: var(--r-box); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 16px; height: 16px; }
.brand-name { font-family: var(--font-display); font-size: 1.05rem; line-height: 1; }
.brand-name small { font-family: var(--font-body); font-size: .72rem; color: var(--muted); display: block; margin-top: .2rem; letter-spacing: .01em; }
.state-chip {
  display: inline-flex; align-items: center; gap: .35rem;
  min-height: 44px; padding: 0 .7rem;
  border: 1px solid var(--line-strong); border-radius: 999px; background: transparent;
  font-size: .85rem; cursor: pointer; white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis;
}
.state-chip:hover { background: var(--surface-2); }
.state-chip .code { font-weight: 700; color: var(--accent); }
.tabs { display: flex; max-width: 640px; margin: 0 auto; gap: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 1 0; min-width: 72px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
  text-decoration: none; color: var(--muted); font-weight: 600; font-size: .92rem; letter-spacing: .005em;
  border-bottom: 3px solid transparent; padding: .5rem .25rem; white-space: nowrap;
}
.tab[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .badge { background: var(--bad); color: var(--on-status); font-size: .7rem; min-width: 1.3rem; height: 1.3rem; border-radius: 999px; display: inline-grid; place-items: center; padding: 0 .3rem; font-variant-numeric: tabular-nums; }

/* ---------- Views ---------- */
.view { padding-top: 1.25rem; }
.view > * + * { margin-top: 1rem; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .5rem; }
.section-title .count { color: var(--muted); font-size: .9rem; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.lead { font-size: 1.15rem; line-height: 1.45; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 48px; padding: .6rem 1.1rem; border-radius: var(--r-ctl);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
  font-weight: 600; font-size: 1rem; cursor: pointer; text-decoration: none; text-align: center; line-height: 1.25;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn-danger:hover { background: var(--bad-soft); }
.btn-sm { min-height: 44px; padding: .35rem .8rem; font-size: .9rem; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: .6rem; }
.btn-row > .btn { flex: 1 1 auto; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px;
  border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.is-on { color: var(--accent); background: var(--accent-soft); }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 1rem; }
.card-soft { background: var(--accent-soft); color: var(--accent-soft-ink); border-color: transparent; }
.card + .card { margin-top: .75rem; }

/* ---------- Landing ---------- */
.hero { padding-top: .5rem; }
.hero h1 { margin-bottom: .75rem; max-width: 18ch; }
.hero .lead { max-width: 42ch; color: var(--muted); }
.hero-demo { margin-top: 1.25rem; }
.cta { margin-top: 1.25rem; display: grid; gap: .6rem; }
.cta .btn { min-height: 52px; font-size: 1.05rem; }
.note-official { font-size: .8rem; color: var(--muted); margin-top: .75rem; }

/* The exam "answer sheet" header: facts set like the fields of a form */
.facts { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line-strong); border-radius: var(--r-card); overflow: hidden; background: var(--surface); }
.fact { padding: .75rem .5rem .65rem; border-right: 1px solid var(--line); text-align: center; }
.fact:last-child { border-right: 0; }
.fact b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.65rem; line-height: 1; font-variant-numeric: tabular-nums; }
.fact span { display: block; font-size: .78rem; color: var(--muted); margin-top: .3rem; line-height: 1.2; }
@media (max-width: 380px) { .facts { grid-template-columns: repeat(2, 1fr); } .fact:nth-child(2) { border-right: 0; } .fact:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }

.inside { list-style: none; padding: 0; margin: 0; display: grid; gap: .45rem; }
.inside li { display: flex; gap: .65rem; align-items: flex-start; }
.inside li::before { content: ""; width: 10px; height: 10px; margin-top: .5rem; flex: none; border: 2px solid var(--accent); border-radius: 2px; }

.price { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; }
.price-amount { font-family: var(--font-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.price-amount small { font-family: var(--font-body); font-size: .85rem; color: var(--muted); display: block; margin-top: .35rem; }
.price .btn { flex: 1 1 200px; }

.faq details { border-top: 1px solid var(--line); }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary { cursor: pointer; padding: .85rem 0; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 1rem; align-items: center; min-height: 44px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--font-display); font-size: 1.4rem; color: var(--muted); flex: none; }
.faq details[open] summary::after { content: "–"; }
.faq details p { padding-bottom: .9rem; color: var(--muted); }

.foot { border-top: 1px solid var(--line); padding-top: 1.25rem; font-size: .9rem; color: var(--muted); }
.foot h3 { font-size: 1rem; color: var(--fg); margin-bottom: .35rem; }
.foot .cols { display: grid; gap: 1.25rem; grid-template-columns: 1fr; }
@media (min-width: 560px) { .foot .cols { grid-template-columns: 1fr 1fr; } }
.foot address { font-style: normal; white-space: pre-line; }
.placeholder { color: var(--bad); font-weight: 600; }

/* ---------- Chips ---------- */
.chips { display: flex; gap: .5rem; flex-wrap: wrap; }
.chip {
  min-height: 44px; padding: .3rem .85rem; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface); cursor: pointer; font-size: .9rem; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* ---------- Question list ---------- */
.qlist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
.qrow {
  display: flex; align-items: center; gap: .75rem; width: 100%; min-height: 52px; padding: .55rem .9rem;
  border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer;
}
.qrow:last-child { border-bottom: 0; }
.qrow:hover { background: var(--surface-2); }
.qrow .no { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; min-width: 2.6ch; }
.qrow .txt { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: .95rem; }
.qrow.is-wrap .txt { white-space: normal; }
.qrow .lock-ico { color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 999px; border: 2px solid var(--line-strong); flex: none; }
.dot.is-ok { background: var(--ok); border-color: var(--ok); }
.dot.is-bad { background: var(--bad); border-color: var(--bad); }
.qrow.is-locked .txt { color: var(--muted); }

/* ---------- Question card ---------- */
.qcard { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-card); padding: 1rem; }
.qcard-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-size: .82rem; color: var(--muted); margin-bottom: .75rem; }
.qcard-head .field { font-family: var(--font-display); color: var(--fg); font-size: .95rem; }
.qtext { font-size: 1.2rem; line-height: 1.4; font-weight: 500; }
.qline { display: flex; gap: .25rem; align-items: flex-start; }
.qline .icon-btn { margin-top: -.5rem; margin-right: -.5rem; }
.qline > :first-child { flex: 1; }
.tr { color: var(--muted); border-left: 2px solid var(--accent); padding-left: .65rem; margin-top: .5rem; font-size: .98rem; line-height: 1.45; }
.opts { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .5rem; }
.opt {
  display: flex; align-items: flex-start; gap: .75rem; width: 100%; min-height: 52px; padding: .7rem .85rem;
  border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface); color: var(--fg);
  text-align: left; cursor: pointer; line-height: 1.35; font-size: 1rem;
}
.opt:hover { background: var(--surface-2); }
.opt .box { width: 24px; height: 24px; flex: none; border: 2px solid var(--line-strong); border-radius: var(--r-box); display: grid; place-items: center; margin-top: .05rem; background: var(--surface); }
.opt .box svg { width: 16px; height: 16px; }
.opt .body { flex: 1; }
.opt .body .tr { margin-top: .25rem; font-size: .9rem; border-left-width: 2px; }
.opt .letter { color: var(--muted); font-size: .8rem; margin-right: .35rem; font-variant-numeric: tabular-nums; }
.opt[disabled] { cursor: default; }
.opt.is-picked { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.opt.is-picked .box { border-color: var(--fg); color: var(--fg); }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); box-shadow: inset 0 0 0 1px var(--ok); }
.opt.is-correct .box { border-color: var(--ok); background: var(--ok); color: var(--on-status); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: inset 0 0 0 1px var(--bad); }
.opt.is-wrong .box { border-color: var(--bad); background: var(--bad); color: var(--on-status); }
.opt .opt-img { margin-top: .4rem; border: 1px solid var(--line); border-radius: var(--r-box); }
.opts.is-grid { grid-template-columns: 1fr 1fr; }
.opts.is-grid .opt { flex-direction: column; }
.q-img { margin: .75rem 0 0; border: 1px solid var(--line); border-radius: var(--r-box); max-height: 320px; object-fit: contain; width: 100%; background: var(--surface-2); }
.img-note { margin-top: .6rem; padding: .6rem .75rem; border: 1px dashed var(--line-strong); border-radius: var(--r-ctl); font-size: .88rem; color: var(--muted); }
.img-note b { color: var(--fg); font-weight: 600; }

.exp { margin-top: 1rem; padding: .9rem 1rem; border-radius: var(--r-ctl); background: var(--accent-soft); color: var(--accent-soft-ink); border-left: 4px solid var(--accent); }
.exp .verdict { font-family: var(--font-display); font-size: 1.1rem; margin-bottom: .3rem; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.exp.is-ok { background: var(--ok-soft); color: var(--ok-ink); border-left-color: var(--ok); }
.exp.is-bad { background: var(--bad-soft); color: var(--bad-ink); border-left-color: var(--bad); }
.exp .icon-btn { color: inherit; width: 44px; height: 44px; margin: -.3rem -.3rem -.3rem 0; }
.exp p { margin: 0; }
.exp .icon-btn:hover { background: var(--hover-tint); color: inherit; }
.qnav { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-top: 1rem; }
.progress-txt { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

/* ---------- Lock card ---------- */
.lock { border: 1px solid var(--line-strong); border-radius: var(--r-card); padding: 1rem; background: var(--surface); display: grid; gap: .6rem; }
.lock h3 { display: flex; align-items: center; gap: .5rem; }
.lock h3 svg { width: 20px; height: 20px; }
.lock .price-amount { font-size: 1.6rem; }
.teaser { position: relative; overflow: hidden; max-height: 3.2em; color: var(--muted); }
.teaser::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, var(--surface)); }

/* ---------- Exam ---------- */
.exam-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.timer { font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.timer.is-low { color: var(--bad); }
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
.flag-btn { display: inline-flex; align-items: center; gap: .4rem; }
.flag-btn.is-on { background: var(--mark); color: var(--mark-ink); border-color: var(--mark); }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: .4rem; }
.navgrid button { min-height: 44px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--surface); font-variant-numeric: tabular-nums; cursor: pointer; font-weight: 600; }
.navgrid button.is-done { background: var(--surface-2); }
.navgrid button.is-marked { border-color: var(--mark); box-shadow: inset 0 0 0 2px var(--mark); }
.navgrid button.is-current { outline: 2px solid var(--accent); outline-offset: 1px; }

.score { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
.score-big { font-family: var(--font-display); font-size: 3.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score-big small { font-size: 1.4rem; color: var(--muted); }
.verdict-pill { display: inline-flex; align-items: center; min-height: 36px; padding: 0 .9rem; border-radius: 999px; font-weight: 700; }
.verdict-pill.is-pass { background: var(--ok-soft); color: var(--ok-ink); }
.verdict-pill.is-fail { background: var(--bad-soft); color: var(--bad-ink); }
.cat-rows { display: grid; gap: .5rem; }
.cat-row { display: grid; grid-template-columns: 1fr auto; gap: .25rem .75rem; align-items: center; font-size: .92rem; }
.cat-row .bar { grid-column: 1 / -1; }
.cat-row .num { color: var(--muted); }
.wrong-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.wrong-item { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
.wrong-item > button { width: 100%; display: flex; gap: .6rem; align-items: flex-start; text-align: left; padding: .75rem .9rem; border: 0; background: transparent; cursor: pointer; min-height: 48px; }
.wrong-item .no { color: var(--bad); font-weight: 700; font-variant-numeric: tabular-nums; }
.wrong-item .detail { padding: 0 .9rem .9rem; font-size: .95rem; }
.wrong-item .detail .row { display: flex; gap: .5rem; margin-bottom: .25rem; }
.wrong-item .detail .row b { flex: none; width: 5.5ch; color: var(--muted); font-weight: 600; }

/* ---------- Stats / settings ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
.stat { padding: .8rem .5rem; text-align: center; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { display: block; font-size: .8rem; color: var(--muted); margin-top: .3rem; }
.stat.is-ok b { color: var(--ok); }
.stat.is-bad b { color: var(--bad); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 52px; padding: .5rem 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting label { flex: 1; cursor: pointer; }
.setting .hint { display: block; color: var(--muted); font-size: .85rem; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.switch i { position: absolute; inset: 0; background: var(--line-strong); border-radius: 999px; transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; background: var(--knob); border-radius: 999px; transition: transform .15s; box-shadow: 0 1px 2px var(--knob-shadow); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 3px solid var(--accent); outline-offset: 2px; }
select, input[type="email"], input[type="text"] {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-ctl);
  min-height: 48px; padding: .5rem .75rem; width: 100%;
}
.field { display: grid; gap: .35rem; }
.field label { font-weight: 600; font-size: .95rem; }
.check { display: flex; gap: .6rem; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: .1rem 0 0; flex: none; accent-color: var(--accent); }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; justify-content: space-between; gap: .75rem; padding: .55rem 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.hist li:last-child { border-bottom: 0; }
.hist .when { color: var(--muted); }
.hist .pass { color: var(--ok); font-weight: 700; }
.hist .fail { color: var(--bad); font-weight: 700; }
.premium-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.status-pill { display: inline-flex; align-items: center; gap: .4rem; min-height: 32px; padding: 0 .75rem; border-radius: 999px; background: var(--surface-2); font-size: .88rem; font-weight: 600; }
.status-pill.is-on { background: var(--ok-soft); color: var(--ok-ink); }
.msg { padding: .75rem .9rem; border-radius: var(--r-ctl); font-size: .95rem; }
.msg.is-ok { background: var(--ok-soft); color: var(--ok-ink); }
.msg.is-bad { background: var(--bad-soft); color: var(--bad-ink); }
.msg.is-info { background: var(--accent-soft); color: var(--accent-soft-ink); }

/* ---------- Sheet (buy / restore) ---------- */
.sheet-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); color: var(--fg);
  border-radius: 12px 12px 0 0; padding: 1rem 1rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
  max-height: 92vh; overflow: auto; box-shadow: var(--shadow);
}
@media (min-width: 600px) { .sheet-bg { align-items: center; padding: 1rem; } .sheet { border-radius: 10px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .75rem; }
.sheet form { display: grid; gap: .8rem; margin-top: .75rem; }
.offer { display: inline-block; background: var(--mark); color: var(--mark-ink); padding: .15rem .55rem; border-radius: var(--r-box); font-weight: 700; font-size: .88rem; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: .65rem 1rem; border-radius: var(--r-ctl); font-size: .92rem; z-index: 60; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

/* ---------- Warm skin (overrides) ---------- */
.hdr { background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(8px); border-bottom-color: var(--line); }
.brand-mark { border: 0; background: var(--cta); color: var(--cta-ink); border-radius: 8px; }
.brand-name { font-weight: 800; }
.tab[aria-current="page"] { border-bottom-color: var(--cta); }
.btn { border-radius: var(--r-ctl); border-color: var(--line-strong); }
.btn-primary { background: var(--cta); border-color: var(--cta); color: var(--cta-ink); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.btn-primary:hover { background: var(--cta); filter: brightness(1.06); }
.card, .qcard, .lock, .wrong-item, .qlist, .stats { border-color: var(--line); box-shadow: var(--shadow); }
.qcard { border-radius: var(--r-card); padding: 1.1rem; }
.qcard-head .field { font-family: var(--font-body); font-weight: 700; font-size: .78rem; letter-spacing: .03em; text-transform: uppercase; color: var(--warm-ink); background: var(--warm-soft); padding: .2rem .55rem; border-radius: 999px; }
.qtext { font-weight: 650; }
.tr { border-left-color: var(--cta); }
.opt { border-color: var(--line-strong); border-radius: var(--r-ctl); padding: .75rem .9rem; transition: background .12s, border-color .12s, transform .08s; }
.opt:active:not([disabled]) { transform: scale(.99); }
.opt .box { width: 30px; height: 30px; border-radius: 999px; border: 2px solid var(--line-strong); font-weight: 800; font-size: .9rem; color: var(--muted); margin-top: -.1rem; }
.opt .letter { display: none; }
.opt.is-picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.is-picked .box { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.exp { border-radius: var(--r-ctl); border-left-width: 0; padding: 1rem 1.1rem; }
.exp .verdict { font-family: var(--font-display); font-weight: 800; }
.hero { background: linear-gradient(160deg, var(--warm-soft), transparent 75%); border-radius: 22px; padding: 1.4rem 1.1rem 1.2rem; margin-left: -.25rem; margin-right: -.25rem; }
.hero h1 { font-size: clamp(1.85rem, 6.4vw, 2.6rem); }
.hero .lead { color: var(--fg); opacity: .82; }
.hello { display: inline-flex; align-items: center; gap: .4rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .3rem .75rem; font-size: .86rem; font-weight: 600; margin-bottom: .85rem; box-shadow: var(--shadow); }
.facts { border: 0; background: transparent; gap: .5rem; overflow: visible; }
.fact { background: var(--surface); border: 1px solid var(--line) !important; border-radius: 14px; box-shadow: var(--shadow); }
.fact b { font-family: var(--font-display); font-weight: 800; color: var(--cta); }
.price-amount, .score-big, .stat b, .timer { font-weight: 800; }
.inside li::before { border-radius: 999px; border-color: var(--cta); background: var(--warm-soft); }
.note-official { opacity: .9; }
/* Quick quiz */
.welcome { background: var(--warm-soft); color: var(--warm-ink); border-radius: var(--r-card); padding: 1rem 1.1rem; }
.welcome h2 { font-size: 1.3rem; margin-bottom: .35rem; color: var(--fg); }
.welcome p { margin: 0; }
.dots { display: flex; gap: .4rem; align-items: center; }
.dots i { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); }
.dots i.is-ok { background: var(--ok); }
.dots i.is-bad { background: var(--bad); }
.dots i.is-cur { background: var(--cta); }
.dots-txt { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: .4rem; }
.hint-pick { text-align: center; color: var(--muted); font-size: .9rem; margin-top: .75rem; }
.quick-score { text-align: center; padding: 1.4rem 1rem; }
.quick-score .big { font-family: var(--font-display); font-weight: 800; font-size: 3.4rem; line-height: 1; color: var(--cta); }
.quick-score .big small { font-size: 1.5rem; color: var(--muted); }
.next-cta { position: sticky; bottom: calc(.75rem + env(safe-area-inset-bottom, 0px)); z-index: 5; margin-top: 1rem; }
.next-cta .btn { width: 100%; min-height: 54px; font-size: 1.05rem; }

/* ---------- Motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

<script id="einb-data" type="application/json">[{"id":"G001","n":1,"scope":"general","cat":"politik","q":"In Deutschland dürfen Menschen offen etwas gegen die Regierung sagen, weil …","a":["hier Religionsfreiheit gilt.","die Menschen Steuern zahlen.","die Menschen das Wahlrecht haben.","hier Meinungsfreiheit gilt."],"c":3,"img":null,"tq":"Almanya'da insanlar hükümete karşı açıkça bir şey söyleyebilir, çünkü …","ta":["burada din özgürlüğü geçerlidir.","insanlar vergi öder.","insanların seçme hakkı vardır.","burada ifade özgürlüğü geçerlidir."],"exp":"Doğru cevap ifade özgürlüğüdür: Grundgesetz'in (Temel Yasa/Anayasa) 5. maddesi herkese düşüncesini özgürce açıklama hakkı verir ve hükümeti eleştirmek de bu hakkın içindedir. Din özgürlüğü, vergi ödemek veya seçme hakkı bunun gerekçesi değildir."},{"id":"G002","n":2,"scope":"general","cat":"politik","q":"In Deutschland können Eltern bis zum 14. Lebensjahr ihres Kindes entscheiden, ob es in der Schule am …","a":["Geschichtsunterricht teilnimmt.","Religionsunterricht teilnimmt.","Politikunterricht teilnimmt.","Sprachunterricht teilnimmt."],"c":1,"img":null,"tq":"Almanya'da anne babalar, çocukları 14 yaşını dolduruncaya kadar onun okulda … katılıp katılmayacağına karar verebilir.","ta":["tarih dersine","din dersine","politika dersine","dil dersine"],"exp":"Doğru cevap din dersidir: Din dersi Almanya'da okullarda olağan bir derstir, ama katılım zorunlu değildir; anne babalar çocuğu 14 yaşına kadar bu dersten alabilir. 14 yaşından itibaren çocuk 'dini açıdan reşit' sayılır ve bu kararı kendisi verir. Tarih, politika ve dil dersleri ise zorunludur."},{"id":"G003","n":3,"scope":"general","cat":"politik","q":"Deutschland ist ein Rechtsstaat. Was ist damit gemeint?","a":["Alle Einwohnerinnen/Einwohner und der Staat müssen sich an die Gesetze halten.","Der Staat muss sich nicht an die Gesetze halten.","Nur Deutsche müssen die Gesetze befolgen.","Die Gerichte machen die Gesetze."],"c":0,"img":null,"tq":"Almanya bir hukuk devletidir. Bununla ne kastedilmektedir?","ta":["Tüm sakinler ve devlet yasalara uymak zorundadır.","Devlet yasalara uymak zorunda değildir.","Yasalara yalnızca Almanlar uymak zorundadır.","Yasaları mahkemeler yapar."],"exp":"Doğru cevap: Hem ülkede yaşayan herkes hem de devletin kendisi yasalara uymak zorundadır. Hukuk devleti (Rechtsstaat) demek, devletin yasaların üstünde olmaması ve her işlemini hukuka dayandırması demektir. Yasaları mahkemeler değil, parlamento yapar."},{"id":"G004","n":4,"scope":"general","cat":"politik","q":"Welches Recht gehört zu den Grundrechten in Deutschland?","a":["Waffenbesitz","Faustrecht","Meinungsfreiheit","Selbstjustiz"],"c":2,"img":null,"tq":"Hangi hak Almanya'daki temel haklar arasında yer alır?","ta":["Silah sahibi olma","Kaba kuvvet hakkı (güçlünün hakkı)","İfade özgürlüğü","Kendi adaletini kendin sağlama"],"exp":"Doğru cevap ifade özgürlüğüdür: Grundgesetz'in (Temel Yasa/Anayasa) 5. maddesinde güvence altına alınmış bir temel haktır. Silah sahibi olmak temel hak değildir, izne bağlıdır; kaba kuvvet ve kendi adaletini kendin sağlamak ise hukuk devletinde yasaktır."},{"id":"G005","n":5,"scope":"general","cat":"politik","q":"Wahlen in Deutschland sind frei. Was bedeutet das?","a":["Man darf Geld annehmen, wenn man dafür eine bestimmte Kandidatin/einen bestimmten Kandidaten wählt.","Nur Personen, die noch nie im Gefängnis waren, dürfen wählen.","Die Wählerin/der Wähler darf bei der Wahl weder beeinflusst noch zu einer bestimmten Stimmabgabe gezwungen werden und keine Nachteile durch die Wahl haben.","Alle wahlberechtigten Personen müssen wählen."],"c":2,"img":null,"tq":"Almanya'da seçimler serbesttir. Bu ne anlama gelir?","ta":["Belirli bir adaya oy vermek karşılığında para kabul edilebilir.","Yalnızca hiç hapse girmemiş kişiler oy kullanabilir.","Seçmen, seçimde ne etki altında bırakılabilir ne de belirli bir şekilde oy vermeye zorlanabilir ve seçim nedeniyle hiçbir zarar görmez.","Oy hakkı olan herkes oy kullanmak zorundadır."],"exp":"Doğru cevap: Seçmen etki altında bırakılamaz, belirli bir oya zorlanamaz ve oyu yüzünden zarar görmez; 'serbest seçim' ilkesi tam olarak budur. Oy karşılığı para almak rüşvettir ve yasaktır. Almanya'da oy kullanma zorunluluğu da yoktur, bu yüzden son seçenek yanlıştır."},{"id":"G006","n":6,"scope":"general","cat":"politik","q":"Wie heißt die deutsche Verfassung?","a":["Volksgesetz","Bundesgesetz","Deutsches Gesetz","Grundgesetz"],"c":3,"img":null,"tq":"Alman anayasasının adı nedir?","ta":["Volksgesetz (Halk Yasası)","Bundesgesetz (Federal Yasa)","Deutsches Gesetz (Alman Yasası)","Grundgesetz (Temel Yasa)"],"exp":"Doğru cevap Grundgesetz'dir (Temel Yasa): Almanya'nın anayasası 23 Mayıs 1949'da yürürlüğe girdi ve 1990'daki birleşmeden sonra tüm Almanya için geçerli oldu. 'Bundesgesetz' herhangi bir federal yasa için kullanılan genel bir sözcüktür, anayasanın adı değildir."},{"id":"G007","n":7,"scope":"general","cat":"politik","q":"Welches Recht gehört zu den Grundrechten, die nach der deutschen Verfassung garantiert werden? Das Recht auf …","a":["Glaubens- und Gewissensfreiheit","Unterhaltung","Arbeit","Wohnung"],"c":0,"img":null,"tq":"Hangi hak, Alman anayasasına göre güvence altına alınan temel haklardandır? … hakkı","ta":["İnanç ve vicdan özgürlüğü","Eğlence","İş","Konut"],"exp":"Doğru cevap inanç ve vicdan özgürlüğüdür: Grundgesetz'in (Temel Yasa/Anayasa) 4. maddesi bunu güvence altına alır. Eğlence, iş ve konut Almanya'da anayasal temel hak değildir; sosyal devlet iş ve konut konusunda destek verir, ama bunları herkese garanti edilen bir hak olarak tanımaz."},{"id":"G008","n":8,"scope":"general","cat":"politik","q":"Was steht nicht im Grundgesetz von Deutschland?","a":["Die Würde des Menschen ist unantastbar.","Alle sollen gleich viel Geld haben.","Jeder Mensch darf seine Meinung sagen.","Alle sind vor dem Gesetz gleich."],"c":1,"img":null,"tq":"Almanya'nın Grundgesetz'inde (Temel Yasa/Anayasa) hangisi yer almaz?","ta":["İnsan onuru dokunulmazdır.","Herkesin eşit miktarda parası olmalıdır.","Her insan düşüncesini söyleyebilir.","Herkes yasa önünde eşittir."],"exp":"Doğru cevap: 'Herkesin eşit miktarda parası olmalıdır' cümlesi Grundgesetz'de yer almaz. Anayasa yasa önünde eşitliği (madde 3) güvence altına alır, mal varlığı eşitliğini değil. İnsan onuru (madde 1) ve ifade özgürlüğü (madde 5) ise anayasada açıkça yazılıdır."},{"id":"G009","n":9,"scope":"general","cat":"politik","q":"Welches Grundrecht gilt in Deutschland nur für Ausländerinnen/Ausländer? Das Grundrecht auf …","a":["Schutz der Familie","Menschenwürde","Asyl","Meinungsfreiheit"],"c":2,"img":null,"tq":"Almanya'da hangi temel hak yalnızca yabancılar için geçerlidir? … temel hakkı","ta":["Ailenin korunması","İnsan onuru","Sığınma (iltica)","İfade özgürlüğü"],"exp":"Doğru cevap sığınma hakkıdır: Grundgesetz'in (Temel Yasa/Anayasa) 16a maddesi siyasi baskı gören kişilere sığınma hakkı tanır. Bir Alman vatandaşı kendi ülkesinden sığınma isteyemeyeceği için bu hak doğası gereği yalnızca yabancılar içindir. İnsan onuru, ailenin korunması ve ifade özgürlüğü herkes için geçerlidir."},{"id":"G010","n":10,"scope":"general","cat":"politik","q":"Was ist mit dem deutschen Grundgesetz vereinbar?","a":["die Prügelstrafe","die Folter","die Todesstrafe","die Geldstrafe"],"c":3,"img":null,"tq":"Hangisi Alman Grundgesetz'i (Temel Yasa/Anayasa) ile bağdaşır?","ta":["dayak cezası","işkence","ölüm cezası","para cezası"],"exp":"Doğru cevap para cezasıdır: Para cezası hukuk devletinin olağan bir yaptırımıdır. Ölüm cezası Grundgesetz'in 102. maddesiyle kaldırılmıştır; işkence ve dayak cezası ise insan onuru (madde 1) ve bedensel dokunulmazlık hakkı (madde 2) ile bağdaşmaz."},{"id":"G011","n":11,"scope":"general","cat":"politik","q":"Wie wird die Verfassung der Bundesrepublik Deutschland genannt?","a":["Grundgesetz","Bundesverfassung","Gesetzbuch","Verfassungsvertrag"],"c":0,"img":null,"tq":"Federal Almanya Cumhuriyeti'nin anayasası nasıl adlandırılır?","ta":["Grundgesetz (Temel Yasa)","Bundesverfassung (Federal Anayasa)","Gesetzbuch (Kanun Kitabı)","Verfassungsvertrag (Anayasa Antlaşması)"],"exp":"Doğru cevap Grundgesetz'dir (Temel Yasa): 1949'da 'Verfassung' (anayasa) yerine bilinçli olarak bu ad seçildi, çünkü metin o zaman birleşmeye kadar geçici bir düzenleme olarak düşünülüyordu. 'Bundesverfassung' İsviçre anayasasının adıdır; 'Gesetzbuch' ise Medeni Kanun (BGB) gibi bir kanun kitabı demektir."},{"id":"G012","n":12,"scope":"general","cat":"politik","q":"Eine Partei im Deutschen Bundestag will die Pressefreiheit abschaffen. Ist das möglich?","a":["Ja, wenn mehr als die Hälfte der Abgeordneten im Bundestag dafür sind.","Ja, aber dazu müssen zwei Drittel der Abgeordneten im Bundestag dafür sein.","Nein, denn die Pressefreiheit ist ein Grundrecht. Sie kann nicht abgeschafft werden.","Nein, denn nur der Bundesrat kann die Pressefreiheit abschaffen."],"c":2,"img":null,"tq":"Alman Bundestag'ında (Federal Meclis) bir parti basın özgürlüğünü kaldırmak istiyor. Bu mümkün müdür?","ta":["Evet, Bundestag'daki milletvekillerinin yarısından fazlası bunu desteklerse.","Evet, ancak bunun için Bundestag'daki milletvekillerinin üçte ikisinin desteği gerekir.","Hayır, çünkü basın özgürlüğü bir temel haktır. Kaldırılamaz.","Hayır, çünkü basın özgürlüğünü yalnızca Bundesrat (Federal Konsey) kaldırabilir."],"exp":"Doğru cevap: Hayır, basın özgürlüğü bir temel haktır ve kaldırılamaz. Grundgesetz (Temel Yasa/Anayasa) temel hakların özüne dokunulmasını yasaklar (madde 19) ve insan onuru ile demokratik düzenin ilkeleri hiçbir çoğunlukla değiştirilemez (madde 79). Üçte iki çoğunluk yalnızca başka anayasa değişiklikleri için gerekir."},{"id":"G013","n":13,"scope":"general","cat":"politik","q":"Im Parlament steht der Begriff \"Opposition\" für …","a":["die regierenden Parteien.","die Fraktion mit den meisten Abgeordneten.","alle Parteien, die bei der letzten Wahl die 5%-Hürde erreichen konnten.","alle Abgeordneten, die nicht zu der Regierungspartei/den Regierungsparteien gehören."],"c":3,"img":null,"tq":"Parlamentoda \"muhalefet\" kavramı … ifade eder.","ta":["iktidardaki partileri","en çok milletvekiline sahip grubu","son seçimde %5 barajını aşabilen tüm partileri","iktidar partisine/partilerine ait olmayan tüm milletvekillerini"],"exp":"Doğru cevap: Muhalefet, hükümeti kuran partilere ait olmayan tüm milletvekilleridir. Görevi hükümeti denetlemek ve eleştirmektir. En büyük grup çoğu zaman hükümettedir, bu yüzden ikinci seçenek yanıltıcıdır; %5 barajını aşan partiler ise hem iktidarı hem muhalefeti kapsar."},{"id":"G014","n":14,"scope":"general","cat":"politik","q":"Meinungsfreiheit in Deutschland heißt, dass ich …","a":["Passanten auf der Straße beschimpfen darf.","meine Meinung im Internet äußern kann.","Nazi-, Hamas- oder Islamischer Staat-Symbole öffentlich tragen darf.","meine Meinung nur dann äußern darf, solange ich der Regierung nicht widerspreche."],"c":1,"img":null,"tq":"Almanya'da ifade özgürlüğü, … anlamına gelir.","ta":["sokakta yoldan geçenlere hakaret edebileceğim","düşüncemi internette dile getirebileceğim","Nazi, Hamas veya İslam Devleti sembollerini herkesin önünde taşıyabileceğim","düşüncemi yalnızca hükümete karşı çıkmadığım sürece dile getirebileceğim"],"exp":"Doğru cevap: İfade özgürlüğü düşüncemi internette de özgürce dile getirebilmem demektir. Bu özgürlüğün sınırları vardır: hakaret suçtur ve anayasaya aykırı örgütlerin (Nazi, Hamas, İslam Devleti) sembollerini taşımak yasaktır. Hükümete karşı çıkmak ise tam tersine bu özgürlüğün özüdür."},{"id":"G015","n":15,"scope":"general","cat":"politik","q":"Was verbietet das deutsche Grundgesetz?","a":["Militärdienst","Zwangsarbeit","freie Berufswahl","Arbeit im Ausland"],"c":1,"img":null,"tq":"Alman Grundgesetz'i (Temel Yasa/Anayasa) neyi yasaklar?","ta":["Askerlik hizmetini","Zorla çalıştırmayı","Serbest meslek seçimini","Yurt dışında çalışmayı"],"exp":"Doğru cevap zorla çalıştırmadır: Grundgesetz'in 12. maddesi herkese mesleğini ve iş yerini serbestçe seçme hakkı verir ve zorla çalıştırmayı yasaklar. Askerlik hizmeti anayasada öngörülmüştür (zorunlu askerlik 2011'den beri yalnızca askıdadır); serbest meslek seçimi ve yurt dışında çalışmak ise serbesttir."},{"id":"G016","n":16,"scope":"general","cat":"politik","q":"Wann ist die Meinungsfreiheit in Deutschland eingeschränkt?","a":["bei der öffentlichen Verbreitung falscher Behauptungen über einzelne Personen","bei Meinungsäußerungen über die Bundesregierung","bei Diskussionen über Religionen","bei Kritik am Staat"],"c":0,"img":null,"tq":"Almanya'da ifade özgürlüğü ne zaman sınırlanır?","ta":["tek tek kişiler hakkında yanlış iddiaların kamuoyunda yayılması durumunda","Federal Hükümet hakkında görüş açıklanması durumunda","dinler hakkında tartışmalarda","devletin eleştirilmesi durumunda"],"exp":"Doğru cevap: Kişiler hakkında yanlış iddialar yaymak ifade özgürlüğünün kapsamı dışındadır, çünkü bu iftira ve hakaret suçudur ve başkalarının kişilik haklarını ihlal eder. Hükümet hakkında görüş açıklamak, dinleri tartışmak ve devleti eleştirmek ise ifade özgürlüğünün tam da koruduğu davranışlardır."},{"id":"G017","n":17,"scope":"general","cat":"politik","q":"Die deutschen Gesetze verbieten …","a":["Meinungsfreiheit der Einwohnerinnen und Einwohner.","Petitionen der Bürgerinnen und Bürger.","Versammlungsfreiheit der Einwohnerinnen und Einwohner.","Ungleichbehandlung der Bürgerinnen und Bürger durch den Staat."],"c":3,"img":null,"tq":"Alman yasaları … yasaklar.","ta":["ülke sakinlerinin ifade özgürlüğünü","vatandaşların dilekçe (petisyon) vermesini","ülke sakinlerinin toplanma özgürlüğünü","devletin vatandaşlara eşit olmayan davranmasını"],"exp":"Doğru cevap: Yasalar devletin vatandaşlara eşit davranmamasını yasaklar; Grundgesetz'in (Temel Yasa/Anayasa) 3. maddesine göre herkes yasa önünde eşittir, kimse kökeni veya inancı yüzünden farklı muamele göremez. İfade özgürlüğü, dilekçe hakkı ve toplanma özgürlüğü ise yasak değil, korunan temel haklardır."},{"id":"G018","n":18,"scope":"general","cat":"politik","q":"Welches Grundrecht ist in Artikel 1 des Grundgesetzes der Bundesrepublik Deutschland garantiert?","a":["die Unantastbarkeit der Menschenwürde","das Recht auf Leben","Religionsfreiheit","Meinungsfreiheit"],"c":0,"img":null,"tq":"Federal Almanya Cumhuriyeti Grundgesetz'inin (Temel Yasa/Anayasa) 1. maddesinde hangi temel hak güvence altına alınmıştır?","ta":["insan onurunun dokunulmazlığı","yaşam hakkı","din özgürlüğü","ifade özgürlüğü"],"exp":"Doğru cevap insan onurunun dokunulmazlığıdır: Grundgesetz'in 1. maddesi 'İnsan onuru dokunulmazdır' cümlesiyle başlar ve bu ilke hiçbir şekilde değiştirilemez. Hafıza ipucu: 1. madde insan onuru, 2. madde yaşam hakkı, 4. madde din özgürlüğü, 5. madde ifade özgürlüğü."},{"id":"G019","n":19,"scope":"general","cat":"politik","q":"Was versteht man unter dem Recht der \"Freizügigkeit\" in Deutschland?","a":["Man darf sich seinen Wohnort selbst aussuchen.","Man kann seinen Beruf wechseln.","Man darf sich für eine andere Religion entscheiden.","Man darf sich in der Öffentlichkeit nur leicht bekleidet bewegen."],"c":0,"img":null,"tq":"Almanya'da \"Freizügigkeit\" (serbest dolaşım ve yerleşme) hakkından ne anlaşılır?","ta":["İnsan yaşayacağı yeri kendisi seçebilir.","İnsan mesleğini değiştirebilir.","İnsan başka bir dine geçmeye karar verebilir.","İnsan kamuya açık yerlerde yalnızca hafif giyimli dolaşabilir."],"exp":"Doğru cevap: Freizügigkeit, kişinin Almanya içinde nerede yaşayacağını ve nereye taşınacağını kendisinin seçmesidir (Grundgesetz madde 11). Meslek değiştirme mesleki özgürlüğe, din değiştirme ise inanç özgürlüğüne girer; sözcüğün Türkçe çağrışımına aldanmayın, giyimle ilgisi yoktur."},{"id":"G020","n":20,"scope":"general","cat":"politik","q":"Eine Partei in Deutschland verfolgt das Ziel, eine Diktatur zu errichten. Sie ist dann …","a":["tolerant.","rechtsstaatlich orientiert.","gesetzestreu.","verfassungswidrig."],"c":3,"img":null,"tq":"Almanya'da bir parti diktatörlük kurma hedefi güdüyor. Bu durumda bu parti …","ta":["hoşgörülüdür.","hukuk devletine yöneliktir.","yasalara bağlıdır.","anayasaya aykırıdır."],"exp":"Doğru cevap anayasaya aykırıdır: Grundgesetz'in (Temel Yasa/Anayasa) 21. maddesine göre özgür demokratik düzeni ortadan kaldırmayı amaçlayan partiler anayasaya aykırıdır ve Federal Anayasa Mahkemesi (Bundesverfassungsgericht) tarafından yasaklanabilir. Diktatörlük hedefi, hoşgörü veya hukuk devletiyle bağdaşmaz."},{"id":"G021","n":21,"scope":"general","cat":"politik","q":"Welches ist das Wappen der Bundesrepublik Deutschland?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":0,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/d/da/Coat_of_arms_of_Germany.svg","","","https://upload.wikimedia.org/wikipedia/commons/c/c1/Coat_of_arms_of_East_Germany_%281955%E2%80%931990%29.svg"],"note":"Bild 1 = Bundeswappen (Bundesadler); Bild 2 = Christusmonogramm (Chi-Rho); Bild 3 = Eisernes Kreuz (Bundeswehr-Hoheitszeichen); Bild 4 = Staatswappen der DDR (Hammer und Zirkel im Ährenkranz). Nur fuer Bild 1 und Bild 4 sind amtliche Wappen als Commons-URL hinterlegt; fuer Bild 2/3 wurde keine verifizierte freie Datei bestimmt (leerer String)."},"tq":"Federal Almanya Cumhuriyeti'nin arması hangisidir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 1: Altın sarısı zemin üzerinde kanatları açık siyah kartal, yani Bundesadler (Federal Kartal) Almanya'nın resmi armasıdır. Resim 4'teki çekiç ve pergel, 1990'da ortadan kalkan Doğu Almanya'nın (DDR) armasıdır; Resim 2 bir Hristiyan sembolü, Resim 3 ise ordunun işareti olan Demir Haç'tır."},{"id":"G022","n":22,"scope":"general","cat":"politik","q":"Was für eine Staatsform hat Deutschland?","a":["Monarchie","Diktatur","Republik","Fürstentum"],"c":2,"img":null,"tq":"Almanya'nın devlet biçimi nedir?","ta":["Monarşi","Diktatörlük","Cumhuriyet","Prenslik"],"exp":"Doğru cevap cumhuriyettir: Devletin başı kalıtsal bir hükümdar değil, seçimle belirlenen Bundespräsident'tir (Federal Cumhurbaşkanı). Ülkenin resmi adı 'Bundesrepublik Deutschland' (Federal Almanya Cumhuriyeti) bunu zaten söyler. Monarşi 1918'de sona erdi."},{"id":"G023","n":23,"scope":"general","cat":"politik","q":"In Deutschland sind die meisten Erwerbstätigen …","a":["in kleinen Familienunternehmen beschäftigt.","ehrenamtlich für ein Bundesland tätig.","selbstständig mit einer eigenen Firma tätig.","bei einer Firma oder Behörde beschäftigt."],"c":3,"img":null,"tq":"Almanya'da çalışanların çoğu …","ta":["küçük aile şirketlerinde çalışır.","bir eyalet için gönüllü (fahri) olarak çalışır.","kendi şirketleriyle serbest çalışır.","bir şirkette veya kamu kurumunda çalışır."],"exp":"Doğru cevap: Çalışanların büyük çoğunluğu bir şirkette veya kamu kurumunda ücretli olarak çalışır. Almanya'da çalışanların yaklaşık %90'ı ücretli çalışandır; serbest çalışanlar yalnızca yaklaşık %10'dur. Gönüllü çalışma ise bir geçim kaynağı değildir."},{"id":"G024","n":24,"scope":"general","cat":"politik","q":"Wie viele Bundesländer hat die Bundesrepublik Deutschland?","a":["14","15","16","17"],"c":2,"img":null,"tq":"Federal Almanya Cumhuriyeti'nin kaç eyaleti (Bundesland) vardır?","ta":["14","15","16","17"],"exp":"Doğru cevap 16'dır: Almanya 13 alan eyaleti ile 3 şehir eyaletinden (Berlin, Hamburg, Bremen) oluşur. 1990'daki birleşmede Batı Almanya'nın 11 eyaletine Doğu Almanya'dan 5 yeni eyalet katılarak bugünkü 16 sayısına ulaşıldı."},{"id":"G025","n":25,"scope":"general","cat":"politik","q":"Was ist kein Bundesland der Bundesrepublik Deutschland?","a":["Elsass-Lothringen","Nordrhein-Westfalen","Mecklenburg-Vorpommern","Sachsen-Anhalt"],"c":0,"img":null,"tq":"Hangisi Federal Almanya Cumhuriyeti'nin bir eyaleti değildir?","ta":["Elsass-Lothringen","Nordrhein-Westfalen","Mecklenburg-Vorpommern","Sachsen-Anhalt"],"exp":"Doğru cevap Elsass-Lothringen'dir (Alsace-Lorraine): Bu bölge bugün Fransa'ya aittir; 1871-1918 arasında Alman İmparatorluğu'na bağlıydı. Nordrhein-Westfalen, Mecklenburg-Vorpommern ve Sachsen-Anhalt ise Almanya'nın 16 eyaletinden üçüdür."},{"id":"G026","n":26,"scope":"general","cat":"politik","q":"Deutschland ist …","a":["eine kommunistische Republik.","ein demokratischer und sozialer Bundesstaat.","eine kapitalistische und soziale Monarchie.","ein sozialer und sozialistischer Bundesstaat."],"c":1,"img":null,"tq":"Almanya …","ta":["komünist bir cumhuriyettir.","demokratik ve sosyal bir federal devlettir.","kapitalist ve sosyal bir monarşidir.","sosyal ve sosyalist bir federal devlettir."],"exp":"Doğru cevap: Almanya demokratik ve sosyal bir federal devlettir. Bu tanım Grundgesetz'in (Temel Yasa/Anayasa) 20. maddesinden kelimesi kelimesine alınmıştır. 'Sosyal' ile 'sosyalist' karıştırılmamalıdır: sosyal devlet zayıfları korur, sosyalizm ise bambaşka bir ekonomik düzendir. Almanya monarşi de değildir."},{"id":"G027","n":27,"scope":"general","cat":"politik","q":"Deutschland ist …","a":["ein sozialistischer Staat.","ein Bundesstaat.","eine Diktatur.","eine Monarchie."],"c":1,"img":null,"tq":"Almanya …","ta":["sosyalist bir devlettir.","bir federal devlettir.","bir diktatörlüktür.","bir monarşidir."],"exp":"Doğru cevap federal devlettir (Bundesstaat): Almanya, kendi anayasası, parlamentosu ve hükümeti olan 16 eyaletten oluşur ve bu eyaletler federal devlet (Bund) ile yetkileri paylaşır. Diktatörlük ve monarşi dışlanır, çünkü Almanya demokratik bir cumhuriyettir; sosyalist bir devlet de değildir."},{"id":"G028","n":28,"scope":"general","cat":"politik","q":"Wer wählt in Deutschland die Abgeordneten zum Bundestag?","a":["das Militär","die Wirtschaft","das wahlberechtigte Volk","die Verwaltung"],"c":2,"img":null,"tq":"Almanya'da Bundestag (Federal Meclis) milletvekillerini kim seçer?","ta":["ordu","ekonomi çevreleri","seçme hakkına sahip halk","idare (bürokrasi)"],"exp":"Doğru cevap seçme hakkına sahip halktır: Bundestag milletvekilleri dört yılda bir yapılan genel, doğrudan, serbest, eşit ve gizli seçimlerle 18 yaşını doldurmuş Alman vatandaşları tarafından seçilir. Ordu, ekonomi veya idarenin milletvekili seçme yetkisi yoktur; egemenlik halktadır."},{"id":"G029","n":29,"scope":"general","cat":"politik","q":"Welches Tier ist das Wappentier der Bundesrepublik Deutschland?","a":["Löwe","Adler","Bär","Pferd"],"c":1,"img":null,"tq":"Hangi hayvan Federal Almanya Cumhuriyeti'nin arma hayvanıdır?","ta":["Aslan","Kartal","Ayı","At"],"exp":"Doğru cevap kartaldır: Bundesadler (Federal Kartal) Almanya'nın federal armasında yer alır ve Bundestag'ın (Federal Meclis) oturum salonunda da asılıdır. Diğer hayvanlar bazı eyaletlerin armalarında görülür: Berlin'de ayı, Bayern'de aslan, Niedersachsen'de at."},{"id":"G030","n":30,"scope":"general","cat":"politik","q":"Was ist kein Merkmal unserer Demokratie?","a":["regelmäßige Wahlen","Pressezensur","Meinungsfreiheit","verschiedene Parteien"],"c":1,"img":null,"tq":"Hangisi demokrasimizin bir özelliği değildir?","ta":["düzenli seçimler","basın sansürü","ifade özgürlüğü","farklı partiler"],"exp":"Doğru cevap basın sansürüdür: Grundgesetz'in (Temel Yasa/Anayasa) 5. maddesi açıkça 'Sansür yapılmaz' der. Basın sansürü diktatörlüklerin aracıdır. Düzenli seçimler, ifade özgürlüğü ve birden fazla parti ise demokrasinin temel özellikleridir."},{"id":"G031","n":31,"scope":"general","cat":"politik","q":"Die Zusammenarbeit von Parteien zur Bildung einer Regierung nennt man in Deutschland …","a":["Einheit.","Koalition.","Ministerium.","Fraktion."],"c":1,"img":null,"tq":"Almanya'da partilerin hükümet kurmak için iş birliği yapmasına … denir.","ta":["birlik","koalisyon","bakanlık","meclis grubu"],"exp":"Doğru cevap koalisyondur: Almanya'da bir parti tek başına çoğunluğu nadiren elde eder, bu yüzden iki veya daha fazla parti bir koalisyon anlaşması yaparak birlikte hükümet kurar. 'Fraktion' ise tek bir partinin parlamentodaki milletvekillerinden oluşan meclis grubudur, partiler arası iş birliği değildir."},{"id":"G032","n":32,"scope":"general","cat":"politik","q":"Was ist keine staatliche Gewalt in Deutschland?","a":["Gesetzgebung","Regierung","Presse","Rechtsprechung"],"c":2,"img":null,"tq":"Hangisi Almanya'da bir devlet erki değildir?","ta":["Yasama","Hükümet","Basın","Yargı"],"exp":"Doğru cevap basındır: Basın devletin bir organı değil, bağımsız bir denetleyicidir; bu yüzden halk arasında 'dördüncü kuvvet' denir, ama resmi bir devlet erki değildir. Üç devlet erki yasama (parlamento), yürütme (hükümet ve idare) ve yargıdır (mahkemeler)."},{"id":"G033","n":33,"scope":"general","cat":"politik","q":"Welche Aussage ist richtig? In Deutschland …","a":["sind Staat und Religionsgemeinschaften voneinander getrennt.","bilden die Religionsgemeinschaften den Staat.","ist der Staat abhängig von den Religionsgemeinschaften.","bilden Staat und Religionsgemeinschaften eine Einheit."],"c":0,"img":null,"tq":"Hangi ifade doğrudur? Almanya'da …","ta":["devlet ile dini topluluklar birbirinden ayrıdır.","dini topluluklar devleti oluşturur.","devlet dini topluluklara bağımlıdır.","devlet ile dini topluluklar bir bütün oluşturur."],"exp":"Doğru cevap: Almanya'da devlet ile dini topluluklar birbirinden ayrıdır. Devlet kilisesi yoktur ve devlet dinler karşısında tarafsızdır (Grundgesetz madde 140). Buna rağmen devlet ve kiliseler bazı alanlarda iş birliği yapar, örneğin kilise vergisini devlet toplar; bu ayrılık ilkesini değiştirmez."},{"id":"G034","n":34,"scope":"general","cat":"politik","q":"Was ist Deutschland nicht?","a":["eine Demokratie","ein Rechtsstaat","eine Monarchie","ein Sozialstaat"],"c":2,"img":null,"tq":"Almanya ne değildir?","ta":["bir demokrasi","bir hukuk devleti","bir monarşi","bir sosyal devlet"],"exp":"Doğru cevap monarşidir: Almanya'da kral veya imparator yoktur; monarşi 1918'de sona erdi ve ülke o zamandan beri cumhuriyettir. Demokrasi, hukuk devleti ve sosyal devlet ise Grundgesetz'in (Temel Yasa/Anayasa) 20. maddesinde sayılan temel devlet ilkeleridir."},{"id":"G035","n":35,"scope":"general","cat":"politik","q":"Womit finanziert der deutsche Staat die Sozialversicherung?","a":["Kirchensteuer","Sozialabgaben","Spendengeldern","Vereinsbeiträgen"],"c":1,"img":null,"tq":"Alman devleti sosyal sigortayı neyle finanse eder?","ta":["Kilise vergisiyle","Sosyal sigorta primleriyle","Bağış paralarıyla","Dernek aidatlarıyla"],"exp":"Doğru cevap sosyal sigorta primleridir (Sozialabgaben): Çalışanların brüt maaşından kesilen ve işverenin de katkı yaptığı primler emeklilik, sağlık, bakım, işsizlik ve kaza sigortasını finanse eder. Kilise vergisi kiliselere gider, bağışlar ve dernek aidatları ise sosyal sigortayla ilgisizdir."},{"id":"G036","n":36,"scope":"general","cat":"politik","q":"Welche Maßnahme schafft in Deutschland soziale Sicherheit?","a":["die Krankenversicherung","die Autoversicherung","die Gebäudeversicherung","die Haftpflichtversicherung"],"c":0,"img":null,"tq":"Almanya'da hangi önlem sosyal güvenlik sağlar?","ta":["sağlık sigortası","araç sigortası","bina sigortası","sorumluluk sigortası"],"exp":"Doğru cevap sağlık sigortasıdır (Krankenversicherung): Almanya'da herkes için zorunludur ve yasal sosyal sigortanın beş kolundan biridir. Araç, bina ve sorumluluk sigortaları özel sigortalardır; mal varlığını korurlar ama devletin sosyal güvenlik sisteminin parçası değildirler."},{"id":"G037","n":37,"scope":"general","cat":"politik","q":"Wie werden die Regierungschefinnen/Regierungschefs der meisten Bundesländer in Deutschland genannt?","a":["Erste Ministerin/Erster Minister","Premierministerin/Premierminister","Senatorin/Senator","Ministerpräsidentin/Ministerpräsident"],"c":3,"img":null,"tq":"Almanya'da çoğu eyaletin hükümet başkanı nasıl adlandırılır?","ta":["Erste Ministerin/Erster Minister (Birinci Bakan)","Premierministerin/Premierminister (Başbakan)","Senatorin/Senator (Senatör)","Ministerpräsidentin/Ministerpräsident (Eyalet Başbakanı)"],"exp":"Doğru cevap Ministerpräsident'tir (Eyalet Başbakanı): 13 alan eyaletinin hükümet başkanı bu unvanı taşır. Soru 'çoğu eyalet' der, çünkü şehir eyaletlerinde unvan farklıdır: Berlin'de 'Regierender Bürgermeister', Hamburg'da 'Erster Bürgermeister'. Senatörler ise şehir eyaletlerinin bakanlarıdır."},{"id":"G038","n":38,"scope":"general","cat":"politik","q":"Die Bundesrepublik Deutschland ist ein demokratischer und sozialer …","a":["Staatenverbund.","Bundesstaat.","Staatenbund.","Zentralstaat."],"c":1,"img":null,"tq":"Federal Almanya Cumhuriyeti demokratik ve sosyal bir …","ta":["devletler birliğidir (Staatenverbund).","federal devlettir (Bundesstaat).","konfederasyondur (Staatenbund).","merkezi devlettir (Zentralstaat)."],"exp":"Doğru cevap federal devlettir (Bundesstaat): Grundgesetz'in (Temel Yasa/Anayasa) 20. maddesi Almanya'yı tam bu sözlerle tanımlar. Eyaletler kendi devlet niteliğini korur ama tek devletin parçasıdır; konfederasyon bağımsız devletlerin gevşek birliğidir, 'Staatenverbund' ise AB'yi anlatır."},{"id":"G039","n":39,"scope":"general","cat":"politik","q":"Was hat jedes deutsche Bundesland?","a":["eine eigene Außenministerin/einen eigenen Außenminister","eine eigene Währung","eine eigene Armee","eine eigene Regierung"],"c":3,"img":null,"tq":"Her Alman eyaletinin (Bundesland) nesi vardır?","ta":["kendi dışişleri bakanı","kendi para birimi","kendi ordusu","kendi hükümeti"],"exp":"Doğru cevap: her eyaletin kendi hükümeti (Landesregierung) vardır. Almanya federal bir devlettir; 16 eyaletin her birinin kendi meclisi, hükümeti ve anayasası bulunur. Dış politika, para birimi ve ordu ise yalnız federal devlete aittir; bu yüzden diğer şıklar yanlıştır."},{"id":"G040","n":40,"scope":"general","cat":"politik","q":"Mit welchen Worten beginnt die deutsche Nationalhymne?","a":["Völker, hört die Signale …","Einigkeit und Recht und Freiheit …","Freude schöner Götterfunken …","Deutschland einig Vaterland …"],"c":1,"img":null,"tq":"Alman milli marşı hangi sözlerle başlar?","ta":["Völker, hört die Signale … (Halklar, işaretleri duyun)","Einigkeit und Recht und Freiheit … (Birlik ve hukuk ve özgürlük)","Freude schöner Götterfunken … (Neşe, güzel tanrısal kıvılcım)","Deutschland einig Vaterland … (Almanya birleşik anavatan)"],"exp":"Doğru cevap 'Einigkeit und Recht und Freiheit'tır: Milli marş olarak yalnızca Deutschlandlied'in üçüncü kıtası söylenir ve bu sözlerle başlar. 'Völker, hört die Signale' Enternasyonal'den, 'Freude schöner Götterfunken' AB marşı olan 9. Senfoni'den, 'Deutschland einig Vaterland' ise eski DDR marşındandır."},{"id":"G041","n":41,"scope":"general","cat":"politik","q":"Warum gibt es in einer Demokratie mehr als eine Partei?","a":["weil dadurch die unterschiedlichen Meinungen der Bürgerinnen und Bürger vertreten werden","damit Bestechung in der Politik begrenzt wird","um politische Demonstrationen zu verhindern","um wirtschaftlichen Wettbewerb anzuregen"],"c":0,"img":null,"tq":"Bir demokraside neden birden fazla parti vardır?","ta":["çünkü böylece vatandaşların farklı görüşleri temsil edilir","siyasette rüşvet sınırlansın diye","siyasi gösterileri önlemek için","ekonomik rekabeti teşvik etmek için"],"exp":"Doğru cevap: Birden fazla parti, vatandaşların farklı görüş ve çıkarlarının parlamentoda temsil edilmesini sağlar. Demokrasi çoğulculuğa dayanır; tek partili sistemler diktatörlüklerin özelliğidir. Rüşvet, gösteriler veya ekonomik rekabet ise çok partili sistemin gerekçesi değildir."},{"id":"G042","n":42,"scope":"general","cat":"politik","q":"Wer beschließt in Deutschland ein neues Gesetz?","a":["die Regierung","das Parlament","die Gerichte","die Polizei"],"c":1,"img":null,"tq":"Almanya'da yeni bir yasayı kim kabul eder?","ta":["hükümet","parlamento","mahkemeler","polis"],"exp":"Doğru cevap parlamentodur: Federal yasaları Bundestag (Federal Meclis) kabul eder, Bundesrat (Federal Konsey) da sürece katılır. Hükümet yasa tasarısı hazırlayabilir ama kabul edemez; mahkemeler yasaları uygular ve denetler, polis ise yürütmenin bir parçası olarak yasaları uygular."},{"id":"G043","n":43,"scope":"general","cat":"politik","q":"Wann kann in Deutschland eine Partei verboten werden?","a":["wenn ihr Wahlkampf zu teuer ist","wenn sie gegen die Verfassung kämpft","wenn sie Kritik am Staatsoberhaupt äußert","wenn ihr Programm eine neue Richtung vorschlägt"],"c":1,"img":null,"tq":"Almanya'da bir parti ne zaman yasaklanabilir?","ta":["seçim kampanyası çok pahalıysa","anayasaya karşı mücadele ediyorsa","devlet başkanını eleştiriyorsa","programı yeni bir yön öneriyorsa"],"exp":"Doğru cevap: Bir parti anayasaya karşı mücadele ediyorsa, yani özgür demokratik düzeni yıkmayı amaçlıyorsa yasaklanabilir. Bu kararı yalnızca Federal Anayasa Mahkemesi (Bundesverfassungsgericht) verebilir (Grundgesetz madde 21). Devlet başkanını eleştirmek veya yeni fikirler önermek ise demokrasinin normal parçasıdır."},{"id":"G044","n":44,"scope":"general","cat":"politik","q":"Wen kann man als Bürgerin/Bürger in Deutschland nicht direkt wählen?","a":["Abgeordnete des EU-Parlaments","Die Bundespräsidentin/den Bundespräsidenten","Landtagsabgeordnete","Bundestagsabgeordnete"],"c":1,"img":null,"tq":"Almanya'da vatandaş olarak kimi doğrudan seçemezsiniz?","ta":["AB Parlamentosu milletvekillerini","Bundespräsident'i (Federal Cumhurbaşkanı)","Landtag (Eyalet Meclisi) milletvekillerini","Bundestag (Federal Meclis) milletvekillerini"],"exp":"Doğru cevap Bundespräsident'tir (Federal Cumhurbaşkanı): Halk tarafından değil, yalnızca bu amaçla toplanan Bundesversammlung (Federal Kurul) tarafından 5 yıl için seçilir. Kurul, Bundestag üyeleri ile eyaletlerin eşit sayıda temsilcisinden oluşur. AB, eyalet ve federal meclis milletvekillerini ise halk doğrudan seçer."},{"id":"G045","n":45,"scope":"general","cat":"politik","q":"Zu welcher Versicherung gehört die Pflegeversicherung?","a":["Sozialversicherung","Unfallversicherung","Hausratsversicherung","Haftpflicht- und Feuerversicherung"],"c":0,"img":null,"tq":"Bakım sigortası (Pflegeversicherung) hangi sigortaya dahildir?","ta":["Sosyal sigorta","Kaza sigortası","Ev eşyası sigortası","Sorumluluk ve yangın sigortası"],"exp":"Doğru cevap sosyal sigortadır: 1995'te getirilen bakım sigortası, yasal sosyal sigortanın beş kolundan biridir; diğerleri sağlık, emeklilik, işsizlik ve kaza sigortasıdır. Ev eşyası, sorumluluk ve yangın sigortaları ise isteğe bağlı özel sigortalardır."},{"id":"G046","n":46,"scope":"general","cat":"politik","q":"Der deutsche Staat hat viele Aufgaben. Welche Aufgabe gehört dazu?","a":["Er baut Straßen und Schulen.","Er verkauft Lebensmittel und Kleidung.","Er versorgt alle Einwohnerinnen und Einwohner kostenlos mit Zeitungen.","Er produziert Autos und Busse."],"c":0,"img":null,"tq":"Alman devletinin birçok görevi vardır. Hangi görev bunlara dahildir?","ta":["Yollar ve okullar inşa eder.","Gıda ve giysi satar.","Tüm sakinlere ücretsiz gazete sağlar.","Otomobil ve otobüs üretir."],"exp":"Doğru cevap: Devlet yollar ve okullar inşa eder; altyapı ve eğitim klasik kamu görevleridir ve vergilerle finanse edilir. Gıda ve giysi satmak, araç üretmek gibi işler ise sosyal piyasa ekonomisinde özel şirketlere aittir; devlet gazete de dağıtmaz, çünkü basın devletten bağımsızdır."},{"id":"G047","n":47,"scope":"general","cat":"politik","q":"Der deutsche Staat hat viele Aufgaben. Welche Aufgabe gehört nicht dazu?","a":["Er bezahlt für alle Staatsangehörigen Urlaubsreisen.","Er zahlt Kindergeld.","Er unterstützt Museen.","Er fördert Sportlerinnen und Sportler."],"c":0,"img":null,"tq":"Alman devletinin birçok görevi vardır. Hangi görev bunlara dahil değildir?","ta":["Tüm vatandaşların tatil seyahatlerini öder.","Çocuk parası (Kindergeld) öder.","Müzeleri destekler.","Sporcuları teşvik eder."],"exp":"Doğru cevap: Devlet vatandaşların tatil seyahatlerini ödemez; tatil kişisel bir harcamadır. Buna karşılık çocuk parası (Kindergeld) ödemek, müzeleri desteklemek ve sporcuları teşvik etmek sosyal devletin ve kültür politikasının gerçek görevleridir."},{"id":"G048","n":48,"scope":"general","cat":"politik","q":"Welches Organ gehört nicht zu den Verfassungsorganen Deutschlands?","a":["der Bundesrat","die Bundespräsidentin/der Bundespräsident","die Bürgerversammlung","die Regierung"],"c":2,"img":null,"tq":"Hangi organ Almanya'nın anayasal organlarından değildir?","ta":["Bundesrat (Federal Konsey)","Bundespräsident (Federal Cumhurbaşkanı)","Vatandaşlar meclisi (Bürgerversammlung)","Hükümet"],"exp":"Doğru cevap vatandaşlar meclisidir (Bürgerversammlung): Böyle bir anayasal organ yoktur; vatandaş toplantıları yalnızca yerel bilgilendirme amaçlıdır. Almanya'nın beş daimi anayasal organı Bundestag, Bundesrat, Bundespräsident, Bundesregierung (Hükümet) ve Bundesverfassungsgericht'tir (Federal Anayasa Mahkemesi)."},{"id":"G049","n":49,"scope":"general","cat":"politik","q":"Wer bestimmt in Deutschland die Schulpolitik?","a":["die Lehrer und Lehrerinnen","die Bundesländer","das Familienministerium","die Universitäten"],"c":1,"img":null,"tq":"Almanya'da okul politikasını kim belirler?","ta":["öğretmenler","eyaletler (Bundesländer)","Aile Bakanlığı","üniversiteler"],"exp":"Doğru cevap eyaletlerdir: Almanya'da eğitim ve kültür işleri eyaletlerin yetkisindedir ('Kulturhoheit der Länder'). Bu yüzden okul türleri, müfredat ve tatil tarihleri eyaletten eyalete değişir. Federal Aile Bakanlığı'nın okullar üzerinde yetkisi yoktur; öğretmenler ve üniversiteler ise politikayı belirlemez, uygular."},{"id":"G050","n":50,"scope":"general","cat":"politik","q":"Die Wirtschaftsform in Deutschland nennt man …","a":["freie Zentralwirtschaft.","soziale Marktwirtschaft.","gelenkte Zentralwirtschaft.","Planwirtschaft."],"c":1,"img":null,"tq":"Almanya'daki ekonomi biçimine … denir.","ta":["serbest merkezi ekonomi","sosyal piyasa ekonomisi","güdümlü merkezi ekonomi","planlı ekonomi"],"exp":"Doğru cevap sosyal piyasa ekonomisidir (soziale Marktwirtschaft): Arz ve talebe dayalı serbest piyasa, devletin sosyal dengeyi koruyan müdahaleleriyle birleştirilir. Bu model 1948'den itibaren Ludwig Erhard'la özdeşleşmiştir. Planlı ve merkezi ekonomi ise eski Doğu Almanya (DDR) gibi sosyalist devletlerin sistemiydi."},{"id":"G051","n":51,"scope":"general","cat":"politik","q":"Zu einem demokratischen Rechtsstaat gehört es nicht, dass …","a":["Menschen sich kritisch über die Regierung äußern können.","Bürger friedlich demonstrieren gehen dürfen.","Menschen von einer Privatpolizei ohne Grund verhaftet werden.","jemand ein Verbrechen begeht und deshalb verhaftet wird."],"c":2,"img":null,"tq":"Demokratik bir hukuk devletine … dahil değildir.","ta":["insanların hükümet hakkında eleştirel görüş bildirebilmesi","vatandaşların barışçıl gösteri yapabilmesi","insanların özel bir polis tarafından sebepsiz yere tutuklanması","birinin suç işlediği için tutuklanması"],"exp":"Doğru cevap: Özel bir polisin insanları sebepsiz yere tutuklaması hukuk devletiyle bağdaşmaz. Tutuklama yetkisi yalnızca devlete aittir, yasal gerekçe ve hâkim kararı gerektirir. Hükümeti eleştirmek ve barışçıl gösteri temel haktır; bir suçlunun yasaya uygun tutuklanması da hukuk devletinin normal işleyişidir."},{"id":"G052","n":52,"scope":"general","cat":"politik","q":"Was bedeutet \"Volkssouveränität\"? Alle Staatsgewalt geht vom …","a":["Volke aus.","Bundestag aus.","preußischen König aus.","Bundesverfassungsgericht aus."],"c":0,"img":null,"tq":"\"Halk egemenliği\" (Volkssouveränität) ne anlama gelir? Tüm devlet erki … kaynaklanır.","ta":["halktan","Bundestag'dan (Federal Meclis)","Prusya kralından","Federal Anayasa Mahkemesi'nden (Bundesverfassungsgericht)"],"exp":"Doğru cevap halktır: Grundgesetz'in (Temel Yasa/Anayasa) 20. maddesi 'Tüm devlet erki halktan kaynaklanır' der. Halk bu erki seçimler ve oylamalarla, ayrıca yasama, yürütme ve yargı organları aracılığıyla kullanır. Bundestag ve Anayasa Mahkemesi bu erki halk adına kullanan organlardır, kaynağı değildir."},{"id":"G053","n":53,"scope":"general","cat":"politik","q":"Was bedeutet \"Rechtsstaat\" in Deutschland?","a":["Der Staat hat Recht.","Es gibt nur rechte Parteien.","Die Bürgerinnen und Bürger entscheiden über Gesetze.","Der Staat muss die Gesetze einhalten."],"c":3,"img":null,"tq":"Almanya'da \"hukuk devleti\" (Rechtsstaat) ne anlama gelir?","ta":["Devlet haklıdır.","Yalnızca sağcı partiler vardır.","Yasalara vatandaşlar karar verir.","Devlet yasalara uymak zorundadır."],"exp":"Doğru cevap: Rechtsstaat (hukuk devleti), devletin kendisinin de yasalara uymak zorunda olduğu anlamına gelir. Devlet keyfi davranamaz; her işlemi yasaya dayanır ve mahkemelerce denetlenebilir. 'Recht' burada 'sağ' değil 'hukuk' demektir; yasaları doğrudan halk değil seçilmiş parlamento yapar."},{"id":"G054","n":54,"scope":"general","cat":"politik","q":"Was ist keine staatliche Gewalt in Deutschland?","a":["Legislative","Judikative","Exekutive","Direktive"],"c":3,"img":null,"tq":"Hangisi Almanya'da bir devlet erki değildir?","ta":["Yasama (Legislative)","Yargı (Judikative)","Yürütme (Exekutive)","Direktif (Direktive)"],"exp":"Doğru cevap 'Direktive'dir: Böyle bir devlet erki yoktur; sözcük yalnızca 'talimat' anlamına gelir ve diğer üçüne benzediği için şaşırtmaca olarak konmuştur. Kuvvetler ayrılığında üç erk vardır: yasama (Legislative), yürütme (Exekutive) ve yargı (Judikative)."},{"id":"G055","n":55,"scope":"general","cat":"politik","q":"Was zeigt dieses Bild?","a":["den Bundestagssitz in Berlin","das Bundesverfassungsgericht in Karlsruhe","das Bundesratsgebäude in Berlin","das Bundeskanzleramt in Berlin"],"c":0,"img":{"kind":"question","urls":["https://upload.wikimedia.org/wikipedia/commons/c/c7/Reichstag_building_Berlin_view_from_west_before_sunset.jpg"],"note":"Foto des Reichstagsgebaeudes in Berlin (Sitz des Deutschen Bundestages), Westfassade. Commons-Ersatzbild, nicht das BAMF-Originalfoto (© Deutscher Bundestag/Achim Melde)."},"tq":"Bu resim neyi gösteriyor?","ta":["Berlin'deki Bundestag'ın (Federal Meclis) binasını","Karlsruhe'deki Federal Anayasa Mahkemesi'ni","Berlin'deki Bundesrat (Federal Konsey) binasını","Berlin'deki Federal Başbakanlık binasını"],"exp":"Doğru cevap Bundestag'ın Berlin'deki binasıdır: Resimde cam kubbesi ve sütunlu girişiyle Reichstag binası görülüyor; alınlığında 'Dem deutschen Volke' (Alman halkına) yazar. Bundestag 1999'dan beri burada toplanır. Federal Anayasa Mahkemesi Karlsruhe'dedir, Başbakanlık ise modern, beyaz küp biçimli bir binadır."},{"id":"G056","n":56,"scope":"general","cat":"politik","q":"Welches Amt gehört in Deutschland zur Gemeindeverwaltung?","a":["Pfarramt","Ordnungsamt","Finanzamt","Auswärtiges Amt"],"c":1,"img":null,"tq":"Almanya'da hangi daire belediye yönetimine aittir?","ta":["Pfarramt (Kilise papazlık dairesi)","Ordnungsamt (Kamu Düzeni Dairesi)","Finanzamt (Vergi Dairesi)","Auswärtiges Amt (Dışişleri Bakanlığı)"],"exp":"Doğru cevap Ordnungsamt'tır (Kamu Düzeni Dairesi): Belediyeye bağlıdır ve park düzeni, gürültü, ruhsatlar gibi yerel düzen işlerine bakar. Finanzamt eyaletin vergi dairesidir, Auswärtiges Amt federal Dışişleri Bakanlığı'dır; Pfarramt ise devlete değil kiliseye aittir."},{"id":"G057","n":57,"scope":"general","cat":"politik","q":"Wer wird meistens zur Präsidentin/zum Präsidenten des Deutschen Bundestages gewählt?","a":["die/der älteste Abgeordnete im Parlament","die Ministerpräsidentin/der Ministerpräsident des größten Bundeslandes","eine ehemalige Bundeskanzlerin/ein ehemaliger Bundeskanzler","eine Abgeordnete/ein Abgeordneter der stärksten Fraktion"],"c":3,"img":null,"tq":"Almanya'da Bundestag (Federal Meclis) Başkanlığına çoğunlukla kim seçilir?","ta":["parlamentodaki en yaşlı milletvekili","en büyük eyaletin başbakanı (Ministerpräsident)","eski bir Federal Başbakan (Bundeskanzler)","en güçlü meclis grubunun bir milletvekili"],"exp":"Doğru cevap: Bundestag Başkanı geleneksel olarak en çok sandalyeye sahip meclis grubunun bir üyesi olur; bu yazılı bir kural değil, yerleşik bir parlamento geleneğidir. En yaşlı milletvekili yalnızca yeni meclisin ilk oturumunu açar. Bundestag Başkanı protokolde Cumhurbaşkanı'ndan sonra ikinci sıradadır."},{"id":"G058","n":58,"scope":"general","cat":"politik","q":"Wer ernennt in Deutschland die Ministerinnen/die Minister der Bundesregierung?","a":["die Präsidentin/der Präsident des Bundesverfassungsgerichtes","die Bundespräsidentin/der Bundespräsident","die Bundesratspräsidentin/der Bundesratspräsident","die Bundestagspräsidentin/der Bundestagspräsident"],"c":1,"img":null,"tq":"Almanya'da Federal Hükümet'in bakanlarını kim atar?","ta":["Federal Anayasa Mahkemesi Başkanı","Bundespräsident (Federal Cumhurbaşkanı)","Bundesrat (Federal Konsey) Başkanı","Bundestag (Federal Meclis) Başkanı"],"exp":"Doğru cevap Bundespräsident'tir (Federal Cumhurbaşkanı): Bakanları resmi olarak Cumhurbaşkanı atar ve görevden alır, ama her zaman Federal Başbakan'ın (Bundeskanzler) önerisi üzerine (Grundgesetz madde 64). Yani bakanları fiilen Başbakan seçer, Cumhurbaşkanı atamayı yapar. Diğer üç başkanın bu konuda yetkisi yoktur."},{"id":"G059","n":59,"scope":"general","cat":"politik","q":"Vor wie vielen Jahren gab es erstmals eine jüdische Gemeinde auf dem Gebiet des heutigen Deutschlands?","a":["vor etwa 300 Jahren","vor etwa 700 Jahren","vor etwa 1150 Jahren","vor etwa 1700 Jahren"],"c":3,"img":null,"tq":"Bugünkü Almanya topraklarında ilk Yahudi cemaati kaç yıl önce ortaya çıktı?","ta":["yaklaşık 300 yıl önce","yaklaşık 700 yıl önce","yaklaşık 1150 yıl önce","yaklaşık 1700 yıl önce"],"exp":"Doğru cevap yaklaşık 1700 yıl öncedir: Köln'deki Yahudi cemaatinden söz eden ilk belge, Roma İmparatoru Konstantin'in MS 321 tarihli bir fermanıdır. Bu, Alpler'in kuzeyindeki en eski Yahudi yerleşim kanıtıdır. Almanya 2021'de 'Almanya'da 1700 yıllık Yahudi yaşamı' yıl dönümünü kutladı; bu tarih iyi bir hafıza ipucudur."},{"id":"G060","n":60,"scope":"general","cat":"politik","q":"In Deutschland gehören der Bundestag und der Bundesrat zur …","a":["Exekutive.","Legislative.","Direktive.","Judikative."],"c":1,"img":null,"tq":"Almanya'da Bundestag (Federal Meclis) ve Bundesrat (Federal Konsey) … dahildir.","ta":["yürütmeye (Exekutive)","yasamaya (Legislative)","direktife (Direktive)","yargıya (Judikative)"],"exp":"Doğru cevap yasamadır (Legislative): Bundestag ve Bundesrat federal düzeyde yasa yapan organlardır. Bundestag yasaları kabul eder, Bundesrat ise eyaletlerin katılımını sağlar. Yürütme hükümet ve idaredir, yargı mahkemelerdir; 'Direktive' ise devlet erki değildir."},{"id":"G061","n":61,"scope":"general","cat":"politik","q":"Was bedeutet \"Volkssouveränität\"?","a":["Die Königin/der König herrscht über das Volk.","Das Bundesverfassungsgericht steht über der Verfassung.","Die Interessenverbände üben die Souveränität zusammen mit der Regierung aus.","Die Staatsgewalt geht vom Volke aus."],"c":3,"img":null,"tq":"\"Halk egemenliği\" (Volkssouveränität) ne anlama gelir?","ta":["Kral veya kraliçe halkı yönetir.","Federal Anayasa Mahkemesi anayasanın üstündedir.","Çıkar grupları egemenliği hükümetle birlikte kullanır.","Devlet erki halktan kaynaklanır."],"exp":"Doğru cevap: Devlet erki halktan kaynaklanır (Grundgesetz madde 20). Halk bu erki seçimlerle ve seçtiği organlar aracılığıyla kullanır. Bir hükümdarın yönetmesi monarşidir; Anayasa Mahkemesi anayasanın üstünde değil, ona bağlıdır; çıkar grupları da egemenliğe ortak değildir."},{"id":"G062","n":62,"scope":"general","cat":"politik","q":"Wenn das Parlament eines deutschen Bundeslandes gewählt wird, nennt man das …","a":["Kommunalwahl","Landtagswahl","Europawahl","Bundestagswahl"],"c":1,"img":null,"tq":"Bir Alman eyaletinin parlamentosu seçildiğinde buna … denir.","ta":["Kommunalwahl (yerel seçim)","Landtagswahl (eyalet meclisi seçimi)","Europawahl (Avrupa seçimi)","Bundestagswahl (Federal Meclis seçimi)"],"exp":"Doğru cevap Landtagswahl'dır: Eyalet parlamentosu Landtag (Eyalet Meclisi) olduğu için seçimine Landtagswahl denir; genellikle beş yılda bir yapılır. Kommunalwahl belediye meclisi seçimidir, Bundestagswahl federal parlamento seçimi, Europawahl ise Avrupa Parlamentosu seçimidir."},{"id":"G063","n":63,"scope":"general","cat":"politik","q":"Was gehört in Deutschland nicht zur Exekutive?","a":["die Polizei","die Gerichte","das Finanzamt","die Ministerien"],"c":1,"img":null,"tq":"Almanya'da hangisi yürütmeye (Exekutive) dahil değildir?","ta":["polis","mahkemeler","vergi dairesi (Finanzamt)","bakanlıklar"],"exp":"Doğru cevap mahkemelerdir: Mahkemeler yargı erkini (Judikative) oluşturur ve yürütmeden bağımsızdır. Polis, vergi dairesi ve bakanlıklar ise yasaları uygulayan idari kurumlar olarak yürütmenin parçasıdır. Hafıza ipucu: Yürütme 'uygular', yargı 'karar verir'."},{"id":"G064","n":64,"scope":"general","cat":"politik","q":"Die Bundesrepublik Deutschland ist heute gegliedert in …","a":["vier Besatzungszonen.","einen Oststaat und einen Weststaat.","16 Kantone.","Bund, Länder und Kommunen."],"c":3,"img":null,"tq":"Federal Almanya Cumhuriyeti bugün … ayrılmıştır.","ta":["dört işgal bölgesine","bir doğu devleti ve bir batı devletine","16 kantona","federasyon (Bund), eyaletler (Länder) ve belediyelere (Kommunen)"],"exp":"Doğru cevap: Almanya bugün federasyon (Bund), eyaletler (Länder) ve belediyeler (Kommunen) olmak üzere üç düzeyden oluşur. Dört işgal bölgesi 1945-1949 arasındaki durumdu; iki Alman devleti 1990'daki birleşmeyle sona erdi; kanton ise İsviçre'nin idari birimidir, Almanya'nınki eyalettir."},{"id":"G065","n":65,"scope":"general","cat":"politik","q":"Es gehört nicht zu den Aufgaben des Deutschen Bundestages, …","a":["Gesetze zu entwerfen.","die Bundesregierung zu kontrollieren.","die Bundeskanzlerin/den Bundeskanzler zu wählen.","das Bundeskabinett zu bilden."],"c":3,"img":null,"tq":"… Alman Bundestag'ının (Federal Meclis) görevlerine dahil değildir.","ta":["Yasa tasarıları hazırlamak","Federal Hükümet'i denetlemek","Federal Başbakan'ı (Bundeskanzler) seçmek","Federal kabineyi oluşturmak"],"exp":"Doğru cevap: Federal kabineyi oluşturmak Bundestag'ın görevi değildir; bakanları Federal Başbakan seçer ve Cumhurbaşkanı atar. Bundestag'ın asıl görevleri yasa yapmak, hükümeti denetlemek ve Başbakan'ı seçmektir. Hafıza ipucu: Bundestag Başbakan'ı seçer, Başbakan kabineyi kurar."},{"id":"G066","n":66

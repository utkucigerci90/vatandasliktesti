,"scope":"general","cat":"politik","q":"Welche Städte haben die größten jüdischen Gemeinden in Deutschland?","a":["Berlin und München","Hamburg und Essen","Nürnberg und Stuttgart","Worms und Speyer"],"c":0,"img":null,"tq":"Almanya'daki en büyük Yahudi cemaatleri hangi şehirlerdedir?","ta":["Berlin ve München","Hamburg ve Essen","Nürnberg ve Stuttgart","Worms ve Speyer"],"exp":"Doğru cevap Berlin ve München'dir: Bugün en kalabalık Yahudi cemaatleri bu iki büyük şehirdedir. Worms ve Speyer şaşırtıcı bir seçenektir: Orta Çağ'da (Mainz ile birlikte 'ŞUM şehirleri') önemli Yahudi merkezleriydi ve 2021'de UNESCO Dünya Mirası oldu, ama bugünkü cemaatleri küçüktür."},{"id":"G067","n":67,"scope":"general","cat":"politik","q":"Was ist in Deutschland vor allem eine Aufgabe der Bundesländer?","a":["Verteidigungspolitik","Außenpolitik","Wirtschaftspolitik","Schulpolitik"],"c":3,"img":null,"tq":"Almanya'da hangisi öncelikle eyaletlerin (Bundesländer) görevidir?","ta":["Savunma politikası","Dış politika","Ekonomi politikası","Okul politikası"],"exp":"Doğru cevap okul politikasıdır: Eğitim ve kültür Almanya'da eyaletlerin yetki alanındadır, bu yüzden her eyaletin kendi eğitim bakanlığı ve okul sistemi vardır. Savunma ve dış politika yalnızca federal devletin görevidir; ekonomi politikası da ağırlıklı olarak federal düzeyde belirlenir."},{"id":"G068","n":68,"scope":"general","cat":"politik","q":"Warum kontrolliert der Staat in Deutschland das Schulwesen?","a":["weil es in Deutschland nur staatliche Schulen gibt","weil alle Schülerinnen und Schüler einen Schulabschluss haben müssen","weil es in den Bundesländern verschiedene Schulen gibt","weil es nach dem Grundgesetz seine Aufgabe ist"],"c":3,"img":null,"tq":"Almanya'da devlet okul sistemini neden denetler?","ta":["çünkü Almanya'da yalnızca devlet okulları vardır","çünkü tüm öğrencilerin bir okul diploması olmak zorundadır","çünkü eyaletlerde farklı okullar vardır","çünkü Grundgesetz'e (Temel Yasa/Anayasa) göre bu onun görevidir"],"exp":"Doğru cevap: Grundgesetz'in 7. maddesi 'Tüm okul sistemi devletin denetimi altındadır' der; yani bu anayasal bir görevdir. Almanya'da özel okullar da vardır, bu yüzden ilk seçenek yanlıştır; diploma zorunluluğu veya okul çeşitliliği de denetimin anayasal gerekçesi değildir."},{"id":"G069","n":69,"scope":"general","cat":"politik","q":"Die Bundesrepublik Deutschland hat einen dreistufigen Verwaltungsaufbau. Wie heißt die unterste politische Stufe?","a":["Stadträte","Landräte","Gemeinden","Bezirksämter"],"c":2,"img":null,"tq":"Federal Almanya Cumhuriyeti üç kademeli bir idari yapıya sahiptir. En alttaki siyasi kademenin adı nedir?","ta":["Belediye meclisleri (Stadträte)","İlçe kaymakamları (Landräte)","Belediyeler (Gemeinden)","Semt daireleri (Bezirksämter)"],"exp":"Doğru cevap belediyelerdir (Gemeinden): Üç kademe federasyon (Bund), eyaletler (Länder) ve belediyelerdir (Gemeinden). Belediyeler yerel işleri kendi kendine yönetme hakkına sahiptir (Grundgesetz madde 28). Stadtrat belediyenin seçilmiş meclisidir, Landrat ise ilçe yöneticisidir; bunlar kademe değil, organdır."},{"id":"G070","n":70,"scope":"general","cat":"politik","q":"Der deutsche Bundespräsident Gustav Heinemann gibt Helmut Schmidt 1974 die Ernennungsurkunde zum deutschen Bundeskanzler. Was gehört zu den Aufgaben der deutschen Bundespräsidentin/des deutschen Bundespräsidenten?","a":["Sie/Er führt die Regierungsgeschäfte.","Sie/Er kontrolliert die Regierungspartei.","Sie/Er wählt die Ministerinnen/Minister aus.","Sie/Er schlägt die Kanzlerin/den Kanzler zur Wahl vor."],"c":3,"img":{"kind":"question","urls":[],"note":"Foto: Bundespraesident Gustav Heinemann ueberreicht Helmut Schmidt 1974 die Ernennungsurkunde (© Bundesregierung/Engelbert Reineke). Kein freies Ersatzbild verifiziert; der Bildinhalt steht im Fragetext."},"tq":"Federal Cumhurbaşkanı Gustav Heinemann 1974'te Helmut Schmidt'e Federal Başbakanlık atama belgesini veriyor. Almanya'da Bundespräsident'in (Federal Cumhurbaşkanı) görevleri arasında hangisi vardır?","ta":["Hükümet işlerini yürütür.","İktidar partisini denetler.","Bakanları seçer.","Başbakanı (Kanzler) seçim için önerir."],"exp":"Doğru cevap: Cumhurbaşkanı, Bundestag'a (Federal Meclis) Başbakan adayını önerir; Bundestag onu seçer, Cumhurbaşkanı da atar (Grundgesetz madde 63). Fotoğraf tam bu anı gösterir. Hükümet işlerini Başbakan yürütür, bakanları da Başbakan seçer; Cumhurbaşkanı'nın görevi büyük ölçüde temsilidir."},{"id":"G071","n":71,"scope":"general","cat":"politik","q":"Wo hält sich die deutsche Bundeskanzlerin/der deutsche Bundeskanzler am häufigsten auf? Am häufigsten ist sie/er …","a":["in Bonn, weil sich dort das Bundeskanzleramt und der Bundestag befinden.","auf Schloss Meseberg, dem Gästehaus der Bundesregierung, um Staatsgäste zu empfangen.","auf Schloss Bellevue, dem Amtssitz der Bundespräsidentin/des Bundespräsidenten, um Staatsgäste zu empfangen.","in Berlin, weil sich dort das Bundeskanzleramt und der Bundestag befinden."],"c":3,"img":null,"tq":"Alman Federal Başbakanı en çok nerede bulunur? En sık …","ta":["Bonn'dadır, çünkü Federal Başbakanlık ve Bundestag oradadır.","Federal Hükümet'in konukevi Meseberg Sarayı'ndadır, devlet konuklarını ağırlamak için.","Federal Cumhurbaşkanı'nın makamı Bellevue Sarayı'ndadır, devlet konuklarını ağırlamak için.","Berlin'dedir, çünkü Federal Başbakanlık ve Bundestag oradadır."],"exp":"Doğru cevap Berlin'dir: Hükümet ve parlamento 1999'da Bonn'dan Berlin'e taşındı; Bundeskanzleramt (Federal Başbakanlık) ve Bundestag (Federal Meclis) bugün Berlin'dedir. Bonn 1949-1990 arasında Batı Almanya'nın başkentiydi. Bellevue Sarayı Cumhurbaşkanı'nın makamıdır, Meseberg ise yalnızca konukevidir."},{"id":"G072","n":72,"scope":"general","cat":"politik","q":"Wie heißt die jetzige Bundeskanzlerin/der jetzige Bundeskanzler von Deutschland?","a":["Gerhard Schröder","Angela Merkel","Ursula von der Leyen","Friedrich Merz"],"c":3,"img":null,"tq":"Almanya'nın şu anki Federal Başbakanı (Bundeskanzler) kimdir?","ta":["Gerhard Schröder","Angela Merkel","Ursula von der Leyen","Friedrich Merz"],"exp":"Doğru cevap Friedrich Merz'dir: Şubat 2025 seçimlerinin ardından Mayıs 2025'te Bundestag tarafından Federal Başbakan seçildi. Angela Merkel 2005-2021, Gerhard Schröder 1998-2005 arasında Başbakandı; Ursula von der Leyen ise Avrupa Komisyonu Başkanıdır. Bu soru güncel olduğundan sınavdan önce kontrol edin."},{"id":"G073","n":73,"scope":"general","cat":"politik","q":"Die beiden größten Fraktionen im Deutschen Bundestag heißen zurzeit …","a":["CDU/CSU und AfD.","Die Linke und Bündnis 90/Die Grünen.","Bündnis 90/Die Grünen und SPD.","Die Linke und CDU/CSU."],"c":0,"img":null,"tq":"Alman Bundestag'ındaki (Federal Meclis) en büyük iki meclis grubu şu anda …","ta":["CDU/CSU ve AfD'dir.","Die Linke ve Bündnis 90/Die Grünen'dir.","Bündnis 90/Die Grünen ve SPD'dir.","Die Linke ve CDU/CSU'dur."],"exp":"Doğru cevap CDU/CSU ve AfD'dir: Şubat 2025 seçiminde CDU/CSU yaklaşık %28,5 ile birinci, AfD yaklaşık %20,8 ile ikinci oldu; SPD üçüncü sıraya düştü. Meclis grubu (Fraktion) büyüklüğü sandalye sayısına göre belirlenir. Bu bilgi her seçimde değişebilir, güncelliğini kontrol edin."},{"id":"G074","n":74,"scope":"general","cat":"politik","q":"Wie heißt das Parlament für ganz Deutschland?","a":["Bundesversammlung","Volkskammer","Bundestag","Bundesgerichtshof"],"c":2,"img":null,"tq":"Tüm Almanya için geçerli olan parlamentonun adı nedir?","ta":["Bundesversammlung (Federal Kurul)","Volkskammer (Halk Meclisi)","Bundestag (Federal Meclis)","Bundesgerichtshof (Federal Yargıtay)"],"exp":"Doğru cevap Bundestag'dır (Federal Meclis): Almanya'nın halk tarafından doğrudan seçilen tek federal parlamentosudur ve Berlin'deki Reichstag binasında toplanır. Bundesversammlung yalnızca Cumhurbaşkanı'nı seçer, Volkskammer eski Doğu Almanya'nın (DDR) parlamentosuydu, Bundesgerichtshof ise bir yüksek mahkemedir."},{"id":"G075","n":75,"scope":"general","cat":"politik","q":"Wie heißt Deutschlands heutiges Staatsoberhaupt?","a":["Frank-Walter Steinmeier","Bärbel Bas","Bodo Ramelow","Joachim Gauck"],"c":0,"img":null,"tq":"Almanya'nın bugünkü devlet başkanı kimdir?","ta":["Frank-Walter Steinmeier","Bärbel Bas","Bodo Ramelow","Joachim Gauck"],"exp":"Doğru cevap Frank-Walter Steinmeier'dir: 2017'den beri Bundespräsident (Federal Cumhurbaşkanı) olarak devlet başkanıdır; 2022'de ikinci kez 5 yıl için seçildi. Joachim Gauck ondan önceki Cumhurbaşkanıydı (2012-2017); Bärbel Bas ve Bodo Ramelow bu görevde bulunmadı. Güncel bir soru olduğundan sınavdan önce kontrol edin."},{"id":"G076","n":76,"scope":"general","cat":"politik","q":"Was bedeutet die Abkürzung CDU in Deutschland?","a":["Christliche Deutsche Union","Club Deutscher Unternehmer","Christlicher Deutscher Umweltschutz","Christlich Demokratische Union"],"c":3,"img":null,"tq":"Almanya'da CDU kısaltması ne anlama gelir?","ta":["Christliche Deutsche Union (Hristiyan Alman Birliği)","Club Deutscher Unternehmer (Alman Girişimciler Kulübü)","Christlicher Deutscher Umweltschutz (Hristiyan Alman Çevre Koruması)","Christlich Demokratische Union (Hristiyan Demokrat Birlik)"],"exp":"Doğru cevap Christlich Demokratische Union (Hristiyan Demokrat Birlik). Kısaltmadaki D harfi \"Deutsche\" değil \"Demokratische\" kelimesinden gelir; parti adında Almanya ya da Alman kelimesi geçmez. CDU, Bavyera dışındaki tüm eyaletlerde faaliyet gösteren büyük bir halk partisidir."},{"id":"G077","n":77,"scope":"general","cat":"politik","q":"Was ist die Bundeswehr?","a":["die deutsche Polizei","ein deutscher Hafen","eine deutsche Bürgerinitiative","die deutsche Armee"],"c":3,"img":null,"tq":"Bundeswehr nedir?","ta":["Alman polisi","bir Alman limanı","bir Alman vatandaş girişimi","Alman ordusu"],"exp":"Bundeswehr, Almanya'nın silahlı kuvvetleri yani Alman ordusudur; 1955'te kurulmuştur. Addaki \"Wehr\" kelimesi savunma anlamına gelir. Polis ise Polizei olarak adlandırılır ve esas olarak eyaletlerin sorumluluğundadır."},{"id":"G078","n":78,"scope":"general","cat":"politik","q":"Was bedeutet die Abkürzung SPD?","a":["Sozialistische Partei Deutschlands","Sozialpolitische Partei Deutschlands","Sozialdemokratische Partei Deutschlands","Sozialgerechte Partei Deutschlands"],"c":2,"img":null,"tq":"SPD kısaltması ne anlama gelir?","ta":["Sozialistische Partei Deutschlands (Almanya Sosyalist Partisi)","Sozialpolitische Partei Deutschlands (Almanya Sosyal Politika Partisi)","Sozialdemokratische Partei Deutschlands (Almanya Sosyal Demokrat Partisi)","Sozialgerechte Partei Deutschlands (Almanya Sosyal Adalet Partisi)"],"exp":"Doğru cevap Sozialdemokratische Partei Deutschlands (Almanya Sosyal Demokrat Partisi). Dört seçenek de \"Sozial... Partei Deutschlands\" kalıbındadır, kilit kelime \"demokratische\"dir: SPD sosyal demokrat bir partidir, sosyalist değil. Kökleri 1863'e uzanan SPD, Almanya'nın en eski partisidir."},{"id":"G079","n":79,"scope":"general","cat":"politik","q":"Was bedeutet die Abkürzung FDP in Deutschland?","a":["Friedliche Demonstrative Partei","Freie Deutschland Partei","Führende Demokratische Partei","Freie Demokratische Partei"],"c":3,"img":null,"tq":"Almanya'da FDP kısaltması ne anlama gelir?","ta":["Friedliche Demonstrative Partei (Barışçıl Gösteri Partisi)","Freie Deutschland Partei (Özgür Almanya Partisi)","Führende Demokratische Partei (Önder Demokrat Parti)","Freie Demokratische Partei (Hür Demokrat Parti)"],"exp":"Doğru cevap Freie Demokratische Partei (Hür Demokrat Parti). FDP 1948'de kurulmuş liberal bir partidir; rengi sarıdır ve üyelerine \"Liberale\" de denir. Kısaltmada F \"Freie\" (özgür), D \"Demokratische\" (demokrat), P \"Partei\" (parti) kelimelerini karşılar."},{"id":"G080","n":80,"scope":"general","cat":"politik","q":"Welches Gericht in Deutschland ist zuständig für die Auslegung des Grundgesetzes?","a":["Oberlandesgericht","Amtsgericht","Bundesverfassungsgericht","Verwaltungsgericht"],"c":2,"img":null,"tq":"Almanya'da Grundgesetz'in (Temel Yasa/Anayasa) yorumlanmasından hangi mahkeme sorumludur?","ta":["Oberlandesgericht (Eyalet Yüksek Mahkemesi)","Amtsgericht (Sulh/İlk Derece Mahkemesi)","Bundesverfassungsgericht (Federal Anayasa Mahkemesi)","Verwaltungsgericht (İdare Mahkemesi)"],"exp":"Doğru cevap Bundesverfassungsgericht (Federal Anayasa Mahkemesi). Karlsruhe'deki bu mahkeme, yasaların ve devlet işlemlerinin Grundgesetz'e (Anayasa) uygun olup olmadığını denetler ve Anayasa'yı herkes için bağlayıcı biçimde yorumlar. Diğer seçenekler günlük ceza, hukuk ve idare davalarına bakan mahkemelerdir."},{"id":"G081","n":81,"scope":"general","cat":"politik","q":"Wer wählt die Bundeskanzlerin/den Bundeskanzler in Deutschland?","a":["der Bundesrat","die Bundesversammlung","das Volk","der Bundestag"],"c":3,"img":null,"tq":"Almanya'da Bundeskanzler'i (Federal Başbakan) kim seçer?","ta":["Bundesrat (Federal Konsey)","Bundesversammlung (Federal Kurul)","halk","Bundestag (Federal Meclis)"],"exp":"Federal Başbakan'ı Bundestag (Federal Meclis) seçer. Halk doğrudan başbakanı değil, Bundestag milletvekillerini seçer; Bundestag da Bundespräsident'in (Federal Cumhurbaşkanı) önerisi üzerine başbakanı oylar. Bundesversammlung (Federal Kurul) ise Cumhurbaşkanı'nı seçen kuruldur."},{"id":"G082","n":82,"scope":"general","cat":"politik","q":"Wer leitet das deutsche Bundeskabinett?","a":["die Bundestagspräsidentin/der Bundestagspräsident","die Bundespräsidentin/der Bundespräsident","die Bundesratspräsidentin/der Bundesratspräsident","die Bundeskanzlerin/der Bundeskanzler"],"c":3,"img":null,"tq":"Alman Federal Kabinesi'ni (Bundeskabinett) kim yönetir?","ta":["Bundestagspräsident/in (Federal Meclis Başkanı)","Bundespräsident/in (Federal Cumhurbaşkanı)","Bundesratspräsident/in (Federal Konsey Başkanı)","Bundeskanzler/in (Federal Başbakan)"],"exp":"Federal Kabine'yi, yani Federal Hükümet'i Bundeskanzler/in (Federal Başbakan) yönetir. Kabine, başbakan ile federal bakanlardan oluşur; başbakan siyasetin ana hatlarını belirler. Cumhurbaşkanı hükümeti yönetmez, devleti temsil eder; Meclis ve Konsey başkanları ise kendi organlarının oturumlarını yönetir."},{"id":"G083","n":83,"scope":"general","cat":"politik","q":"Wer wählt die deutsche Bundeskanzlerin/den deutschen Bundeskanzler?","a":["das Volk","die Bundesversammlung","der Bundestag","die Bundesregierung"],"c":2,"img":null,"tq":"Alman Bundeskanzler'ini (Federal Başbakan) kim seçer?","ta":["halk","Bundesversammlung (Federal Kurul)","Bundestag (Federal Meclis)","Bundesregierung (Federal Hükümet)"],"exp":"Başbakanı Bundestag (Federal Meclis) seçer; bunun için kural olarak milletvekillerinin salt çoğunluğunun oyu gerekir. Halk başbakanı doğrudan seçmez; Bundesversammlung (Federal Kurul) Cumhurbaşkanı'nı seçer; Bundesregierung (Federal Hükümet) ise başbakanın yönettiği hükümetin kendisidir, onu seçemez."},{"id":"G084","n":84,"scope":"general","cat":"politik","q":"Welche Hauptaufgabe hat die deutsche Bundespräsidentin/der deutsche Bundespräsident? Sie/Er …","a":["regiert das Land.","entwirft die Gesetze.","repräsentiert das Land.","überwacht die Einhaltung der Gesetze."],"c":2,"img":null,"tq":"Alman Bundespräsident'inin (Federal Cumhurbaşkanı) ana görevi nedir? O …","ta":["ülkeyi yönetir.","yasaları tasarlar.","ülkeyi temsil eder.","yasalara uyulmasını denetler."],"exp":"Federal Cumhurbaşkanı'nın ana görevi ülkeyi temsil etmektir: devlet başkanı olarak Almanya'yı yurt içinde ve dışında temsil eder, yasaları imzalar, uluslararası anlaşmaları onaylar. Yönetmek başbakanın, yasa yapmak Bundestag'ın (Federal Meclis), yasalara uyulmasını denetlemek polis ve mahkemelerin işidir."},{"id":"G085","n":85,"scope":"general","cat":"politik","q":"Wer bildet den deutschen Bundesrat?","a":["die Abgeordneten des Bundestages","die Ministerinnen und Minister der Bundesregierung","die Regierungsvertreter der Bundesländer","die Parteimitglieder"],"c":2,"img":null,"tq":"Alman Bundesrat'ını (Federal Konsey) kim oluşturur?","ta":["Bundestag (Federal Meclis) milletvekilleri","Federal Hükümet'in bakanları","eyaletlerin (Bundesländer) hükümet temsilcileri","parti üyeleri"],"exp":"Bundesrat'ı (Federal Konsey) 16 eyaletin hükümet temsilcileri oluşturur; her eyalet nüfusuna göre 3 ile 6 arasında oyla temsil edilir, toplam 69 oy vardır. Bundesrat halk tarafından seçilmez, üyelerini eyalet hükümetleri gönderir; bu yüzden onu seçimle gelen Bundestag (Federal Meclis) ile karıştırmayın."},{"id":"G086","n":86,"scope":"general","cat":"politik","q":"Wer wählt in Deutschland die Bundespräsidentin/den Bundespräsidenten?","a":["die Bundesversammlung","der Bundesrat","das Bundesparlament","das Bundesverfassungsgericht"],"c":0,"img":null,"tq":"Almanya'da Bundespräsident'i (Federal Cumhurbaşkanı) kim seçer?","ta":["Bundesversammlung (Federal Kurul)","Bundesrat (Federal Konsey)","Federal Parlamento","Bundesverfassungsgericht (Federal Anayasa Mahkemesi)"],"exp":"Cumhurbaşkanı'nı yalnızca bu amaçla toplanan Bundesversammlung (Federal Kurul) seçer. Kurul, Bundestag (Federal Meclis) üyeleri ile eyalet meclislerinin gönderdiği eşit sayıda temsilciden oluşur; Cumhurbaşkanı 5 yıl için seçilir ve halk bu seçimde doğrudan oy kullanmaz."},{"id":"G087","n":87,"scope":"general","cat":"politik","q":"Wer ist das Staatsoberhaupt der Bundesrepublik Deutschland?","a":["die Bundeskanzlerin/der Bundeskanzler","die Bundespräsidentin/der Bundespräsident","die Bundesratspräsidentin/der Bundesratspräsident","die Bundestagspräsidentin/der Bundestagspräsident"],"c":1,"img":null,"tq":"Almanya Federal Cumhuriyeti'nin devlet başkanı kimdir?","ta":["Bundeskanzler/in (Federal Başbakan)","Bundespräsident/in (Federal Cumhurbaşkanı)","Bundesratspräsident/in (Federal Konsey Başkanı)","Bundestagspräsident/in (Federal Meclis Başkanı)"],"exp":"Devlet başkanı Bundespräsident/in (Federal Cumhurbaşkanı) olup ülkeyi temsil eder. Hükümetin başı ise başbakandır; Almanya'da bu iki makam birbirinden ayrıdır. İpucu: Staatsoberhaupt = devletin başı = Cumhurbaşkanı."},{"id":"G088","n":88,"scope":"general","cat":"politik","q":"Die parlamentarische Opposition im Deutschen Bundestag …","a":["kontrolliert die Regierung.","entscheidet, wer Bundesministerin/Bundesminister wird.","bestimmt, wer im Bundesrat sitzt.","schlägt die Regierungschefinnen/Regierungschefs der Länder vor."],"c":0,"img":null,"tq":"Alman Bundestag'ındaki (Federal Meclis) parlamento muhalefeti …","ta":["hükümeti denetler.","kimin federal bakan olacağına karar verir.","Bundesrat'ta (Federal Konsey) kimin oturacağını belirler.","eyaletlerin hükümet başkanlarını önerir."],"exp":"Muhalefetin temel görevi hükümeti denetlemektir: soru önergeleri verir, araştırma komisyonları kurdurur ve alternatif politikalar sunar. Bakanları başbakan belirler, Bundesrat (Federal Konsey) üyelerini eyalet hükümetleri gönderir, eyalet başbakanlarını ise eyalet meclisleri seçer."},{"id":"G089","n":89,"scope":"general","cat":"politik","q":"Wie nennt man in Deutschland die Vereinigung von Abgeordneten einer Partei im Parlament?","a":["Verband","Ältestenrat","Fraktion","Opposition"],"c":2,"img":null,"tq":"Almanya'da bir partinin parlamentodaki milletvekillerinin oluşturduğu topluluğa ne denir?","ta":["Verband (birlik/dernek)","Ältestenrat (Yaşlılar Kurulu)","Fraktion (meclis grubu)","Opposition (muhalefet)"],"exp":"Doğru cevap Fraktion, yani meclis grubudur: aynı partiden milletvekilleri Bundestag'da (Federal Meclis) bir Fraktion olarak birlikte çalışır ve oy kullanır. Ältestenrat, meclis çalışmasını planlayan kuruldur; Opposition ise hükümette olmayan grupların tümünü anlatır."},{"id":"G090","n":90,"scope":"general","cat":"politik","q":"Die deutschen Bundesländer wirken an der Gesetzgebung des Bundes mit durch …","a":["den Bundesrat.","die Bundesversammlung.","den Bundestag.","die Bundesregierung."],"c":0,"img":null,"tq":"Alman eyaletleri (Bundesländer) federal düzeydeki yasama sürecine şu organ aracılığıyla katılır: …","ta":["Bundesrat (Federal Konsey).","Bundesversammlung (Federal Kurul).","Bundestag (Federal Meclis).","Bundesregierung (Federal Hükümet)."],"exp":"Eyaletler federal yasalara Bundesrat (Federal Konsey) aracılığıyla katılır: eyalet hükümetlerinin temsilcileri burada yasa tasarılarını görüşür ve birçok yasa ancak Bundesrat'ın onayıyla yürürlüğe girer. Bundestag (Federal Meclis) ise doğrudan halkın seçtiği federal parlamentodur."},{"id":"G091","n":91,"scope":"general","cat":"politik","q":"In Deutschland kann ein Regierungswechsel in einem Bundesland Auswirkungen auf die Bundespolitik haben. Das Regieren wird …","a":["schwieriger, wenn sich dadurch die Mehrheit im Bundestag ändert.","leichter, wenn dadurch neue Parteien in den Bundesrat kommen.","schwieriger, wenn dadurch die Mehrheit im Bundesrat verändert wird.","leichter, wenn es sich um ein reiches Bundesland handelt."],"c":2,"img":null,"tq":"Almanya'da bir eyaletteki hükümet değişikliği federal siyaseti etkileyebilir. Ülkeyi yönetmek …","ta":["bunun sonucunda Bundestag'daki (Federal Meclis) çoğunluk değişirse zorlaşır.","bunun sonucunda Bundesrat'a (Federal Konsey) yeni partiler girerse kolaylaşır.","bunun sonucunda Bundesrat'taki (Federal Konsey) çoğunluk değişirse zorlaşır.","söz konusu olan zengin bir eyaletse kolaylaşır."],"exp":"Doğru cevap: Bundesrat'taki (Federal Konsey) çoğunluk değişirse yönetmek zorlaşır. Eyalet hükümetleri Bundesrat'ta oturduğu için bir eyalet seçimi oradaki dengeyi değiştirebilir ve federal hükümet yasalarını geçirmekte zorlanır. Bundestag'daki (Federal Meclis) çoğunluk ise eyalet seçimlerinden etkilenmez."},{"id":"G092","n":92,"scope":"general","cat":"politik","q":"Was bedeutet die Abkürzung CSU in Deutschland?","a":["Christlich Sichere Union","Christlich Süddeutsche Union","Christlich Sozialer Unternehmerverband","Christlich Soziale Union"],"c":3,"img":null,"tq":"Almanya'da CSU kısaltması ne anlama gelir?","ta":["Christlich Sichere Union (Hristiyan Güvenli Birlik)","Christlich Süddeutsche Union (Hristiyan Güney Alman Birliği)","Christlich Sozialer Unternehmerverband (Hristiyan Sosyal Girişimciler Birliği)","Christlich Soziale Union (Hristiyan Sosyal Birlik)"],"exp":"Doğru cevap Christlich Soziale Union (Hristiyan Sosyal Birlik). CSU yalnızca Bavyera'da faaliyet gösterir ve Bundestag'da (Federal Meclis) CDU ile ortak bir meclis grubu kurar; \"Süddeutsche\" seçeneği bu yüzden caziptir, ancak S harfi \"Soziale\" kelimesini karşılar."},{"id":"G093","n":93,"scope":"general","cat":"politik","q":"Je mehr \"Zweitstimmen\" eine Partei bei einer Bundestagswahl bekommt, desto …","a":["weniger Erststimmen kann sie haben.","mehr Direktkandidaten der Partei ziehen ins Parlament ein.","größer ist das Risiko, eine Koalition bilden zu müssen.","mehr Sitze erhält die Partei im Parlament."],"c":3,"img":null,"tq":"Bir parti Bundestag (Federal Meclis) seçiminde ne kadar çok \"Zweitstimme\" (ikinci oy) alırsa, …","ta":["o kadar az Erststimme (birinci oy) alabilir.","partinin o kadar çok doğrudan adayı parlamentoya girer.","koalisyon kurmak zorunda kalma riski o kadar büyür.","parti parlamentoda o kadar çok sandalye alır."],"exp":"Doğru cevap: parti parlamentoda o kadar çok sandalye alır. Zweitstimme (ikinci oy) bir partinin eyalet listesine verilir ve partilerin Bundestag'daki (Federal Meclis) sandalye oranını belirleyen asıl oydur. Erststimme (birinci oy) ise seçim bölgesindeki tek bir adaya verilir."},{"id":"G094","n":94,"scope":"general","cat":"politik","q":"Ab welchem Alter darf man in Deutschland an der Wahl zum Deutschen Bundestag teilnehmen?","a":["16","18","21","23"],"c":1,"img":null,"tq":"Almanya'da Bundestag (Federal Meclis) seçimlerine kaç yaşından itibaren katılınabilir?","ta":["16","18","21","23"],"exp":"Bundestag (Federal Meclis) seçimlerinde oy kullanma yaşı 18'dir; bunu Grundgesetz'in (Anayasa) 38. maddesi belirler. 16 yaş, bazı eyalet ve belediye seçimleri ile Avrupa Parlamentosu seçiminde geçerlidir, ancak Bundestag için 18 gerekir."},{"id":"G095","n":95,"scope":"general","cat":"politik","q":"Was gilt für die meisten Kinder in Deutschland?","a":["Wahlpflicht","Schulpflicht","Schweigepflicht","Religionspflicht"],"c":1,"img":null,"tq":"Almanya'daki çoğu çocuk için ne geçerlidir?","ta":["oy kullanma zorunluluğu (Wahlpflicht)","okul zorunluluğu (Schulpflicht)","sır saklama yükümlülüğü (Schweigepflicht)","din zorunluluğu (Religionspflicht)"],"exp":"Doğru cevap Schulpflicht, yani zorunlu eğitimdir: Almanya'da çocuklar genellikle 6 yaşından itibaren okula gitmek zorundadır ve tam zamanlı okul zorunluluğu eyalete göre 9 ya da 10 yıl sürer. Oy kullanmak ve din ise zorunluluk değil, özgür bir tercihtir."},{"id":"G096","n":96,"scope":"general","cat":"politik","q":"Wie kann jemand, der den Holocaust leugnet, bestraft werden?","a":["Kürzung sozialer Leistungen","bis zu 100 Sozialstunden","gar nicht, Holocaustleugnung ist erlaubt","mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe"],"c":3,"img":null,"tq":"Holokost'u inkâr eden bir kişi nasıl cezalandırılabilir?","ta":["sosyal yardımların kesilmesiyle","100 saate kadar kamu hizmeti cezasıyla","hiç cezalandırılmaz, Holokost'u inkâr etmek serbesttir","beş yıla kadar hapis cezası veya para cezasıyla"],"exp":"Holokost'u inkâr etmek Almanya'da suçtur ve Ceza Kanunu'nun (StGB) 130. maddesine göre beş yıla kadar hapis veya para cezasıyla cezalandırılır. İfade özgürlüğü bu eylemi korumaz; Nazi soykırımını inkâr etmek halkı kışkırtma (Volksverhetzung) sayılır."},{"id":"G097","n":97,"scope":"general","cat":"politik","q":"Was bezahlt man in Deutschland automatisch, wenn man fest angestellt ist?","a":["Sozialversicherung","Sozialhilfe","Kindergeld","Wohngeld"],"c":0,"img":null,"tq":"Almanya'da sürekli bir işte çalışan kişi neyi otomatik olarak öder?","ta":["sosyal sigorta primi (Sozialversicherung)","sosyal yardım (Sozialhilfe)","çocuk parası (Kindergeld)","kira yardımı (Wohngeld)"],"exp":"Sigortalı bir işte çalışanın maaşından sosyal sigorta primleri (Sozialversicherung) otomatik olarak kesilir: emeklilik, sağlık, bakım ve işsizlik sigortası. Sozialhilfe, Kindergeld ve Wohngeld ise ödenen değil, devletten alınan yardımlardır."},{"id":"G098","n":98,"scope":"general","cat":"politik","q":"Wenn Abgeordnete im Deutschen Bundestag ihre Fraktion wechseln, …","a":["dürfen sie nicht mehr an den Sitzungen des Parlaments teilnehmen.","kann die Regierung ihre Mehrheit verlieren.","muss die Bundespräsidentin/der Bundespräsident zuvor ihr/sein Einverständnis geben.","dürfen die Wählerinnen/Wähler dieser Abgeordneten noch einmal wählen."],"c":1,"img":null,"tq":"Alman Bundestag'ındaki (Federal Meclis) milletvekilleri meclis grubunu (Fraktion) değiştirirse, …","ta":["artık parlamento oturumlarına katılamazlar.","hükümet çoğunluğunu kaybedebilir.","Bundespräsident'in (Federal Cumhurbaşkanı) önceden onay vermesi gerekir.","bu milletvekillerinin seçmenleri yeniden oy kullanabilir."],"exp":"Doğru cevap: hükümet çoğunluğunu kaybedebilir. Milletvekilleri serbest vekâlete sahiptir, yani sandalyelerini korur ve kimseden izin almadan grup değiştirebilir; ancak iktidar gruplarından ayrılan her vekil hükümetin meclisteki çoğunluğunu daraltır."},{"id":"G099","n":99,"scope":"general","cat":"politik","q":"Wer bezahlt in Deutschland die Sozialversicherungen?","a":["Arbeitgeberinnen/Arbeitgeber und Arbeitnehmerinnen/Arbeitnehmer","nur Arbeitnehmerinnen/Arbeitnehmer","alle Staatsangehörigen","nur Arbeitgeberinnen/Arbeitgeber"],"c":0,"img":null,"tq":"Almanya'da sosyal sigorta primlerini kim öder?","ta":["işverenler ve çalışanlar","yalnızca çalışanlar","tüm vatandaşlar","yalnızca işverenler"],"exp":"Sosyal sigorta primlerini işveren ve çalışan birlikte öder; prim genellikle yaklaşık yarı yarıya paylaşılır ve çalışanın payı doğrudan brüt maaştan kesilir. Çalışmayan vatandaşlar prim ödemediği için \"tüm vatandaşlar\" seçeneği yanlıştır."},{"id":"G100","n":100,"scope":"general","cat":"politik","q":"Was gehört nicht zur gesetzlichen Sozialversicherung?","a":["die Lebensversicherung","die gesetzliche Rentenversicherung","die Arbeitslosenversicherung","die Pflegeversicherung"],"c":0,"img":null,"tq":"Hangisi yasal sosyal sigortaya (gesetzliche Sozialversicherung) dahil değildir?","ta":["hayat sigortası (Lebensversicherung)","yasal emeklilik sigortası (gesetzliche Rentenversicherung)","işsizlik sigortası (Arbeitslosenversicherung)","bakım sigortası (Pflegeversicherung)"],"exp":"Doğru cevap: hayat sigortası (Lebensversicherung) yasal sosyal sigortaya dahil değildir; özel bir sigortadır. Almanya'nın yasal sosyal sigortası beş koldan oluşur: emeklilik, işsizlik, bakım, sağlık ve kaza sigortası. Soruda 'dahil olmayan' sorulduğuna dikkat edin."},{"id":"G101","n":101,"scope":"general","cat":"politik","q":"Gewerkschaften sind Interessenverbände der …","a":["Jugendlichen.","Arbeitnehmerinnen und Arbeitnehmer.","Rentnerinnen und Rentner.","Arbeitgeberinnen und Arbeitgeber."],"c":1,"img":null,"tq":"Sendikalar (Gewerkschaften) şu grubun çıkar örgütleridir: …","ta":["gençlerin.","çalışanların.","emeklilerin.","işverenlerin."],"exp":"Sendikalar çalışanların çıkarlarını temsil eder: işverenlerle toplu sözleşme görüşmeleri yapar, ücret ve çalışma koşulları için mücadele eder, gerekirse grev düzenler. İşverenlerin kendi örgütleri vardır (Arbeitgeberverbände); en büyük sendika çatısı DGB'dir."},{"id":"G102","n":102,"scope":"general","cat":"politik","q":"Womit kann man in der Bundesrepublik Deutschland geehrt werden, wenn man auf politischem, wirtschaftlichem, kulturellem, geistigem oder sozialem Gebiet eine besondere Leistung erbracht hat? Mit dem …","a":["Bundesverdienstkreuz","Bundesadler","Vaterländischen Verdienstorden","Ehrentitel \"Held der Deutschen Demokratischen Republik\""],"c":0,"img":null,"tq":"Almanya Federal Cumhuriyeti'nde siyasi, ekonomik, kültürel, düşünsel veya sosyal alanda özel bir başarı gösteren bir kişi neyle onurlandırılabilir? Şununla: …","ta":["Bundesverdienstkreuz (Federal Liyakat Nişanı)","Bundesadler (Federal Kartal)","Vaterländischer Verdienstorden (Vatan Liyakat Nişanı)","\"Held der Deutschen Demokratischen Republik\" (Alman Demokratik Cumhuriyeti Kahramanı) onur unvanı"],"exp":"Doğru cevap: Bundesverdienstkreuz (Federal Liyakat Nişanı), siyaset, ekonomi, kültür, bilim veya sosyal alanda özel başarı gösterenlere Federal Cumhurbaşkanı tarafından verilir. Bundesadler bir nişan değil, devlet armasındaki kartaldır; 'Vaterländischer Verdienstorden' ve 'Held der DDR' ise eski Doğu Almanya'nın nişanlarıydı."},{"id":"G103","n":103,"scope":"general","cat":"politik","q":"Was wird in Deutschland als \"Ampelkoalition\" bezeichnet? Die Zusammenarbeit …","a":["der Bundestagsfraktionen von CDU und CSU","von SPD, FDP und Bündnis 90/Die Grünen in einer Regierung","von CSU, Die LINKE und Bündnis 90/Die Grünen in einer Regierung","der Bundestagsfraktionen von CDU und SPD"],"c":1,"img":null,"tq":"Almanya'da \"Ampelkoalition\" (trafik ışığı koalisyonu) olarak ne adlandırılır? Şunların iş birliği: …","ta":["CDU ve CSU'nun Bundestag (Federal Meclis) gruplarının","bir hükümette SPD, FDP ve Bündnis 90/Die Grünen'in","bir hükümette CSU, Die LINKE ve Bündnis 90/Die Grünen'in","CDU ve SPD'nin Bundestag (Federal Meclis) gruplarının"],"exp":"Ampelkoalition, SPD, FDP ve Yeşiller'in birlikte hükümet kurmasıdır. Adı parti renklerinden gelir: SPD kırmızı, FDP sarı, Bündnis 90/Die Grünen yeşil, tıpkı bir trafik ışığı gibi. 2021–2024 arasında federal hükümet böyle bir koalisyondu; CDU ve SPD ortaklığına ise \"Große Koalition\" (büyük koalisyon) denir."},{"id":"G104","n":104,"scope":"general","cat":"politik","q":"Eine Frau in Deutschland verliert ihre Arbeit. Was darf nicht der Grund für diese Entlassung sein?","a":["Die Frau ist lange krank und arbeitsunfähig.","Die Frau kam oft zu spät zur Arbeit.","Die Frau erledigt private Sachen während der Arbeitszeit.","Die Frau bekommt ein Kind und ihr Chef weiß das."],"c":3,"img":null,"tq":"Almanya'da bir kadın işini kaybediyor. Bu işten çıkarmanın nedeni ne olamaz?","ta":["Kadın uzun süredir hasta ve çalışamıyor.","Kadın işe sık sık geç geldi.","Kadın mesai saatlerinde özel işlerini hallediyor.","Kadın bebek bekliyor ve patronu bunu biliyor."],"exp":"Hamilelik işten çıkarma nedeni olamaz: Anneliği Koruma Yasası'na (Mutterschutzgesetz) göre işveren hamileliği biliyorsa, hamilelik boyunca ve doğumdan sonraki dört ay içinde işten çıkarma yasaktır. Sık geç kalma veya mesaide özel iş yapma ise uyarıdan sonra işten çıkarma nedeni olabilir."},{"id":"G105","n":105,"scope":"general","cat":"politik","q":"Was ist eine Aufgabe von Wahlhelferinnen/Wahlhelfern in Deutschland?","a":["Sie helfen alten Menschen bei der Stimmabgabe in der Wahlkabine.","Sie schreiben die Wahlbenachrichtigungen vor der Wahl.","Sie geben Zwischenergebnisse an die Medien weiter.","Sie zählen die Stimmen nach dem Ende der Wahl."],"c":3,"img":null,"tq":"Almanya'da seçim görevlilerinin (Wahlhelfer) görevlerinden biri nedir?","ta":["Yaşlı insanlara seçim kabininde oy vermelerinde yardımcı olurlar.","Seçimden önce seçmen bildirimlerini (Wahlbenachrichtigung) yazarlar.","Ara sonuçları medyaya iletirler.","Seçim bittikten sonra oyları sayarlar."],"exp":"Seçim görevlileri, sandıklar saat 18.00'de kapandıktan sonra oyları açık biçimde sayar. Seçim kabinine seçmenle birlikte girmezler, çünkü oy gizlidir; seçmen bildirimlerini belediye gönderir; sonuçlar da medyaya değil seçim kuruluna (Wahlleiter) iletilir."},{"id":"G106","n":106,"scope":"general","cat":"politik","q":"In Deutschland helfen ehrenamtliche Wahlhelferinnen und Wahlhelfer bei den Wahlen. Was ist eine Aufgabe von Wahlhelferinnen/Wahlhelfern?","a":["Sie helfen Kindern und alten Menschen beim Wählen.","Sie schreiben Karten und Briefe mit der Angabe des Wahllokals.","Sie geben Zwischenergebnisse an Journalisten weiter.","Sie zählen die Stimmen nach dem Ende der Wahl."],"c":3,"img":null,"tq":"Almanya'da seçimlerde gönüllü seçim görevlileri (Wahlhelfer) yardımcı olur. Seçim görevlilerinin görevlerinden biri nedir?","ta":["Çocuklara ve yaşlılara oy vermede yardımcı olurlar.","Seçim yerinin (Wahllokal) adresini bildiren kartlar ve mektuplar yazarlar.","Ara sonuçları gazetecilere iletirler.","Seçim bittikten sonra oyları sayarlar."],"exp":"Seçim görevlileri oy verme işlemini denetler ve seçim bitince oyları sayar; bu, vatandaşların fahri (ehrenamtlich) olarak üstlendiği bir görevdir. Çocuklar zaten oy kullanamaz, seçim yeri bilgisini belediye gönderir, ara sonuçlar ise gazetecilere değil seçim kuruluna iletilir."},{"id":"G107","n":107,"scope":"general","cat":"politik","q":"Für wie viele Jahre wird der Bundestag in Deutschland gewählt?","a":["2 Jahre","4 Jahre","6 Jahre","8 Jahre"],"c":1,"img":null,"tq":"Almanya'da Bundestag (Federal Meclis) kaç yıllığına seçilir?","ta":["2 yıl","4 yıl","6 yıl","8 yıl"],"exp":"Bundestag (Federal Meclis) 4 yıllığına seçilir; buna yasama dönemi (Wahlperiode) denir ve Grundgesetz'in (Anayasa) 39. maddesinde yazılıdır. Meclis erken feshedilirse, örneğin 2025'te olduğu gibi, dönem daha kısa sürebilir, ancak normal süre 4 yıldır."},{"id":"G108","n":108,"scope":"general","cat":"politik","q":"Bei einer Bundestagswahl in Deutschland darf jede/jeder wählen, die/der …","a":["in der Bundesrepublik Deutschland wohnt und wählen möchte.","Bürgerin/Bürger der Bundesrepublik Deutschland ist und mindestens 18 Jahre alt ist.","seit mindestens 3 Jahren in der Bundesrepublik Deutschland lebt.","Bürgerin/Bürger der Bundesrepublik Deutschland ist und mindestens 21 Jahre alt ist."],"c":1,"img":null,"tq":"Almanya'da bir Bundestag (Federal Meclis) seçiminde şu kişiler oy kullanabilir: …","ta":["Almanya Federal Cumhuriyeti'nde yaşayan ve oy kullanmak isteyen herkes.","Almanya Federal Cumhuriyeti vatandaşı olan ve en az 18 yaşında olan herkes.","en az 3 yıldır Almanya Federal Cumhuriyeti'nde yaşayan herkes.","Almanya Federal Cumhuriyeti vatandaşı olan ve en az 21 yaşında olan herkes."],"exp":"Bundestag (Federal Meclis) seçiminde oy kullanmak için iki koşul gerekir: Alman vatandaşı olmak ve en az 18 yaşında olmak. Almanya'da yaşamak tek başına yeterli değildir; AB vatandaşları yalnızca belediye ve Avrupa Parlamentosu seçimlerinde oy kullanabilir. Sınır 21 değil 18 yaştır."},{"id":"G109","n":109,"scope":"general","cat":"politik","q":"Wie oft gibt es normalerweise Bundestagswahlen in Deutschland?","a":["alle drei Jahre","alle vier Jahre","alle fünf Jahre","alle sechs Jahre"],"c":1,"img":null,"tq":"Almanya'da normalde ne sıklıkla Bundestag (Federal Meclis) seçimi yapılır?","ta":["üç yılda bir","dört yılda bir","beş yılda bir","altı yılda bir"],"exp":"Bundestag (Federal Meclis) seçimleri normalde dört yılda bir yapılır, çünkü bir yasama dönemi 4 yıl sürer. Beş yıl, çoğu eyalet meclisi (Landtag) ve Avrupa Parlamentosu seçimi için geçerlidir; Bundestag için doğru sayı 4'tür."},{"id":"G110","n":110,"scope":"general","cat":"politik","q":"Für wie viele Jahre wird der Bundestag in Deutschland gewählt?","a":["2 Jahre","3 Jahre","4 Jahre","5 Jahre"],"c":2,"img":null,"tq":"Almanya'da Bundestag (Federal Meclis) kaç yıllığına seçilir?","ta":["2 yıl","3 yıl","4 yıl","5 yıl"],"exp":"Bundestag (Federal Meclis) 4 yıl için seçilir (Grundgesetz/Anayasa madde 39). 5 yıl seçeneği caziptir, çünkü Bundespräsident (Federal Cumhurbaşkanı) 5 yıllığına seçilir ve çoğu eyalet meclisi de 5 yıl görev yapar; ancak federal parlamento için süre 4 yıldır."},{"id":"G111","n":111,"scope":"general","cat":"politik","q":"Welche Handlungen mit Bezug auf den Staat Israel sind in Deutschland verboten?","a":["die Politik Israels öffentlich kritisieren","das Aufhängen einer israelischen Flagge auf dem Privatgrundstück","eine Diskussion über die Politik Israels","der öffentliche Aufruf zur Vernichtung Israels"],"c":3,"img":null,"tq":"İsrail Devleti ile ilgili hangi eylemler Almanya'da yasaktır?","ta":["İsrail'in politikasını alenen eleştirmek","özel mülkte İsrail bayrağı asmak","İsrail'in politikası hakkında tartışmak","İsrail'in yok edilmesi için alenen çağrı yapmak"],"exp":"Yasak olan, İsrail'in yok edilmesi için alenen çağrı yapmaktır; bu, halkı kışkırtma ve şiddete çağrı sayılır ve ceza gerektirir. Bir devletin politikasını eleştirmek ya da tartışmak ise ifade özgürlüğü kapsamındadır; kendi mülkünde herhangi bir ülkenin bayrağını asmak da serbesttir."},{"id":"G112","n":112,"scope":"general","cat":"politik","q":"Die Wahlen in Deutschland sind …","a":["speziell.","geheim.","berufsbezogen.","geschlechtsabhängig."],"c":1,"img":null,"tq":"Almanya'da seçimler …","ta":["özeldir.","gizlidir.","mesleğe bağlıdır.","cinsiyete bağlıdır."],"exp":"Almanya'da seçimler gizlidir: kimse kime oy verdiğinizi öğrenemez, bu yüzden oy seçim kabininde yalnız kullanılır. Grundgesetz'in (Anayasa) 38. maddesi beş seçim ilkesini sayar: genel, doğrudan, özgür, eşit ve gizli. Meslek veya cinsiyet oy hakkını etkilemez."},{"id":"G113","n":113,"scope":"general","cat":"politik","q":"Wahlen in Deutschland gewinnt die Partei, die …","a":["die meisten Stimmen bekommt.","die meisten Männer mehrheitlich gewählt haben.","die meisten Stimmen bei den Arbeiterinnen/Arbeitern bekommen hat.","die meisten Erststimmen für ihre Kanzlerkandidatin/ihren Kanzlerkandidaten erhalten hat."],"c":0,"img":null,"tq":"Almanya'da seçimleri şu parti kazanır: …","ta":["en çok oyu alan.","erkeklerin çoğunluğunun oy verdiği.","işçilerden en çok oyu alan.","başbakan adayı için en çok birinci oyu (Erststimme) alan."],"exp":"Seçimi en çok oyu alan parti kazanır; her oy, seçmenin cinsiyeti veya mesleği ne olursa olsun eşit sayılır. Başbakan halk tarafından doğrudan seçilmediği için \"başbakan adayına verilen birinci oy\" diye bir şey yoktur; Erststimme seçim bölgesindeki adaya verilir."},{"id":"G114","n":114,"scope":"general","cat":"politik","q":"An demokratischen Wahlen in Deutschland teilzunehmen ist …","a":["eine Pflicht.","ein Recht.","ein Zwang.","eine Last."],"c":1,"img":null,"tq":"Almanya'da demokratik seçimlere katılmak …","ta":["bir yükümlülüktür.","bir haktır.","bir zorlamadır.","bir yüktür."],"exp":"Seçimlere katılmak bir haktır (Wahlrecht), zorunluluk değildir: Almanya'da oy kullanma zorunluluğu (Wahlpflicht) yoktur ve oy vermeyen kişiye ceza verilmez. Seçimlerin \"özgür\" olması ilkesi, oy verip vermeme kararını da kişinin kendisine bırakır."},{"id":"G115","n":115,"scope":"general","cat":"politik","q":"Was bedeutet \"aktives Wahlrecht\" in Deutschland?","a":["Man kann gewählt werden.","Man muss wählen gehen.","Man kann wählen.","Man muss zur Auszählung der Stimmen gehen."],"c":2,"img":null,"tq":"Almanya'da \"aktives Wahlrecht\" (aktif seçme hakkı) ne anlama gelir?","ta":["Kişi seçilebilir.","Kişi oy vermeye gitmek zorundadır.","Kişi oy verebilir.","Kişi oy sayımına gitmek zorundadır."],"exp":"Aktif seçme hakkı, kişinin oy verebilmesi, yani seçmen olabilmesi demektir. Seçilebilme hakkına ise \"passives Wahlrecht\" (pasif seçilme hakkı) denir. Hatırlatma: aktif = seçmek, pasif = seçilmek; Bundestag (Federal Meclis) için her ikisi de 18 yaşında başlar."},{"id":"G116","n":116,"scope":"general","cat":"politik","q":"Wenn Sie bei einer Bundestagswahl in Deutschland wählen dürfen, heißt das …","a":["aktive Wahlkampagne.","aktives Wahlverfahren.","aktiver Wahlkampf.","aktives Wahlrecht."],"c":3,"img":null,"tq":"Almanya'da bir Bundestag (Federal Meclis) seçiminde oy kullanabiliyorsanız, buna … denir.","ta":["aktif seçim kampanyası (aktive Wahlkampagne)","aktif seçim usulü (aktives Wahlverfahren)","aktif seçim mücadelesi (aktiver Wahlkampf)","aktif seçme hakkı (aktives Wahlrecht)"],"exp":"Oy kullanabilme hakkına \"aktives Wahlrecht\" (aktif seçme hakkı) denir. Wahlkampf ve Wahlkampagne partilerin seçim öncesi propaganda çalışmasını anlatır, Wahlverfahren ise seçimin teknik usulüdür; seçmenin hakkını ifade eden tek terim Wahlrecht'tir."},{"id":"G117","n":117,"scope":"general","cat":"politik","q":"Wie viel Prozent der Zweitstimmen müssen Parteien mindestens bekommen, um in den Deutschen Bundestag gewählt zu werden?","a":["3%","4%","5%","6%"],"c":2,"img":null,"tq":"Partilerin Alman Bundestag'ına (Federal Meclis) girebilmek için en az yüzde kaç ikinci oy (Zweitstimme) alması gerekir?","ta":["%3","%4","%5","%6"],"exp":"Bir parti Bundestag'a (Federal Meclis) girebilmek için ülke genelinde ikinci oyların (Zweitstimmen) en az %5'ini almalıdır; buna \"5%-Hürde\" (yüzde 5 barajı) denir. Baraj, parlamentonun çok sayıda küçük partiye bölünmesini önler ve hükümet kurmayı kolaylaştırır."},{"id":"G118","n":118,"scope":"general","cat":"politik","q":"Wer darf bei den rund 40 jüdischen Makkabi-Sportvereinen Mitglied werden?","a":["nur Deutsche","nur Israelis","nur religiöse Menschen","alle Menschen"],"c":3,"img":null,"tq":"Yaklaşık 40 Yahudi Makkabi spor kulübüne kim üye olabilir?","ta":["yalnızca Almanlar","yalnızca İsrailliler","yalnızca dindar insanlar","herkes"],"exp":"Makkabi spor kulüplerine herkes üye olabilir. Kökleri Yahudi spor hareketine dayansa da bu kulüpler dini, kökeni veya vatandaşlığı ne olursa olsun tüm insanlara açıktır; Almanya'daki spor kulüpleri genel olarak herkese açık olma ilkesiyle çalışır."},{"id":"G119","n":119,"scope":"general","cat":"politik","q":"Wahlen in Deutschland sind frei. Was bedeutet das?","a":["Alle verurteilten Straftäterinnen/Straftäter dürfen nicht wählen.","Wenn ich wählen gehen möchte, muss meine Arbeitgeberin/mein Arbeitgeber mir frei geben.","Jede Person kann ohne Zwang entscheiden, ob sie wählen möchte und wen sie wählen möchte.","Ich kann frei entscheiden, wo ich wählen gehen möchte."],"c":2,"img":null,"tq":"Almanya'da seçimler özgürdür. Bu ne anlama gelir?","ta":["Hüküm giymiş tüm suçlular oy kullanamaz.","Oy vermeye gitmek istersem işverenim bana izin vermek zorundadır.","Her kişi, oy verip vermeyeceğine ve kime oy vereceğine hiçbir baskı olmadan karar verebilir.","Nerede oy kullanacağıma özgürce karar verebilirim."],"exp":"Özgür seçim, her kişinin baskı olmadan oy verip vermeyeceğine ve kime oy vereceğine kendisinin karar vermesidir. Hüküm giymek genellikle oy hakkını kaldırmaz; oy verme yeri de seçmen bildiriminde yazan seçim yeridir, serbestçe seçilmez. Seçimler ayrıca pazar günü yapılır, işverenden izin gerekmez."},{"id":"G120","n":120,"scope":"general","cat":"politik","q":"Das Wahlsystem in Deutschland ist ein …","a":["Zensuswahlrecht.","Dreiklassenwahlrecht.","Mehrheits- und Verhältniswahlrecht.","allgemeines Männerwahlrecht."],"c":2,"img":null,"tq":"Almanya'daki seçim sistemi şudur: …","ta":["Zensuswahlrecht (mülke ve gelire dayalı seçme hakkı).","Dreiklassenwahlrecht (üç sınıflı seçme hakkı).","çoğunluk ve nispi temsil sistemi (Mehrheits- und Verhältniswahlrecht).","genel erkek seçme hakkı (allgemeines Männerwahlrecht)."],"exp":"Almanya'da çoğunluk ve nispi temsil sistemi birlikte uygulanır: birinci oyla (Erststimme) seçim bölgesinde en çok oyu alan aday kazanır, ikinci oy (Zweitstimme) partilerin sandalye oranını belirler. Üç sınıflı ve servete dayalı seçim sistemleri ile yalnızca erkeklerin oy hakkı tarihte kalmıştır."},{"id":"G121","n":121,"scope":"general","cat":"politik","q":"Eine Partei möchte in den Deutschen Bundestag. Sie muss aber einen Mindestanteil an Wählerstimmen haben. Das heißt …","a":["5%-Hürde.","Zulassungsgrenze.","Basiswert.","Richtlinie."],"c":0,"img":null,"tq":"Bir parti Alman Bundestag'ına (Federal Meclis) girmek istiyor. Ancak seçmen oylarının belirli bir asgari oranına sahip olması gerekir. Buna … denir.","ta":["%5 barajı (5%-Hürde)","kabul sınırı (Zulassungsgrenze)","taban değer (Basiswert)","yönerge (Richtlinie)"],"exp":"Bu asgari orana \"5%-Hürde\" (yüzde 5 barajı) denir: bir parti ikinci oyların en az %5'ini alamazsa eyalet listelerinden Bundestag'a (Federal Meclis) milletvekili sokamaz. Diğer seçenekler seçim hukukunda kullanılan terimler değildir."},{"id":"G122","n":122,"scope":"general","cat":"politik","q":"Welchem Grundsatz unterliegen Wahlen in Deutschland? Wahlen in Deutschland sind …","a":["frei, gleich, geheim.","offen, sicher, frei.","geschlossen, gleich, sicher.","sicher, offen, freiwillig."],"c":0,"img":null,"tq":"Almanya'da seçimler hangi ilkeye tabidir? Almanya'da seçimler …","ta":["özgür, eşit ve gizlidir.","açık, güvenli ve özgürdür.","kapalı, eşit ve güvenlidir.","güvenli, açık ve gönüllüdür."],"exp":"Almanya'da seçimler özgür, eşit ve gizlidir. Grundgesetz'in (Anayasa) 38. maddesi tam olarak beş ilke sayar: genel, doğrudan, özgür, eşit, gizli. Diğer seçeneklerdeki \"açık\" ve \"kapalı\" kelimeleri bu ilkeler arasında yer almaz."},{"id":"G123","n":123,"scope":"general","cat":"politik","q":"Was ist in Deutschland die \"5%-Hürde\"?","a":["Abstimmungsregelung im Bundestag für kleine Parteien","Anwesenheitskontrolle im Bundestag für Abstimmungen","Mindestanteil an Wählerstimmen, um ins Parlament zu kommen","Anwesenheitskontrolle im Bundesrat für Abstimmungen"],"c":2,"img":null,"tq":"Almanya'da \"%5 barajı\" (5%-Hürde) nedir?","ta":["Bundestag'da (Federal Meclis) küçük partiler için oylama düzenlemesi","Bundestag'da oylamalar için yoklama kontrolü","parlamentoya girebilmek için gereken asgari seçmen oyu oranı","Bundesrat'ta (Federal Konsey) oylamalar için yoklama kontrolü"],"exp":"%5 barajı, bir partinin parlamentoya girebilmesi için alması gereken asgari oy oranıdır: Bundestag (Federal Meclis) seçiminde ikinci oyların en az %5'i. Bu kural parlamentoya girişle ilgilidir, meclis içindeki oylamalar veya yoklamalarla hiçbir ilgisi yoktur."},{"id":"G124","n":124,"scope":"general","cat":"politik","q":"Die Bundestagswahl in Deutschland ist die Wahl …","a":["der Bundeskanzlerin/des Bundeskanzlers.","der Parlamente der Länder.","des Parlaments für Deutschland.","der Bundespräsidentin/des Bundespräsidenten."],"c":2,"img":null,"tq":"Almanya'daki Bundestag (Federal Meclis) seçimi şunun seçimidir: …","ta":["Bundeskanzler'in (Federal Başbakan).","eyalet parlamentolarının.","Almanya'nın parlamentosunun.","Bundespräsident'in (Federal Cumhurbaşkanı)."],"exp":"Bundestag (Federal Meclis) seçimi, Almanya'nın federal parlamentosunun, yani milletvekillerinin seçimidir. Halk başbakanı ve cumhurbaşkanını doğrudan seçmez: başbakanı Bundestag, cumhurbaşkanını Bundesversammlung (Federal Kurul) seçer. Eyalet parlamentoları ise Landtag (Eyalet Meclisi) seçimleriyle belirlenir."},{"id":"G125","n":125,"scope":"general","cat":"politik","q":"In einer Demokratie ist eine Funktion von regelmäßigen Wahlen, …","a":["die Bürgerinnen und Bürger zu zwingen, ihre Stimme abzugeben.","nach dem Willen der Wählermehrheit den Wechsel der Regierung zu ermöglichen.","im Land bestehende Gesetze beizubehalten.","den Armen mehr Macht zu geben."],"c":1,"img":null,"tq":"Bir demokraside düzenli seçimlerin işlevlerinden biri …","ta":["vatandaşları oy vermeye zorlamaktır.","seçmen çoğunluğunun iradesine göre hükümet değişikliğini mümkün kılmaktır.","ülkedeki mevcut yasaları korumaktır.","yoksullara daha fazla güç vermektir."],"exp":"Düzenli seçimler, seçmen çoğunluğu isterse hükümetin barışçıl yoldan değişmesini sağlar; iktidar böylece halkın onayına bağlı kalır. Seçimler kimseyi oy vermeye zorlamaz, yasaları dondurmaz ve belirli bir gruba ayrıcalık vermez; her oy eşittir."},{"id":"G126","n":126,"scope":"general","cat":"politik","q":"Was bekommen wahlberechtigte Bürgerinnen und Bürger in Deutschland vor einer Wahl?","a":["eine Wahlbenachrichtigung von der Gemeinde","eine Wahlerlaubnis von der Bundespräsidentin/von dem Bundespräsidenten","eine Benachrichtigung von der Bundesversammlung","eine Benachrichtigung vom Pfarramt"],"c":0,"img":null,"tq":"Almanya'da oy hakkına sahip vatandaşlar bir seçimden önce ne alır?","ta":["belediyeden bir seçmen bildirimi (Wahlbenachrichtigung)","Bundespräsident'ten (Federal Cumhurbaşkanı) bir oy kullanma izni","Bundesversammlung'dan (Federal Kurul) bir bildirim","kilise/cemaat bürosundan bir bildirim"],"exp":"Seçimden birkaç hafta önce belediye (Gemeinde), oy hakkı olan herkese bir Wahlbenachrichtigung (seçmen bildirimi) gönderir; üzerinde seçim yeri ve tarihi yazar, posta yoluyla oy (Briefwahl) da bununla talep edilir. Cumhurbaşkanı, Bundesversammlung (Federal Kurul) veya kilisenin seçmen kaydıyla ilgisi yoktur."},{"id":"G127","n":127,"scope":"general","cat":"politik","q":"Warum gibt es die 5%-Hürde im Wahlgesetz der Bundesrepublik Deutschland? Es gibt sie, weil …","a":["die Programme von vielen kleinen Parteien viele Gemeinsamkeiten haben.","die Bürgerinnen und Bürger bei vielen kleinen Parteien die Orientierung verlieren können.","viele kleine Parteien die Regierungsbildung erschweren.","die kleinen Parteien nicht so viel Geld haben, um die Politikerinnen und Politiker zu bezahlen."],"c":2,"img":null,"tq":"Almanya Federal Cumhuriyeti'nin seçim yasasında neden %5 barajı vardır? Bu baraj vardır, çünkü …","ta":["birçok küçük partinin programları çok ortak nokta içerir.","vatandaşlar çok sayıda küçük parti arasında yönlerini kaybedebilir.","çok sayıda küçük parti hükümet kurmayı zorlaştırır.","küçük partilerin politikacılara ödeme yapacak kadar parası yoktur."],"exp":"%5 barajının nedeni, çok sayıda küçük partinin hükümet kurmayı zorlaştırmasıdır. Weimar Cumhuriyeti'nde parçalanmış parlamento istikrarsız hükümetlere yol açmıştı; baraj bu dersten çıkarılmıştır ve çalışabilir çoğunluklar oluşmasını sağlar."},{"id":"G128","n":128,"scope":"general","cat":"politik","q":"Parlamentsmitglieder, die von den Bürgerinnen und Bürgern gewählt werden, nennt man …","a":["Abgeordnete.","Kanzlerinnen/Kanzler.","Botschafterinnen/Botschafter.","Ministerpräsidentinnen/Ministerpräsidenten."],"c":0,"img":null,"tq":"Vatandaşlar tarafından seçilen parlamento üyelerine … denir.","ta":["milletvekili (Abgeordnete)","başbakan (Kanzler/in)","büyükelçi (Botschafter/in)","eyalet başbakanı (Ministerpräsident/in)"],"exp":"Halkın seçtiği parlamento üyelerine Abgeordnete (milletvekili) denir; Bundestag'da (Federal Meclis) 630 milletvekili vardır. Başbakanı Bundestag seçer, eyalet başbakanını eyalet meclisi seçer, büyükelçiler ise atanan diplomatlardır."},{"id":"G129","n":129,"scope":"general","cat":"politik","q":"Vom Volk gewählt wird in Deutschland …","a":["die Bundeskanzlerin/der Bundeskanzler.","die Ministerpräsidentin/der Ministerpräsident eines Bundeslandes.","der Bundestag.","die Bundespräsidentin/der Bundespräsident."],"c":2,"img":null,"tq":"Almanya'da halk tarafından seçilen …","ta":["Bundeskanzler'dir (Federal Başbakan).","bir eyaletin Ministerpräsident'idir (eyalet başbakanı).","Bundestag'dır (Federal Meclis).","Bundespräsident'tir (Federal Cumhurbaşkanı)."],"exp":"Halk doğrudan yalnızca parlamentoyu, yani Bundestag'ı (Federal Meclis) seçer. Diğer makamlar dolaylı yoldan belirlenir: başbakanı Bundestag, eyalet başbakanını Landtag (Eyalet Meclisi), cumhurbaşkanını Bundesversammlung (Federal Kurul) seçer. Bu, Almanya'nın temsili demokrasi olmasının sonucudur."},{"id":"G130","n":130,"scope":"general","cat":"politik","q":"Welcher Stimmzettel wäre bei einer Bundestagswahl gültig?","a":["1","2","3","4"],"c":0,"img":{"kind":"question","urls":[],"note":"Vier Muster-Stimmzettel (in Anlehnung an BWO Anlage 26): Stimmzettel 1 = genau ein Kreuz bei der Erststimme und ein Kreuz bei der Zweitstimme (gueltig); 2 = zwei Kreuze in der Zweitstimmen-Spalte; 3 = zwei Kreuze in der Erststimmen-Spalte; 4 = drei Kreuze bei den Erststimmen. Kein freies Ersatzbild."},"tq":"Bir Bundestag (Federal Meclis) seçiminde hangi oy pusulası geçerli olurdu?","ta":["1","2","3","4"],"exp":"Geçerli olan 1 numaralı oy pusulasıdır: birinci oy (Erststimme) sütununda tam bir çarpı ve ikinci oy (Zweitstimme) sütununda tam bir çarpı var. Her seçmenin iki oyu vardır ve her sütunda yalnızca bir işaret yapılabilir; 2, 3 ve 4 numaralı pusulalarda aynı sütunda birden fazla çarpı olduğu için o oylar geçersizdir."},{"id":"G131","n":131,"scope":"general","cat":"politik","q":"In Deutschland ist eine Bürgermeisterin/ein Bürgermeister …","a":["die Leiterin/der Leiter einer Schule.","die Chefin/der Chef einer Bank.","das Oberhaupt einer Gemeinde.","die/der Vorsitzende einer Partei."],"c":2,"img":null,"tq":"Almanya'da bir Bürgermeister/in (belediye başkanı) …","ta":["bir okulun müdürüdür.","bir bankanın müdürüdür.","bir belediyenin (Gemeinde) başıdır.","bir partinin başkanıdır."],"exp":"Belediye başkanı bir belediyenin, yani bir şehir veya kasabanın başıdır; belediye yönetimini yönetir ve belediye meclisine (Gemeinderat/Stadtrat) başkanlık eder. Büyük şehirlerde bu makama Oberbürgermeister/in denir. Okul müdürü Schulleiter, parti başkanı Parteivorsitzende olarak adlandırılır."},{"id":"G132","n":132,"scope":"general","cat":"politik","q":"Viele Menschen in Deutschland arbeiten in ihrer Freizeit ehrenamtlich. Was bedeutet das?","a":["Sie arbeiten als Soldatinnen/Soldaten.","Sie arbeiten freiwillig und unbezahlt in Vereinen und Verbänden.","Sie arbeiten in der Bundesregierung.","Sie arbeiten in einem Krankenhaus und verdienen dabei Geld."],"c":1,"img":null,"tq":"Almanya'da birçok insan boş zamanında fahri (ehrenamtlich) olarak çalışır. Bu ne anlama gelir?","ta":["Asker olarak çalışırlar.","Derneklerde ve birliklerde gönüllü ve ücretsiz çalışırlar.","Federal Hükümet'te çalışırlar.","Bir hastanede çalışır ve bunun karşılığında para kazanırlar."],"exp":"Ehrenamt, gönüllü ve ücretsiz çalışmaktır: itfaiye, spor kulübü, yardım kuruluşu gibi dernek ve birliklerde karşılık beklemeden görev almak. Almanya'da nüfusun yaklaşık %40'ı fahri çalışır. Para kazanılan bir iş, tanımı gereği fahri değildir."},{"id":"G133","n":133,"scope":"general","cat":"politik","q":"Was ist bei Bundestags- und Landtagswahlen in Deutschland erlaubt?","a":["Der Ehemann wählt für seine Frau mit.","Man kann durch Briefwahl seine Stimme abgeben.","Man kann am Wahltag telefonisch seine Stimme abgeben.","Kinder ab dem Alter von 14 Jahren dürfen wählen."],"c":1,"img":null,"tq":"Almanya'da Bundestag (Federal Meclis) ve Landtag (Eyalet Meclisi) seçimlerinde neye izin verilir?","ta":["Koca, eşi adına da oy kullanır.","Kişi oyunu posta yoluyla (Briefwahl) kullanabilir.","Kişi seçim günü telefonla oy kullanabilir.","14 yaşından itibaren çocuklar oy kullanabilir."],"exp":"İzin verilen tek seçenek posta yoluyla oy kullanmaktır (Briefwahl): seçmen belgelerini önceden talep eder ve oyunu postayla gönderir. Oy kişiseldir, başkası adına kullanılamaz; telefonla oy yoktur; oy kullanma yaşı 18'dir."},{"id":"G134","n":134,"scope":"general","cat":"politik","q":"Man will die Buslinie abschaffen, mit der Sie immer zur Arbeit fahren. Was können Sie machen, um die Buslinie zu erhalten?","a":["Ich beteilige mich an einer Bürgerinitiative für die Erhaltung der Buslinie oder gründe selber eine Initiative.","Ich werde Mitglied in einem Sportverein und trainiere Radfahren.","Ich wende mich an das Finanzamt, weil ich als Steuerzahlerin/Steuerzahler ein Recht auf die Buslinie habe.","Ich schreibe einen Brief an das Forstamt der Gemeinde."],"c":0,"img":null,"tq":"İşe gitmek için her zaman kullandığınız otobüs hattı kaldırılmak isteniyor. Hattın korunması için ne yapabilirsiniz?","ta":["Otobüs hattının korunması için bir vatandaş girişimine (Bürgerinitiative) katılırım ya da kendim bir girişim kurarım.","Bir spor kulübüne üye olur ve bisiklet antrenmanı yaparım.","Vergi mükellefi olarak otobüs hattına hakkım olduğu için vergi dairesine başvururum.","Belediyenin orman idaresine bir mektup yazarım."],"exp":"Doğru yol, bir vatandaş girişimine (Bürgerinitiative) katılmak ya da kurmaktır: aynı sorundan etkilenen insanlar bir araya gelir, imza toplar ve belediye meclisini etkilemeye çalışır. Vergi dairesinin ve orman idaresinin toplu taşıma kararlarıyla ilgisi yoktur."},{"id":"G135","n":135,"scope":"general","cat":"politik","q":"Wen vertreten die Gewerkschaften in Deutschland?","a":["große Unternehmen","kleine Unternehmen","Selbstständige","Arbeitnehmerinnen und Arbeitnehmer"],"c":3,"img":null,"tq":"Almanya'da sendikalar (Gewerkschaften) kimi temsil eder?","ta":["büyük şirketleri","küçük şirketleri","serbest çalışanları","çalışanları"],"exp":"Sendikalar çalışanları temsil eder; onların ücret, çalışma süresi ve iş güvenliği gibi çıkarlarını işverenlere karşı savunur. En bilinen örnekler IG Metall ve ver.di'dir. Şirketlerin çıkarlarını ise işveren birlikleri (Arbeitgeberverbände) temsil eder."},{"id":"G136","n":136,"scope":"general","cat":"politik","q":"Sie gehen in Deutschland zum Arbeitsgericht bei …","a":["falscher Nebenkostenabrechnung.","ungerechtfertigter Kündigung durch Ihre Chefin/Ihren Chef.","Problemen mit den Nachbarinnen/Nachbarn.","Schwierigkeiten nach einem Verkehrsunfall."],"c":1,"img":null,"tq":"Almanya'da şu durumda Arbeitsgericht'e (İş Mahkemesi) gidersiniz: …","ta":["hatalı yan gider (Nebenkosten) hesaplamasında.","patronunuz tarafından haksız yere işten çıkarılmanızda.","komşularla sorunlarda.","bir trafik kazasından sonraki zorluklarda."],"exp":"İş Mahkemesi (Arbeitsgericht) işveren ile çalışan arasındaki uyuşmazlıklara, özellikle haksız işten çıkarma davalarına bakar. Yan gider hesabı ve komşu anlaşmazlıkları Amtsgericht'in (sulh mahkemesi) hukuk dairelerine, trafik kazaları ise duruma göre hukuk veya ceza mahkemelerine gider."},{"id":"G137","n":137,"scope":"general","cat":"politik","q":"Welches Gericht ist in Deutschland bei Konflikten in der Arbeitswelt zuständig?","a":["das Familiengericht","das Strafgericht","das Arbeitsgericht","das Amtsgericht"],"c":2,"img":null,"tq":"Almanya'da iş dünyasındaki anlaşmazlıklarda hangi mahkeme yetkilidir?","ta":["Familiengericht (Aile Mahkemesi)","Strafgericht (Ceza Mahkemesi)","Arbeitsgericht (İş Mahkemesi)","Amtsgericht (Sulh/İlk Derece Mahkemesi)"],"exp":"İş hayatındaki anlaşmazlıklar için ayrı bir mahkeme türü vardır: Arbeitsgericht (İş Mahkemesi). İşten çıkarma, ödenmeyen maaş veya çalışma belgesi gibi konular burada görülür. Aile mahkemesi boşanma ve velayete, ceza mahkemesi suçlara bakar."},{"id":"G138","n":138,"scope":"general","cat":"politik","q":"Was kann ich in Deutschland machen, wenn mir meine Arbeitgeberin/mein Arbeitgeber zu Unrecht gekündigt hat?","a":["weiterarbeiten und freundlich zur Chefin/zum Chef sein","ein Mahnverfahren gegen die Arbeitgeberin/den Arbeitgeber führen","Kündigungsschutzklage erheben","die Arbeitgeberin/den Arbeitgeber bei der Polizei anzeigen"],"c":2,"img":null,"tq":"Almanya'da işverenim beni haksız yere işten çıkardıysa ne yapabilirim?","ta":["çalışmaya devam edip patrona karşı nazik olmak","işverene karşı ödeme emri (Mahnverfahren) süreci başlatmak","işe iade davası (Kündigungsschutzklage) açmak","işvereni polise şikâyet etmek"],"exp":"Haksız işten çıkarmaya karşı İş Mahkemesi'nde Kündigungsschutzklage (işe iade davası) açılır; bunun için fesih bildiriminin ulaşmasından itibaren yalnızca 3 hafta süre vardır. İşten çıkarma bir suç değildir, bu yüzden polis yetkili değildir; Mahnverfahren ise alacak tahsili içindir."},{"id":"G139","n":139,"scope":"general","cat":"politik","q":"Wann kommt es in Deutschland zu einem Prozess vor Gericht? Wenn jemand …","a":["zu einer anderen Religion übertritt.","eine Straftat begangen hat und angeklagt wird.","eine andere Meinung als die der Regierung vertritt.","sein Auto falsch geparkt hat und es abgeschleppt wird."],"c":1,"img":null,"tq":"Almanya'da ne zaman mahkemede dava görülür? Bir kişi …","ta":["başka bir dine geçtiğinde.","bir suç işlediğinde ve hakkında dava açıldığında.","hükümetinkinden farklı bir görüşü savunduğunda.","arabasını yanlış park ettiğinde ve araba çekildiğinde."],"exp":"Mahkeme süreci, bir kişi suç işlediğinde ve savcılık onun hakkında dava açtığında başlar. Din değiştirmek ve hükümeti eleştirmek temel haklardır, ceza konusu olamaz. Yanlış park etmek yalnızca bir kabahattir (Ordnungswidrigkeit) ve para cezasıyla sonuçlanır, mahkemeye gitmez."},{"id":"G140","n":140,"scope":"general","cat":"politik","q":"Was macht eine Schöffin/ein Schöffe in Deutschland? Sie/Er …","a":["entscheidet mit Richterinnen/Richtern über Schuld und Strafe.","gibt Bürgerinnen/Bürgern rechtlichen Rat.","stellt Urkunden aus.","verteidigt die Angeklagte/den Angeklagten."],"c":0,"img":null,"tq":"Almanya'da bir Schöffe/Schöffin (fahri hâkim) ne yapar? O …","ta":["hâkimlerle birlikte suç ve ceza hakkında karar verir.","vatandaşlara hukuki tavsiye verir.","resmî belgeler düzenler.","sanığı savunur."],"exp":"Schöffe, ceza davalarında meslekten hâkimlerle birlikte oturan ve onlarla eşit oy hakkıyla suç ve ceza hakkında karar veren fahri hâkimdir. Hukuki tavsiye vermek ve sanığı savunmak avukatın, resmî belge düzenlemek noterin işidir."},{"id":"G141","n":141,"scope":"general","cat":"politik","q":"Wer berät in Deutschland Personen bei Rechtsfragen und vertritt sie vor Gericht?","a":["eine Rechtsanwältin/ein Rechtsanwalt","eine Richterin/ein Richter","eine Schöffin/ein Schöffe","eine Staatsanwältin/ein Staatsanwalt"],"c":0,"img":null,"tq":"Almanya'da hukuki konularda kişilere kim danışmanlık yapar ve onları mahkemede kim temsil eder?","ta":["bir Rechtsanwalt/Rechtsanwältin (avukat)","bir Richter/in (hâkim)","bir Schöffe/Schöffin (fahri hâkim)","bir Staatsanwalt/Staatsanwältin (savcı)"],"exp":"Hukuki danışmanlık veren ve kişileri mahkemede temsil eden kişi avukattır (Rechtsanwalt). Hâkim tarafsız olmalı ve taraf tutamaz; fahri hâkim hâkimle birlikte karar verir; savcı ise devlet adına suçlamayı yürütür, sanığı temsil etmez."},{"id":"G142","n":142,"scope":"general","cat":"politik","q":"Was ist die Hauptaufgabe einer Richterin/eines Richters in Deutschland? Eine Richterin/ein Richter …","a":["vertritt Bürgerinnen und Bürger vor einem Gericht.","arbeitet an einem Gericht und spricht Urteile.","ändert Gesetze.","betreut Jugendliche vor Gericht."],"c":1,"img":null,"tq":"Almanya'da bir hâkimin (Richter/in) ana görevi nedir? Bir hâkim …","ta":["vatandaşları mahkemede temsil eder.","bir mahkemede çalışır ve karar verir.","yasaları değiştirir.","gençlere mahkemede refakat eder."],"exp":"Hâkimin ana görevi mahkemede çalışmak ve hüküm vermektir; hâkimler bağımsızdır ve yalnızca yasaya bağlıdır. Vatandaşları temsil etmek avukatın, yasaları değiştirmek parlamentonun, gençlere refakat etmek ise gençlik dairesi çalışanlarının (Jugendgerichtshilfe) görevidir."},{"id":"G143","n":143,"scope":"general","cat":"politik","q":"Eine Richterin/ein Richter in Deutschland gehört zur …","a":["Judikative.","Exekutive.","Operative.","Legislative."],"c":0,"img":null,"tq":"Almanya'da bir hâkim (Richter/in) şu erke aittir: …","ta":["Judikative (yargı).","Exekutive (yürütme).","Operative.","Legislative (yasama)."],"exp":"Hâkimler yargı erkine, yani Judikative'ye aittir. Kuvvetler ayrılığında üç erk vardır: Legislative (yasama: parlamentolar), Exekutive (yürütme: hükümet, idare, polis) ve Judikative (yargı: mahkemeler). \"Operative\" diye bir devlet erki yoktur."},{"id":"G144","n":144,"scope":"general","cat":"politik","q":"Eine Richterin/ein Richter gehört in Deutschland zur …","a":["vollziehenden Gewalt.","rechtsprechenden Gewalt.","planenden Gewalt.","gesetzgebenden Gewalt."],"c":1,"img":null,"tq":"Almanya'da bir hâkim (Richter/in) şu erke aittir: …","ta":["yürütme erkine (vollziehende Gewalt).","yargı erkine (rechtsprechende Gewalt).","planlama erkine (planende Gewalt).","yasama erkine (gesetzgebende Gewalt)."],"exp":"Hâkim yargı erkine (rechtsprechende Gewalt) aittir; \"Recht sprechen\" hukuku uygulayıp karar vermek demektir. Grundgesetz'in (Anayasa) 20. maddesi devlet gücünü yasama (gesetzgebende), yürütme (vollziehende) ve yargı (rechtsprechende) olarak üçe ayırır; planlama erki diye bir şey yoktur."},{"id":"G145","n":145,"scope":"general","cat":"politik","q":"In Deutschland wird die Staatsgewalt geteilt. Für welche Staatsgewalt arbeitet eine Richterin/ein Richter? Für die …","a":["Judikative","Exekutive","Presse","Legislative"],"c":0,"img":null,"tq":"Almanya'da devlet gücü bölünmüştür. Bir hâkim (Richter/in) hangi devlet erki için çalışır? Şunun için: …","ta":["Judikative (yargı)","Exekutive (yürütme)","basın","Legislative (yasama)"],"exp":"Hâkim yargı erki, yani Judikative için çalışır. Basın zaman zaman \"dördüncü güç\" diye anılsa da resmî bir devlet erki değildir; devlet gücü yalnızca yasama, yürütme ve yargı olarak üçe ayrılır. Hatırlatma: Judikative kelimesi Latince \"yargılamak\" fiilinden gelir."},{"id":"G146","n":146,"scope":"general","cat":"politik","q":"Wie nennt man in Deutschland ein Verfahren vor einem Gericht?","a":["Programm","Prozedur","Protokoll","Prozess"],"c":3,"img":null,"tq":"Almanya'da bir mahkeme önündeki yargılamaya ne denir?","ta":["Programm (program)","Prozedur (prosedür)","Protokoll (tutanak)","Prozess (dava/duruşma)"],"exp":"Mahkemedeki yargılamaya Prozess (dava) denir; örneğin Strafprozess ceza davası, Zivilprozess hukuk davasıdır. Protokoll duruşmada tutulan tutanaktır, Prozedur genel olarak işlem sırası anlamına gelir; dört seçenek de P ile başladığı için kelimeyi iyi ezberleyin."},{"id":"G147","n":147,"scope":"general","cat":"politik","q":"Was ist die Arbeit einer Richterin/eines Richters in Deutschland?","a":["Deutschland regieren","Recht sprechen","Pläne erstellen","Gesetze erlassen"],"c":1,"img":null,"tq":"Almanya'da bir hâkimin (Richter/in) işi nedir?","ta":["Almanya'yı yönetmek","hüküm vermek (Recht sprechen)","planlar hazırlamak","yasalar çıkarmak"],"exp":"Hâkimin işi hüküm vermektir (Recht sprechen): yasaları somut olaylara uygular ve karar verir. Ülkeyi yönetmek hükümetin (yürütme), yasa çıkarmak parlamentonun (yasama) işidir; kuvvetler ayrılığı gereği hâkim bunların hiçbirini yapamaz."},{"id":"G148","n":148,"scope":"general","cat":"politik","q":"Was ist eine Aufgabe der Polizei in Deutschland?","a":["das Land zu verteidigen","die Bürgerinnen und Bürger abzuhören","die Gesetze zu beschließen","die Einhaltung von Gesetzen zu überwachen"],"c":3,"img":null,"tq":"Almanya'da polisin görevlerinden biri nedir?","ta":["ülkeyi savunmak","vatandaşları dinlemek (gizlice izlemek)","yasaları kabul etmek","yasalara uyulmasını denetlemek"],"exp":"Polisin görevi yasalara uyulmasını denetlemek, kamu güvenliğini korumak ve suçları aydınlatmaktır. Ülkeyi savunmak Bundeswehr'in (ordu), yasa çıkarmak parlamentonun işidir; vatandaşları keyfi olarak dinlemek ise yasaktır ve ancak hâkim kararıyla, sıkı koşullarda mümkündür."},{"id":"G149","n":149,"scope":"general","cat":"politik","q":"Was ist ein Beispiel für antisemitisches Verhalten?","a":["ein jüdisches Fest besuchen","die israelische Regierung kritisieren","den Holocaust leugnen","gegen Juden Fußball spielen."],"c":2,"img":null,"tq":"Antisemit (Yahudi düşmanı) davranışa bir örnek nedir?","ta":["bir Yahudi bayramına katılmak","İsrail hükümetini eleştirmek","Holokost'u inkâr etmek","Yahudilere karşı futbol oynamak"],"exp":"Holokost'u inkâr etmek antisemitizmin tipik bir örneğidir ve Almanya'da suçtur. Bir hükümeti eleştirmek, herhangi bir ülke için olduğu gibi İsrail için de ifade özgürlüğü kapsamındadır; bir Yahudi bayramına katılmak ya da birlikte spor yapmak ise tam tersine saygı ve birlikte yaşama örneğidir."},{"id":"G150","n":150,"scope":"general","cat":"politik","q":"Eine Gerichtsschöffin/ein Gerichtsschöffe in Deutschland ist …","a":["die Stellvertreterin/der Stellvertreter des Stadtoberhaupts.","eine ehrenamtliche Richterin/ein ehrenamtlicher Richter.","ein Mitglied eines Gemeinderats.","eine Person, die Jura studiert hat."],"c":1,"img":null,"tq":"Almanya'da bir Gerichtsschöffe/Gerichtsschöffin …","ta":["şehir yönetiminin başının vekilidir.","fahri bir hâkimdir.","bir belediye meclisi üyesidir.","hukuk okumuş bir kişidir."],"exp":"Schöffe, fahri bir hâkimdir: hukuk eğitimi almamış sıradan vatandaşlar arasından 5 yıllığına seçilir ve ceza davalarında meslekten hâkimlerle birlikte karar verir. Amaç, halkın yargıya katılmasıdır; bu nedenle hukuk okumuş olmak şart değildir."},{"id":"G151","n":151,"scope":"general","cat":"geschichte","q":"Wer baute die Mauer in Berlin?","a":["Großbritannien","die DDR","die Bundesrepublik Deutschland","die USA"],"c":1,"img":null,"tq":"Berlin'deki Duvar'ı kim inşa etti?","ta":["Büyük Britanya","DDR (Doğu Almanya)","Federal Almanya Cumhuriyeti","ABD"],"exp":"Doğru cevap DDR'dir (Doğu Almanya). Berlin Duvarı, 13 Ağustos 1961'de DDR yönetimi tarafından Doğu Berlin'den Batı'ya kaçışları durdurmak için inşa edildi. Duvar 9 Kasım 1989'da açıldı."},{"id":"G152","n":152,"scope":"general","cat":"geschichte","q":"Wann waren die Nationalsozialisten mit Adolf Hitler in Deutschland an der Macht?","a":["1918 bis 1923","1932 bis 1950","1933 bis 1945","1945 bis 1989"],"c":2,"img":null,"tq":"Adolf Hitler önderliğindeki Nasyonal Sosyalistler Almanya'da ne zaman iktidardaydı?","ta":["1918'den 1923'e","1932'den 1950'ye","1933'ten 1945'e","1945'ten 1989'a"],"exp":"Doğru cevap 1933'ten 1945'e. Hitler 30 Ocak 1933'te Reichskanzler (Reich Şansölyesi/Başbakan) oldu; Nasyonal Sosyalist diktatörlük, Almanya'nın 8 Mayıs 1945'teki koşulsuz teslimiyetiyle sona erdi. Toplam 12 yıl sürdü."},{"id":"G153","n":153,"scope":"general","cat":"geschichte","q":"Was war am 8. Mai 1945?","a":["Tod Adolf Hitlers","Beginn des Berliner Mauerbaus","Wahl von Konrad Adenauer zum Bundeskanzler","Ende des Zweiten Weltkriegs in Europa"],"c":3,"img":null,"tq":"8 Mayıs 1945'te ne oldu?","ta":["Adolf Hitler'in ölümü","Berlin Duvarı'nın inşasının başlaması","Konrad Adenauer'in Federal Başbakan seçilmesi","İkinci Dünya Savaşı'nın Avrupa'da sona ermesi"],"exp":"Doğru cevap: İkinci Dünya Savaşı'nın Avrupa'da sona ermesi. 8 Mayıs 1945'te Alman ordusunun koşulsuz teslimiyeti yürürlüğe girdi; bu gün Almanya'da \"Tag der Befreiung\" (Kurtuluş Günü) olarak anılır. Hitler ise birkaç gün önce, 30 Nisan 1945'te intihar etmişti."},{"id":"G154","n":154,"scope":"general","cat":"geschichte","q":"Wann war der Zweite Weltkrieg zu Ende?","a":["1933","1945","1949","1961"],"c":1,"img":null,"tq":"İkinci Dünya Savaşı ne zaman sona erdi?","ta":["1933","1945","1949","1961"],"exp":"Doğru cevap 1945. Savaş Avrupa'da 8 Mayıs 1945'te Almanya'nın teslimiyetiyle, dünyada ise Eylül 1945'te Japonya'nın teslimiyetiyle bitti. Diğer yıllar başka dönüm noktalarıdır: 1933 Hitler'in iktidara gelişi, 1949 iki Alman devletinin kuruluşu, 1961 Berlin Duvarı."},{"id":"G155","n":155,"scope":"general","cat":"geschichte","q":"Wann waren die Nationalsozialisten in Deutschland an der Macht?","a":["1888 bis 1918","1921 bis 1934","1933 bis 1945","1949 bis 1963"],"c":2,"img":null,"tq":"Nasyonal Sosyalistler Almanya'da ne zaman iktidardaydı?","ta":["1888'den 1918'e","1921'den 1934'e","1933'ten 1945'e","1949'dan 1963'e"],"exp":"Doğru cevap 1933'ten 1945'e. Nasyonal Sosyalist dönem Hitler'in 1933'te iktidara gelmesiyle başladı ve 1945'te savaşın kaybedilmesiyle bitti. 1888–1918 İmparator II. Wilhelm'in, 1949–1963 ise Federal Başbakan Konrad Adenauer'in dönemidir."},{"id":"G156","n":156,"scope":"general","cat":"geschichte","q":"In welchem Jahr wurde Hitler Reichskanzler?","a":["1923","1927","1933","1936"],"c":2,"img":null,"tq":"Hitler hangi yıl Reichskanzler (Reich Şansölyesi/Başbakan) oldu?","ta":["1923","1927","1933","1936"],"exp":"Doğru cevap 1933. Hitler, 30 Ocak 1933'te Reichspräsident (Reich Cumhurbaşkanı) Hindenburg tarafından Reichskanzler olarak atandı. 1923 ise Hitler'in Münih'teki başarısız darbe girişiminin yılıdır; iktidara gelişiyle karıştırmayın."},{"id":"G157","n":157,"scope":"general","cat":"geschichte","q":"Die Nationalsozialisten mit Adolf Hitler errichteten 1933 in Deutschland …","a":["eine Diktatur.","einen demokratischen Staat.","eine Monarchie.","ein Fürstentum."],"c":0,"img":null,"tq":"Adolf Hitler önderliğindeki Nasyonal Sosyalistler 1933'te Almanya'da … kurdu.","ta":["bir diktatörlük.","demokratik bir devlet.","bir monarşi.","bir prenslik."],"exp":"Doğru cevap: bir diktatörlük. 1933'te Nasyonal Sosyalistler parlamentoyu devre dışı bıraktı, diğer partileri yasakladı ve tüm gücü Hitler'de topladı. Demokrasi, kuvvetler ayrılığı ve temel haklar ortadan kaldırıldı."},{"id":"G158","n":158,"scope":"general","cat":"geschichte","q":"Das \"Dritte Reich\" war eine …","a":["Diktatur.","Demokratie.","Monarchie.","Räterepublik."],"c":0,"img":null,"tq":"\"Drittes Reich\" (Üçüncü İmparatorluk) bir … idi.","ta":["diktatörlük.","demokrasi.","monarşi.","Räterepublik (konseyler cumhuriyeti)."],"exp":"Doğru cevap: diktatörlük. \"Drittes Reich\", Nasyonal Sosyalistlerin 1933–1945 arasındaki tek parti diktatörlüğünü anlatan addır; özgür seçim, basın özgürlüğü ve muhalefet yoktu. Räterepublik (konseyler cumhuriyeti) ise 1919'da Münih'te kısa süre denenmiş sol bir yönetim biçimidir."},{"id":"G159","n":159,"scope":"general","cat":"geschichte","q":"Was gab es in Deutschland nicht während der Zeit des Nationalsozialismus?","a":["freie Wahlen","Pressezensur","willkürliche Verhaftungen","Verfolgung von Juden"],"c":0,"img":null,"tq":"Nasyonal Sosyalizm döneminde Almanya'da hangisi yoktu?","ta":["özgür seçimler","basın sansürü","keyfi tutuklamalar","Yahudilere yönelik zulüm"],"exp":"Doğru cevap: özgür seçimler. Nazi diktatörlüğünde yalnızca NSDAP'ye izin veriliyordu ve gerçek bir seçim yapılmıyordu. Basın sansürü, keyfi tutuklamalar ve Yahudilere yönelik zulüm ise bu rejimin günlük gerçekleriydi; soru \"yoktu\" diye sorduğu için dikkat edin."},{"id":"G160","n":160,"scope":"general","cat":"geschichte","q":"Welcher Krieg dauerte von 1939 bis 1945?","a":["der Erste Weltkrieg","der Zweite Weltkrieg","der Vietnamkrieg","der Golfkrieg"],"c":1,"img":null,"tq":"Hangi savaş 1939'dan 1945'e kadar sürdü?","ta":["Birinci Dünya Savaşı","İkinci Dünya Savaşı","Vietnam Savaşı","Körfez Savaşı"],"exp":"Doğru cevap: İkinci Dünya Savaşı. Savaş, Almanya'nın 1 Eylül 1939'da Polonya'ya saldırmasıyla başladı ve 1945'te sona erdi. Birinci Dünya Savaşı 1914–1918 yılları arasındaydı."},{"id":"G161","n":161,"scope":"general","cat":"geschichte","q":"Was kennzeichnete den NS-Staat? Eine Politik …","a":["des staatlichen Rassismus","der Meinungsfreiheit","der allgemeinen Religionsfreiheit","der Entwicklung der Demokratie"],"c":0,"img":null,"tq":"NS devletinin (Nasyonal Sosyalist devlet) ayırt edici özelliği neydi? … politikası.","ta":["devlet eliyle ırkçılık","ifade özgürlüğü","genel din özgürlüğü","demokrasinin geliştirilmesi"],"exp":"Doğru cevap: devlet eliyle ırkçılık. Nazi devleti, insanları sözde \"ırk\"larına göre ayıran yasalar çıkardı (1935 Nürnberg Yasaları) ve Yahudilerle diğer grupları sistemli biçimde dışladı, zulmetti ve öldürdü. İfade özgürlüğü, din özgürlüğü ve demokrasi ise bu rejimde yoktu."},{"id":"G162","n":162,"scope":"general","cat":"geschichte","q":"Claus Schenk Graf von Stauffenberg wurde bekannt durch …","a":["eine Goldmedaille bei den Olympischen Spielen 1936.","den Bau des Reichstagsgebäudes.","den Aufbau der Wehrmacht.","das Attentat auf Hitler am 20. Juli 1944."],"c":3,"img":null,"tq":"Claus Schenk Graf von Stauffenberg … ile tanındı.","ta":["1936 Olimpiyat Oyunları'nda kazandığı bir altın madalya.","Reichstag binasının inşası.","Wehrmacht'ın (Alman ordusu) kurulması.","20 Temmuz 1944'te Hitler'e yönelik suikast girişimi."],"exp":"Doğru cevap: 20 Temmuz 1944'te Hitler'e yönelik suikast girişimi. Subay Stauffenberg, Hitler'in karargâhına bomba yerleştirdi; Hitler hafif yaralanarak kurtuldu ve Stauffenberg aynı gece kurşuna dizildi. 20 Temmuz, bugün Almanya'da Nazi rejimine karşı direnişin simgesidir."},{"id":"G163","n":163,"scope":"general","cat":"geschichte","q":"In welchem Jahr zerstörten die Nationalsozialisten Synagogen und jüdische Geschäfte in Deutschland?","a":["1925","1930","1938","1945"],"c":2,"img":null,"tq":"Nasyonal Sosyalistler hangi yıl Almanya'daki sinagogları ve Yahudi dükkânlarını tahrip etti?","ta":["1925","1930","1938","1945"],"exp":"Doğru cevap 1938. 9 Kasım 1938 gecesi (Reichspogromnacht, \"Kristal Gece\") Almanya genelinde sinagoglar yakıldı, Yahudi dükkânları yağmalandı ve binlerce Yahudi tutuklandı. Bu olay, Yahudilere yönelik zulmün açık şiddete dönüştüğü dönüm noktasıdır."},{"id":"G164","n":164,"scope":"general","cat":"geschichte","q":"Was passierte am 9. November 1938 in Deutschland?","a":["Mit dem Angriff auf Polen beginnt der Zweite Weltkrieg.","Die Nationalsozialisten verlieren eine Wahl und lösen den Reichstag auf.","Jüdische Geschäfte und Synagogen werden durch Nationalsozialisten und ihre Anhänger zerstört.","Hitler wird Reichspräsident und lässt alle Parteien verbieten."],"c":2,"img":null,"tq":"9 Kasım 1938'de Almanya'da ne oldu?","ta":["Polonya'ya saldırıyla İkinci Dünya Savaşı başlar.","Nasyonal Sosyalistler bir seçimi kaybeder ve Reichstag'ı fesheder.","Yahudi dükkânları ve sinagoglar Nasyonal Sosyalistler ve yandaşları tarafından tahrip edilir.","Hitler Reichspräsident (Reich Cumhurbaşkanı) olur ve tüm partileri yasaklatır."],"exp":"Doğru cevap: Yahudi dükkânları ve sinagoglar tahrip edilir. 9 Kasım 1938 gecesi yaşanan bu pogrom \"Reichspogromnacht\" olarak anılır. Polonya'ya saldırı ise 1 Eylül 1939'dadır. 9 Kasım, 1989'da Berlin Duvarı'nın açıldığı gün olarak da Alman tarihinde önemlidir."},{"id":"G165","n":165,"scope":"general","cat":"geschichte","q":"Wie hieß der erste Bundeskanzler der Bundesrepublik Deutschland?","a":["Konrad Adenauer","Kurt Georg Kiesinger","Helmut Schmidt","Willy Brandt"],"c":0,"img":null,"tq":"Federal Almanya Cumhuriyeti'nin ilk Bundeskanzler'i (Federal Başbakan) kimdi?","ta":["Konrad Adenauer","Kurt Georg Kiesinger","Helmut Schmidt","Willy Brandt"],"exp":"Doğru cevap Konrad Adenauer. CDU'lu Adenauer, 1949'dan 1963'e kadar 14 yıl Federal Başbakanlık yaptı; Batı'ya bağlanma ve Fransa ile uzlaşma politikasıyla tanınır. Kiesinger (1966–1969), Brandt (1969–1974) ve Schmidt (1974–1982) sonraki başbakanlardır."},{"id":"G166","n":166,"scope":"general","cat":"geschichte","q":"Bei welchen Demonstrationen in Deutschland riefen die Menschen \"Wir sind das Volk\"?","a":["beim Arbeiteraufstand 1953 in der DDR","bei den Demonstrationen 1968 in der Bundesrepublik Deutschland","bei den Anti-Atomkraft-Demonstrationen 1985 in der Bundesrepublik Deutschland","bei den Montagsdemonstrationen 1989 in der DDR"],"c":3,"img":null,"tq":"Almanya'da insanlar hangi gösterilerde \"Wir sind das Volk\" (Halk biziz) diye bağırdı?","ta":["1953'te DDR'deki (Doğu Almanya) işçi ayaklanmasında","1968'de Federal Almanya Cumhuriyeti'ndeki gösterilerde","1985'te Federal Almanya Cumhuriyeti'ndeki nükleer karşıtı gösterilerde","1989'da DDR'deki Pazartesi gösterilerinde"],"exp":"Doğru cevap: 'Wir sind das Volk' (Biz halkız) slo

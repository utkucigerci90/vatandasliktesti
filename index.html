"img":null,"tq":"Almanya'da çocuk yetiştirme sorunlarında … gidersiniz.","ta":["doktora","sağlık dairesine (Gesundheitsamt)","nüfus kayıt dairesine (Einwohnermeldeamt)","gençlik dairesine (Jugendamt)"],"exp":"Doğru cevap Jugendamt'tır (gençlik dairesi): Çocuk yetiştirmeyle ilgili sorunlarda ailelere ücretsiz danışmanlık ve destek sağlayan kurum budur. Hatırlatma: \"Jugend\" (gençlik) kelimesi çocuk ve gençlerle ilgili her konuya işaret eder; nüfus dairesi yalnızca adres kaydı içindir."},{"id":"G274","n":274,"scope":"general","cat":"gesellschaft","q":"Sie haben in Deutschland absichtlich einen Brief geöffnet, der an eine andere Person adressiert ist. Was haben Sie nicht beachtet?","a":["das Schweigerecht","das Briefgeheimnis","die Schweigepflicht","die Meinungsfreiheit"],"c":1,"img":null,"tq":"Almanya'da başka bir kişiye adreslenmiş bir mektubu kasıtlı olarak açtınız. Neyi dikkate almadınız?","ta":["susma hakkını","haberleşme gizliliğini (Briefgeheimnis)","sır saklama yükümlülüğünü","ifade özgürlüğünü"],"exp":"Doğru cevap haberleşme gizliliğidir (Briefgeheimnis): Temel Yasa'nın 10. maddesi mektup, posta ve telekomünikasyon gizliliğini korur. Başkasının mektubunu izinsiz açmak suçtur. Susma hakkı sanıklarla, sır saklama yükümlülüğü ise doktor ve avukat gibi mesleklerle ilgilidir."},{"id":"G275","n":275,"scope":"general","cat":"gesellschaft","q":"Was braucht man in Deutschland für eine Ehescheidung?","a":["die Einwilligung der Eltern","ein Attest einer Ärztin/eines Arztes","die Einwilligung der Kinder","die Unterstützung einer Anwältin/eines Anwalts"],"c":3,"img":null,"tq":"Almanya'da boşanma için neye ihtiyaç vardır?","ta":["ebeveynlerin onayına","bir doktor raporuna","çocukların onayına","bir avukatın desteğine"],"exp":"Doğru cevap bir avukatın desteğidir. Almanya'da boşanma yalnızca aile mahkemesi kararıyla gerçekleşir ve mahkemede boşanma başvurusu için avukat zorunluluğu vardır. Ebeveynlerin, çocukların onayı veya doktor raporu gerekmez."},{"id":"G276","n":276,"scope":"general","cat":"gesellschaft","q":"Was sollten Sie tun, wenn Sie von Ihrer Ansprechpartnerin/Ihrem Ansprechpartner in einer deutschen Behörde schlecht behandelt werden?","a":["Ich kann nichts tun.","Ich muss mir diese Behandlung gefallen lassen.","Ich drohe der Person.","Ich kann mich bei der Behördenleiterin/beim Behördenleiter beschweren."],"c":3,"img":null,"tq":"Bir Alman resmi dairesinde muhatabınız size kötü davranırsa ne yapmalısınız?","ta":["Hiçbir şey yapamam.","Bu muameleye katlanmak zorundayım.","Kişiyi tehdit ederim.","Daire müdürüne şikayette bulunabilirim."],"exp":"Doğru cevap daire müdürüne şikayette bulunmaktır. Almanya'da vatandaşlar memurların davranışlarından şikayet etme hakkına sahiptir (Dienstaufsichtsbeschwerde); kötü muameleye katlanmak zorunda değilsiniz. Tehdit ise suçtur ve sorunu çözmez."},{"id":"G277","n":277,"scope":"general","cat":"gesellschaft","q":"Eine Frau, die ein zweijähriges Kind hat, bewirbt sich in Deutschland um eine Stelle. Was ist ein Beispiel für Diskriminierung? Sie bekommt die Stelle nur deshalb nicht, weil sie …","a":["kein Englisch spricht.","zu hohe Gehaltsvorstellungen hat.","keine Erfahrungen in diesem Beruf hat.","Mutter ist."],"c":3,"img":null,"tq":"İki yaşında bir çocuğu olan bir kadın Almanya'da bir işe başvuruyor. Hangisi ayrımcılık örneğidir? İşi yalnızca … nedeniyle alamıyor.","ta":["İngilizce bilmemesi","çok yüksek maaş beklentisi olması","bu meslekte deneyiminin olmaması","anne olması"],"exp":"Doğru cevap anne olmasıdır. Dil bilgisi, maaş beklentisi ve deneyim işle doğrudan ilgili, meşru ölçütlerdir. Anne olmak ise işle ilgisi olmayan kişisel bir durumdur; bu nedenle reddetmek Genel Eşit Muamele Yasası'na (AGG) göre yasak olan ayrımcılıktır."},{"id":"G278","n":278,"scope":"general","cat":"gesellschaft","q":"Ein Mann im Rollstuhl hat sich auf eine Stelle als Buchhalter beworben. Was ist ein Beispiel für Diskriminierung? Er bekommt die Stelle nur deshalb nicht, weil er …","a":["im Rollstuhl sitzt.","keine Erfahrung hat.","zu hohe Gehaltsvorstellungen hat.","kein Englisch spricht."],"c":0,"img":null,"tq":"Tekerlekli sandalye kullanan bir adam muhasebeci olarak bir işe başvurdu. Hangisi ayrımcılık örneğidir? İşi yalnızca … nedeniyle alamıyor.","ta":["tekerlekli sandalyede oturması","deneyiminin olmaması","çok yüksek maaş beklentisi olması","İngilizce bilmemesi"],"exp":"Doğru cevap tekerlekli sandalyede oturmasıdır. Muhasebecilik işi için engel durumu bir yeterlilik ölçütü değildir; engel nedeniyle reddetmek yasak olan ayrımcılıktır. Deneyim, maaş beklentisi ve dil bilgisi ise işverenin dikkate alabileceği meşru nedenlerdir."},{"id":"G279","n":279,"scope":"general","cat":"gesellschaft","q":"In den meisten Mietshäusern in Deutschland gibt es eine \"Hausordnung\". Was steht in einer solchen \"Hausordnung\"? Sie nennt …","a":["Regeln für die Benutzung öffentlicher Verkehrsmittel.","alle Mieterinnen und Mieter im Haus.","Regeln, an die sich alle Bewohnerinnen und Bewohner halten müssen.","die Adresse des nächsten Ordnungsamtes."],"c":2,"img":null,"tq":"Almanya'daki çoğu apartmanda bir \"Hausordnung\" (bina kuralları) vardır. Böyle bir \"Hausordnung\"da ne yazar? …","ta":["Toplu taşıma araçlarını kullanma kurallarını belirtir.","Binadaki tüm kiracıları listeler.","Tüm bina sakinlerinin uymak zorunda olduğu kuralları belirtir.","En yakın kamu düzeni dairesinin (Ordnungsamt) adresini belirtir."],"exp":"Doğru cevap: Tüm bina sakinlerinin uymak zorunda olduğu kuralları belirtir. Hausordnung; gece sessizliği, merdiven temizliği, çöp ayrıştırma, ortak alanların kullanımı gibi konuları düzenler ve çoğunlukla kira sözleşmesinin bir parçasıdır."},{"id":"G280","n":280,"scope":"general","cat":"gesellschaft","q":"Wenn Sie sich in Deutschland gegen einen falschen Steuerbescheid wehren wollen, müssen Sie …","a":["nichts machen.","den Bescheid wegwerfen.","Einspruch einlegen.","warten, bis ein anderer Bescheid kommt."],"c":2,"img":null,"tq":"Almanya'da hatalı bir vergi tahakkuk belgesine (Steuerbescheid) karşı çıkmak istiyorsanız …","ta":["hiçbir şey yapmanız gerekmez.","belgeyi atmanız gerekir.","itiraz etmeniz (Einspruch) gerekir.","başka bir belge gelene kadar beklemeniz gerekir."],"exp":"Doğru cevap itiraz etmektir (Einspruch einlegen). Vergi dairesinden gelen hatalı bir belgeye karşı genellikle bir ay içinde yazılı itiraz hakkınız vardır; bu süre geçerse belge kesinleşir. Beklemek veya belgeyi atmak hiçbir şeyi değiştirmez, ödeme yükümlülüğü devam eder."},{"id":"G281","n":281,"scope":"general","cat":"gesellschaft","q":"Zwei Freunde wollen in ein öffentliches Schwimmbad in Deutschland. Beide haben eine dunkle Hautfarbe und werden deshalb nicht hineingelassen. Welches Recht wird in dieser Situation verletzt? Das Recht auf …","a":["Meinungsfreiheit","Gleichbehandlung","Versammlungsfreiheit","Freizügigkeit"],"c":1,"img":null,"tq":"İki arkadaş Almanya'da halka açık bir yüzme havuzuna gitmek istiyor. İkisinin de ten rengi koyu ve bu nedenle içeri alınmıyorlar. Bu durumda hangi hak ihlal ediliyor? … hakkı.","ta":["İfade özgürlüğü","Eşit muamele","Toplanma özgürlüğü","Seyahat ve yerleşme özgürlüğü"],"exp":"Doğru cevap eşit muamele hakkıdır (Gleichbehandlung). Ten rengi nedeniyle birini bir hizmetten dışlamak, Temel Yasa'nın 3. maddesine ve Genel Eşit Muamele Yasası'na (AGG) aykırı ayrımcılıktır. İfade, toplanma ve yerleşme özgürlüğü bu olayla ilgili değildir."},{"id":"G282","n":282,"scope":"general","cat":"gesellschaft","q":"Welches Ehrenamt müssen deutsche Staatsbürgerinnen und Staatsbürger übernehmen, wenn sie dazu aufgefordert werden?","a":["Vereinstrainerin/Vereinstrainer","Wahlhelferin/Wahlhelfer","Bibliotheksaufsicht","Lehrerin/Lehrer"],"c":1,"img":null,"tq":"Alman vatandaşları, çağrıldıklarında hangi fahri görevi üstlenmek zorundadır?","ta":["kulüp antrenörlüğü","seçim görevliliği (Wahlhelfer)","kütüphane gözetmenliği","öğretmenlik"],"exp":"Doğru cevap seçim görevliliğidir (Wahlhelfer). Belediye bir vatandaşı sandık kurulunda görev yapmaya çağırırsa, geçerli bir mazereti yoksa bunu kabul etmek zorundadır; bu, demokrasiye katkı sayılan fahri bir yurttaşlık görevidir. Diğer seçenekler tamamen gönüllüdür."},{"id":"G283","n":283,"scope":"general","cat":"gesellschaft","q":"Was tun Sie, wenn Sie eine falsche Rechnung von einer deutschen Behörde bekommen?","a":["Ich lasse die Rechnung liegen.","Ich lege Widerspruch bei der Behörde ein.","Ich schicke die Rechnung an die Behörde zurück.","Ich gehe mit der Rechnung zum Finanzamt."],"c":1,"img":null,"tq":"Bir Alman resmi dairesinden hatalı bir fatura alırsanız ne yaparsınız?","ta":["Faturayı olduğu gibi bırakırım.","Daireye itiraz (Widerspruch) ederim.","Faturayı daireye geri gönderirim.","Faturayla vergi dairesine (Finanzamt) giderim."],"exp":"Doğru cevap daireye itiraz etmektir (Widerspruch einlegen). Resmi bir karara veya ödeme talebine karşı belirli bir süre içinde (genellikle bir ay) yazılı itiraz hakkınız vardır. Faturayı bırakmak ya da geri göndermek ödeme yükümlülüğünü ortadan kaldırmaz."},{"id":"G284","n":284,"scope":"general","cat":"gesellschaft","q":"Was man für die Arbeit können muss, ändert sich in Zukunft sehr schnell. Was kann man tun?","a":["Es ist egal, was man lernt.","Erwachsene müssen auch nach der Ausbildung immer weiter lernen.","Kinder lernen in der Schule alles, was im Beruf wichtig ist. Nach der Schule muss man nicht weiter lernen.","Alle müssen früher aufhören zu arbeiten, weil sich alles ändert."],"c":1,"img":null,"tq":"İş için bilinmesi gerekenler gelecekte çok hızlı değişecek. Ne yapılabilir?","ta":["Ne öğrenildiğinin önemi yoktur.","Yetişkinler meslek eğitiminden sonra da sürekli öğrenmeye devam etmelidir.","Çocuklar meslekte önemli olan her şeyi okulda öğrenir. Okuldan sonra öğrenmeye gerek yoktur.","Her şey değiştiği için herkes çalışmayı daha erken bırakmalıdır."],"exp":"Doğru cevap: Yetişkinler meslek eğitiminden sonra da sürekli öğrenmeye devam etmelidir. Buna \"yaşam boyu öğrenme\" (lebenslanges Lernen) denir; teknoloji ve meslekler değiştikçe bilgiyi güncellemek gerekir. Volkshochschule gibi kurumlar bunun için yetişkin eğitimi sunar."},{"id":"G285","n":285,"scope":"general","cat":"gesellschaft","q":"Frau Frost arbeitet als fest angestellte Mitarbeiterin in einem Büro. Was muss sie nicht von ihrem Gehalt bezahlen?","a":["Lohnsteuer","Beiträge zur Arbeitslosenversicherung","Beiträge zur Renten- und Krankenversicherung","Umsatzsteuer"],"c":3,"img":null,"tq":"Bayan Frost bir büroda kadrolu çalışan olarak görev yapıyor. Maaşından neyi ödemek zorunda değildir?","ta":["Gelir vergisi (Lohnsteuer)","İşsizlik sigortası primleri","Emeklilik ve sağlık sigortası primleri","Katma değer vergisi (Umsatzsteuer)"],"exp":"Doğru cevap katma değer vergisidir (Umsatzsteuer). Bu vergiyi şirketler ürün ve hizmet satışlarında tahsil eder; maaştan kesilmez. Çalışanların maaşından ise gelir vergisi ile işsizlik, emeklilik, sağlık ve bakım sigortası primleri kesilir."},{"id":"G286","n":286,"scope":"general","cat":"gesellschaft","q":"Welche Organisation in einer Firma hilft den Arbeitnehmerinnen und Arbeitnehmern bei Problemen mit der Arbeitgeberin/dem Arbeitgeber?","a":["der Betriebsrat","die Betriebsprüferin/der Betriebsprüfer","die Betriebsgruppe","das Betriebsmanagement"],"c":0,"img":null,"tq":"Bir şirkette hangi kuruluş, çalışanlara işverenle yaşadıkları sorunlarda yardımcı olur?","ta":["işyeri konseyi (Betriebsrat)","işletme denetçisi (Betriebsprüfer)","işletme grubu (Betriebsgruppe)","işletme yönetimi (Betriebsmanagement)"],"exp":"Doğru cevap Betriebsrat'tır (işyeri konseyi): Çalışanlar tarafından seçilen bu kurul, işçilerin çıkarlarını işverene karşı temsil eder ve işten çıkarma, çalışma saatleri gibi konularda söz hakkına sahiptir. Betriebsprüfer vergi denetçisidir, yönetim ise işveren tarafındadır."},{"id":"G287","n":287,"scope":"general","cat":"gesellschaft","q":"Sie möchten bei einer Firma in Deutschland ihr Arbeitsverhältnis beenden. Was müssen Sie beachten?","a":["die Gehaltszahlungen","die Arbeitszeit","die Kündigungsfrist","die Versicherungspflicht"],"c":2,"img":null,"tq":"Almanya'da bir şirketteki iş ilişkinizi sona erdirmek istiyorsunuz. Neye dikkat etmeniz gerekir?","ta":["maaş ödemelerine","çalışma süresine","fesih bildirim süresine (Kündigungsfrist)","sigorta zorunluluğuna"],"exp":"Doğru cevap fesih bildirim süresidir (Kündigungsfrist). İşten ayrılmak isteyen çalışan, iş sözleşmesindeki veya yasadaki bildirim süresine uymak zorundadır; yasal asgari süre genellikle 4 haftadır (ayın 15'ine veya sonuna). Fesih yazılı olmalıdır."},{"id":"G288","n":288,"scope":"general","cat":"gesellschaft","q":"Woraus begründet sich Deutschlands besondere Verantwortung für Israel?","a":["aus der Mitgliedschaft in der Europäischen Union (EU)","aus den nationalsozialistischen Verbrechen gegen Juden","aus dem Grundgesetz der Bundesrepublik Deutschland","aus der christlichen Tradition"],"c":1,"img":null,"tq":"Almanya'nın İsrail'e karşı özel sorumluluğu neye dayanır?","ta":["Avrupa Birliği (AB) üyeliğine","Nasyonal Sosyalistlerin Yahudilere karşı işlediği suçlara","Federal Almanya Cumhuriyeti'nin Temel Yasası'na (Grundgesetz)","Hristiyan geleneğine"],"exp":"Doğru cevap Nasyonal Sosyalistlerin Yahudilere karşı işlediği suçlardır. Nazi döneminde (1933–1945) yaklaşık altı milyon Yahudi öldürüldü (Holokost/Shoah). Bu tarihsel suç nedeniyle Almanya, İsrail'in varlığı ve güvenliği konusunda özel bir sorumluluk taşıdığını kabul eder."},{"id":"G289","n":289,"scope":"general","cat":"gesellschaft","q":"Ein Mann mit dunkler Hautfarbe bewirbt sich um eine Stelle als Kellner in einem Restaurant in Deutschland. Was ist ein Beispiel für Diskriminierung? Er bekommt die Stelle nur deshalb nicht, weil …","a":["seine Deutschkenntnisse zu gering sind.","er zu hohe Gehaltsvorstellungen hat.","er eine dunkle Haut hat.","er keine Erfahrungen im Beruf hat."],"c":2,"img":null,"tq":"Koyu tenli bir adam Almanya'da bir restoranda garson olarak bir işe başvuruyor. Hangisi ayrımcılık örneğidir? İşi yalnızca … nedeniyle alamıyor.","ta":["Almanca bilgisinin çok az olması","çok yüksek maaş beklentisi olması","koyu tenli olması","meslekte deneyiminin olmaması"],"exp":"Doğru cevap koyu tenli olmasıdır. Ten rengi işle ilgisi olmayan bir özelliktir ve bu nedenle reddetmek yasaklanmış ayrımcılıktır (AGG). Garson için Almanca bilgisi, deneyim ve maaş beklentisi ise işin gereğiyle ilgili meşru ölçütlerdir."},{"id":"G290","n":290,"scope":"general","cat":"gesellschaft","q":"Sie haben in Deutschland einen Fernseher gekauft. Zu Hause packen Sie den Fernseher aus, doch er funktioniert nicht. Der Fernseher ist kaputt. Was können Sie machen?","a":["eine Anzeige schreiben","den Fernseher reklamieren","das Gerät ungefragt austauschen","die Garantie verlängern"],"c":1,"img":null,"tq":"Almanya'da bir televizyon satın aldınız. Evde televizyonu kutusundan çıkarıyorsunuz ama çalışmıyor. Televizyon bozuk. Ne yapabilirsiniz?","ta":["suç duyurusunda bulunmak","televizyonu şikayet konusu yapmak / iade-değişim talep etmek (reklamieren)","cihazı sormadan değiştirmek","garantiyi uzatmak"],"exp":"Doğru cevap televizyonu reklamieren etmektir, yani satıcıya ayıplı mal bildirimi yapıp onarım veya değişim istemektir. Almanya'da yeni ürünlerde satıcı 2 yıl boyunca kusurlardan sorumludur (Gewährleistung). Suç duyurusu gereksizdir; cihazı kendi başınıza değiştirmek mümkün değildir."},{"id":"G291","n":291,"scope":"general","cat":"gesellschaft","q":"Warum muss man in Deutschland bei der Steuererklärung aufschreiben, ob man zu einer Kirche gehört oder nicht? Weil …","a":["es eine Kirchensteuer gibt, die an die Einkommen- und Lohnsteuer geknüpft ist.","das für die Statistik in Deutschland wichtig ist.","man mehr Steuern zahlen muss, wenn man nicht zu einer Kirche gehört.","die Kirche für die Steuererklärung verantwortlich ist."],"c":0,"img":null,"tq":"Almanya'da vergi beyannamesinde bir kiliseye üye olup olmadığınızı neden yazmanız gerekir? Çünkü …","ta":["gelir ve ücret vergisine bağlı bir kilise vergisi vardır.","bu, Almanya'daki istatistikler için önemlidir.","bir kiliseye üye değilseniz daha fazla vergi ödemeniz gerekir.","kilise, vergi beyannamesinden sorumludur."],"exp":"Doğru cevap: Almanya'da kilise vergisi (Kirchensteuer) vardır ve bu vergi gelir ve ücret vergisine bağlı olarak kesilir; bu yüzden vergi beyanında bir kiliseye üye olup olmadığınız sorulur. Üye olmayanlar bu vergiyi ödemez; yani kiliseye üye olmayan daha fazla değil, daha az vergi öder."},{"id":"G292","n":292,"scope":"general","cat":"gesellschaft","q":"Die Menschen in Deutschland leben nach dem Grundsatz der religiösen Toleranz. Was bedeutet das?","a":["Es dürfen keine Moscheen gebaut werden.","Alle Menschen glauben an Gott.","Jeder kann glauben, was er möchte.","Der Staat entscheidet, an welchen Gott die Menschen glauben."],"c":2,"img":null,"tq":"Almanya'da insanlar dini hoşgörü ilkesine göre yaşar. Bu ne anlama gelir?","ta":["Cami inşa edilemez.","Bütün insanlar Tanrı'ya inanır.","Herkes istediğine inanabilir.","İnsanların hangi Tanrı'ya inanacağına devlet karar verir."],"exp":"Doğru cevap: Herkes istediğine inanabilir. Temel Yasa'nın 4. maddesi din ve vicdan özgürlüğünü güvence altına alır; herkes bir dine inanabilir, inanmayabilir veya dinini değiştirebilir. Devlet tarafsızdır ve camiler dahil ibadet yerleri serbestçe inşa edilebilir."},{"id":"G293","n":293,"scope":"general","cat":"gesellschaft","q":"Was ist in Deutschland ein Brauch zu Ostern?","a":["Kürbisse vor die Tür stellen","einen Tannenbaum schmücken","Eier bemalen","Raketen in die Luft schießen"],"c":2,"img":null,"tq":"Almanya'da Paskalya'da (Ostern) hangi gelenek vardır?","ta":["kapının önüne balkabağı koymak","bir çam ağacı süslemek","yumurta boyamak","havaya roket atmak"],"exp":"Doğru cevap yumurta boyamaktır. Paskalya'da (Ostern) renkli boyanmış yumurtalar saklanır ve çocuklar onları arar; yumurta yeni hayatın simgesidir. Çam ağacı Noel'e, balkabağı Cadılar Bayramı'na, havai fişek ise yılbaşı gecesine (Silvester) aittir."},{"id":"G294","n":294,"scope":"general","cat":"gesellschaft","q":"Pfingsten ist ein …","a":["christlicher Feiertag.","deutscher Gedenktag.","internationaler Trauertag.","bayerischer Brauch."],"c":0,"img":null,"tq":"Pfingsten (Hamsin Yortusu) bir …","ta":["Hristiyan bayramıdır.","Alman anma günüdür.","uluslararası yas günüdür.","Bavyera geleneğidir."],"exp":"Doğru cevap Hristiyan bayramıdır. Pfingsten, Paskalya'dan 50 gün sonra kutlanır ve Hristiyan inancında Kutsal Ruh'un havarilere inişini anar. Pfingstmontag (Pfingsten Pazartesisi) Almanya genelinde resmi tatildir. Tıpkı Noel ve Paskalya gibi dini kökenli bir bayramdır."},{"id":"G295","n":295,"scope":"general","cat":"gesellschaft","q":"Welche Religion hat die europäische und deutsche Kultur geprägt?","a":["der Hinduismus","das Christentum","der Buddhismus","der Islam"],"c":1,"img":null,"tq":"Avrupa ve Alman kültürünü hangi din şekillendirmiştir?","ta":["Hinduizm","Hristiyanlık","Budizm","İslam"],"exp":"Doğru cevap Hristiyanlıktır. Avrupa ve Almanya'nın tarihi, sanatı, takvimi ve resmi tatilleri (Noel, Paskalya, Pfingsten) büyük ölçüde Hristiyan gelenekten gelir. Bu, bugün din özgürlüğünün geçerli olduğu ve başka dinlerin de serbestçe yaşandığı gerçeğini değiştirmez."},{"id":"G296","n":296,"scope":"general","cat":"gesellschaft","q":"In Deutschland nennt man die letzten vier Wochen vor Weihnachten …","a":["den Buß- und Bettag.","das Erntedankfest.","die Adventszeit.","Allerheiligen."],"c":2,"img":null,"tq":"Almanya'da Noel'den önceki son dört haftaya … denir.","ta":["Buß- und Bettag (Tövbe ve Dua Günü)","Erntedankfest (Hasat Şükran Bayramı)","Advent dönemi (Adventszeit)","Allerheiligen (Azizler Günü)"],"exp":"Doğru cevap Advent dönemidir (Adventszeit). Noel'den önceki dört pazar günü dört Advent mumuyla kutlanır; bu dönemde Advent çelenkleri, Noel pazarları ve Advent takvimleri öne çıkar. Diğer üç seçenek tek günlük, Noel öncesi dönemle ilgisi olmayan günlerdir."},{"id":"G297","n":297,"scope":"general","cat":"gesellschaft","q":"Aus welchem Land sind die meisten Migrantinnen und Migranten nach Deutschland gekommen?","a":["Italien","Polen","Marokko","Türkei"],"c":3,"img":null,"tq":"Almanya'ya en çok göçmen hangi ülkeden gelmiştir?","ta":["İtalya","Polonya","Fas","Türkiye"],"exp":"Doğru cevap Türkiye'dir. 1961'deki işgücü anlaşmasıyla başlayan göç sonucunda Türkiye kökenli insanlar Almanya'daki en büyük göçmen kökenli grubu oluşturur (yaklaşık 3 milyon kişi). İtalya ve Polonya da önemli kaynak ülkelerdir, ancak sayıca Türkiye'nin gerisindedir."},{"id":"G298","n":298,"scope":"general","cat":"gesellschaft","q":"In der DDR lebten vor allem Migrantinnen und Migranten aus …","a":["Vietnam, Polen, Mosambik.","Frankreich, Rumänien, Somalia.","Chile, Ungarn, Simbabwe.","Nordkorea, Mexiko, Ägypten."],"c":0,"img":null,"tq":"Demokratik Alman Cumhuriyeti'nde (DDR) özellikle … göçmenler yaşıyordu.","ta":["Vietnam, Polonya ve Mozambik'ten","Fransa, Romanya ve Somali'den","Şili, Macaristan ve Zimbabve'den","Kuzey Kore, Meksika ve Mısır'dan"],"exp":"Doğru cevap Vietnam, Polonya ve Mozambik'tir. Doğu Almanya (DDR), \"sözleşmeli işçileri\" (Vertragsarbeiter) yalnızca kendisi gibi sosyalist ülkelerden getiriyordu. İpucu: Doğru seçenekteki üç ülke de o dönemde sosyalist bloktaydı; diğer seçeneklerde Batı ülkeleri de yer alır."},{"id":"G299","n":299,"scope":"general","cat":"gesellschaft","q":"Ausländische Arbeitnehmerinnen und Arbeitnehmer, die in den 50er und 60er Jahren von der Bundesrepublik Deutschland angeworben wurden, nannte man …","a":["Schwarzarbeiterinnen/Schwarzarbeiter.","Gastarbeiterinnen/Gastarbeiter.","Zeitarbeiterinnen/Zeitarbeiter.","Schichtarbeiterinnen/Schichtarbeiter."],"c":1,"img":null,"tq":"1950'li ve 1960'lı yıllarda Federal Almanya Cumhuriyeti tarafından işe alınmak üzere çağrılan yabancı işçilere … denirdi.","ta":["kaçak işçi (Schwarzarbeiter)","misafir işçi (Gastarbeiter)","geçici işçi (Zeitarbeiter)","vardiyalı işçi (Schichtarbeiter)"],"exp":"Doğru cevap Gastarbeiter'dır (misafir işçi). Batı Almanya, ekonomik mucize döneminde işgücü açığını kapatmak için 1955'ten itibaren İtalya, İspanya, Yunanistan, Türkiye gibi ülkelerle anlaşmalar yaptı. \"Misafir\" denmesi, kalışlarının geçici sanılmasından kaynaklanır; çoğu kaldı."},{"id":"G300","n":300,"scope":"general","cat":"gesellschaft","q":"Aus welchem Land kamen die ersten Gastarbeiterinnen und Gastarbeiter in die Bundesrepublik Deutschland?","a":["Italien","Spanien","Portugal","Türkei"],"c":0,"img":null,"tq":"Federal Almanya Cumhuriyeti'ne ilk misafir işçiler (Gastarbeiter) hangi ülkeden geldi?","ta":["İtalya","İspanya","Portekiz","Türkiye"],"exp":"Doğru cevap İtalya'dır: İlk işgücü anlaşması 1955'te İtalya ile imzalandı. Ardından İspanya ve Yunanistan (1960), Türkiye (1961), Portekiz (1964) geldi. Hatırlatma: Türkiye en çok göçmen veren ülkedir, ama ilk anlaşma İtalya ile yapılmıştır."},{"id":"BW01","n":1,"scope":"BW","cat":"land","q":"Welches Wappen gehört zum Bundesland Baden-Württemberg?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":0,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/0/0f/Lesser_coat_of_arms_of_Baden-W%C3%BCrttemberg.svg","https://upload.wikimedia.org/wikipedia/commons/0/08/Coat_of_arms_of_Thuringia.svg","https://upload.wikimedia.org/wikipedia/commons/5/53/Wappen_Sachsen-Anhalt.svg","https://upload.wikimedia.org/wikipedia/commons/5/5d/DEU_Hamburg_COA.svg"],"note":"Bild 1 = Wappen Baden-Württemberg; Bild 2 = Wappen Thüringen; Bild 3 = Wappen Sachsen-Anhalt; Bild 4 = Wappen Hamburg. Reihenfolge wie im amtlichen Katalog (BAMF-Online-Fragenkatalog, 31.10.2026); Commons-Dateien der amtlichen Landeswappen."},"tq":"Hangi arma (Wappen) Baden-Württemberg eyaletine (Bundesland) aittir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 1'dir. Baden-Württemberg arması, altın sarısı zemin üzerinde yürüyen üç siyah aslan gösterir; kalkanın üstünde yapraklı bir taç vardır. Resim 2 Thüringen (yıldızlı çizgili aslan), Resim 3 Sachsen-Anhalt, Resim 4 ise Hamburg'dur (kırmızı zeminde beyaz kale)."},{"id":"BW02","n":2,"scope":"BW","cat":"land","q":"Welches ist ein Landkreis in Baden-Württemberg?","a":["Mecklenburgische Seenplatte","Neckar-Odenwald-Kreis","Nordfriesland","Altötting"],"c":1,"img":null,"tq":"Hangisi Baden-Württemberg'de bir ilçedir (Landkreis)?","ta":["Mecklenburgische Seenplatte","Neckar-Odenwald-Kreis","Nordfriesland","Altötting"],"exp":"Doğru cevap Neckar-Odenwald-Kreis adlı ilçedir (Landkreis). İpucu: Neckar, Stuttgart ve Heidelberg'den geçen Baden-Württemberg nehridir. Mecklenburgische Seenplatte Mecklenburg-Vorpommern'de, Nordfriesland Schleswig-Holstein'da, Altötting ise Bayern'dedir."},{"id":"BW03","n":3,"scope":"BW","cat":"land","q":"Für wie viele Jahre wird der Landtag in Baden-Württemberg gewählt?","a":["3","4","5","6"],"c":2,"img":null,"tq":"Baden-Württemberg'de Landtag (Eyalet Meclisi) kaç yıl için seçilir?","ta":["3","4","5","6"],"exp":"Doğru cevap 5'tir. Baden-Württemberg Landtag'ı (Eyalet Meclisi) Stuttgart'ta toplanır ve 5 yıl için seçilir. Almanya'da Bremen dışındaki tüm eyalet meclisleri 5 yıllığına seçilir; yalnızca Bremen'de süre 4 yıldır."},{"id":"BW04","n":4,"scope":"BW","cat":"land","q":"Ab welchem Alter darf man in Baden-Württemberg bei Kommunalwahlen wählen?","a":["14","16","18","20"],"c":1,"img":null,"tq":"Baden-Württemberg'de yerel seçimlerde (Kommunalwahlen) kaç yaşından itibaren oy kullanılabilir?","ta":["14","16","18","20"],"exp":"Doğru cevap 16'dır. Baden-Württemberg'de belediye ve ilçe meclisi seçimlerinde (Kommunalwahlen) 16 yaşını doldurmuş olanlar oy kullanabilir. Bu kural Almanya'nın birçok eyaletinde geçerlidir; Bayern ve Hessen gibi eyaletlerde ise yerel seçimler için 18 yaş gerekir."},{"id":"BW05","n":5,"scope":"BW","cat":"land","q":"Welche Farben hat die Landesflagge von Baden-Württemberg?","a":["blau-weiß-rot","schwarz-gold","weiß-blau","grün-weiß-rot"],"c":1,"img":null,"tq":"Baden-Württemberg eyalet bayrağı (Landesflagge) hangi renklerdedir?","ta":["mavi-beyaz-kırmızı","siyah-altın sarısı","beyaz-mavi","yeşil-beyaz-kırmızı"],"exp":"Doğru cevap siyah-altın sarısıdır. Baden-Württemberg eyalet bayrağı üstte siyah, altta altın sarısı iki yatay şeritten oluşur. Renkler armadan gelir: altın sarısı zemin ve siyah aslanlar."},{"id":"BW06","n":6,"scope":"BW","cat":"land","q":"Wo können Sie sich in Baden-Württemberg über politische Themen informieren?","a":["beim Ordnungsamt der Gemeinde","bei der Verbraucherzentrale","bei der Landeszentrale für politische Bildung","bei den Kirchen"],"c":2,"img":null,"tq":"Baden-Württemberg'de siyasi konular hakkında nereden bilgi alabilirsiniz?","ta":["belediyenin Ordnungsamt'ından (kamu düzeni dairesi)","Verbraucherzentrale'den (tüketici danışma merkezi)","Landeszentrale für politische Bildung'dan (Eyalet Siyasi Eğitim Merkezi)","kiliselerden"],"exp":"Doğru cevap Landeszentrale für politische Bildung'dur (Eyalet Siyasi Eğitim Merkezi). Bu kurum her eyalette vatandaşları siyaset, demokrasi ve tarih konularında tarafsız biçimde bilgilendirir. Ordnungsamt kamu düzeniyle, Verbraucherzentrale tüketici haklarıyla ilgilenir."},{"id":"BW07","n":7,"scope":"BW","cat":"land","q":"Die Landeshauptstadt von Baden-Württemberg heißt …","a":["Heidelberg.","Stuttgart.","Karlsruhe.","Mannheim."],"c":1,"img":null,"tq":"Baden-Württemberg'in eyalet başkentinin (Landeshauptstadt) adı …","ta":["Heidelberg'dir.","Stuttgart'tır.","Karlsruhe'dir.","Mannheim'dır."],"exp":"Doğru cevap Stuttgart'tır. Stuttgart, Baden-Württemberg'in eyalet başkenti (Landeshauptstadt) ve en büyük şehridir; Landtag ve eyalet hükümeti burada bulunur. Heidelberg, Karlsruhe ve Mannheim de bu eyaletin önemli şehirleridir, ancak başkent değildir."},{"id":"BW08","n":8,"scope":"BW","cat":"land","q":"Welches Bundesland ist Baden-Württemberg?","a":["1","2","3","4"],"c":1,"img":{"kind":"question","urls":[],"note":"Deutschlandkarte, auf der vier Bundeslaender mit den Ziffern 1-4 markiert sind; eines davon ist Baden-Württemberg. Kein freies Ersatzbild mit identischer Nummerierung."},"tq":"Haritada hangi eyalet (Bundesland) Baden-Württemberg'dir?","ta":["1","2","3","4"],"exp":"Doğru cevap 2'dir. Sınav haritasında Baden-Württemberg 2 numarayla gösterilir. Eyalet Almanya'nın güneybatısında yer alır; batıda Fransa, güneyde İsviçre ile komşudur, doğusunda ise Bayern bulunur."},{"id":"BW09","n":9,"scope":"BW","cat":"land","q":"Wie nennt man die Regierungschefin/den Regierungschef in Baden-Württemberg?","a":["Erste Ministerin/Erster Minister","Premierministerin/Premierminister","Bürgermeisterin/Bürgermeister","Ministerpräsidentin/Ministerpräsident"],"c":3,"img":null,"tq":"Baden-Württemberg'de hükümet başkanına ne ad verilir?","ta":["Erste Ministerin/Erster Minister (Birinci Bakan)","Premierministerin/Premierminister (Başbakan)","Bürgermeisterin/Bürgermeister (Belediye Başkanı)","Ministerpräsidentin/Ministerpräsident (Eyalet Başbakanı)"],"exp":"Doğru cevap Ministerpräsidentin/Ministerpräsident'tir (Eyalet Başbakanı). Baden-Württemberg gibi alan eyaletlerinde (Flächenländer) hükümet başkanı bu unvanı taşır ve Landtag tarafından seçilir. Şehir devletlerinde unvan farklıdır; örneğin Hamburg'da Erster Bürgermeister denir."},{"id":"BW10","n":10,"scope":"BW","cat":"land","q":"Welche Ministerin/welchen Minister hat Baden-Württemberg nicht?","a":["Finanzministerin/Finanzminister","Justizministerin/Justizminister","Innenministerin/Innenminister","Außenministerin/Außenminister"],"c":3,"img":null,"tq":"Baden-Württemberg'in hangi bakanı yoktur?","ta":["Finanzministerin/Finanzminister (Maliye Bakanı)","Justizministerin/Justizminister (Adalet Bakanı)","Innenministerin/Innenminister (İçişleri Bakanı)","Außenministerin/Außenminister (Dışişleri Bakanı)"],"exp":"Doğru cevap Außenministerin/Außenminister'dir (Dışişleri Bakanı). Dış politika Almanya'da federal devletin (Bund) yetkisindedir, bu yüzden hiçbir eyaletin dışişleri bakanı yoktur. Maliye, adalet ve içişleri bakanlıkları ise her eyalet hükümetinde bulunur."},{"id":"BY01","n":1,"scope":"BY","cat":"land","q":"Welches Wappen gehört zum Freistaat Bayern?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":1,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/0/0f/Lesser_coat_of_arms_of_Baden-W%C3%BCrttemberg.svg","https://upload.wikimedia.org/wikipedia/commons/d/d5/Coat_of_arms_of_Bavaria.svg","https://upload.wikimedia.org/wikipedia/commons/5/53/Wappen_Sachsen-Anhalt.svg","https://upload.wikimedia.org/wikipedia/commons/7/74/Coat_of_arms_of_Mecklenburg-Western_Pomerania_%28great%29.svg"],"note":"Bild 1 = Wappen Baden-Württemberg; Bild 2 = Wappen Bayern; Bild 3 = Wappen Sachsen-Anhalt; Bild 4 = Wappen Mecklenburg-Vorpommern. Reihenfolge wie im amtlichen Katalog (BAMF-Online-Fragenkatalog, 31.10.2026); Commons-Dateien der amtlichen Landeswappen."},"tq":"Hangi arma (Wappen) Bayern Özgür Devleti'ne (Freistaat Bayern) aittir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 2'dir. Bayern arması dörde bölünmüş bir kalkandır: altın aslan, kırmızı-beyaz 'Franken tırmığı', mavi panter ve üç siyah aslan; ortasında beyaz-mavi baklava desenli küçük bir kalkan vardır ve iki aslan kalkanı tutar. Beyaz-mavi baklavalar Bayern'in simgesidir."},{"id":"BY02","n":2,"scope":"BY","cat":"land","q":"Welches ist ein Landkreis in Bayern?","a":["Prignitz","Rhein-Sieg-Kreis","Nordfriesland","Altötting"],"c":3,"img":null,"tq":"Hangisi Bayern'de bir ilçedir (Landkreis)?","ta":["Prignitz","Rhein-Sieg-Kreis","Nordfriesland","Altötting"],"exp":"Doğru cevap Altötting'dir. Altötting, Bayern'in güneydoğusunda, Avusturya sınırına yakın bir ilçedir (Landkreis) ve ünlü bir hac yeridir. Prignitz Brandenburg'da, Rhein-Sieg-Kreis Nordrhein-Westfalen'de, Nordfriesland ise Schleswig-Holstein'dadır."},{"id":"BY03","n":3,"scope":"BY","cat":"land","q":"Für wie viele Jahre wird der Landtag in Bayern gewählt?","a":["3","4","5","6"],"c":2,"img":null,"tq":"Bayern'de Landtag (Eyalet Meclisi) kaç yıl için seçilir?","ta":["3","4","5","6"],"exp":"Doğru cevap 5'tir. Bayern Landtag'ı (Eyalet Meclisi) München'de toplanır ve 5 yıl için seçilir. Bremen dışındaki tüm eyaletlerde seçim dönemi 5 yıldır; yalnızca Bremen'de 4 yıldır."},{"id":"BY04","n":4,"scope":"BY","cat":"land","q":"Ab welchem Alter darf man in Bayern bei Kommunalwahlen wählen?","a":["14","16","18","20"],"c":2,"img":null,"tq":"Bayern'de yerel seçimlerde (Kommunalwahlen) kaç yaşından itibaren oy kullanılabilir?","ta":["14","16","18","20"],"exp":"Doğru cevap 18'dir. Bayern, yerel seçimlerde (Kommunalwahlen) oy kullanma yaşını 18 olarak koruyan az sayıdaki eyaletten biridir; Hessen ve Sachsen'de de 18'dir. Birçok başka eyalette ise yerel seçimlerde 16 yaş yeterlidir."},{"id":"BY05","n":5,"scope":"BY","cat":"land","q":"Welche Farben hat die Landesflagge von Bayern?","a":["blau-weiß-rot","weiß-blau","grün-weiß-rot","schwarz-gelb"],"c":1,"img":null,"tq":"Bayern eyalet bayrağı (Landesflagge) hangi renklerdedir?","ta":["mavi-beyaz-kırmızı","beyaz-mavi","yeşil-beyaz-kırmızı","siyah-sarı"],"exp":"Doğru cevap beyaz-mavidir. Bayern bayrağı beyaz ve mavi renklerdedir: ya iki yatay şerit (üstte beyaz, altta mavi) ya da beyaz-mavi baklava deseni (Rautenflagge) biçimindedir. Renkler armanın ortasındaki baklava desenli kalkandan gelir."},{"id":"BY06","n":6,"scope":"BY","cat":"land","q":"Wo können Sie sich in Bayern über politische Themen informieren?","a":["beim Ordnungsamt der Gemeinde","bei der Landeszentrale für politische Bildung","bei der Verbraucherzentrale","bei den Kirchen"],"c":1,"img":null,"tq":"Bayern'de siyasi konular hakkında nereden bilgi alabilirsiniz?","ta":["belediyenin Ordnungsamt'ından (kamu düzeni dairesi)","Landeszentrale für politische Bildung'dan (Eyalet Siyasi Eğitim Merkezi)","Verbraucherzentrale'den (tüketici danışma merkezi)","kiliselerden"],"exp":"Doğru cevap Landeszentrale für politische Bildung'dur (Eyalet Siyasi Eğitim Merkezi). Her eyaletin böyle bir merkezi vardır; Bayern'dekinin adı Bayerische Landeszentrale für politische Bildungsarbeit olup siyaset ve demokrasi konularında tarafsız bilgi sunar."},{"id":"BY07","n":7,"scope":"BY","cat":"land","q":"Die Landeshauptstadt von Bayern heißt …","a":["Ingolstadt.","Regensburg.","Nürnberg.","München."],"c":3,"img":null,"tq":"Bayern'in eyalet başkentinin (Landeshauptstadt) adı …","ta":["Ingolstadt'tır.","Regensburg'dur.","Nürnberg'dir.","München'dir."],"exp":"Doğru cevap München'dir. München, Bayern'in eyalet başkenti (Landeshauptstadt) ve Almanya'nın üçüncü büyük şehridir; Landtag ve eyalet hükümeti burada bulunur. Nürnberg Bayern'in ikinci büyük şehridir, ancak başkent değildir."},{"id":"BY08","n":8,"scope":"BY","cat":"land","q":"Welches Bundesland ist Bayern?","a":["1","2","3","4"],"c":3,"img":{"kind":"question","urls":[],"note":"Deutschlandkarte, auf der vier Bundeslaender mit den Ziffern 1-4 markiert sind; eines davon ist Bayern. Kein freies Ersatzbild mit identischer Nummerierung."},"tq":"Haritada hangi eyalet (Bundesland) Bayern'dir?","ta":["1","2","3","4"],"exp":"Doğru cevap 4'tür. Sınav haritasında Bayern 4 numarayla gösterilir. Bayern, Almanya'nın güneydoğusunda yer alır ve yüzölçümü bakımından en büyük eyalettir; güneyde Avusturya, doğuda Çekya ile komşudur."},{"id":"BY09","n":9,"scope":"BY","cat":"land","q":"Wie nennt man die Regierungschefin/den Regierungschef in Bayern?","a":["Erste Ministerin/Erster Minister","Premierministerin/Premierminister","Bürgermeisterin/Bürgermeister","Ministerpräsidentin/Ministerpräsident"],"c":3,"img":null,"tq":"Bayern'de hükümet başkanına ne ad verilir?","ta":["Erste Ministerin/Erster Minister (Birinci Bakan)","Premierministerin/Premierminister (Başbakan)","Bürgermeisterin/Bürgermeister (Belediye Başkanı)","Ministerpräsidentin/Ministerpräsident (Eyalet Başbakanı)"],"exp":"Doğru cevap Ministerpräsidentin/Ministerpräsident'tir (Eyalet Başbakanı). Bayern'de hükümet başkanı Landtag tarafından seçilir ve Bayerische Staatsregierung'u (Bayern Eyalet Hükümeti) yönetir. Diğer alan eyaletlerinde de aynı unvan kullanılır."},{"id":"BY10","n":10,"scope":"BY","cat":"land","q":"Welche Ministerin/welchen Minister hat Bayern nicht?","a":["Justizministerin/Justizminister","Außenministerin/Außenminister","Finanzministerin/Finanzminister","Innenministerin/Innenminister"],"c":1,"img":null,"tq":"Bayern'in hangi bakanı yoktur?","ta":["Justizministerin/Justizminister (Adalet Bakanı)","Außenministerin/Außenminister (Dışişleri Bakanı)","Finanzministerin/Finanzminister (Maliye Bakanı)","Innenministerin/Innenminister (İçişleri Bakanı)"],"exp":"Doğru cevap Außenministerin/Außenminister'dir (Dışişleri Bakanı). Dış politika federal devletin (Bund) görevidir; bu nedenle ne Bayern'in ne de başka bir eyaletin dışişleri bakanı vardır. Adalet, maliye ve içişleri bakanlıkları ise eyalet hükümetinde bulunur."},{"id":"BE01","n":1,"scope":"BE","cat":"land","q":"Welches Wappen gehört zum Bundesland Berlin?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":3,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/5/5d/DEU_Hamburg_COA.svg","https://upload.wikimedia.org/wikipedia/commons/6/64/Bremen_Wappen%28Mittel%29.svg","https://upload.wikimedia.org/wikipedia/commons/c/cd/Coat_of_arms_of_Hesse.svg","https://upload.wikimedia.org/wikipedia/commons/8/8c/DEU_Berlin_COA.svg"],"note":"Bild 1 = Wappen Hamburg; Bild 2 = Wappen Bremen; Bild 3 = Wappen Hessen; Bild 4 = Wappen Berlin. Reihenfolge wie im amtlichen Katalog (BAMF-Online-Fragenkatalog, 31.10.2026); Commons-Dateien der amtlichen Landeswappen."},"tq":"Hangi arma (Wappen) Berlin eyaletine (Bundesland) aittir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 4'tür. Berlin arması, beyaz zemin üzerinde ayakta duran siyah bir ayı gösterir; kalkanın üstünde altın renkli bir taç vardır. Berlin ayısı (Berliner Bär) şehrin en bilinen simgesidir. Resim 1 Hamburg (beyaz kale), Resim 2 Bremen (gümüş anahtar), Resim 3 Hessen'dir (çizgili aslan)."},{"id":"BE02","n":2,"scope":"BE","cat":"land","q":"Welches ist ein Bezirk von Berlin?","a":["Altona","Prignitz","Pankow","Mecklenburgische Seenplatte"],"c":2,"img":null,"tq":"Hangisi Berlin'in bir ilçesidir (Bezirk)?","ta":["Altona","Prignitz","Pankow","Mecklenburgische Seenplatte"],"exp":"Doğru cevap Pankow'dur. Berlin 12 ilçeye (Bezirk) ayrılır; Pankow bunların en kalabalığıdır ve şehrin kuzeydoğusunda yer alır. Altona Hamburg'un bir ilçesi, Prignitz Brandenburg'da, Mecklenburgische Seenplatte ise Mecklenburg-Vorpommern'de bir ilçedir (Landkreis)."},{"id":"BE03","n":3,"scope":"BE","cat":"land","q":"Für wie viele Jahre wird das Landesparlament in Berlin gewählt?","a":["3","4","5","6"],"c":2,"img":null,"tq":"Berlin'de eyalet parlamentosu (Landesparlament) kaç yıl için seçilir?","ta":["3","4","5","6"],"exp":"Doğru cevap 5'tir. Berlin'in eyalet parlamentosu olan Abgeordnetenhaus (Berlin eyalet meclisi) 5 yıl için seçilir. Bremen dışındaki tüm eyaletlerde seçim dönemi 5 yıldır; yalnızca Bremen'de 4 yıldır."},{"id":"BE04","n":4,"scope":"BE","cat":"land","q":"Ab welchem Alter darf man in Berlin bei Kommunalwahlen (Wahl der Bezirksverordnetenversammlung) wählen?","a":["14","16","18","20"],"c":1,"img":null,"tq":"Berlin'de yerel seçimlerde (Kommunalwahlen – Bezirksverordnetenversammlung, yani ilçe meclisi seçimi) kaç yaşından itibaren oy kullanılabilir?","ta":["14","16","18","20"],"exp":"Doğru cevap 16'dır. Berlin'de ilçe meclisi (Bezirksverordnetenversammlung) seçimlerinde 16 yaşını doldurmuş olanlar oy kullanabilir. Berlin'de bir ilçe, başka eyaletlerdeki bir belediyeye benzer; bu seçim de yerel seçim sayılır."},{"id":"BE05","n":5,"scope":"BE","cat":"land","q":"Welche Farben hat die Landesflagge von Berlin?","a":["blau-weiß-rot","weiß-rot","grün-weiß-rot","schwarz-gold"],"c":1,"img":null,"tq":"Berlin eyalet bayrağı (Landesflagge) hangi renklerdedir?","ta":["mavi-beyaz-kırmızı","beyaz-kırmızı","yeşil-beyaz-kırmızı","siyah-altın sarısı"],"exp":"Doğru cevap beyaz-kırmızıdır. Berlin bayrağı üstte ve altta kırmızı, ortada geniş beyaz bir şeritten oluşur; beyaz şeridin üzerinde siyah Berlin ayısı bulunur. İpucu: Berlin, Hamburg ve Bremen şehir devletlerinin bayrakları hep beyaz-kırmızıdır."},{"id":"BE06","n":6,"scope":"BE","cat":"land","q":"Wo können Sie sich in Berlin über politische Themen informieren?","a":["beim Ordnungsamt der Gemeinde","bei den Kirchen","bei der Verbraucherzentrale","bei der Landeszentrale für politische Bildung"],"c":3,"img":null,"tq":"Berlin'de siyasi konular hakkında nereden bilgi alabilirsiniz?","ta":["belediyenin Ordnungsamt'ından (kamu düzeni dairesi)","kiliselerden","Verbraucherzentrale'den (tüketici danışma merkezi)","Landeszentrale für politische Bildung'dan (Eyalet Siyasi Eğitim Merkezi)"],"exp":"Doğru cevap Landeszentrale für politische Bildung'dur (Eyalet Siyasi Eğitim Merkezi). Berliner Landeszentrale für politische Bildung, siyaset, demokrasi ve tarih konularında tarafsız bilgi, yayın ve etkinlik sunar. Ordnungsamt kamu düzeniyle, Verbraucherzentrale tüketici haklarıyla ilgilenir."},{"id":"BE07","n":7,"scope":"BE","cat":"land","q":"Welches Bundesland ist ein Stadtstaat?","a":["Berlin","Saarland","Brandenburg","Hessen"],"c":0,"img":null,"tq":"Hangi eyalet (Bundesland) bir şehir devletidir (Stadtstaat)?","ta":["Berlin","Saarland","Brandenburg","Hessen"],"exp":"Doğru cevap Berlin'dir. Almanya'da üç şehir devleti (Stadtstaat) vardır: Berlin, Hamburg ve Bremen; bunlarda şehir aynı zamanda bir eyalettir. Saarland, Brandenburg ve Hessen ise birçok şehir ve ilçeden oluşan alan eyaletleridir (Flächenländer)."},{"id":"BE08","n":8,"scope":"BE","cat":"land","q":"Welches Bundesland ist Berlin?","a":["1","2","3","4"],"c":3,"img":{"kind":"question","urls":[],"note":"Deutschlandkarte, auf der vier Bundeslaender mit den Ziffern 1-4 markiert sind; eines davon ist Berlin. Kein freies Ersatzbild mit identischer Nummerierung."},"tq":"Haritada hangi eyalet (Bundesland) Berlin'dir?","ta":["1","2","3","4"],"exp":"Doğru cevap 4'tür. Sınav haritasında Berlin 4 numarayla gösterilir. Berlin, Almanya'nın kuzeydoğusunda küçük bir alan olarak görünür ve her yanından Brandenburg eyaletiyle çevrilidir; Polonya sınırına yaklaşık 70 km uzaklıktadır."},{"id":"BE09","n":9,"scope":"BE","cat":"land","q":"Wie nennt man die Regierungschefin/den Regierungschef des Stadtstaates Berlin?","a":["Ministerpräsidentin/Ministerpräsident","Oberbürgermeisterin/Oberbürgermeister","Präsidentin/Präsident des Senates","Regierende Bürgermeisterin/Regierender Bürgermeister"],"c":3,"img":null,"tq":"Berlin şehir devletinin (Stadtstaat) hükümet başkanına ne ad verilir?","ta":["Ministerpräsidentin/Ministerpräsident (Eyalet Başbakanı)","Oberbürgermeisterin/Oberbürgermeister (Büyükşehir Belediye Başkanı)","Präsidentin/Präsident des Senates (Senato Başkanı)","Regierende Bürgermeisterin/Regierender Bürgermeister (Berlin'in hükümet eden belediye başkanı)"],"exp":"Doğru cevap Regierende Bürgermeisterin/Regierender Bürgermeister'dir (Berlin'in hükümet eden belediye başkanı). Bu unvan Berlin'e özgüdür; Abgeordnetenhaus (Berlin eyalet meclisi) tarafından seçilir ve Senat adlı eyalet hükümetini yönetir. Hamburg'da Erster Bürgermeister, Bremen'de Präsident des Senats denir."},{"id":"BE10","n":10,"scope":"BE","cat":"land","q":"Welche Senatorin/welchen Senator hat Berlin nicht?","a":["Finanzsenatorin/Finanzsenator","Innensenatorin/Innensenator","Senatorin/Senator für Außenbeziehungen","Justizsenatorin/Justizsenator"],"c":2,"img":null,"tq":"Berlin'in hangi senatörü (Senator/in – eyalet bakanı) yoktur?","ta":["Finanzsenatorin/Finanzsenator (Maliye Senatörü)","Innensenatorin/Innensenator (İçişleri Senatörü)","Senatorin/Senator für Außenbeziehungen (Dış İlişkiler Senatörü)","Justizsenatorin/Justizsenator (Adalet Senatörü)"],"exp":"Doğru cevap Senatorin/Senator für Außenbeziehungen'dir (Dış İlişkiler Senatörü). Berlin'de eyalet bakanlarına Senator denir; dış politika ise federal devletin (Bund) yetkisinde olduğundan hiçbir eyaletin dış ilişkiler bakanı yoktur. Maliye, içişleri ve adalet senatörleri Berlin Senatı'nda bulunur."},{"id":"BB01","n":1,"scope":"BB","cat":"land","q":"Welches Wappen gehört zum Bundesland Brandenburg?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":0,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/a/a2/DEU_Brandenburg_COA.svg","https://upload.wikimedia.org/wikipedia/commons/8/89/Coat_of_arms_of_Rhineland-Palatinate.svg","https://upload.wikimedia.org/wikipedia/commons/8/8e/Wappen_des_Saarlands.svg","https://upload.wikimedia.org/wikipedia/commons/0/0f/Lesser_coat_of_arms_of_Baden-W%C3%BCrttemberg.svg"],"note":"Bild 1 = Wappen Brandenburg; Bild 2 = Wappen Rheinland-Pfalz; Bild 3 = Wappen Saarland; Bild 4 = Wappen Baden-Württemberg. Reihenfolge wie im amtlichen Katalog (BAMF-Online-Fragenkatalog, 31.10.2026); Commons-Dateien der amtlichen Landeswappen."},"tq":"Hangi arma (Wappen) Brandenburg eyaletine (Bundesland) aittir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 1'dir. Brandenburg arması, beyaz zemin üzerinde kanatları açık kırmızı bir kartal (Roter Adler) gösterir; kanatlarında altın renkli yonca sapları vardır. Resim 2 Rheinland-Pfalz (haç, tekerlek ve aslan), Resim 3 Saarland (dört parçalı kalkan), Resim 4 Baden-Württemberg'dir (üç siyah aslan)."},{"id":"BB02","n":2,"scope":"BB","cat":"land","q":"Welches ist ein Landkreis in Brandenburg?","a":["Prignitz","Rhein-Sieg-Kreis","Vogtlandkreis","Amberg-Sulzbach"],"c":0,"img":null,"tq":"Hangisi Brandenburg'da bir ilçedir (Landkreis)?","ta":["Prignitz","Rhein-Sieg-Kreis","Vogtlandkreis","Amberg-Sulzbach"],"exp":"Doğru cevap Prignitz'dir. Prignitz, Brandenburg'un kuzeybatısında, Elbe nehri kıyısında yer alan bir ilçedir (Landkreis). Rhein-Sieg-Kreis Nordrhein-Westfalen'de, Vogtlandkreis Sachsen'de, Amberg-Sulzbach ise Bayern'dedir."},{"id":"BB03","n":3,"scope":"BB","cat":"land","q":"Für wie viele Jahre wird der Landtag in Brandenburg gewählt?","a":["3","4","5","6"],"c":2,"img":null,"tq":"Brandenburg'da Landtag (Eyalet Meclisi) kaç yıl için seçilir?","ta":["3","4","5","6"],"exp":"Doğru cevap 5'tir. Brandenburg Landtag'ı (Eyalet Meclisi) Potsdam'da toplanır ve 5 yıl için seçilir. Bremen dışındaki tüm eyaletlerde seçim dönemi 5 yıldır; yalnızca Bremen'de 4 yıldır."},{"id":"BB04","n":4,"scope":"BB","cat":"land","q":"Ab welchem Alter darf man in Brandenburg bei Kommunalwahlen wählen?","a":["14","16","18","20"],"c":1,"img":null,"tq":"Brandenburg'da yerel seçimlerde (Kommunalwahlen) kaç yaşından itibaren oy kullanılabilir?","ta":["14","16","18","20"],"exp":"Doğru cevap 16'dır. Brandenburg'da belediye ve ilçe meclisi seçimlerinde (Kommunalwahlen) 16 yaşını doldurmuş olanlar oy kullanabilir. Brandenburg ayrıca Landtag seçimlerinde de 16 yaş kuralını uygulayan eyaletlerden biridir."},{"id":"BB05","n":5,"scope":"BB","cat":"land","q":"Welche Farben hat die Landesflagge von Brandenburg?","a":["blau-weiß-rot","rot-weiß","grün-weiß-rot","schwarz-gelb"],"c":1,"img":null,"tq":"Brandenburg eyalet bayrağı (Landesflagge) hangi renklerdedir?","ta":["mavi-beyaz-kırmızı","kırmızı-beyaz","yeşil-beyaz-kırmızı","siyah-sarı"],"exp":"Doğru cevap kırmızı-beyazdır. Brandenburg bayrağı üstte kırmızı, altta beyaz iki yatay şeritten oluşur ve ortasında armadaki kırmızı kartal bulunur. Renkler armadan gelir: beyaz zemin, kırmızı kartal."},{"id":"BB06","n":6,"scope":"BB","cat":"land","q":"Wo können Sie sich in Brandenburg über politische Themen informieren?","a":["bei den Kirchen","beim Ordnungsamt der Gemeinde","bei der Landeszentrale für politische Bildung","bei der Verbraucherzentrale"],"c":2,"img":null,"tq":"Brandenburg'da siyasi konular hakkında nereden bilgi alabilirsiniz?","ta":["kiliselerden","belediyenin Ordnungsamt'ından (kamu düzeni dairesi)","Landeszentrale für politische Bildung'dan (Eyalet Siyasi Eğitim Merkezi)","Verbraucherzentrale'den (tüketici danışma merkezi)"],"exp":"Doğru cevap Landeszentrale für politische Bildung'dur (Eyalet Siyasi Eğitim Merkezi). Brandenburgische Landeszentrale für politische Bildung, Potsdam'da bulunur ve siyaset, demokrasi ve tarih konularında tarafsız bilgi sunar. Ordnungsamt ve Verbraucherzentrale'nin görevleri farklıdır."},{"id":"BB07","n":7,"scope":"BB","cat":"land","q":"Die Landeshauptstadt von Brandenburg heißt …","a":["Potsdam.","Cottbus.","Brandenburg.","Frankfurt/Oder."],"c":0,"img":null,"tq":"Brandenburg'un eyalet başkentinin (Landeshauptstadt) adı …","ta":["Potsdam'dır.","Cottbus'tur.","Brandenburg'dur.","Frankfurt/Oder'dir."],"exp":"Doğru cevap Potsdam'dır. Potsdam, Brandenburg'un eyalet başkenti (Landeshauptstadt) ve en büyük şehridir; Berlin'in hemen güneybatısında yer alır ve Sanssouci Sarayı ile ünlüdür. Brandenburg an der Havel şehri eyalete adını vermiştir, ancak başkent değildir."},{"id":"BB08","n":8,"scope":"BB","cat":"land","q":"Welches Bundesland ist Brandenburg?","a":["1","2","3","4"],"c":3,"img":{"kind":"question","urls":[],"note":"Deutschlandkarte, auf der vier Bundeslaender mit den Ziffern 1-4 markiert sind; eines davon ist Brandenburg. Kein freies Ersatzbild mit identischer Nummerierung."},"tq":"Haritada hangi eyalet (Bundesland) Brandenburg'dur?","ta":["1","2","3","4"],"exp":"Doğru cevap 4'tür. Sınav haritasında Brandenburg 4 numarayla gösterilir. Brandenburg, Almanya'nın kuzeydoğusunda yer alır, Berlin'i her yanından çevreler ve doğuda Polonya ile sınır komşusudur; haritada ortasındaki küçük Berlin alanından kolayca tanınır."},{"id":"BB09","n":9,"scope":"BB","cat":"land","q":"Wie nennt man die Regierungschefin/den Regierungschef in Brandenburg?","a":["Erste Ministerin/Erster Minister","Premierministerin/Premierminister","Bürgermeisterin/Bürgermeister","Ministerpräsidentin/Ministerpräsident"],"c":3,"img":null,"tq":"Brandenburg'da hükümet başkanına ne ad verilir?","ta":["Erste Ministerin/Erster Minister (Birinci Bakan)","Premierministerin/Premierminister (Başbakan)","Bürgermeisterin/Bürgermeister (Belediye Başkanı)","Ministerpräsidentin/Ministerpräsident (Eyalet Başbakanı)"],"exp":"Doğru cevap Ministerpräsidentin/Ministerpräsident'tir (Eyalet Başbakanı). Brandenburg bir alan eyaletidir (Flächenland); hükümet başkanı Landtag (Eyalet Meclisi) tarafından seçilir ve eyalet hükümetini yönetir. Belediye başkanı ise bir eyaleti değil, bir şehri veya belediyeyi yönetir."},{"id":"BB10","n":10,"scope":"BB","cat":"land","q":"Welche Ministerin/welchen Minister hat Brandenburg nicht?","a":["Justizministerin/Justizminister","Außenministerin/Außenminister","Finanzministerin/Finanzminister","Innenministerin/Innenminister"],"c":1,"img":null,"tq":"Brandenburg'un hangi bakanı yoktur?","ta":["Justizministerin/Justizminister (Adalet Bakanı)","Außenministerin/Außenminister (Dışişleri Bakanı)","Finanzministerin/Finanzminister (Maliye Bakanı)","Innenministerin/Innenminister (İçişleri Bakanı)"],"exp":"Doğru cevap Außenministerin/Außenminister'dir (Dışişleri Bakanı). Dış politika Almanya'da federal devletin (Bund) yetkisindedir; bu yüzden hiçbir eyaletin dışişleri bakanı yoktur. Adalet, maliye ve içişleri bakanlıkları ise her eyalet hükümetinde bulunur."},{"id":"HB01","n":1,"scope":"HB","cat":"land","q":"Welches Wappen gehört zur Freien Hansestadt Bremen?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":2,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/6/60/Coat_of_arms_of_Schleswig-Holstein.svg","https://upload.wikimedia.org/wikipedia/commons/0/0f/Lesser_coat_of_arms_of_Baden-W%C3%BCrttemberg.svg","https://upload.wikimedia.org/wikipedia/commons/6/64/Bremen_Wappen%28Mittel%29.svg","https://upload.wikimedia.org/wikipedia/commons/d/d5/Coat_of_arms_of_Bavaria.svg"],"note":"Bild 1 = Wappen Schleswig-Holstein; Bild 2 = Wappen Baden-Württemberg; Bild 3 = Wappen Bremen; Bild 4 = Wappen Bayern. Reihenfolge wie im amtlichen Katalog (BAMF-Online-Fragenkatalog, 31.10.2026); Commons-Dateien der amtlichen Landeswappen."},"tq":"Hangi arma (Wappen) Özgür Hansa Şehri Bremen'e (Freie Hansestadt Bremen) aittir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 3'tür. Bremen arması, kırmızı zemin üzerinde çapraz duran gümüş (beyaz) bir anahtar gösterir; kalkanın üstünde altın bir taç vardır. Bu anahtar, şehrin koruyucusu Aziz Petrus'un anahtarıdır. Resim 1 Schleswig-Holstein, Resim 2 Baden-Württemberg, Resim 4 Bayern'dir."},{"id":"HB02","n":2,"scope":"HB","cat":"land","q":"Welches ist ein Stadtteil von Bremen?","a":["Altona","Hemelingen","Pankow","Babelsberg"],"c":1,"img":null,"tq":"Hangisi Bremen'in bir semtidir (Stadtteil)?","ta":["Altona","Hemelingen","Pankow","Babelsberg"],"exp":"Doğru cevap Hemelingen'dir. Hemelingen, Bremen şehrinin doğusunda, Weser nehri kıyısında bir semttir (Stadtteil). Altona Hamburg'un, Pankow Berlin'in bir ilçesidir; Babelsberg ise Potsdam'ın film stüdyolarıyla ünlü bir semtidir."},{"id":"HB03","n":3,"scope":"HB","cat":"land","q":"Für wie viele Jahre wird das Landesparlament in Bremen gewählt?","a":["3","4","5","6"],"c":1,"img":null,"tq":"Bremen'de eyalet parlamentosu (Landesparlament) kaç yıl için seçilir?","ta":["3","4","5","6"],"exp":"Doğru cevap 4'tür. Bremen'in eyalet parlamentosu olan Bremische Bürgerschaft (Bremen eyalet meclisi) 4 yıl için seçilir. Bremen, seçim dönemi 4 yıl olan tek eyalettir; diğer 15 eyalette parlamento 5 yıllığına seçilir."},{"id":"HB04","n":4,"scope":"HB","cat":"land","q":"Ab welchem Alter darf man in Bremen bei den Wahlen zur Bürgerschaft (Landtag) wählen?","a":["14","16","18","20"],"c":1,"img":null,"tq":"Bremen'de Bürgerschaft (Bremen eyalet meclisi, Landtag) seçimlerinde kaç yaşından itibaren oy kullanılabilir?","ta":["14","16","18","20"],"exp":"Doğru cevap 16'dır. Bremen'de Bürgerschaft (eyalet meclisi) seçimlerinde 16 yaşını doldurmuş olanlar oy kullanabilir. Bremen, 2009'da eyalet seçimlerinde oy yaşını 16'ya indiren ilk Alman eyaleti olmuştur."},{"id":"HB05","n":5,"scope":"HB","cat":"land","q":"Welche Farben hat die Landesflagge von Bremen?","a":["blau-weiß-rot","rot-weiß","grün-weiß-rot","schwarz-gold"],"c":1,"img":null,"tq":"Bremen eyalet bayrağı (Landesflagge) hangi renklerdedir?","ta":["mavi-beyaz-kırmızı","kırmızı-beyaz","yeşil-beyaz-kırmızı","siyah-altın sarısı"],"exp":"Doğru cevap kırmızı-beyazdır. Bremen bayrağı en az sekiz kırmızı-beyaz yatay şeritten oluşur ve gönder tarafında kırmızı-beyaz damalı bir desen vardır; halk arasında 'Speckflagge' (pastırma bayrağı) olarak anılır. Renkler armadan gelir: kırmızı zemin, beyaz anahtar."},{"id":"HB06","n":6,"scope":"HB","cat":"land","q":"Wo können Sie sich in Bremen über politische Themen informieren?","a":["beim Ordnungsamt der Gemeinde","bei der Landeszentrale für politische Bildung","bei den Kirchen","bei der Verbraucherzentrale"],"c":1,"img":null,"tq":"Bremen'de siyasi konular hakkında nereden bilgi alabilirsiniz?","ta":["belediyenin Ordnungsamt'ından (kamu düzeni dairesi)","Landeszentrale für politische Bildung'dan (Eyalet Siyasi Eğitim Merkezi)","kiliselerden","Verbraucherzentrale'den (tüketici danışma merkezi)"],"exp":"Doğru cevap Landeszentrale für politische Bildung'dur (Eyalet Siyasi Eğitim Merkezi). Bremen'in bu merkezi siyaset, demokrasi ve tarih konularında tarafsız bilgi, yayın ve etkinlik sunar. Ordnungsamt kamu düzeniyle, Verbraucherzentrale tüketici haklarıyla ilgilenir."},{"id":"HB07","n":7,"scope":"HB","cat":"land","q":"Was ist ein deutscher Stadtstaat?","a":["Bremen","München","Frankfurt","Erfurt"],"c":0,"img":null,"tq":"Hangisi bir Alman şehir devletidir (Stadtstaat)?","ta":["Bremen","München","Frankfurt","Erfurt"],"exp":"Doğru cevap Bremen'dir. Almanya'da üç şehir devleti (Stadtstaat) vardır: Berlin, Hamburg ve Bremen; Bremen eyaleti Bremen ve Bremerhaven şehirlerinden oluşur. München Bayern'in, Erfurt Thüringen'in başkentidir, Frankfurt ise Hessen'de bir şehirdir; hiçbiri kendi başına eyalet değildir."},{"id":"HB08","n":8,"scope":"HB","cat":"land","q":"Welches Bundesland ist Bremen?","a":["1","2","3","4"],"c":0,"img":{"kind":"question","urls":[],"note":"Deutschlandkarte, auf der vier Bundeslaender mit den Ziffern 1-4 markiert sind; eines davon ist Bremen. Kein freies Ersatzbild mit identischer Nummerierung."},"tq":"Haritada hangi eyalet (Bundesland) Bremen'dir?","ta":["1","2","3","4"],"exp":"Doğru cevap 1'dir. Sınav haritasında Bremen 1 numarayla gösterilir. Bremen, Almanya'nın kuzeybatısında, Niedersachsen eyaletinin içinde iki küçük alan olarak görünür: Bremen şehri ve Kuzey Denizi kıyısındaki Bremerhaven. En küçük Alman eyaletidir."},{"id":"HB09","n":9,"scope":"HB","cat":"land","q":"Wie nennt man die Regierungschefin/den Regierungschef des Stadtstaates Bremen?","a":["Ministerpräsidentin/Ministerpräsident","Erste Bürgermeisterin/Erster Bürgermeister","Präsidentin/Präsident des Senates","Regierende Bürgermeisterin/Regierender Bürgermeister"],"c":2,"img":null,"tq":"Bremen şehir devletinin (Stadtstaat) hükümet başkanına ne ad verilir?","ta":["Ministerpräsidentin/Ministerpräsident (Eyalet Başbakanı)","Erste Bürgermeisterin/Erster Bürgermeister (Birinci Belediye Başkanı)","Präsidentin/Präsident des Senates (Senato Başkanı)","Regierende Bürgermeisterin/Regierender Bürgermeister (Berlin'in hükümet eden belediye başkanı)"],"exp":"Doğru cevap Präsidentin/Präsident des Senates'tir (Senato Başkanı). Bremen'de eyalet hükümetine Senat denir; hükümet başkanı Senat'ın başkanıdır ve aynı zamanda Bürgermeister unvanını taşır. Erster Bürgermeister Hamburg'un, Regierender Bürgermeister Berlin'in hükümet başkanıdır."},{"id":"HB10","n":10,"scope":"HB","cat":"land","q":"Welche Senatorin/welchen Senator hat Bremen nicht?","a":["Senatorin/Senator für Außenbeziehungen","Finanzsenatorin/Finanzsenator","Justizsenatorin/Justizsenator","Innensenatorin/Innensenator"],"c":0,"img":null,"tq":"Bremen'in hangi senatörü (Senator/in – eyalet bakanı) yoktur?","ta":["Senatorin/Senator für Außenbeziehungen (Dış İlişkiler Senatörü)","Finanzsenatorin/Finanzsenator (Maliye Senatörü)","Justizsenatorin/Justizsenator (Adalet Senatörü)","Innensenatorin/Innensenator (İçişleri Senatörü)"],"exp":"Doğru cevap Senatorin/Senator für Außenbeziehungen'dir (Dış İlişkiler Senatörü). Bremen'de eyalet bakanlarına Senator denir; dış politika federal devletin (Bund) yetkisinde olduğundan hiçbir eyaletin dış ilişkiler bakanı yoktur. Maliye, adalet ve içişleri senatörleri Bremen Senatı'nda bulunur."},{"id":"HH01","n":1,"scope":"HH","cat":"land","q":"Welches Wappen gehört zur Freien und Hansestadt Hamburg?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":1,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/0/0b/Coat_of_arms_of_Lower_Saxony.svg","https://upload.wikimedia.org/wikipedia/commons/5/5d/DEU_Hamburg_COA.svg","https://upload.wikimedia.org/wikipedia/commons/1/1b/Coat_of_arms_of_North_Rhine-Westphalia.svg","https://upload.wikimedia.org/wikipedia/commons/5/53/Wappen_Sachsen-Anhalt.svg"],"note":"Bild 1 = Wappen Niedersachsen; Bild 2 = Wappen Hamburg; Bild 3 = Wappen Nordrhein-Westfalen; Bild 4 = Wappen Sachsen-Anhalt. Reihenfolge wie im amtlichen Katalog (BAMF-Online-Fragenkatalog, 31.10.2026); Commons-Dateien der amtlichen Landeswappen."},"tq":"Hangi arma (Wappen) Özgür ve Hansa Şehri Hamburg'a (Freie und Hansestadt Hamburg) aittir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 2'dir. Hamburg arması, kırmızı zemin üzerinde üç kuleli beyaz bir kale (Burg) gösterir; kapısı kapalıdır ve yan kulelerin üstünde yıldızlar vardır. Resim 1 Niedersachsen (beyaz at), Resim 3 Nordrhein-Westfalen (nehir, at ve gül), Resim 4 Sachsen-Anhalt'tır."},{"id":"HH02","n":2,"scope":"HH","cat":"land","q":"Welches ist ein Bezirk von Hamburg?","a":["Altona","Hemelingen","Pankow","Mecklenburgische Seenplatte"],"c":0,"img":null,"tq":"Hangisi Hamburg'un bir ilçesidir (Bezirk)?","ta":["Altona","Hemelingen","Pankow","Mecklenburgische Seenplatte"],"exp":"Doğru cevap Altona'dır. Hamburg 7 ilçeye (Bezirk) ayrılır; Altona şehrin batısında, Elbe nehri kıyısında yer alır ve eskiden ayrı bir şehirdi. Hemelingen Bremen'in bir semti, Pankow Berlin'in bir ilçesi, Mecklenburgische Seenplatte ise Mecklenburg-Vorpommern'de bir Landkreis'tır."},{"id":"HH03" i dairesi)","Verbraucherzentrale'den (tüketici danışma merkezi)","kiliselerden","Landeszentrale für politische Bildung'dan (Eyalet Siyasi Eğitim Merkezi)"],"exp":"Doğru cevap Landeszentrale für politische Bildung'dur (Eyalet Siyasi Eğitim Merkezi). Hamburg'un bu merkezi siyaset, demokrasi ve tarih konularında tarafsız bilgi, yayın ve etkinlik sunar. Ordnungsamt kamu düzeniyle, Verbraucherzentrale tüketici haklarıyla ilgilenir."},{"id":"HH07","n":7,"scope":"HH","cat":"land","q":"Welches Bundesland ist ein Stadtstaat?","a":["Hamburg","Sachsen","Bayern","Thüringen"],"c":0,"img":null,"tq":"Hangi eyalet (Bundesland) bir şehir devletidir (Stadtstaat)?","ta":["Hamburg","Sachsen","Bayern","Thüringen"],"exp":"Doğru cevap Hamburg'dur. Almanya'da üç şehir devleti (Stadtstaat) vardır: Berlin, Hamburg ve Bremen; bunlarda şehir aynı zamanda bir eyalettir. Sachsen, Bayern ve Thüringen ise birçok şehir ve ilçeden oluşan alan eyaletleridir (Flächenländer)."},{"id":"HH08","n":8,"scope":"HH","cat":"land","q":"Welches Bundesland ist Hamburg?","a":["1","2","3","4"],"c":2,"img":{"kind":"question","urls":[],"note":"Deutschlandkarte, auf der vier Bundeslaender mit den Ziffern 1-4 markiert sind; eines davon ist Hamburg. Kein freies Ersatzbild mit identischer Nummerierung."},"tq":"Haritada hangi eyalet (Bundesland) Hamburg'dur?","ta":["1","2","3","4"],"exp":"Doğru cevap 3'tür. Sınav haritasında Hamburg 3 numarayla gösterilir. Hamburg, Almanya'nın kuzeyinde, Elbe nehri üzerinde küçük bir alan olarak görünür; kuzeyde Schleswig-Holstein, güneyde Niedersachsen ile çevrilidir. Almanya'nın ikinci büyük şehridir."},{"id":"HH09","n":9,"scope":"HH","cat":"land","q":"Wie nennt man die Regierungschefin/den Regierungschef des Stadtstaates Hamburg?","a":["Ministerpräsidentin/Ministerpräsident","Erste Bürgermeisterin/Erster Bürgermeister","Regierende Senatorin/Regierender Senator","Oberbürgermeisterin/Oberbürgermeister"],"c":1,"img":null,"tq":"Hamburg şehir devletinin (Stadtstaat) hükümet başkanına ne ad verilir?","ta":["Ministerpräsidentin/Ministerpräsident (Eyalet Başbakanı)","Erste Bürgermeisterin/Erster Bürgermeister (Birinci Belediye Başkanı)","Regierende Senatorin/Regierender Senator (Hükümet Eden Senatör)","Oberbürgermeisterin/Oberbürgermeister (Büyükşehir Belediye Başkanı)"],"exp":"Doğru cevap Erste Bürgermeisterin/Erster Bürgermeister'dir (Birinci Belediye Başkanı). Hamburg'da hükümet başkanı Bürgerschaft (Hamburg eyalet meclisi) tarafından seçilir ve Senat adlı eyalet hükümetini yönetir. Berlin'de Regierender Bürgermeister, Bremen'de Präsident des Senats denir."},{"id":"HH10","n":10,"scope":"HH","cat":"land","q":"Welche Senatorin/welchen Senator hat Hamburg nicht?","a":["Justizsenatorin/Justizsenator","Senatorin/Senator für Außenbeziehungen","Finanzsenatorin/Finanzsenator","Innensenatorin/Innensenator"],"c":1,"img":null,"tq":"Hamburg'un hangi senatörü (Senator/in – eyalet bakanı) yoktur?","ta":["Justizsenatorin/Justizsenator (Adalet Senatörü)","Senatorin/Senator für Außenbeziehungen (Dış İlişkiler Senatörü)","Finanzsenatorin/Finanzsenator (Maliye Senatörü)","Innensenatorin/Innensenator (İçişleri Senatörü)"],"exp":"Doğru cevap Senatorin/Senator für Außenbeziehungen'dir (Dış İlişkiler Senatörü). Hamburg'da eyalet bakanlarına Senator denir; dış politika federal devletin (Bund) yetkisinde olduğundan hiçbir eyaletin dış ilişkiler bakanı yoktur. Adalet, maliye ve içişleri senatörleri Hamburg Senatı'nda bulunur."},{"id":"HE01","n":1,"scope":"HE","cat":"land","q":"Welches Wappen gehört zum Bundesland Hessen?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":0,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/c/cd/Coat_of_arms_of_Hesse.svg","https://upload.wikimedia.org/wikipedia/commons/8/8c/DEU_Berlin_COA.svg","https://upload.wikimedia.org/wikipedia/commons/6/60/Coat_of_arms_of_Schleswig-Holstein.svg","https://upload.wikimedia.org/wikipedia/commons/5/5f/Coat_of_arms_of_Saxony.svg"],"note":"Bild 1 = Wappen Hessen; Bild 2 = Wappen Berlin; Bild 3 = Wappen Schleswig-Holstein; Bild 4 = Wappen Sachsen. Reihenfolge wie im amtlichen Katalog (BAMF-Online-Fragenkatalog, 31.10.2026); Commons-Dateien der amtlichen Landeswappen."},"tq":"Hangi arma (Wappen) Hessen eyaletine (Bundesland) aittir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 1'dir. Hessen arması, mavi zemin üzerinde kırmızı-beyaz yatay çizgili, şaha kalkmış bir aslan gösterir; kalkanın üstünde yapraklı bir taç vardır. Resim 2 Berlin (siyah ayı), Resim 3 Schleswig-Holstein (iki aslan ve ısırgan yaprağı), Resim 4 Sachsen'dir (siyah-sarı çizgiler üzerinde yeşil çelenk)."},{"id":"HE02","n":2,"scope":"HE","cat":"land","q":"Welches ist ein Landkreis in Hessen?","a":["Ammerland","Altötting","Prignitz","Main-Taunus-Kreis"],"c":3,"img":null,"tq":"Hangisi Hessen'de bir ilçedir (Landkreis)?","ta":["Ammerland","Altötting","Prignitz","Main-Taunus-Kreis"],"exp":"Doğru cevap Main-Taunus-Kreis'tır. Bu ilçe (Landkreis) Frankfurt ile Wiesbaden arasında yer alır; adı Main nehri ile Taunus dağlarından gelir, ikisi de Hessen'dedir. Ammerland Niedersachsen'de, Altötting Bayern'de, Prignitz ise Brandenburg'dadır."},{"id":"HE03","n":3,"scope":"HE","cat":"land","q":"Für wie viele Jahre wird der Landtag in Hessen gewählt?","a":["3","4","5","6"],"c":2,"img":null,"tq":"Hessen'de Landtag (Eyalet Meclisi) kaç yıl için seçilir?","ta":["3","4","5","6"],"exp":"Doğru cevap 5'tir. Hessen Landtag'ı (Eyalet Meclisi) Wiesbaden'de toplanır ve 5 yıl için seçilir. Bremen dışındaki tüm eyaletlerde seçim dönemi 5 yıldır; yalnızca Bremen'de 4 yıldır."},{"id":"HE04","n":4,"scope":"HE","cat":"land","q":"Ab welchem Alter darf man in Hessen bei Kommunalwahlen wählen?","a":["14","16","18","20"],"c":2,"img":null,"tq":"Hessen'de yerel seçimlerde (Kommunalwahlen) kaç yaşından itibaren oy kullanılabilir?","ta":["14","16","18","20"],"exp":"Doğru cevap 18'dir. Hessen, yerel seçimlerde (Kommunalwahlen) oy kullanma yaşını 18 olarak koruyan eyaletlerden biridir; Bayern ve Sachsen'de de 18'dir. Birçok başka eyalette ise yerel seçimlerde 16 yaş yeterlidir."},{"id":"HE05","n":5,"scope":"HE","cat":"land","q":"Welche Farben hat die Landesflagge von Hessen?","a":["blau-weiß-rot","rot-weiß","schwarz-gold","grün-weiß-rot"],"c":1,"img":null,"tq":"Hessen eyalet bayrağı (Landesflagge) hangi renklerdedir?","ta":["mavi-beyaz-kırmızı","kırmızı-beyaz","siyah-altın sarısı","yeşil-beyaz-kırmızı"],"exp":"Doğru cevap kırmızı-beyazdır. Hessen bayrağı üstte kırmızı, altta beyaz iki yatay şeritten oluşur. Renkler armadaki aslanın kırmızı-beyaz çizgilerinden gelir. Dikkat: Bremen ve Brandenburg bayrakları da kırmızı-beyazdır, ancak desenleri farklıdır."},{"id":"HE06","n":6,"scope":"HE","cat":"land","q":"Wo können Sie sich in Hessen über politische Themen informieren?","a":["bei der Landeszentrale für politische Bildung","bei der Verbraucherzentrale","beim Ordnungsamt der Gemeinde","bei den Kirchen"],"c":0,"img":null,"tq":"Hessen'de siyasi konular hakkında nereden bilgi alabilirsiniz?","ta":["Landeszentrale für politische Bildung'dan (Eyalet Siyasi Eğitim Merkezi)","Verbraucherzentrale'den (tüketici danışma merkezi)","belediyenin Ordnungsamt'ından (kamu düzeni dairesi)","kiliselerden"],"exp":"Doğru cevap Landeszentrale für politische Bildung'dur (Eyalet Siyasi Eğitim Merkezi). Hessische Landeszentrale für politische Bildung, Wiesbaden'de bulunur ve siyaset, demokrasi ve tarih konularında tarafsız bilgi sunar. Verbraucherzentrale ve Ordnungsamt'ın görevleri farklıdır."},{"id":"HE07","n":7,"scope":"HE","cat":"land","q":"Die Landeshauptstadt von Hessen heißt …","a":["Kassel.","Darmstadt.","Frankfurt.","Wiesbaden."],"c":3,"img":null,"tq":"Hessen'in eyalet başkentinin (Landeshauptstadt) adı …","ta":["Kassel'dir.","Darmstadt'tır.","Frankfurt'tur.","Wiesbaden'dir."],"exp":"Doğru cevap Wiesbaden'dir. Wiesbaden, Hessen'in eyalet başkentidir (Landeshauptstadt); Landtag ve eyalet hükümeti burada bulunur. Frankfurt am Main eyaletin en büyük şehri ve önemli bir finans merkezidir, ancak başkent değildir; sınavda en sık yapılan hata budur."},{"id":"HE08","n":8,"scope":"HE","cat":"land","q":"Welches Bundesland ist Hessen?","a":["1","2","3","4"],"c":2,"img":{"kind":"question","urls":[],"note":"Deutschlandkarte, auf der vier Bundeslaender mit den Ziffern 1-4 markiert sind; eines davon ist Hessen. Kein freies Ersatzbild mit identischer Nummerierung."},"tq":"Haritada hangi eyalet (Bundesland) Hessen'dir?","ta":["1","2","3","4"],"exp":"Doğru cevap 3'tür. Sınav haritasında Hessen 3 numarayla gösterilir. Hessen, Almanya'nın tam ortasında yer alır ve altı eyaletle komşudur: Nordrhein-Westfalen, Niedersachsen, Thüringen, Bayern, Baden-Württemberg ve Rheinland-Pfalz. Dış ülke sınırı yoktur."},{"id":"HE09","n":9,"scope":"HE","cat":"land","q":"Wie nennt man die Regierungschefin/den Regierungschef in Hessen?","a":["Erste Ministerin/Erster Minister","Premierministerin/Premierminister","Bürgermeisterin/Bürgermeister","Ministerpräsidentin/Ministerpräsident"],"c":3,"img":null,"tq":"Hessen'de hükümet başkanına ne ad verilir?","ta":["Erste Ministerin/Erster Minister (Birinci Bakan)","Premierministerin/Premierminister (Başbakan)","Bürgermeisterin/Bürgermeister (Belediye Başkanı)","Ministerpräsidentin/Ministerpräsident (Eyalet Başbakanı)"],"exp":"Doğru cevap Ministerpräsidentin/Ministerpräsident'tir (Eyalet Başbakanı). Hessen bir alan eyaletidir (Flächenland); hükümet başkanı Landtag (Eyalet Meclisi) tarafından seçilir ve Wiesbaden'deki eyalet hükümetini yönetir. Belediye başkanı ise yalnızca bir şehri yönetir."},{"id":"HE10","n":10,"scope":"HE","cat":"land","q":"Welche Ministerin/welchen Minister hat Hessen nicht?","a":["Justizministerin/Justizminister","Außenministerin/Außenminister","Finanzministerin/Finanzminister","Innenministerin/Innenminister"],"c":1,"img":null,"tq":"Hessen'in hangi bakanı yoktur?","ta":["Justizministerin/Justizminister (Adalet Bakanı)","Außenministerin/Außenminister (Dışişleri Bakanı)","Finanzministerin/Finanzminister (Maliye Bakanı)","Innenministerin/Innenminister (İçişleri Bakanı)"],"exp":"Doğru cevap Außenministerin/Außenminister'dir (Dışişleri Bakanı). Dış politika Almanya'da federal devletin (Bund) yetkisindedir; bu yüzden hiçbir eyaletin dışişleri bakanı yoktur. Adalet, maliye ve içişleri bakanlıkları ise her eyalet hükümetinde bulunur."},{"id":"MV01","n":1,"scope":"MV","cat":"land","q":"Welches Wappen gehört zum Bundesland Mecklenburg-Vorpommern?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":2,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/0/08/Coat_of_arms_of_Thuringia.svg","https://upload.wikimedia.org/wikipedia/commons/a/a2/DEU_Brandenburg_COA.svg","https://upload.wikimedia.org/wikipedia/commons/7/74/Coat_of_arms_of_Mecklenburg-Western_Pomerania_%28great%29.svg","https://upload.wikimedia.org/wikipedia/commons/0/0b/Coat_of_arms_of_Lower_Saxony.svg"],"note":"Bild 1 = Wappen Thüringen; Bild 2 = Wappen Brandenburg; Bild 3 = Wappen Mecklenburg-Vorpommern; Bild 4 = Wappen Niedersachsen. Reihenfolge wie im amtlichen Katalog (BAMF-Online-Fragenkatalog, 31.10.2026); Commons-Dateien der amtlichen Landeswappen."},"tq":"Hangi arma (Wappen) Mecklenburg-Vorpommern eyaletine (Bundesland) aittir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 3'tür. Mecklenburg-Vorpommern arması dörde bölünmüştür: altın zeminde siyah boğa başı (Mecklenburg), beyaz zeminde kırmızı grifon (Vorpommern), kırmızı kartal (Brandenburg) ve tekrar boğa başı. Resim 1 Thüringen, Resim 2 Brandenburg (tek kırmızı kartal), Resim 4 Niedersachsen'dir (beyaz at)."},{"id":"MV02","n":2,"scope":"MV","cat":"land","q":"Welches ist ein Landkreis in Mecklenburg-Vorpommern?","a":["Prignitz","Mecklenburgische Seenplatte","Vogtlandkreis","Rhein-Sieg-Kreis"],"c":1,"img":null,"tq":"Hangisi Mecklenburg-Vorpommern'de bir ilçedir (Landkreis)?","ta":["Prignitz","Mecklenburgische Seenplatte","Vogtlandkreis","Rhein-Sieg-Kreis"],"exp":"Doğru cevap Mecklenburgische Seenplatte'dir. Bu ilçe (Landkreis) Almanya'nın yüzölçümü en büyük ilçesidir ve adını Mecklenburg göller bölgesinden alır; adındaki 'Mecklenburg' ipucudur. Prignitz Brandenburg'da, Vogtlandkreis Sachsen'de, Rhein-Sieg-Kreis ise Nordrhein-Westfalen'dedir."},{"id":"MV03","n":3,"scope":"MV","cat":"land","q":"Für wie viele Jahre wird der Landtag in Mecklenburg-Vorpommern gewählt?","a":["3","4","5","6"],"c":2,"img":null,"tq":"Mecklenburg-Vorpommern'de Landtag (Eyalet Meclisi) kaç yıl için seçilir?","ta":["3","4","5","6"],"exp":"Doğru cevap 5'tir. Mecklenburg-Vorpommern Landtag'ı (Eyalet Meclisi) Schwerin'deki şatoda toplanır ve 5 yıl için seçilir. Bremen dışındaki tüm eyaletlerde seçim dönemi 5 yıldır; yalnızca Bremen'de 4 yıldır."},{"id":"MV04","n":4,"scope":"MV","cat":"land","q":"Ab welchem Alter darf man in Mecklenburg-Vorpommern bei Kommunalwahlen wählen?","a":["14","16","18","20"],"c":1,"img":null,"tq":"Mecklenburg-Vorpommern'de yerel seçimlerde (Kommunalwahlen) kaç yaşından itibaren oy kullanılabilir?","ta":["14","16","18","20"],"exp":"Doğru cevap 16'dır. Mecklenburg-Vorpommern'de belediye ve ilçe meclisi seçimlerinde (Kommunalwahlen) 16 yaşını doldurmuş olanlar oy kullanabilir. Landtag seçimlerinde de bu eyalette oy yaşı 16'dır."},{"id":"MV05","n":5,"scope":"MV","cat":"land","q":"Welche Farben hat die Landesflagge von Mecklenburg-Vorpommern?","a":["schwarz-rot-gold","blau-weiß-gelb-rot","grün-weiß-rot","schwarz-gelb"],"c":1,"img":null,"tq":"Mecklenburg-Vorpommern eyalet bayrağı (Landesflagge) hangi renklerdedir?","ta":["siyah-kırmızı-altın sarısı","mavi-beyaz-sarı-kırmızı","yeşil-beyaz-kırmızı","siyah-sarı"],"exp":"Doğru cevap mavi-beyaz-sarı-kırmızıdır. Mecklenburg-Vorpommern bayrağı, yukarıdan aşağıya mavi, beyaz, sarı ve kırmızı dört yatay şeritten oluşur; bu, dört renkli tek Alman eyalet bayrağıdır. Mavi-sarı-kırmızı Mecklenburg'un, mavi-beyaz Pommern'in eski renkleridir."},{"id":"MV06","n":6,"scope":"MV","cat":"land","q":"Wo können Sie sich in Mecklenburg-Vorpommern über politische Theme 'ı (Eyalet Meclisi) beş yıl için seçilir. Hatırlatma: Bundestag dört yıl için seçilir, Bremen dışındaki tüm eyalet meclisleri ise beş yıl için seçilir."},{"id":"SN04","n":4,"scope":"SN","cat":"land","q":"Ab welchem Alter darf man in Sachsen bei Kommunalwahlen wählen?","a":["14","16","18","20"],"c":2,"img":null,"tq":"Sachsen'de yerel seçimlerde (Kommunalwahlen) kaç yaşından itibaren oy kullanılabilir?","ta":["14","16","18","20"],"exp":"Doğru cevap 18'dir: Sachsen'de yerel seçimlerde (Kommunalwahlen) oy kullanmak için 18 yaşını doldurmuş olmak gerekir; bu eyalet yaş sınırını 16'ya indirmemiştir. Bundestag ve Landtag (Eyalet Meclisi) seçimlerinde de 18 yaş aranır."},{"id":"SN05","n":5,"scope":"SN","cat":"land","q":"Welche Farben hat die Landesflagge von Sachsen?","a":["blau-weiß-rot","weiß-grün","grün-weiß-rot","schwarz-gelb"],"c":1,"img":null,"tq":"Sachsen'in eyalet bayrağı (Landesflagge) hangi renklerdedir?","ta":["mavi-beyaz-kırmızı","beyaz-yeşil","yeşil-beyaz-kırmızı","siyah-sarı"],"exp":"Doğru cevap beyaz-yeşildir: Sachsen'in bayrağı üstte beyaz, altta yeşil iki yatay şeritten oluşur. Dikkat: siyah-sarı Sachsen'in armasının renkleridir, bayrağının değil; yeşil-beyaz-kırmızı ise Nordrhein-Westfalen'in bayrağıdır."},{"id":"SN06","n":6,"scope":"SN","cat":"land","q":"Wo können Sie sich in Sachsen über politische Themen informieren?","a":["bei der Landeszentrale für politische Bildung","beim Ordnungsamt der Gemeinde","bei den Kirchen","bei der Verbraucherzentrale"],"c":0,"img":null,"tq":"Sachsen'de siyasi konular hakkında nereden bilgi alabilirsiniz?","ta":["Landeszentrale für politische Bildung'dan (Eyalet Siyasi Eğitim Merkezi)","belediyenin Ordnungsamt'ından (Kamu Düzeni Dairesi)","kiliselerden","Verbraucherzentrale'den (Tüketici Danışma Merkezi)"],"exp":"Doğru cevap Landeszentrale für politische Bildung'dur (Eyalet Siyasi Eğitim Merkezi): Dresden'deki bu kurum vatandaşlara siyaset ve demokrasi konularında tarafsız bilgi sunar. Ordnungsamt kamu düzeniyle, Verbrauche   /* =========================================================

  function shuffle(arr, rnd) {
    rnd = rnd || Math.random;
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));

  }
  function sample(arr, n, rnd) { return shuffle(arr, rnd).slice(0, Math.max(0, Math.min(n, arr.length))); }

  function assembleExam(general, stateQs, rnd) {

  }
  /** Score answers: {score, total, pass, wrong:[ids], byCat:{cat:{total,correct}}} */
  function scoreExam(ids, answers, byId, passMark) {
    var score = 0, wrong = [], byCat = {};
    ids.forEach(function (id) {
      var q = byId[id]; if (!q) return;
      var cat = q.cat || 'politik';
      byCat[cat] = byCat[cat] || { total: 0, correct: 0 };
      byCat[cat].total++;

    });

  }

  /* =========================================================
     Question card (shared by landing demo, study, retry, exam)
     opts: {context:'landing'|'study'|'retry'|'exam', showNav, reveal, idx, total, marked, showTr}
     ========================================================= */
  function imgBlock(q) {
    if (!q.img) return '';
    var urls = Array.isArray(q.img.urls) ? q.img.urls : [];
    var note = q.img.note || '';
    if (q.img.kind === 'options') return ''; // handled per option
    if (urls.length) {
      return '<div class="qimg-wrap"><img class="q-img" src="' + esc(urls[0]) + '" alt="' + esc(note) + '" loading="lazy" data-note="' + esc(note) + '">' +
        '<div class="img-note" hidden><b>Resim:</b> ' + esc(note) + '</div></div>';
    }
    return note ? '<div class="img-note"><b>Resim:</b> ' + esc(note) + '</div>' : '';
  }
  function optImg(q, i) {
    if (!q.img || q.img.kind !== 'options') return '';
    var urls = Array.isArray(q.img.urls) ? q.img.urls : [];
    if (urls[i]) return '<img class="opt-img" src="' + esc(urls[i]) + '" alt="Resim ' + (i + 1) + '" loading="lazy" data-note="">';
    return '';
  }
  function optionsNote(q) {
    if (!q.img || q.img.kind !== 'options') return '';
    var urls = Array.isArray(q.img.urls) ? q.img.urls : [];
    if (urls.length) return '';
    return q.img.note ? '<div class="img-note"><b>Resimler:</b> ' + esc(q.img.note) + '</div>' : '';
  }
  function questionCard(q, picked, o) {
    o = o || {};
    var answered = picked !== null && picked !== undefined;
    var reveal = o.reveal !== false && answered;       // exam mode: reveal=false until the end
    var showTr = (o.showTr !== undefined) ? o.showTr : state.tr;
    var hasOptImgs = q.img && q.img.kind === 'options' && Array.isArray(q.img.urls) && q.img.urls.length > 0;
    var counted = o.context === 'exam' || o.context === 'quick';
    var fieldLabel = counted ? esc(q.scope === 'general' ? (CATS[q.cat] || 'Genel soru') : (STATE_NAME[q.scope] || q.scope))
      : (q.scope === 'general' ? ('Soru ' + (q.n || '')) : (esc(STATE_NAME[q.scope] || q.scope) + ' · Soru ' + (q.n || '')));
    var head = '<div class="qcard-head"><span class="field">' + fieldLabel + '</span>' +
      (counted ? '<span class="num">' + (o.idx + 1) + ' / ' + o.total + '</span>' : '<span>' + esc(CATS[q.cat] || '') + '</span>') +
      '</div>';
    var html = '<div class="qcard" data-qid="' + esc(q.id) + '">' + head +
      '<div class="qline"><div><p class="qtext" lang="de">' + esc(q.q) + '</p>' +
      (showTr && q.tq ? '<p class="tr" lang="tr">' + esc(q.tq) + '</p>' : '') + '</div>' + speakBtn(q.q, 'de-DE') + '</div>' +
      imgBlock(q) + optionsNote(q) +
      '<ul class="opts' + (hasOptImgs ? ' is-grid' : '') + '" role="list">';
    for (var i = 0; i < 4; i++) {
      var cls = 'opt';
      if (reveal) { if (i === q.c) cls += ' is-correct'; else if (i === picked) cls += ' is-wrong'; }
      else if (answered && i === picked) cls += ' is-picked';
      var boxInner = reveal && i === q.c ? ICON.check : (reveal && i === picked ? ICON.cross : (answered && i === picked ? ICON.check : LETTERS[i]));
      html += '<li><button type="button" class="' + cls + '" data-act="pick" data-i="' + i + '"' + (reveal ? ' disabled' : '') + ' aria-pressed="' + (answered && i === picked ? 'true' : 'false') + '">' +
        '<span class="box" aria-hidden="true">' + boxInner + '</span>' +
        '<span class="body"><span class="letter">' + LETTERS[i] + '</span><span lang="de">' + esc(q.a[i]) + '</span>' +
        (showTr && q.ta && q.ta[i] ? '<span class="tr" lang="tr" style="display:block">' + esc(q.ta[i]) + '</span>' : '') +
        optImg(q, i) + '</span></button></li>';
    }
    html += '</ul>';
    if (o.context !== 'exam' && SPEECH && state.sound) {
      html += '<p class="small muted" style="margin:.6rem 0 0"><button type="button" class="btn btn-ghost btn-sm" data-act="speak" data-lang="de-DE" data-text="' + esc(q.q + '. ' + q.a.map(function (a, k) { return LETTERS[k] + '. ' + a; }).join('. ')) + '">' + ICON.speaker + ' Soruyu ve şıkları Almanca dinle</button></p>';
    }
    if (reveal) {
      var ok = picked === q.c;
      html += '<div class="exp ' + (ok ? 'is-ok' : 'is-bad') + '" role="status"><div class="verdict"><span>' + (ok ? 'Doğru' : 'Yanlış — doğru cevap ' + LETTERS[q.c]) + '</span>' + speakBtn(q.exp || '', 'tr-TR') + '</div>' +
        '<p>' + esc(q.exp || '') + '</p></div>';
    }
    if (o.showNav !== false && o.context !== 'exam') {
      html += '<div class="qnav">' +
        (o.context === 'landing'
          ? '<span class="progress-txt">Örnek soru — böyle çalışacaksın</span><a class="btn btn-sm" href="#calis" data-act="onboard">Tüm soruları gör</a>'
          : '<span class="progress-txt num">' + (o.progressText || '') + '</span>' +
            '<span class="btn-row">' + (o.prevAct ? '<button type="button" class="btn btn-sm" data-act="' + o.prevAct + '">Önceki</button>' : '') +
            (o.nextAct ? '<button type="button" class="btn btn-sm ' + (reveal ? 'btn-primary' : '') + '" data-act="' + o.nextAct + '">' + (o.nextLabel || 'Sonraki') + '</button>' : '') + '</span>') +
        '</div>';
    }
    html += '</div>';
    return html;
  }

          '<div class="qnav"><span class="progress-txt num">' + (idx + 1) + '/' + pool.length + '</span><span class="btn-row">' + (idx > 0 ? '<button type="button" class="btn btn-sm" data-act="study-prev">Önceki</button>' : '') + (idx < pool.length - 1 ? '<button type="button" class="btn btn-sm" data-act="study-next">Sonraki</button>' : '') + '</span></div></div>';

  function mistakeIds() {

  /* =========================================================
     Exam (mock + free trial)
     ========================================================= */
  var timerHandle = null;
  function startExam(kind, auto) {
    stopSpeech();
    var ids = kind === 'trial' ? assembleTrial(GENERAL) : assembleExam(GENERAL, stateQuestions());
    if (!ids.length) { state.msg = { kind: 'bad', text: 'Soru verisi yüklenemedi.' }; render(); return; }
    state.exam = { kind: kind, ids: ids, answers: {}, marked: {}, idx: 0, start: Date.now(), done: false, result: null, stateCode: state.stateCode, auto: !!auto };
    saveExam();
    if (kind === 'trial' && !auto) track('trial_start', {}); // full-exam starts are not tracked (not in the event whitelist)
    state.onboarded = true; lsSet('onboarded', true);
    go('deneme');
  }
  function examRemaining() { return state.exam ? Math.max(0, EXAM_MS - (Date.now() - state.exam.start)) : 0; }
  function finishExam() {
    var ex = state.exam; if (!ex || ex.done) return;
    stopSpeech();
    var r = scoreExam(ex.ids, ex.answers, BY_ID, EXAM_PASS);
    ex.done = true; ex.result = r; ex.finishedAt = Date.now();
    // Record every answered question into progress/mistakes (unanswered count as wrong in the score but are not logged as attempts)
    ex.ids.forEach(function (id) { var q = BY_ID[id]; if (q && ex.answers[id] !== undefined) recordAnswer(q, ex.answers[id]); });
    state.history.unshift({ ts: ex.finishedAt, score: r.score, total: r.total, pass: r.pass, kind: ex.kind });
    if (state.history.length > 50) state.history = state.history.slice(0, 50);
    lsSet('history', state.history);
    touchDay(); saveExam();
    track(ex.kind === 'trial' ? 'trial_done' : 'exam_done', { score: r.score });
    state.sheet = null; state.expanded = {};
    render();
  }
  function tickTimer() {
    var ex = state.exam;
    if (!ex || ex.done || ex.kind === 'trial' || state.view !== 'deneme') { clearInterval(timerHandle); timerHandle = null; return; }
    var left = examRemaining();
    var el = document.getElementById('timer');
    if (el) { el.textContent = fmtTime(left); el.classList.toggle('is-low', left < 5 * 60 * 1000); }
    if (left <= 0) finishExam();
  }
  function ensureTimer() {
    if (timerHandle) return;
    timerHandle = setInterval(tickTimer, 1000);
  }
  function viewExam() {
    var ex = state.exam;
    if (!ex) return examSetup();
    if (ex.done) return examResults(ex);
    var q = BY_ID[ex.ids[ex.idx]];
    if (!q) { state.exam = null; saveExam(); return examSetup(); }
    var answered = Object.keys(ex.answers).length;
    var isTrial = ex.kind === 'trial';
    var html = '<div class="exam-top">' +
      '<div><strong>' + (isTrial ? 'Ücretsiz deneme' : 'Deneme sınavı') + '</strong><span class="muted small" style="display:block">' + answered + '/' + ex.ids.length + ' cevaplandı</span></div>' +
      (isTrial ? '<span class="muted small">Süre yok</span>' : '<div class="timer num" id="timer" aria-label="Kalan süre">' + fmtTime(examRemaining()) + '</div>') +
      '</div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + ex.ids.length + '" aria-valuenow="' + (ex.idx + 1) + '"><i style="width:' + pct(ex.idx + 1, ex.ids.length) + '%"></i></div>';

  /* =========================================================
     Quick quiz: 5 questions, answer + Turkish explanation shown
     immediately. The first thing campaign visitors see.
     ========================================================= */
  var QUICK_N = 5;
  function assembleQuick(firstId) {
    var pool = GENERAL.filter(function (q) { return !q.img && q.exp && q.id !== firstId; });
    var ids = sample(pool, QUICK_N).map(function (q) { return q.id; });
    if (firstId && BY_ID[firstId]) ids = [firstId].concat(ids.slice(0, QUICK_N - 1));
    return ids;
  }
  function startQuick(auto) {
    stopSpeech();
    var first = PARAMS.q && BY_ID[PARAMS.q] ? PARAMS.q : null;
    var ids = assembleQuick(first);
    if (!ids.length) { go('baslangic'); return; }
    state.quick = { ids: ids, idx: 0, picked: {}, done: false, auto: !!auto, counted: false };
    lsSet('quick', state.quick);
    state.onboarded = true; lsSet('onboarded', true);
    go('hizli');
  }
  function viewQuick() {
    var qz = state.quick;
    if (!qz) return '<div class="card"><p>Hızlı test hazırlanıyor…</p><button type="button" class="btn btn-primary" data-act="quick-start">Başla</button></div>';
    if (qz.done) return quickResult(qz);
    var q = BY_ID[qz.ids[qz.idx]];
    var picked = qz.picked[q.id];
    var answered = picked !== undefined;
    var html = '';
    if (qz.idx === 0 && !answered) {
      html += '<div class="welcome"><h2>Hoş geldin! 5 soruyla dene</h2>' +
        '<p>Sınavdaki gerçek sorular, altında Türkçe çevirisi. Bir şık seç; doğru cevabı ve <strong>neden doğru olduğunu Türkçe</strong> hemen göreceksin. Ücretsiz, kayıt yok.</p></div>';
    }
    html += '<div><div class="dots-txt"><span>Hızlı test</span><span class="num">' + (qz.idx + 1) + ' / ' + qz.ids.length + '</span></div><div class="dots" aria-hidden="true">' +
      qz.ids.map(function (id, i) {
        var p = qz.picked[id];
        var cls = p === undefined ? (i === qz.idx ? 'is-cur' : '') : (p === BY_ID[id].c ? 'is-ok' : 'is-bad');
        return '<i class="' + cls + '"></i>';
      }).join('') + '</div></div>';
    html += questionCard(q, answered ? picked : null, { context: 'quick', idx: qz.idx, total: qz.ids.length, showNav: false, showTr: true });
    if (answered) {
      var last = qz.idx >= qz.ids.length - 1;
      html += '<div class="next-cta"><button type="button" class="btn btn-primary" data-act="quick-next">' + (last ? 'Sonucumu gör' : 'Sonraki soru →') + '</button></div>';
    } else {
      html += '<p class="hint-pick">Cevabını bilmiyorsan da bir şık seç; açıklamayı okuyarak öğrenirsin.</p>';
    }
    return html;
  }
  function quickScore(qz) { return qz.ids.reduce(function (n, id) { return n + (qz.picked[id] === BY_ID[id].c ? 1 : 0); }, 0); }
  function quickResult(qz) {
    var sc = quickScore(qz), n = qz.ids.length;
    var msg = sc === n ? 'Harika, hepsi doğru! Gerçek sınava yakınsın.' : (sc >= 3 ? 'Güzel başlangıç. Biraz çalışmayla 17 doğruyu rahat geçersin.' : 'Endişelenme, çoğu kişi böyle başlıyor. Açıklamalarla çalışınca hızla artıyor.');
    return '<div class="card quick-score"><div class="big num">' + sc + '<small>/' + n + '</small></div><p style="margin:.6rem 0 0;font-weight:600">' + esc(msg) + '</p>' +
      '<p class="small muted" style="margin:.35rem 0 0">Gerçek sınavda 33 sorudan 17 doğru yeterli.</p></div>' +
      '<div class="card"><h3>Sırada ne var?</h3><p class="muted small" style="margin-top:.35rem">30 soruluk ücretsiz denemeyle seviyeni ölç. Süre yok, sonunda yanlışlarının açıklamasını görürsün.</p>' +

      '<button type="button" class="btn btn-ghost btn-sm" data-act="quick-start">5 yeni soruyla tekrar dene</button></div></div>' +
      (isUnlocked() ? '' : '<div class="card"><h3>Tam paket</h3><p class="muted small" style="margin-top:.35rem">460 sorunun hepsi Türkçe çeviri ve açıklamalı, zamanlı 33 soruluk deneme, yanlış tekrarı. 14 gün koşulsuz iade.</p><div class="price">' + priceBlock(true) + '<button type="button" class="btn" data-act="buy" data-where="quick-result">' + buyBtnLabel() + '</button></div></div>');

      var ex = state.exam, left = ex ? ex.ids.length - Object.keys(ex.answers).length : 0;
      inner = '<div class="sheet-head"><h2>Sınavı bitir</h2><button type="button" class="icon-btn" data-act="sheet-close" aria-label="Kapat">' + ICON.close + '</button></div>' +
        '<p>' + (left > 0 ? '<strong>' + left + ' soru</strong> cevapsız. Cevapsız sorular yanlış sayılır.' : 'Tüm soruları cevapladın.') + '</p>' +
        '<div class="btn-row"><button type="button" class="btn btn-primary" data-act="exam-finish">Bitir ve sonucu gör</button><button type="button" class="btn" data-act="sheet-close">Devam et</button></div>';
    } else if (s.kind === 'confirm-abandon') {
      inner = '<div class="sheet-head"><h2>Sınavı iptal et</h2><button type="button" class="icon-btn" data-act="sheet-close" aria-label="Kapat">' + ICON.close + '</button></div>' +
        '<p>Bu denemedeki cevapların silinir, sonuç kaydedilmez.</p>' +
        '<div class="btn-row"><button type="button" class="btn btn-danger" data-act="exam-abandon">İptal et</button><button type="button" class="btn" data-act="sheet-close">Devam et</button></div>';
    }
    return '<div class="sheet-bg" data-act="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">' + inner + '</div></div>';
  }
  function openSheet(s) { state.sheet = s; render(); var first = document.querySelector('#sheet input, #sheet button'); if (first && first.focus) { try { first.focus(); } catch (e) { /* ignore */ } } }
  function closeSheet() { state.sheet = null; render(); }

  /* =========================================================
     Buying — mode-dependent
     ========================================================= */
  function onBuy(where) {
    track('buy_click', { where: where || '' });
    if (CFG.mode === 'live') { openSheet({ kind: 'buy' }); openPaddle(); return; }
    openSheet({ kind: 'buy' });
  }
  function submitSignup(form, emailEl, consentEl, msgEl, meta, onOk) {
    var email = (emailEl.value || '').trim().toLowerCase();
    var valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    if (!valid) { msgEl.innerHTML = '<div class="msg is-bad">Geçerli bir e-posta yaz.</div>'; emailEl.focus(); return; }
    if (!consentEl.checked) { msgEl.innerHTML = '<div class="msg is-bad">Devam etmek için onay kutusunu işaretle.</div>'; consentEl.focus(); return; }
    if (CFG.mode === 'demo' || !CFG.apiBase) {
      onOk({ kind: 'info', text: 'Ön kayıt yakında sitede açılacak' });
      return;
    }
    // Live/preorder: send the signup event; store only a boolean flag, never the address
    try {
      var body = JSON.stringify({ type: 'signup', source: SOURCE, email: email, meta: meta || {} });
      var url = CFG.apiBase + '/api/event';
      var p = window.fetch ? fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }) : Promise.reject(new Error('no_fetch'));
      p.then(function (r) {
        if (r.ok || r.status === 204) { state.signedUp = true; lsSet('signedup', true); onOk({ kind: 'ok', text: meta && meta.where === 'trial' ? 'Kaydın alındı.' : 'Kaydın alındı. Satış açılınca e-posta alacaksın.' }); }
        else onOk({ kind: 'bad', text: 'Kayıt şu an alınamadı. Lütfen biraz sonra tekrar dene.' });
      }).catch(function () { onOk({ kind: 'bad', text: 'Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.' }); });
    } catch (e) { onOk({ kind: 'bad', text: 'Kayıt şu an alınamadı.' }); }
  }

  /* ---------- Paddle (live mode only) ---------- */
  var paddleLoading = false;
  function loadPaddle(cb) {
    if (window.Paddle) { cb(null); return; }
    if (CFG.mode !== 'live') { cb(new Error('not_live')); return; }
    if (paddleLoading) { setTimeout(function () { loadPaddle(cb); }, 300); return; }
    paddleLoading = true;
    var s = document.createElement('script');
    s.src = 'https://cdn.paddle.com/paddle/v2/paddle.js';
    s.async = true;
    s.onload = function () {
      paddleLoading = false;
      try {
        if (CFG.paddle.env === 'sandbox' && window.Paddle.Environment) window.Paddle.Environment.set('sandbox');
        window.Paddle.Initialize({ token: CFG.paddle.clientToken, eventCallback: onPaddleEvent });
        cb(null);
      } catch (e) { cb(e); }
    };
    s.onerror = function () { paddleLoading = false; cb(new Error('load_failed')); };
    document.head.appendChild(s);
  }
  function openPaddle() {
    if (!CFG.paddle.clientToken || !CFG.paddle.priceId) { state.sheet = { kind: 'buy', error: 'Ödeme henüz yapılandırılmadı.' }; render(); return; }
    loadPaddle(function (err) {
      if (err) { state.sheet = { kind: 'buy', error: 'Ödeme penceresi yüklenemedi. Reklam engelleyici açıksa kapatıp tekrar dene.' }; render(); return; }
      try { window.Paddle.Checkout.open({ items: [{ priceId: CFG.paddle.priceId, quantity: 1 }], settings: { displayMode: 'overlay', locale: 'tr' } }); }
      catch (e) { state.sheet = { kind: 'buy', error: 'Ödeme penceresi açılamadı.' }; render(); }
    });
  }
  function onPaddleEvent(ev) {
    if (!ev || !ev.name) return;
    if (ev.name === 'checkout.completed') {
      var txn = ev.data && (ev.data.transaction_id || (ev.data.transaction && ev.data.transaction.id));
      state.sheet = { kind: 'restore', busy: true };
      render();
      postJSON('/api/unlock', { txn: txn }).then(function (res) {
        if (res.ok && res.body && res.body.token) { applyUnlock(res.body.token, 'Ödeme alındı — tam paket açıldı.'); }
        else { state.sheet = { kind: 'restore', error: 'Ödeme alındı ama açma onayı gelmedi. "Geri yükle" ile e-postanı kullanarak tekrar dene.' }; render(); }
      }).catch(function () { state.sheet = { kind: 'restore', error: 'Ödeme alındı ama sunucuya ulaşılamadı. Biraz sonra "Satın aldım, geri yükle" adımını dene.' }; render(); });
    } else if (ev.name === 'checkout.closed') {
      if (state.sheet && state.sheet.kind === 'buy') closeSheet();
    }
  }
  function applyUnlock(token, text) {
    state.unlock = token; lsSet('unlock', token);
    state.sheet = { kind: 'restore', done: { kind: 'ok', text: text || 'Tam paket açıldı.' } };
    render();
  }
  function doRestore(email) {
    state.sheet = { kind: 'restore', busy: true }; render();
    postJSON('/api/restore', { email: email }).then(function (res) {
      if (res.ok && res.body && res.body.token) applyUnlock(res.body.token, 'Satın alımın bulundu — tam paket açıldı.');
      else if (res.status === 404) { state.sheet = { kind: 'restore', error: 'Bu e-postayla tamamlanmış bir satın alma bulunamadı. Ödemede kullandığın adresi kontrol et.' }; render(); }
      else if (res.status === 503) { state.sheet = { kind: 'restore', error: 'Satış henüz açık değil.' }; render(); }
      else { state.sheet = { kind: 'restore', error: 'Kontrol yapılamadı. Biraz sonra tekrar dene.' }; render(); }
    }).catch(function () { state.sheet = { kind: 'restore', error: 'Sunucuya ulaşılamadı. İnternetini kontrol et.' }; render(); });
  }

  /* =========================================================
     Render loop
     ========================================================= */
  var app = document.getElementById('app');
  var sheetEl = document.getElementById('sheet');
  var tabs = document.getElementById('tabs');
  var chip = document.getElementById('state-chip');
  var mistBadge = document.getElementById('mist-badge');
  var VIEW_FN = { baslangic: viewLanding, hizli: viewQuick, calis: viewStudy, deneme: viewExam, yanlislarim: viewMistakes, durum: viewProgress, kosullar: viewKosullar, iade: viewIade, gizlilik: viewGizlilik, kunye: viewKunye };

  function render() {
    if (!app) return;
    var fn = VIEW_FN[state.view] || viewLanding;
    var html;
    try { html = fn(); } catch (e) { html = '<div class="card"><p><strong>Bir şeyler ters gitti.</strong></p><p class="muted small">' + esc(e && e.message) + '</p><a class="btn" href="#baslangic">Başlangıca dön</a></div>'; }
    if (!DATA.length) html = '<div class="card"><p><strong>Soru verisi yüklenemedi.</strong></p><p class="muted small">Sayfayı yenilemeyi dene.</p></div>' + html;
    app.innerHTML = html;
    sheetEl.innerHTML = sheetHtml(state.sheet);
    // tabs
    var tabBtns = tabs.querySelectorAll('.tab');
    for (var i = 0; i < tabBtns.length; i++) {
      var t = tabBtns[i];
      if (t.getAttribute('data-tab') === state.view) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    }
    // state chip
    chip.querySelector('.code').textContent = state.stateCode || '—';
    chip.querySelector('.lbl').textContent = state.stateCode ? (STATE_NAME[state.stateCode] || '').replace(/\s*\(.*\)$/, '') : 'Eyalet seç';
    // mistakes badge
    var mc = mistakeIds().length;
    mistBadge.textContent = String(mc); mistBadge.hidden = mc === 0;
    // image fallbacks: hide broken images, show the note instead
    var imgs = app.querySelectorAll('img[data-note]');
    for (var k = 0; k < imgs.length; k++) attachImgFallback(imgs[k]);
    document.body.style.overflow = state.sheet ? 'hidden' : '';
  }
  function attachImgFallback(img) {
    img.onerror = function () {
      img.hidden = true;
      var wrap = img.parentNode;
      var note = wrap && wrap.querySelector ? wrap.querySelector('.img-note') : null;
      if (note) { note.hidden = false; }
      else if (img.getAttribute('data-note')) { var d = document.createElement('div'); d.className = 'img-note'; d.innerHTML = '<b>Resim:</b> ' + esc(img.getAttribute('data-note')); if (wrap) wrap.appendChild(d); }
      else { var d2 = document.createElement('div'); d2.className = 'img-note'; d2.textContent = 'Resim yüklenemedi — bu şık sınavda bir resimle gösterilir.'; if (wrap) wrap.appendChild(d2); }
    };
    if (img.complete && img.naturalWidth === 0 && img.src) { /* already failed before handler attached */ try { img.onerror(); } catch (e) { /* ignore */ } }
  }

  /* =========================================================
     Share
     ========================================================= */
  var toastHandle = null;
  function toast(text) {
    var el = document.getElementById('toast'); if (!el) return;
    el.textContent = text; el.hidden = false;
    clearTimeout(toastHandle); toastHandle = setTimeout(function () { el.hidden = true; }, 2600);
  }
  function shareUrl() {
    var base = CFG.siteUrl || (window.location.origin + window.location.pathname);
    return base.replace(/\/+$/, '') + (base.indexOf('?') >= 0 ? '&' : '/?') + 'k=share';
  }
  function doShare() {
    var url = shareUrl();
    var done = function () { toast('Bağlantı kopyalandı'); };
    var fail = function () { toast('Kopyalanamadı — bağlantı: ' + url); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, function () { legacyCopy(url) ? done() : fail(); }); return; }
    } catch (e) { /* fall through */ }
    legacyCopy(url) ? done() : fail();
  }
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); var ok = document.execCommand && document.execCommand('copy'); document.body.removeChild(ta); return !!ok;
    } catch (e) { return false; }
  }

  /* =========================================================
     Actions (event delegation)
     ========================================================= */
  function pickAnswer(i) {
    var qz = state.quick;
    if (state.view === 'hizli' && qz && !qz.done) {
      var qqid = qz.ids[qz.idx];
      if (qz.picked[qqid] !== undefined) return;
      if (!qz.counted) { qz.counted = true; track('quick_start', { auto: qz.auto ? 1 : 0 }); }
      qz.picked[qqid] = i; recordAnswer(BY_ID[qqid], i); lsSet('quick', qz); render();
      try { var ee = document.querySelector('.exp'); if (ee && ee.scrollIntoView) ee.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* ignore */ }
      return;
    }
    var ex = state.exam;
    if (state.view === 'deneme' && ex && !ex.done) {
      var qid = ex.ids[ex.idx];
      // Auto-started trials count as started only once the visitor answers a question
      if (ex.kind === 'trial' && ex.auto && !ex.counted) { ex.counted = true; track('trial_start', { auto: 1 }); }
      ex.answers[qid] = i; saveExam(); render(); return;
    }
    if (state.view === 'yanlislarim' && state.retry.id) {
      if (state.retry.picked !== null) return;
      state.retry.picked = i; recordAnswer(BY_ID[state.retry.id], i); render(); return;
    }
    var q = state.view === 'baslangic' ? GENERAL[0] : (state.study.id ? BY_ID[state.study.id] : null);
    if (!q) return;
    if (state.view === 'baslangic') { state.study.id = q.id; }
    if (state.study.picked !== null && state.study.id === q.id) return;
    state.study.picked = i; recordAnswer(q, i); render();
  }
  function studyMove(delta) {
    var pool = studyPool(); var cur = BY_ID[state.study.id]; var idx = pool.indexOf(cur);
    var next = pool[idx + delta]; if (!next) return;
    stopSpeech();
    state.study.id = next.id; state.study.picked = null; render(); scrollTopOf('.qcard');
  }
  function scrollTopOf(sel) {
    try { var el = document.querySelector(sel); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: 'auto' }); } catch (e) { /* ignore */ }
  }
  var studyOpenTracked = false;
  var ACT = {
    'open-state': function () { openSheet({ kind: 'state' }); },
    'state-pick': function (b) { var code = b.getAttribute('data-code'); state.stateCode = code; lsSet('state', code); if (state.study.cat === 'land') state.study.id = null; state.sheet = null; render(); },
    'state-select': function (b) { var code = b.value || null; state.stateCode = code; if (code) lsSet('state', code); else lsDel('state'); render(); },
    'sheet-close': function () { closeSheet(); },
    'sheet-bg': function () { if (!(state.sheet && state.sheet.busy)) closeSheet(); },
    'onboard': function () { state.onboarded = true; lsSet('onboarded', true); },
    'quick-start': function () { startQuick(false); },
    'quick-next': function () {
      var qz = state.quick; if (!qz) return;
      stopSpeech();
      if (qz.idx < qz.ids.length - 1) { qz.idx++; }
      else { qz.done = true; track('quick_done', { score: quickScore(qz) }); }
      lsSet('quick', qz); render(); try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
    },
    'trial-start': function () { if (state.exam && !state.exam.done) { go('deneme'); return; } startExam('trial'); },
    'exam-start': function () { if (!state.stateCode) { openSheet({ kind: 'state' }); return; } startExam('exam'); },
    'exam-prev': function () { var ex = state.exam; if (ex && ex.idx > 0) { ex.idx--; saveExam(); stopSpeech(); render(); scrollTopOf('.exam-top'); } },
    'exam-next': function () { var ex = state.exam; if (ex && ex.idx < ex.ids.length - 1) { ex.idx++; saveExam(); stopSpeech(); render(); scrollTopOf('.exam-top'); } },
    'exam-goto': function (b) { var ex = state.exam; var i = parseInt(b.getAttribute('data-i'), 10); if (ex && i >= 0 && i < ex.ids.length) { ex.idx = i; saveExam(); render(); scrollTopOf('.exam-top'); } },
    'exam-mark': function () { var ex = state.exam; if (!ex) return; var id = ex.ids[ex.idx]; if (ex.marked[id]) delete ex.marked[id]; else ex.marked[id] = true; saveExam(); render(); },
    'exam-finish-ask': function () { openSheet({ kind: 'confirm-finish' }); },
    'exam-finish': function () { finishExam(); },
    'exam-abandon-ask': function () { openSheet({ kind: 'confirm-abandon' }); },
    'exam-abandon': function () { state.exam = null; saveExam(); state.sheet = null; render(); },
    'exam-close': function () { state.exam = null; saveExam(); state.expanded = {}; render(); },
    'toggle-wrong': function (b) { var id = b.getAttribute('data-id'); state.expanded[id] = !state.expanded[id]; render(); },
    'cat': function (b) { state.study.cat = b.getAttribute('data-cat'); state.study.id = null; state.study.picked = null; render(); },
    'study-open': function (b) {
      stopSpeech(); state.study.id = b.getAttribute('data-id'); state.study.picked = null;
      state.onboarded = true; lsSet('onboarded', true);
      if (!studyOpenTracked) { studyOpenTracked = true; track('study_open', { cat: state.study.cat }); } // once per page load
      render(); scrollTopOf('.qcard');
    },
    'study-list': function () { stopSpeech(); state.study.id = null; state.study.picked = null; render(); },
    'study-next': function () { studyMove(1); },
    'study-prev': function () { studyMove(-1); },
    'retry-open': function (b) { stopSpeech(); state.retry.order = mistakeIds(); state.retry.id = b.getAttribute('data-id'); state.retry.picked = null; render(); },
    'retry-start': function () { var ids = mistakeIds(); if (ids.length) { state.retry.order = ids; state.retry.id = ids[0]; state.retry.picked = null; render(); } },
    'retry-list': function () { stopSpeech(); state.retry.id = null; state.retry.picked = null; render(); },
    'retry-next': function () {
      stopSpeech();
      var ids = mistakeIds(); var idx = ids.indexOf(state.retry.id);
      var next;
      if (idx >= 0) next = ids[idx + 1];
      else {
        // The current question just left the list: continue with the first id
        // that sorted after it in the snapshot taken when the session started.
        var order = state.retry.order || [];
        var pos = order.indexOf(state.retry.id);
        next = null;
        for (var i = pos + 1; i < order.length; i++) { if (ids.indexOf(order[i]) >= 0) { next = order[i]; break; } }
      }
      if (next && next !== state.retry.id) { state.retry.id = next; state.retry.picked = null; } else { state.retry.id = null; state.retry.picked = null; }
      render(); scrollTopOf('.qcard');
    },
    'pick': function (b) { pickAnswer(parseInt(b.getAttribute('data-i'), 10)); },
    'speak': function (b) { speak(b.getAttribute('data-text') || '', b.getAttribute('data-lang') || 'de-DE'); },
    'toggle-tr': function (b) { state.tr = !!b.checked; lsSet('tr', state.tr); render(); },
    'toggle-sound': function (b) { state.sound = !!b.checked; lsSet('sound', state.sound); if (!state.sound) stopSpeech(); render(); },
    'share': function () { doShare(); },
    'buy': function (b) { onBuy(b.getAttribute('data-where')); },
    'restore': function () { openSheet({ kind: 'restore' }); },
    'paddle-open': function () { openPaddle(); },
    'reset-1': function () { state.resetStep = 1; render(); },
    'reset-cancel': function () { state.resetStep = 0; render(); },
    'reset-2': function () {
      var keep = { unlock: state.unlock, source: SOURCE, vid: VID, signedup: state.signedUp };
      lsClearAll();
      Object.keys(keep).forEach(function (k) { if (keep[k] !== null && keep[k] !== undefined && keep[k] !== false) lsSet(k, keep[k]); });
      state.progress = {}; state.mistakes = {}; state.history = []; state.days = []; state.exam = null; state.stateCode = null;
      state.study = { cat: 'all', id: null, picked: null }; state.retry = { id: null, picked: null }; state.resetStep = 0;
      state.msg = { kind: 'ok', text: 'Veriler silindi.' }; render();
    }
  };
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    var b = t && t.closest ? t.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'sheet-bg' && t !== b) return;              // clicks inside the sheet must not close it
    if (b.tagName === 'INPUT' || b.tagName === 'SELECT') return; // handled on change
    if (b.tagName === 'A') { if (ACT[act]) ACT[act](b); return; } // let the link navigate too
    ev.preventDefault();
    if (ACT[act]) ACT[act](b);
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target; if (!t || !t.getAttribute) return;
    var act = t.getAttribute('data-act');
    if (act && ACT[act] && (t.tagName === 'INPUT' || t.tagName === 'SELECT')) ACT[act](t);
  });
  document.addEventListener('submit', function (ev) {
    var f = ev.target; if (!f || !f.id) return;
    ev.preventDefault();
    if (f.id === 'trial-form') {
      var score = state.exam && state.exam.result ? state.exam.result.score : null;
      submitSignup(f, document.getElementById('trial-email'), document.getElementById('trial-consent'), document.getElementById('trial-form-msg'), { where: 'trial', score: score }, function (res) {
        var m = document.getElementById('trial-form-msg');
        if (res.kind === 'ok') { render(); } else if (m) { m.innerHTML = '<div class="msg is-' + res.kind + '">' + esc(res.text) + '</div>'; }
      });
    } else if (f.id === 'preorder-form') {
      submitSignup(f, document.getElementById('preorder-email'), document.getElementById('preorder-consent'), document.getElementById('preorder-form-msg'), { where: state.view }, function (res) {
        if (res.kind === 'bad') { var m = document.getElementById('preorder-form-msg'); if (m) m.innerHTML = '<div class="msg is-bad">' + esc(res.text) + '</div>'; return; }
        state.sheet = { kind: 'buy', done: res }; render();
      });
    } else if (f.id === 'restore-form') {
      var em = (document.getElementById('restore-email').value || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { document.getElementById('restore-form-msg').innerHTML = '<div class="msg is-bad">Geçerli bir e-posta yaz.</div>'; return; }
      if (!CFG.apiBase || CFG.mode !== 'live') { state.sheet = { kind: 'restore', error: 'Satış henüz açık değil.' }; render(); return; }
      doRestore(em);
    }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && state.sheet && !state.sheet.busy) closeSheet(); });
  window.addEventListener('pagehide', stopSpeech);

  /* =========================================================
     Boot
     ========================================================= */
  function boot() {
    // Campaign links (?k=fbB, ?k=tt ...) promise "free 30-question trial": land first-time visitors
    // straight on the first trial question instead of the landing page.
    var campaign = cleanSource(PARAMS.k || PARAMS.utm_source);
    if (campaign && !window.location.hash && !state.onboarded && !(state.exam && !state.exam.done)) {
      track('visit', { vid: VID, path: 'hizli', quick: 1 });
      startQuick(true);
      return;
    }
    state.view = routeFromHash();
    if (!window.location.hash && state.view) { try { history.replaceState(null, '', '#' + state.view); } catch (e) { /* ignore */ } }
    render();
    track('visit', { vid: VID, path: state.view });
    // Resume a running timed exam
    if (state.exam && !state.exam.done && state.exam.kind !== 'trial' && state.view === 'deneme') ensureTimer();
  }

  // Test hooks: pure functions + read-only state access
  window.__einb = {
    assembleExam: assembleExam, assembleTrial: assembleTrial, scoreExam: scoreExam, isFreeQuestion: isFreeQuestion,
    calcStreak: calcStreak, fmtTime: fmtTime, shuffle: shuffle, STATES: STATES, CATS: CATS,
    config: CFG, dataCount: DATA.length, getState: function () { return state; }, render: render
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>

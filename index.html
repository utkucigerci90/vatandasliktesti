ganı 1989 sonbaharında Doğu Almanya'daki Pazartesi gösterilerinde (Montagsdemonstrationen, özellikle Leipzig'de) atıldı. Bu barışçıl gösteriler Berlin Duvarı'nın 9 Kasım 1989'da açılmasına giden yolu açtı. 1953 ayaklanması, 1968 öğrenci hareketi ve 1985 nükleer karşıtı gösteriler farklı dönemlerdir."},{"id":"G167","n":167,"scope":"general","cat":"geschichte","q":"Welche Länder wurden nach dem Zweiten Weltkrieg in Deutschland als \"Alliierte Besatzungsmächte\" bezeichnet?","a":["Sowjetunion, Großbritannien, Polen, Schweden","Frankreich, Sowjetunion, Italien, Japan","USA, Sowjetunion, Spanien, Portugal","USA, Sowjetunion, Großbritannien, Frankreich"],"c":3,"img":null,"tq":"İkinci Dünya Savaşı'ndan sonra Almanya'da hangi ülkeler \"Müttefik İşgal Güçleri\" olarak adlandırıldı?","ta":["Sovyetler Birliği, Büyük Britanya, Polonya, İsveç","Fransa, Sovyetler Birliği, İtalya, Japonya","ABD, Sovyetler Birliği, İspanya, Portekiz","ABD, Sovyetler Birliği, Büyük Britanya, Fransa"],"exp":"Doğru cevap: ABD, Sovyetler Birliği, Büyük Britanya, Fransa. Savaşı kazanan bu dört devlet 1945'te Almanya'yı dört işgal bölgesine, Berlin'i de dört sektöre ayırdı. İtalya ve Japonya ise savaşta Almanya'nın müttefikiydi, dolayısıyla işgal gücü olamazdı."},{"id":"G168","n":168,"scope":"general","cat":"geschichte","q":"Welches Land war keine \"Alliierte Besatzungsmacht\" in Deutschland?","a":["USA","Sowjetunion","Frankreich","Japan"],"c":3,"img":null,"tq":"Hangi ülke Almanya'da \"Müttefik İşgal Gücü\" değildi?","ta":["ABD","Sovyetler Birliği","Fransa","Japonya"],"exp":"Doğru cevap Japonya. Japonya, İkinci Dünya Savaşı'nda Almanya'nın müttefikiydi ve savaşı kaybeden taraftaydı. Almanya'yı işgal eden dört güç ABD, Sovyetler Birliği, Büyük Britanya ve Fransa'dır."},{"id":"G169","n":169,"scope":"general","cat":"geschichte","q":"Wann wurde die Bundesrepublik Deutschland gegründet?","a":["1939","1945","1949","1951"],"c":2,"img":null,"tq":"Federal Almanya Cumhuriyeti ne zaman kuruldu?","ta":["1939","1945","1949","1951"],"exp":"Doğru cevap 1949. Grundgesetz (Temel Yasa/Anayasa) 23 Mayıs 1949'da ilan edildi ve Federal Almanya Cumhuriyeti üç Batı işgal bölgesinde kuruldu. Aynı yılın Ekim ayında Doğu'da DDR kuruldu. 1945 savaşın bittiği yıldır, devletin kurulduğu yıl değil."},{"id":"G170","n":170,"scope":"general","cat":"geschichte","q":"Was gab es während der Zeit des Nationalsozialismus in Deutschland?","a":["das Verbot von Parteien","das Recht zur freien Entfaltung der Persönlichkeit","Pressefreiheit","den Schutz der Menschenwürde"],"c":0,"img":null,"tq":"Nasyonal Sosyalizm döneminde Almanya'da hangisi vardı?","ta":["partilerin yasaklanması","kişiliğini özgürce geliştirme hakkı","basın özgürlüğü","insan onurunun korunması"],"exp":"Doğru cevap: partilerin yasaklanması. 1933'te NSDAP dışındaki tüm partiler yasaklandı ve Almanya tek parti devletine dönüştü. Diğer üç seçenek, bugün Grundgesetz'in (Temel Yasa) güvence altına aldığı temel haklardır ve Nazi döneminde yoktu."},{"id":"G171","n":171,"scope":"general","cat":"geschichte","q":"Soziale Marktwirtschaft bedeutet, die Wirtschaft …","a":["steuert sich allein nach Angebot und Nachfrage.","wird vom Staat geplant und gesteuert, Angebot und Nachfrage werden nicht berücksichtigt.","richtet sich nach der Nachfrage im Ausland.","richtet sich nach Angebot und Nachfrage, aber der Staat sorgt für einen sozialen Ausgleich."],"c":3,"img":null,"tq":"Sosyal piyasa ekonomisi şu anlama gelir: ekonomi …","ta":["yalnızca arz ve talebe göre kendi kendini yönetir.","devlet tarafından planlanır ve yönetilir; arz ve talep dikkate alınmaz.","yurt dışındaki talebe göre şekillenir.","arz ve talebe göre işler, ancak devlet sosyal dengeyi sağlar."],"exp":"Doğru cevap: ekonomi arz ve talebe göre işler, ancak devlet sosyal dengeyi sağlar. Sosyal piyasa ekonomisi Almanya'nın ekonomik modelidir: serbest rekabet esastır, devlet ise sosyal güvenlik ve zayıfların korunmasıyla dengeyi kurar. İkinci seçenek DDR'nin planlı ekonomisini anlatır."},{"id":"G172","n":172,"scope":"general","cat":"geschichte","q":"In welcher Besatzungszone wurde die DDR gegründet? In der …","a":["amerikanischen Besatzungszone","französischen Besatzungszone","britischen Besatzungszone","sowjetischen Besatzungszone"],"c":3,"img":null,"tq":"DDR (Doğu Almanya) hangi işgal bölgesinde kuruldu?","ta":["Amerikan işgal bölgesinde","Fransız işgal bölgesinde","İngiliz işgal bölgesinde","Sovyet işgal bölgesinde"],"exp":"Doğru cevap: Sovyet işgal bölgesinde. 7 Ekim 1949'da Sovyetlerin denetimindeki Doğu Almanya'da DDR kuruldu. Amerikan, İngiliz ve Fransız bölgeleri ise birleşerek aynı yıl Federal Almanya Cumhuriyeti'ni oluşturdu."},{"id":"G173","n":173,"scope":"general","cat":"geschichte","q":"Die Bundesrepublik Deutschland ist ein Gründungsmitglied …","a":["des Nordatlantikpakts (NATO).","der Vereinten Nationen (VN).","der Europäischen Union (EU).","des Warschauer Pakts."],"c":2,"img":null,"tq":"Federal Almanya Cumhuriyeti … kurucu üyesidir.","ta":["Kuzey Atlantik Paktı'nın (NATO).","Birleşmiş Milletler'in (BM).","Avrupa Birliği'nin (AB).","Varşova Paktı'nın."],"exp":"Doğru cevap: Avrupa Birliği'nin (AB). Federal Almanya, AB'nin temeli olan Avrupa Kömür ve Çelik Topluluğu'nu (1951) ve Avrupa Ekonomik Topluluğu'nu (1957) kuran altı ülkeden biridir. NATO'ya 1955'te, BM'ye 1973'te sonradan katıldı; Varşova Paktı'na ise hiç üye olmadı."},{"id":"G174","n":174,"scope":"general","cat":"geschichte","q":"Wann wurde die DDR gegründet?","a":["1947","1949","1953","1956"],"c":1,"img":null,"tq":"DDR (Doğu Almanya) ne zaman kuruldu?","ta":["1947","1949","1953","1956"],"exp":"Doğru cevap 1949. DDR, 7 Ekim 1949'da Sovyet işgal bölgesinde kuruldu; Federal Almanya Cumhuriyeti ise aynı yılın Mayıs ayında kurulmuştu. 1953, DDR'deki halk ayaklanmasının yılıdır."},{"id":"G175","n":175,"scope":"general","cat":"geschichte","q":"Wie viele Besatzungszonen gab es in Deutschland nach dem Zweiten Weltkrieg?","a":["3","4","5","6"],"c":1,"img":null,"tq":"İkinci Dünya Savaşı'ndan sonra Almanya'da kaç işgal bölgesi vardı?","ta":["3","4","5","6"],"exp":"Doğru cevap 4. Almanya 1945'te dört Müttefik gücün (ABD, Sovyetler Birliği, Büyük Britanya, Fransa) işgal bölgelerine ayrıldı. Başkent Berlin de aynı şekilde dört sektöre bölündü."},{"id":"G176","n":176,"scope":"general","cat":"geschichte","q":"Wie waren die Besatzungszonen Deutschlands nach 1945 verteilt?","a":["1=Großbritannien, 2=Sowjetunion, 3=Frankreich, 4=USA","1=Sowjetunion, 2=Großbritannien, 3=USA, 4=Frankreich","1=Großbritannien, 2=Sowjetunion, 3=USA, 4=Frankreich","1=Großbritannien, 2=USA, 3=Sowjetunion, 4=Frankreich"],"c":2,"img":{"kind":"question","urls":[],"note":"Karte Deutschlands mit den vier Besatzungszonen, nummeriert: 1 = Nordwesten (britische Zone), 2 = Osten (sowjetische Zone), 3 = Sueden (amerikanische Zone), 4 = Suedwesten (franzoesische Zone). Kein freies Ersatzbild mit identischer Nummerierung."},"tq":"1945'ten sonra Almanya'nın işgal bölgeleri nasıl dağılmıştı?","ta":["1=Büyük Britanya, 2=Sovyetler Birliği, 3=Fransa, 4=ABD","1=Sovyetler Birliği, 2=Büyük Britanya, 3=ABD, 4=Fransa","1=Büyük Britanya, 2=Sovyetler Birliği, 3=ABD, 4=Fransa","1=Büyük Britanya, 2=ABD, 3=Sovyetler Birliği, 4=Fransa"],"exp":"Doğru cevap: 1=Büyük Britanya, 2=Sovyetler Birliği, 3=ABD, 4=Fransa. Haritada kuzeybatı (1) İngiliz, doğu (2) Sovyet, güney (3) Amerikan, güneybatı (4) Fransız bölgesidir. Ezber ipucu: İngilizler kuzeydeki limanlara yakın, Sovyetler doğuda, Fransızlar kendi sınırlarına yakın güneybatıda, Amerikalılar güneyde (Bavyera)."},{"id":"G177","n":177,"scope":"general","cat":"geschichte","q":"Welche deutsche Stadt wurde nach dem Zweiten Weltkrieg in vier Sektoren aufgeteilt?","a":["München","Berlin","Dresden","Frankfurt/Oder"],"c":1,"img":null,"tq":"İkinci Dünya Savaşı'ndan sonra hangi Alman şehri dört sektöre bölündü?","ta":["München","Berlin","Dresden","Frankfurt/Oder"],"exp":"Doğru cevap Berlin. Eski başkent Berlin, Sovyet işgal bölgesinin ortasında kalmasına rağmen dört Müttefik güç arasında dört sektöre bölündü. Üç Batı sektörü sonradan Batı Berlin'i, Sovyet sektörü ise DDR'nin başkenti Doğu Berlin'i oluşturdu."},{"id":"G178","n":178,"scope":"general","cat":"geschichte","q":"Vom Juni 1948 bis zum Mai 1949 wurden die Bürgerinnen und Bürger von West-Berlin durch eine Luftbrücke versorgt. Welcher Umstand war dafür verantwortlich?","a":["Für Frankreich war eine Versorgung der West-Berliner Bevölkerung mit dem Flugzeug kostengünstiger.","Die amerikanischen Soldatinnen und Soldaten hatten beim Landtransport Angst vor Überfällen.","Für Großbritannien war die Versorgung über die Luftbrücke schneller.","Die Sowjetunion unterbrach den gesamten Verkehr auf dem Landwege."],"c":3,"img":null,"tq":"Haziran 1948'den Mayıs 1949'a kadar Batı Berlin halkı bir hava köprüsüyle ikmal edildi. Bunun nedeni hangi durumdu?","ta":["Fransa için Batı Berlin halkını uçakla beslemek daha ucuzdu.","Amerikan askerleri kara taşımacılığında saldırıya uğramaktan korkuyordu.","Büyük Britanya için hava köprüsüyle ikmal daha hızlıydı.","Sovyetler Birliği kara yoluyla tüm ulaşımı kesmişti."],"exp":"Doğru cevap: Sovyetler Birliği kara yoluyla tüm ulaşımı kesmişti. 1948'de Sovyetler Batı Berlin'e giden kara ve su yollarını kapatınca (Berlin Ablukası) Batılı Müttefikler şehri yaklaşık 11 ay boyunca yalnızca uçaklarla besledi. Bu uçaklara halk \"Rosinenbomber\" (kuru üzüm bombardıman uçağı) adını taktı."},{"id":"G179","n":179,"scope":"general","cat":"geschichte","q":"Wie endete der Zweite Weltkrieg in Europa offiziell?","a":["mit dem Tod Adolf Hitlers","durch die bedingungslose Kapitulation Deutschlands","mit dem Rückzug der Deutschen aus den besetzten Gebieten","durch eine Revolution in Deutschland"],"c":1,"img":null,"tq":"İkinci Dünya Savaşı Avrupa'da resmî olarak nasıl sona erdi?","ta":["Adolf Hitler'in ölümüyle","Almanya'nın koşulsuz teslimiyetiyle","Almanların işgal ettikleri bölgelerden çekilmesiyle","Almanya'da bir devrimle"],"exp":"Doğru cevap: Almanya'nın koşulsuz teslimiyetiyle. Alman ordusu 8 Mayıs 1945'te hiçbir koşul ileri sürmeden teslim oldu; savaş Avrupa'da resmî olarak böyle bitti. Hitler'in 30 Nisan'daki ölümü savaşı kendiliğinden bitirmedi; teslimiyet imzalanana kadar çatışmalar bir hafta daha sürdü."},{"id":"G180","n":180,"scope":"general","cat":"geschichte","q":"Der erste Bundeskanzler der Bundesrepublik Deutschland war …","a":["Ludwig Erhard.","Willy Brandt.","Konrad Adenauer.","Gerhard Schröder."],"c":2,"img":null,"tq":"Federal Almanya Cumhuriyeti'nin ilk Bundeskanzler'i (Federal Başbakan) … idi.","ta":["Ludwig Erhard.","Willy Brandt.","Konrad Adenauer.","Gerhard Schröder."],"exp":"Doğru cevap Konrad Adenauer. 1949'da seçilen Adenauer, 1963'e kadar görev yaptı. Ludwig Erhard onun ekonomi bakanı ve \"Wirtschaftswunder\"ın (ekonomik mucize) mimarıydı, ancak başbakanlığa 1963'te, ikinci sırada geldi."},{"id":"G181","n":181,"scope":"general","cat":"geschichte","q":"Was wollte Willy Brandt mit seinem Kniefall 1970 im ehemaligen jüdischen Ghetto in Warschau ausdrücken?","a":["Er hat sich den ehemaligen Alliierten unterworfen.","Er bat Polen und die polnischen Juden um Vergebung.","Er zeigte seine Demut vor dem Warschauer Pakt.","Er sprach ein Gebet am Grab des Unbekannten Soldaten."],"c":1,"img":{"kind":"question","urls":[],"note":"Foto: Kniefall von Willy Brandt am Ehrenmal des Warschauer Ghettos, 7.12.1970 (© Bundesregierung/Engelbert Reineke). Kein freies Ersatzbild verifiziert."},"tq":"Willy Brandt, 1970'te Varşova'daki eski Yahudi gettosunda diz çökerek ne ifade etmek istedi?","ta":["Eski Müttefiklere boyun eğdiğini.","Polonya'dan ve Polonyalı Yahudilerden af dilediğini.","Varşova Paktı karşısındaki alçakgönüllülüğünü.","Meçhul Asker Mezarı'nda dua ettiğini."],"exp":"Doğru cevap: Polonya'dan ve Polonyalı Yahudilerden af dilediğini. Fotoğraftaki anda Federal Başbakan Brandt, 7 Aralık 1970'te Varşova Gettosu Anıtı önünde sessizce diz çöktü. Bu jest, Alman suçları için bir özür ve Doğu Avrupa ile uzlaşma politikasının (Ostpolitik) simgesi olarak tarihe geçti."},{"id":"G182","n":182,"scope":"general","cat":"geschichte","q":"Wie heißt das jüdische Gebetshaus?","a":["Basilika","Moschee","Synagoge","Kirche"],"c":2,"img":null,"tq":"Yahudi ibadethanesinin adı nedir?","ta":["Bazilika","Cami","Sinagog","Kilise"],"exp":"Doğru cevap Sinagog. Sinagog Yahudilerin, cami Müslümanların, kilise ve bazilika ise Hristiyanların ibadet yeridir. Almanya'da 1938 pogromunda yakılan sinagogların birçoğu savaştan sonra yeniden inşa edilmiştir."},{"id":"G183","n":183,"scope":"general","cat":"geschichte","q":"Wann war in der Bundesrepublik Deutschland das \"Wirtschaftswunder\"?","a":["40er Jahre","50er Jahre","70er Jahre","80er Jahre"],"c":1,"img":null,"tq":"Federal Almanya Cumhuriyeti'nde \"Wirtschaftswunder\" (ekonomik mucize) ne zaman yaşandı?","ta":["40'lı yıllar","50'li yıllar","70'li yıllar","80'li yıllar"],"exp":"Doğru cevap: 50'li yıllar. Savaştan sonra yıkılmış olan Batı Almanya 1950'lerde hızla büyüdü, işsizlik neredeyse yok oldu ve refah arttı; bu döneme \"Wirtschaftswunder\" denir. Ekonomi Bakanı Ludwig Erhard ve 1948 para reformu (D-Mark) bu başarının anahtarlarıydı."},{"id":"G184","n":184,"scope":"general","cat":"geschichte","q":"Auf welcher rechtlichen Grundlage wurde der Staat Israel gegründet?","a":["eine Resolution der Vereinten Nationen","ein Beschluss des Zionistenkongresses","ein Vorschlag der Bundesregierung","ein Vorschlag der UdSSR"],"c":0,"img":null,"tq":"İsrail Devleti hangi hukuki temele dayanarak kuruldu?","ta":["Birleşmiş Milletler'in bir kararı","Siyonist Kongresi'nin bir kararı","Alman Federal Hükümeti'nin bir önerisi","SSCB'nin bir önerisi"],"exp":"Doğru cevap: Birleşmiş Milletler'in bir kararı. BM Genel Kurulu Kasım 1947'de Filistin'in bölünmesini öngören 181 sayılı kararı aldı; İsrail bu temelde 14 Mayıs 1948'de kuruldu. Federal Almanya ise İsrail'den bir yıl sonra, 1949'da kurulduğu için öneri getirmiş olamazdı."},{"id":"G185","n":185,"scope":"general","cat":"geschichte","q":"Wofür stand der Ausdruck \"Eiserner Vorhang\"? Für die Abschottung …","a":["des Warschauer Pakts gegen den Westen","Norddeutschlands gegen Süddeutschland","Nazi-Deutschlands gegen die Alliierten","Europas gegen die USA"],"c":0,"img":null,"tq":"\"Demir Perde\" ifadesi neyi anlatıyordu? … kapanmasını.","ta":["Varşova Paktı'nın Batı'ya karşı","Kuzey Almanya'nın Güney Almanya'ya karşı","Nazi Almanyası'nın Müttefiklere karşı","Avrupa'nın ABD'ye karşı"],"exp":"Doğru cevap: Varşova Paktı'nın Batı'ya karşı kapanması. \"Demir Perde\", Soğuk Savaş döneminde Sovyetler Birliği ve Doğu Bloku ülkelerini Batı Avrupa'dan ayıran sıkı korunan sınırı anlatır. Almanya'nın içinden geçen bu sınır, Berlin Duvarı ile birlikte 1989'da açıldı."},{"id":"G186","n":186,"scope":"general","cat":"geschichte","q":"Im Jahr 1953 gab es in der DDR einen Aufstand, an den lange Zeit in der Bundesrepublik Deutschland ein Feiertag erinnerte. Wann war das?","a":["1. Mai","17. Juni","20. Juli","9. November"],"c":1,"img":null,"tq":"1953'te DDR'de (Doğu Almanya) bir ayaklanma oldu; Federal Almanya Cumhuriyeti'nde uzun süre bir resmî tatil günü bu ayaklanmayı andı. Bu hangi gündü?","ta":["1 Mayıs","17 Haziran","20 Temmuz","9 Kasım"],"exp":"Doğru cevap 17 Haziran. 17 Haziran 1953'te DDR'de işçiler ve halk hükümete karşı ayaklandı; ayaklanma Sovyet tanklarıyla bastırıldı. Batı Almanya 1954'ten 1990'a kadar bu günü \"Tag der deutschen Einheit\" adıyla ulusal bayram olarak kutladı; birleşmeden sonra yerini 3 Ekim aldı."},{"id":"G187","n":187,"scope":"general","cat":"geschichte","q":"Welcher deutsche Staat hatte eine schwarz-rot-goldene Flagge mit Hammer, Zirkel und Ährenkranz?","a":["Preußen","Bundesrepublik Deutschland","\"Drittes Reich\"","DDR"],"c":3,"img":{"kind":"question","urls":["https://upload.wikimedia.org/wikipedia/commons/a/a1/Flag_of_East_Germany.svg"],"note":"Flagge der DDR (schwarz-rot-gold mit Hammer, Zirkel und Aehrenkranz)."},"tq":"Hangi Alman devletinin üzerinde çekiç, pergel ve başak çelengi bulunan siyah-kırmızı-altın sarısı bir bayrağı vardı?","ta":["Prusya","Federal Almanya Cumhuriyeti","\"Drittes Reich\" (Üçüncü İmparatorluk)","DDR (Doğu Almanya)"],"exp":"Doğru cevap DDR (Doğu Almanya). Resimdeki bayrak, Federal Almanya ile aynı siyah-kırmızı-altın renkleri taşır ama ortasında DDR arması vardır: işçileri temsil eden çekiç, aydınları temsil eden pergel ve köylüleri temsil eden başak çelengi. Federal Almanya'nın bayrağı ise armasız üç renkli şerittir."},{"id":"G188","n":188,"scope":"general","cat":"geschichte","q":"In welchem Jahr wurde die Mauer in Berlin gebaut?","a":["1953","1956","1959","1961"],"c":3,"img":null,"tq":"Berlin'deki Duvar hangi yıl inşa edildi?","ta":["1953","1956","1959","1961"],"exp":"Doğru cevap 1961. Berlin Duvarı 13 Ağustos 1961'de DDR tarafından inşa edilmeye başlandı ve 28 yıl boyunca şehri ikiye böldü. 1953 ise DDR'deki halk ayaklanmasının yılıdır."},{"id":"G189","n":189,"scope":"general","cat":"geschichte","q":"Wann baute die DDR die Mauer in Berlin?","a":["1919","1933","1961","1990"],"c":2,"img":null,"tq":"DDR (Doğu Almanya) Berlin'deki Duvar'ı ne zaman inşa etti?","ta":["1919","1933","1961","1990"],"exp":"Doğru cevap 1961. DDR, Batı'ya kaçışları durdurmak için 13 Ağustos 1961'de Berlin Duvarı'nı inşa etti. 1919 Weimar Cumhuriyeti'nin, 1933 Nazi iktidarının, 1990 ise Almanya'nın yeniden birleşmesinin yılıdır."},{"id":"G190","n":190,"scope":"general","cat":"geschichte","q":"Was bedeutet die Abkürzung DDR?","a":["Dritter Deutscher Rundfunk","Die Deutsche Republik","Dritte Deutsche Republik","Deutsche Demokratische Republik"],"c":3,"img":null,"tq":"DDR kısaltması ne anlama gelir?","ta":["Dritter Deutscher Rundfunk (Üçüncü Alman Radyosu)","Die Deutsche Republik (Alman Cumhuriyeti)","Dritte Deutsche Republik (Üçüncü Alman Cumhuriyeti)","Deutsche Demokratische Republik (Alman Demokratik Cumhuriyeti)"],"exp":"Doğru cevap Deutsche Demokratische Republik (Alman Demokratik Cumhuriyeti). DDR, 1949–1990 yılları arasında var olan Doğu Alman devletinin resmî adıydı. Adında \"demokratik\" geçmesine rağmen tek partinin (SED) yönettiği bir diktatörlüktü."},{"id":"G191","n":191,"scope":"general","cat":"geschichte","q":"Wann wurde die Mauer in Berlin für alle geöffnet?","a":["1987","1989","1992","1995"],"c":1,"img":null,"tq":"Berlin'deki Duvar ne zaman herkese açıldı?","ta":["1987","1989","1992","1995"],"exp":"Doğru cevap 1989. Berlin Duvarı, DDR'deki barışçıl devrimin ardından 9 Kasım 1989 gecesi açıldı ve insanlar serbestçe Batı'ya geçti. Yaklaşık bir yıl sonra, 3 Ekim 1990'da Almanya yeniden birleşti."},{"id":"G192","n":192,"scope":"general","cat":"geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Brandenburg","Bayern","Saarland","Hessen"],"c":0,"img":null,"tq":"Bugünkü Alman eyaletlerinden hangisi eskiden DDR (Doğu Almanya) topraklarındaydı?","ta":["Brandenburg","Bayern","Saarland","Hessen"],"exp":"Doğru cevap Brandenburg. Berlin'i çevreleyen Brandenburg, 1990'da Federal Almanya'ya katılan beş yeni eyaletten biridir (diğerleri: Mecklenburg-Vorpommern, Sachsen, Sachsen-Anhalt, Thüringen). Bayern, Saarland ve Hessen hep Batı Almanya'daydı."},{"id":"G193","n":193,"scope":"general","cat":"geschichte","q":"Von 1961 bis 1989 war Berlin …","a":["ohne Bürgermeister.","ein eigener Staat.","durch eine Mauer geteilt.","nur mit dem Flugzeug erreichbar."],"c":2,"img":null,"tq":"1961'den 1989'a kadar Berlin …","ta":["belediye başkanından yoksundu.","ayrı bir devletti.","bir duvarla bölünmüştü.","yalnızca uçakla ulaşılabilir durumdaydı."],"exp":"Doğru cevap: bir duvarla bölünmüştü. 1961'de inşa edilen Berlin Duvarı, 1989'da açılana kadar Doğu ve Batı Berlin'i birbirinden ayırdı. Batı Berlin'e kara yoluyla ulaşımın kesildiği dönem ise 1948–1949 Berlin Ablukası'dır; bu tarihleri karıştırmayın."},{"id":"G194","n":194,"scope":"general","cat":"geschichte","q":"Am 3. Oktober feiert man in Deutschland den Tag der Deutschen …","a":["Einheit.","Nation.","Bundesländer.","Städte."],"c":0,"img":null,"tq":"3 Ekim'de Almanya'da Alman … Günü kutlanır.","ta":["Birliği.","Ulusu.","Eyaletleri.","Şehirleri."],"exp":"Doğru cevap: Birliği. 3 Ekim 1990'da DDR Federal Almanya'ya katıldı ve Almanya yeniden birleşti; bu nedenle 3 Ekim \"Tag der Deutschen Einheit\" (Alman Birliği Günü) adıyla ülkenin ulusal bayramı ve tüm Almanya'da resmî tatildir."},{"id":"G195","n":195,"scope":"general","cat":"geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Hessen","Sachsen-Anhalt","Nordrhein-Westfalen","Saarland"],"c":1,"img":null,"tq":"Bugünkü Alman eyaletlerinden hangisi eskiden DDR (Doğu Almanya) topraklarındaydı?","ta":["Hessen","Sachsen-Anhalt","Nordrhein-Westfalen","Saarland"],"exp":"Doğru cevap Sachsen-Anhalt. Başkenti Magdeburg olan Sachsen-Anhalt, eski DDR'nin beş eyaletinden biridir. Hessen, Nordrhein-Westfalen ve Saarland ise eski Batı Almanya eyaletleridir."},{"id":"G196","n":196,"scope":"general","cat":"geschichte","q":"Warum nennt man die Zeit im Herbst 1989 in der DDR \"Die Wende\"? In dieser Zeit veränderte sich die DDR politisch …","a":["von einer Diktatur zur Demokratie.","von einer liberalen Marktwirtschaft zum Sozialismus.","von einer Monarchie zur Sozialdemokratie.","von einem religiösen Staat zu einem kommunistischen Staat."],"c":0,"img":null,"tq":"1989 sonbaharındaki döneme DDR'de (Doğu Almanya) neden \"Die Wende\" (Dönüm Noktası) denir? Bu dönemde DDR siyasi olarak … dönüştü.","ta":["bir diktatörlükten demokrasiye.","liberal bir piyasa ekonomisinden sosyalizme.","bir monarşiden sosyal demokrasiye.","dinî bir devletten komünist bir devlete."],"exp":"Doğru cevap: bir diktatörlükten demokrasiye. 1989 sonbaharında kitlesel gösteriler SED diktatörlüğünü çökertti; Mart 1990'da DDR tarihindeki ilk özgür seçimler yapıldı. Bu köklü değişim \"Wende\" (dönüş, dönüm noktası) olarak adlandırılır."},{"id":"G197","n":197,"scope":"general","cat":"geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Thüringen","Hessen","Bayern","Bremen"],"c":0,"img":null,"tq":"Bugünkü Alman eyaletlerinden hangisi eskiden DDR (Doğu Almanya) topraklarındaydı?","ta":["Thüringen","Hessen","Bayern","Bremen"],"exp":"Doğru cevap Thüringen. Başkenti Erfurt olan Thüringen, 1990'da Federal Almanya'ya katılan beş yeni eyaletten biridir. Hessen, Bayern ve Bremen eski Batı Almanya'da yer alıyordu."},{"id":"G198","n":198,"scope":"general","cat":"geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Bayern","Niedersachsen","Sachsen","Baden-Württemberg"],"c":2,"img":null,"tq":"Bugünkü Alman eyaletlerinden hangisi eskiden DDR (Doğu Almanya) topraklarındaydı?","ta":["Bayern","Niedersachsen","Sachsen","Baden-Württemberg"],"exp":"Doğru cevap Sachsen. Başkenti Dresden olan Sachsen, eski DDR'nin en kalabalık eyaletidir; 1989 Pazartesi gösterileri de Sachsen'deki Leipzig'de başladı. Bayern, Niedersachsen ve Baden-Württemberg ise Batı Almanya eyaletleridir."},{"id":"G199","n":199,"scope":"general","cat":"geschichte","q":"Mit der Abkürzung \"Stasi\" meinte man in der DDR …","a":["das Parlament.","das Ministerium für Staatssicherheit.","eine regierende Partei.","das Ministerium für Volksbildung."],"c":1,"img":null,"tq":"DDR'de (Doğu Almanya) \"Stasi\" kısaltmasıyla … kastedilirdi.","ta":["parlamento.","Devlet Güvenlik Bakanlığı.","iktidardaki bir parti.","Halk Eğitimi Bakanlığı."],"exp":"Doğru cevap: Devlet Güvenlik Bakanlığı. \"Stasi\", Ministerium für Staatssicherheit (Devlet Güvenlik Bakanlığı) adının kısaltmasıdır; DDR'nin gizli servisiydi ve yüz binlerce gayriresmî muhbirle kendi halkını izliyordu. İktidar partisi SED, parlamento ise Volkskammer adını taşıyordu."},{"id":"G200","n":200,"scope":"general","cat":"geschichte","q":"Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?","a":["Hessen","Schleswig-Holstein","Mecklenburg-Vorpommern","Saarland"],"c":2,"img":null,"tq":"Bugünkü Alman eyaletlerinden hangisi eskiden DDR (Doğu Almanya) topraklarındaydı?","ta":["Hessen","Schleswig-Holstein","Mecklenburg-Vorpommern","Saarland"],"exp":"Doğru cevap Mecklenburg-Vorpommern. Baltık Denizi kıyısındaki bu eyalet, başkenti Schwerin ile eski DDR'nin beş eyaletinden biridir. Schleswig-Holstein de kuzeydedir ama hep Batı Almanya'ya aitti; Hessen ve Saarland da öyle."},{"id":"G201","n":201,"scope":"general","cat":"geschichte","q":"Welche der folgenden Auflistungen enthält nur Bundesländer, die zum Gebiet der früheren DDR gehörten?","a":["Niedersachsen, Nordrhein-Westfalen, Hessen, Schleswig-Holstein, Brandenburg","Mecklenburg-Vorpommern, Brandenburg, Sachsen, Sachsen-Anhalt, Thüringen","Bayern, Baden-Württemberg, Rheinland-Pfalz, Thüringen, Sachsen","Sachsen, Thüringen, Hessen, Niedersachen, Brandenburg"],"c":1,"img":null,"tq":"Aşağıdaki listelerden hangisi yalnızca eski DDR (Doğu Almanya) topraklarında yer alan eyaletleri içerir?","ta":["Niedersachsen, Nordrhein-Westfalen, Hessen, Schleswig-Holstein, Brandenburg","Mecklenburg-Vorpommern, Brandenburg, Sachsen, Sachsen-Anhalt, Thüringen","Bayern, Baden-Württemberg, Rheinland-Pfalz, Thüringen, Sachsen","Sachsen, Thüringen, Hessen, Niedersachen, Brandenburg"],"exp":"Doğru cevap: Mecklenburg-Vorpommern, Brandenburg, Sachsen, Sachsen-Anhalt, Thüringen. Bunlar 1990'da Federal Almanya'ya katılan beş \"yeni eyalet\"tir. Diğer listelerin her birinde en az bir Batı Almanya eyaleti (Hessen, Bayern, Niedersachsen gibi) bulunur; tek bir yanlış isim bile listeyi geçersiz kılar."},{"id":"G202","n":202,"scope":"general","cat":"geschichte","q":"Zu wem gehörte die DDR im \"Kalten Krieg\"?","a":["zu den Westmächten","zum Warschauer Pakt","zur NATO","zu den blockfreien Staaten"],"c":1,"img":null,"tq":"DDR (Doğu Almanya) \"Soğuk Savaş\" döneminde kime aitti?","ta":["Batılı güçlere","Varşova Paktı'na","NATO'ya","bağlantısız ülkelere"],"exp":"Doğru cevap: Varşova Paktı'na. DDR, Sovyetler Birliği'nin önderliğindeki Doğu Bloku'nun parçasıydı ve 1955'te kurulan Varşova Paktı askerî ittifakına üyeydi. Federal Almanya ise aynı yıl Batı'nın ittifakı NATO'ya katıldı."},{"id":"G203","n":203,"scope":"general","cat":"geschichte","q":"Wie hieß das Wirtschaftssystem der DDR?","a":["Marktwirtschaft","Planwirtschaft","Angebot und Nachfrage","Kapitalismus"],"c":1,"img":null,"tq":"DDR'nin (Doğu Almanya) ekonomik sisteminin adı neydi?","ta":["Piyasa ekonomisi","Planlı ekonomi","Arz ve talep","Kapitalizm"],"exp":"Doğru cevap: Planlı ekonomi. DDR'de üretim, fiyatlar ve dağıtım arz ve talebe göre değil, devletin beş yıllık planlarına göre merkezî olarak belirleniyordu; işletmeler büyük ölçüde devlete aitti. Federal Almanya'nın modeli ise sosyal piyasa ekonomisidir."},{"id":"G204","n":204,"scope":"general","cat":"geschichte","q":"Wie wurden die Bundesrepublik Deutschland und die DDR zu einem Staat?","a":["Die Bundesrepublik hat die DDR besetzt.","Die heutigen fünf östlichen Bundesländer sind der Bundesrepublik Deutschland beigetreten.","Die westlichen Bundesländer sind der DDR beigetreten.","Die DDR hat die Bundesrepublik Deutschland besetzt."],"c":1,"img":null,"tq":"Federal Almanya Cumhuriyeti ile DDR (Doğu Almanya) nasıl tek bir devlet oldu?","ta":["Federal Almanya DDR'yi işgal etti.","Bugünkü beş doğu eyaleti Federal Almanya Cumhuriyeti'ne katıldı.","Batı eyaletleri DDR'ye katıldı.","DDR Federal Almanya Cumhuriyeti'ni işgal etti."],"exp":"Doğru cevap: Bugünkü beş doğu eyaleti Federal Almanya Cumhuriyeti'ne katıldı. Birleşme bir işgal değil, DDR'nin özgürce seçilmiş parlamentosunun aldığı katılma kararıyla gerçekleşti: 3 Ekim 1990'da yeniden kurulan beş doğu eyaleti Grundgesetz'in (Temel Yasa) geçerlilik alanına girdi."},{"id":"G205","n":205,"scope":"general","cat":"geschichte","q":"Mit dem Beitritt der DDR zur Bundesrepublik Deutschland gehören die neuen Bundesländer nun auch …","a":["zur Europäischen Union.","zum Warschauer Pakt.","zur OPEC.","zur Europäischen Verteidigungsgemeinschaft."],"c":0,"img":null,"tq":"DDR'nin (Doğu Almanya) Federal Almanya Cumhuriyeti'ne katılmasıyla yeni eyaletler artık aynı zamanda … dahildir.","ta":["Avrupa Birliği'ne","Varşova Paktı'na","OPEC'e","Avrupa Savunma Topluluğu'na"],"exp":"Doğru cevap: Avrupa Birliği'ne. Federal Almanya zaten Avrupa Topluluğu üyesi olduğundan, 1990'da katılan beş yeni eyalet otomatik olarak bu topluluğun (bugünkü AB) parçası oldu. Varşova Paktı ise DDR'nin eski ittifakıydı ve 1991'de dağıldı."},{"id":"G206","n":206,"scope":"general","cat":"geschichte","q":"Woran erinnern die sogenannten „Stolpersteine“ in Deutschland?","a":["an berühmte deutsche Politikerinnen und Politiker","an die Opfer des Nationalsozialismus","an Verkehrstote","an bekannte jüdische Musiker"],"c":1,"img":null,"tq":"Almanya'daki \"Stolpersteine\" (tökezleme taşları) neyi hatırlatır?","ta":["ünlü Alman siyasetçileri","Nasyonal Sosyalizm kurbanlarını","trafik kazalarında ölenleri","tanınmış Yahudi müzisyenleri"],"exp":"Doğru cevap: Nasyonal Sosyalizm kurbanlarını. Stolpersteine, kaldırımlara gömülen küçük pirinç plakalardır; her biri Nazi döneminde sürülen ya da öldürülen bir kişinin son oturduğu evin önüne konur ve adını, doğum yılını ve akıbetini taşır. Sanatçı Gunter Demnig'in başlattığı proje Avrupa'ya yayılmıştır."},{"id":"G207","n":207,"scope":"general","cat":"geschichte","q":"In welchem Militärbündnis war die DDR Mitglied?","a":["in der NATO","im Rheinbund","im Warschauer Pakt","im Europabündnis"],"c":2,"img":null,"tq":"DDR (Doğu Almanya) hangi askerî ittifakın üyesiydi?","ta":["NATO'nun","Rheinbund'un (Ren Konfederasyonu)","Varşova Paktı'nın","Avrupa İttifakı'nın"],"exp":"Doğru cevap: Varşova Paktı'nın. DDR, 1955'te Sovyetler Birliği önderliğinde kurulan bu Doğu Bloku askerî ittifakına üyeydi; Batı Almanya ise NATO'dadır. Rheinbund (Ren Konfederasyonu) Napolyon döneminden (1806) kalma tarihî bir birliktir ve DDR ile ilgisi yoktur."},{"id":"G208","n":208,"scope":"general","cat":"geschichte","q":"Was war die \"Stasi\"?","a":["der Geheimdienst im \"Dritten Reich\"","eine berühmte deutsche Gedenkstätte","der Geheimdienst der DDR","ein deutscher Sportverein während des Zweiten Weltkrieges"],"c":2,"img":null,"tq":"\"Stasi\" neydi?","ta":["\"Drittes Reich\"ın (Üçüncü İmparatorluk) gizli servisi","ünlü bir Alman anma yeri","DDR'nin (Doğu Almanya) gizli servisi","İkinci Dünya Savaşı sırasında bir Alman spor kulübü"],"exp":"Doğru cevap: DDR'nin gizli servisi. Stasi (Ministerium für Staatssicherheit, Devlet Güvenlik Bakanlığı), 1950–1990 yılları arasında DDR vatandaşlarını izleyen, muhalifleri baskı altına alan gizli polisti. Nazi döneminin gizli polisi ise Gestapo'ydu; ikisini karıştırmayın."},{"id":"G209","n":209,"scope":"general","cat":"geschichte","q":"Welches war das Wappen der Deutschen Demokratischen Republik?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":3,"img":{"kind":"options","urls":["https://upload.wikimedia.org/wikipedia/commons/d/da/Coat_of_arms_of_Germany.svg","","","https://upload.wikimedia.org/wikipedia/commons/c/c1/Coat_of_arms_of_East_Germany_%281955%E2%80%931990%29.svg"],"note":"Bild 1 = Bundeswappen (Bundesadler); Bild 2 = Christusmonogramm (Chi-Rho); Bild 3 = Eisernes Kreuz (Bundeswehr); Bild 4 = Staatswappen der DDR. Nur fuer Bild 1 und 4 sind Commons-URLs hinterlegt (leerer String bei 2/3)."},"tq":"Alman Demokratik Cumhuriyeti'nin (DDR) arması hangisiydi?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 4: çekiç, pergel ve başak çelenginden oluşan DDR arması. Çekiç işçileri, pergel aydınları, başak çelengi köylüleri simgeler. Resim 1 Federal Almanya'nın kartalı (Bundesadler), Resim 2 Hristiyan Chi-Rho monogramı, Resim 3 ise Bundeswehr'in (Alman ordusu) Demir Haç'ıdır."},{"id":"G210","n":210,"scope":"general","cat":"geschichte","q":"Was ereignete sich am 17. Juni 1953 in der DDR?","a":["der feierliche Beitritt zum Warschauer Pakt","landesweite Streiks und ein Volksaufstand","der 1. SED-Parteitag","der erste Besuch Fidel Castros"],"c":1,"img":null,"tq":"17 Haziran 1953'te DDR'de (Doğu Almanya) ne oldu?","ta":["Varşova Paktı'na törenle katılım","ülke çapında grevler ve bir halk ayaklanması","1. SED Parti Kongresi","Fidel Castro'nun ilk ziyareti"],"exp":"Doğru cevap: 17 Haziran 1953'te Doğu Almanya'da (DDR) ülke çapında grevler ve bir halk ayaklanması yaşandı; çalışma normlarının artırılmasına karşı başlayan protestolar Sovyet tankları ve birlikleriyle bastırıldı. 17 Haziran, 1990'a kadar Batı Almanya'da 'Alman Birliği Günü' olarak anıldı."},{"id":"G211","n":211,"scope":"general","cat":"geschichte","q":"Welcher Politiker steht für die \"Ostverträge\"?","a":["Helmut Kohl","Willy Brandt","Michail Gorbatschow","Ludwig Erhard"],"c":1,"img":null,"tq":"Hangi siyasetçi \"Ostverträge\" (Doğu Antlaşmaları) ile özdeşleşmiştir?","ta":["Helmut Kohl","Willy Brandt","Michail Gorbatschow","Ludwig Erhard"],"exp":"Doğru cevap Willy Brandt. SPD'li Federal Başbakan Brandt, 1970'lerin başında Sovyetler Birliği, Polonya ve DDR ile yakınlaşma antlaşmaları imzaladı; bu \"Ostpolitik\" (Doğu Politikası) ona 1971 Nobel Barış Ödülü'nü kazandırdı. Helmut Kohl ise yaklaşık 20 yıl sonra yeniden birleşmenin başbakanıdır."},{"id":"G212","n":212,"scope":"general","cat":"geschichte","q":"Wie heißt Deutschland mit vollem Namen?","a":["Bundesstaat Deutschland","Bundesländer Deutschland","Bundesrepublik Deutschland","Bundesbezirk Deutschland"],"c":2,"img":null,"tq":"Almanya'nın tam adı nedir?","ta":["Bundesstaat Deutschland (Almanya Federal Devleti)","Bundesländer Deutschland (Almanya Federal Eyaletleri)","Bundesrepublik Deutschland (Federal Almanya Cumhuriyeti)","Bundesbezirk Deutschland (Almanya Federal Bölgesi)"],"exp":"Doğru cevap Bundesrepublik Deutschland (Federal Almanya Cumhuriyeti). Bu ad 1949'dan beri kullanılır ve iki şeyi vurgular: devlet bir cumhuriyettir (monarşi değil) ve federal yapıdadır, yani 16 eyaletten (Bundesländer) oluşur. Kısaltması BRD'dir."},{"id":"G213","n":213,"scope":"general","cat":"geschichte","q":"Wie viele Einwohner hat Deutschland?","a":["70 Millionen","78 Millionen","84 Millionen","90 Millionen"],"c":2,"img":null,"tq":"Almanya'nın kaç nüfusu vardır?","ta":["70 milyon","78 milyon","84 milyon","90 milyon"],"exp":"Doğru cevap 84 milyon. Almanya'nın nüfusu 2022'den beri yaklaşık 83–84 milyon kişidir ve ülke Avrupa Birliği'nin en kalabalık üyesidir. Sınavda yalnızca bu değer doğru kabul edilir; eski kaynaklardaki 80 milyon gibi rakamlara göre değil, bu seçeneğe göre cevap verin."},{"id":"G214","n":214,"scope":"general","cat":"geschichte","q":"Welche Farben hat die deutsche Flagge?","a":["schwarz-rot-gold","rot-weiß-schwarz","schwarz-rot-grün","schwarz-gelb-rot"],"c":0,"img":null,"tq":"Alman bayrağının renkleri nelerdir?","ta":["siyah-kırmızı-altın sarısı","kırmızı-beyaz-siyah","siyah-kırmızı-yeşil","siyah-sarı-kırmızı"],"exp":"Doğru cevap: siyah-kırmızı-altın sarısı (schwarz-rot-gold). Renkler yukarıdan aşağıya bu sırayla yatay üç şerit halindedir ve Grundgesetz'in (Temel Yasa) 22. maddesinde yazılıdır. Kırmızı-beyaz-siyah ise Alman İmparatorluğu'nun (1871–1918) bayrağıydı."},{"id":"G215","n":215,"scope":"general","cat":"geschichte","q":"Wer wird als \"Kanzler der Deutschen Einheit\" bezeichnet?","a":["Gerhard Schröder","Helmut Kohl","Konrad Adenauer","Helmut Schmidt"],"c":1,"img":null,"tq":"Kim \"Alman Birliği'nin Başbakanı\" olarak anılır?","ta":["Gerhard Schröder","Helmut Kohl","Konrad Adenauer","Helmut Schmidt"],"exp":"Doğru cevap Helmut Kohl. CDU'lu Kohl, 1982–1998 yılları arasında 16 yıl Federal Başbakanlık yaptı ve 1990'daki yeniden birleşme sürecini yönetti; bu yüzden \"Kanzler der Einheit\" (Birlik Başbakanı) olarak anılır. Adenauer ise ilk başbakandır, birleşmeyle ilgisi yoktur."},{"id":"G216","n":216,"scope":"general","cat":"geschichte","q":"Welches Symbol ist im Plenarsaal des Deutschen Bundestages zu sehen?","a":["der Bundesadler","die Fahne der Stadt Berlin","der Reichsadler","die Reichskrone"],"c":0,"img":{"kind":"question","urls":[],"note":"Foto des Plenarsaals des Deutschen Bundestages mit dem Bundesadler an der Stirnwand (© Deutscher Bundestag/Janine Schmitz). Kein freies Ersatzbild verifiziert."},"tq":"Alman Bundestag'ının (Federal Meclis) genel kurul salonunda hangi sembol görülür?","ta":["Bundesadler (Federal Kartal)","Berlin şehrinin bayrağı","Reichsadler (Reich Kartalı)","Reichskrone (Reich Tacı)"],"exp":"Doğru cevap Bundesadler (Federal Kartal). Fotoğrafta Bundestag'ın genel kurul salonunun ön duvarındaki büyük kartal görülür; halk arasında tombul görünümünden dolayı \"Fette Henne\" (şişman tavuk) diye anılır. Kartal Almanya'nın devlet sembolüdür; Reichsadler ve Reichskrone imparatorluk dönemine ait tarihî sembollerdir."},{"id":"G217","n":217,"scope":"general","cat":"geschichte","q":"In welchem Zeitraum gab es die Deutsche Demokratische Republik (DDR)?","a":["1919 bis 1927","1933 bis 1945","1945 bis 1961","1949 bis 1990"],"c":3,"img":null,"tq":"Alman Demokratik Cumhuriyeti (DDR) hangi dönemde vardı?","ta":["1919'dan 1927'ye","1933'ten 1945'e","1945'ten 1961'e","1949'dan 1990'a"],"exp":"Doğru cevap 1949'dan 1990'a. DDR, 7 Ekim 1949'da kuruldu ve 3 Ekim 1990'da Federal Almanya'ya katılarak sona erdi; yaklaşık 41 yıl var oldu. 1933–1945 Nazi dönemidir; 1961 ise DDR'nin bitişi değil, Berlin Duvarı'nın inşa edildiği yıldır."},{"id":"G218","n":218,"scope":"general","cat":"geschichte","q":"Wie viele Bundesländer kamen bei der Wiedervereinigung 1990 zur Bundesrepublik Deutschland hinzu?","a":["4","5","6","7"],"c":1,"img":null,"tq":"1990'daki yeniden birleşmede Federal Almanya Cumhuriyeti'ne kaç eyalet eklendi?","ta":["4","5","6","7"],"exp":"Doğru cevap 5. Eski DDR topraklarında yeniden kurulan Brandenburg, Mecklenburg-Vorpommern, Sachsen, Sachsen-Anhalt ve Thüringen 3 Ekim 1990'da Federal Almanya'ya katıldı. Doğu Berlin ise yeni bir eyalet olmadı, Berlin eyaletiyle birleşti; böylece eyalet sayısı 11'den 16'ya çıktı."},{"id":"G219","n":219,"scope":"general","cat":"geschichte","q":"Die Bundesrepublik Deutschland hat die Grenzen von heute seit …","a":["1933","1949","1971","1990"],"c":3,"img":null,"tq":"Federal Almanya Cumhuriyeti bugünkü sınırlarına … yılından beri sahiptir.","ta":["1933","1949","1971","1990"],"exp":"Doğru cevap 1990. Almanya bugünkü sınırlarına yeniden birleşmeyle, 3 Ekim 1990'da kavuştu; aynı yıl Polonya ile Oder-Neisse sınırı da kesin olarak tanındı. 1949'da kurulan Federal Almanya yalnızca Batı Almanya topraklarını kapsıyordu."},{"id":"G220","n":220,"scope":"general","cat":"geschichte","q":"Der 27. Januar ist in Deutschland ein offizieller Gedenktag. Woran erinnert dieser Tag?","a":["an das Ende des Zweiten Weltkrieges","an die Verabschiedung des Grundgesetzes","an die Wiedervereinigung Deutschlands","an die Opfer des Nationalsozialismus (Tag der Befreiung des Vernichtungslagers Auschwitz)"],"c":3,"img":null,"tq":"27 Ocak Almanya'da resmî bir anma günüdür. Bu gün neyi hatırlatır?","ta":["İkinci Dünya Savaşı'nın sona ermesini","Grundgesetz'in (Temel Yasa/Anayasa) kabul edilmesini","Almanya'nın yeniden birleşmesini","Nasyonal Sosyalizm kurbanlarını (Auschwitz imha kampının kurtarılış günü)"],"exp":"Doğru cevap: Nasyonal Sosyalizm kurbanlarını. 27 Ocak 1945'te Sovyet askerleri Auschwitz imha kampını kurtardı; Almanya 1996'dan beri bu günü Nazi kurbanlarını anma günü olarak yaşatır; 2005'ten beri de uluslararası Holokost Anma Günü'dür. Savaşın sonu 8 Mayıs, birleşme 3 Ekim, Grundgesetz ise 23 Mayıs'tır."},{"id":"G221","n":221,"scope":"general","cat":"geschichte","q":"Deutschland ist Mitglied des Schengener Abkommens. Was bedeutet das?","a":["Deutsche können in viele Länder Europas ohne Passkontrolle reisen.","Alle Menschen können ohne Personenkontrolle in Deutschland einreisen.","Deutsche können ohne Passkontrolle in jedes Land reisen.","Deutsche können in jedem Land mit dem Euro bezahlen."],"c":0,"img":null,"tq":"Almanya Schengen Anlaşması'nın üyesidir. Bu ne anlama gelir?","ta":["Almanlar Avrupa'nın birçok ülkesine pasaport kontrolü olmadan seyahat edebilir.","Herkes kimlik kontrolü olmadan Almanya'ya girebilir.","Almanlar her ülkeye pasaport kontrolü olmadan seyahat edebilir.","Almanlar her ülkede euro ile ödeme yapabilir."],"exp":"Doğru cevap: Almanlar Avrupa'nın birçok ülkesine pasaport kontrolü olmadan seyahat edebilir. Schengen Bölgesi'ne üye ülkeler arasındaki iç sınırlarda düzenli kişi kontrolü yapılmaz. Dikkat: bu her ülke için geçerli değildir ve dış sınırlarda kontrol sürer; euro ise Schengen'den ayrı bir konudur."},{"id":"G222","n":222,"scope":"general","cat":"geschichte","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Ungarn","Portugal","Spanien","Schweiz"],"c":3,"img":null,"tq":"Hangi ülke Almanya'nın komşusudur?","ta":["Macaristan","Portekiz","İspanya","İsviçre"],"exp":"Doğru cevap İsviçre. İsviçre, Almanya'nın güneyinde Bodensee (Konstanz Gölü) ve Ren Nehri boyunca komşusudur. Almanya'nın toplam dokuz komşusu vardır: Danimarka, Polonya, Çekya, Avusturya, İsviçre, Fransa, Lüksemburg, Belçika ve Hollanda. Macaristan, İspanya ve Portekiz bu listede yoktur."},{"id":"G223","n":223,"scope":"general","cat":"geschichte","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Rumänien","Bulgarien","Polen","Griechenland"],"c":2,"img":null,"tq":"Hangi ülke Almanya'nın komşusudur?","ta":["Romanya","Bulgaristan","Polonya","Yunanistan"],"exp":"Doğru cevap Polonya. Polonya, Almanya'nın doğu komşusudur; sınırı Oder ve Neisse nehirleri boyunca uzanır. Romanya, Bulgaristan ve Yunanistan ise Güneydoğu Avrupa'dadır ve Almanya ile ortak sınırı yoktur."},{"id":"G224","n":224,"scope":"general","cat":"geschichte","q":"Was bedeutet die Abkürzung EU?","a":["Europäische Unternehmen","Europäische Union","Einheitliche Union","Euro Union"],"c":1,"img":null,"tq":"EU kısaltması ne anlama gelir?","ta":["Europäische Unternehmen (Avrupa İşletmeleri)","Europäische Union (Avrupa Birliği)","Einheitliche Union (Tek Tip Birlik)","Euro Union (Euro Birliği)"],"exp":"Doğru cevap Europäische Union (Avrupa Birliği). AB, 27 Avrupa ülkesinin oluşturduğu siyasi ve ekonomik birliktir; bugünkü adını 1993'te yürürlüğe giren Maastricht Antlaşması ile aldı. Almanya kurucu üyelerdendir. Euro ise AB'nin ortak para birimidir, birliğin adı değildir."},{"id":"G225","n":225,"scope":"general","cat":"geschichte","q":"In welchem anderen Land gibt es eine große deutschsprachige Bevölkerung?","a":["Tschechien","Norwegen","Spanien","Österreich"],"c":3,"img":null,"tq":"Başka hangi ülkede büyük bir Almanca konuşan nüfus vardır?","ta":["Çekya","Norveç","İspanya","Avusturya"],"exp":"Doğru cevap Avusturya. Avusturya'nın resmî dili Almancadır ve yaklaşık 9 milyon kişi Almanca konuşur. Almanca ayrıca İsviçre, Lüksemburg, Liechtenstein ve Belçika'nın doğusunda da resmî dildir. Çekya'da Çekçe, Norveç'te Norveççe, İspanya'da İspanyolca konuşulur."},{"id":"G226","n":226,"scope":"general","cat":"geschichte","q":"Welche ist die Flagge der Europäischen Union?","a":["Bild 1","Bild 2","Bild 3","Bild 4"],"c":1,"img":{"kind":"options","urls":["","https://upload.wikimedia.org/wikipedia/commons/b/b7/Flag_of_Europe.svg","",""],"note":"Bild 1 = Flagge der USA (Sternenbanner); Bild 2 = Flagge der Europaeischen Union (zwoelf gelbe Sterne im Kreis auf blauem Grund); Bild 3 = Flagge der Vereinten Nationen; Bild 4 = blaue Flagge mit stilisiertem weissem Symbol (nicht sicher identifiziert). Nur fuer Bild 2 ist eine Commons-URL hinterlegt."},"tq":"Avrupa Birliği'nin bayrağı hangisidir?","ta":["Resim 1","Resim 2","Resim 3","Resim 4"],"exp":"Doğru cevap Resim 2: Mavi zemin üzerinde daire şeklinde dizilmiş 12 sarı yıldız, Avrupa Birliği bayrağıdır. 12 sayısı üye sayısını değil, birlik ve bütünlüğü simgeler. Resim 1 ABD bayrağı, Resim 3 ise Birleşmiş Milletler bayrağıdır."},{"id":"G227","n":227,"scope":"general","cat":"geschichte","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Finnland","Dänemark","Norwegen","Schweden"],"c":1,"img":null,"tq":"Hangi ülke Almanya'nın komşusudur?","ta":["Finlandiya","Danimarka","Norveç","İsveç"],"exp":"Doğru cevap Danimarka: Almanya'nın kuzeyinde kara sınırı olan tek ülkedir. Finlandiya, Norveç ve İsveç de Kuzey Avrupa ülkeleridir ama Almanya ile sınırları yoktur. Almanya'nın toplam 9 komşu ülkesi vardır."},{"id":"G228","n":228,"scope":"general","cat":"geschichte","q":"Wie wird der Beitritt der DDR zur Bundesrepublik Deutschland im Jahr 1990 allgemein genannt?","a":["NATO-Osterweiterung","EU-Osterweiterung","Deutsche Wiedervereinigung","Europäische Gemeinschaft"],"c":2,"img":null,"tq":"Demokratik Alman Cumhuriyeti'nin (DDR) 1990 yılında Federal Almanya Cumhuriyeti'ne katılması genel olarak nasıl adlandırılır?","ta":["NATO'nun doğuya genişlemesi","AB'nin doğuya genişlemesi","Almanya'nın yeniden birleşmesi","Avrupa Topluluğu"],"exp":"Doğru cevap Almanya'nın yeniden birleşmesidir (Deutsche Wiedervereinigung): Doğu Almanya (DDR) 3 Ekim 1990'da Federal Almanya'ya katıldı. Bu tarih bugün Alman Birliği Günü olarak ulusal bayramdır. NATO ve AB'nin doğuya genişlemesi daha sonraki, farklı olaylardır."},{"id":"G229","n":229,"scope":"general","cat":"geschichte","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Spanien","Bulgarien","Norwegen","Luxemburg"],"c":3,"img":null,"tq":"Hangi ülke Almanya'nın komşusudur?","ta":["İspanya","Bulgaristan","Norveç","Lüksemburg"],"exp":"Doğru cevap Lüksemburg: Almanya'nın batısında yer alan küçük komşu ülkedir. İspanya, Bulgaristan ve Norveç'in Almanya ile sınırı yoktur. Almanya'nın 9 komşusu: Danimarka, Polonya, Çekya, Avusturya, İsviçre, Fransa, Lüksemburg, Belçika ve Hollanda."},{"id":"G230","n":230,"scope":"general","cat":"geschichte","q":"Das Europäische Parlament wird regelmäßig gewählt, nämlich alle …","a":["5 Jahre.","6 Jahre.","7 Jahre.","8 Jahre."],"c":0,"img":null,"tq":"Avrupa Parlamentosu düzenli olarak seçilir, yani her …","ta":["5 yılda bir.","6 yılda bir.","7 yılda bir.","8 yılda bir."],"exp":"Doğru cevap 5 yılda bir: Avrupa Parlamentosu seçimleri 1979'dan beri her beş yılda bir yapılır. Son seçim 2024'te yapıldı, bir sonraki 2029'dadır. Hatırlatma: Bundestag (Federal Meclis) 4 yıl, Avrupa Parlamentosu 5 yıl için seçilir."},{"id":"G231","n":231,"scope":"general","cat":"geschichte","q":"Was bedeutet der Begriff \"europäische Integration\"?","a":["Damit sind amerikanische Einwanderinnen und Einwanderer in Europa gemeint.","Der Begriff meint den Einwanderungsstopp nach Europa.","Damit sind europäische Auswanderinnen und Auswanderer in den USA gemeint.","Der Begriff meint den Zusammenschluss europäischer Staaten zur EU."],"c":3,"img":null,"tq":"\"Avrupa entegrasyonu\" kavramı ne anlama gelir?","ta":["Bununla Avrupa'daki Amerikalı göçmenler kastedilir.","Bu kavram, Avrupa'ya göçün durdurulmasını ifade eder.","Bununla ABD'deki Avrupalı göçmenler kastedilir.","Bu kavram, Avrupa devletlerinin AB çatısı altında birleşmesini ifade eder."],"exp":"Doğru cevap Avrupa devletlerinin AB çatısı altında birleşmesidir. Avrupa entegrasyonu, ülkelerin ekonomik ve siyasi olarak giderek daha sıkı bir birlik oluşturmasıdır; göçle ilgisi yoktur. Bu süreç 1950'lerde kömür ve çelik alanındaki iş birliğiyle başladı."},{"id":"G232","n":232,"scope":"general","cat":"geschichte","q":"Wer wird bei der Europawahl gewählt?","a":["die Europäische Kommission","die Länder, die in die EU eintreten dürfen","die Abgeordneten des Europäischen Parlaments","die europäische Verfassung"],"c":2,"img":null,"tq":"Avrupa seçimlerinde (Europawahl) kim seçilir?","ta":["Avrupa Komisyonu","AB'ye girmesine izin verilen ülkeler","Avrupa Parlamentosu milletvekilleri","Avrupa anayasası"],"exp":"Doğru cevap Avrupa Parlamentosu milletvekilleridir. AB vatandaşları her 5 yılda bir Avrupa Parlamentosu'ndaki temsilcilerini doğrudan seçer. Avrupa Komisyonu halk tarafından seçilmez; hangi ülkelerin üye olacağı ve anayasa konuları da seçimle belirlenmez."},{"id":"G233","n":233,"scope":"general","cat":"geschichte","q":"Welches Land ist ein Nachbarland von Deutschland?","a":["Tschechien","Bulgarien","Griechenland","Portugal"],"c":0,"img":null,"tq":"Hangi ülke Almanya'nın komşusudur?","ta":["Çekya","Bulgaristan","Yunanistan","Portekiz"],"exp":"Doğru cevap Çekya (Tschechien): Almanya'nın doğusunda ve güneydoğusunda uzun bir kara sınırı vardır. Bulgaristan, Yunanistan ve Portekiz Almanya'dan uzaktadır ve ortak sınırları yoktur."},{"id":"G234","n":234,"scope":"general","cat":"geschichte","q":"Wo ist ein Sitz des Europäischen Parlaments?","a":["London","Paris","Berlin","Straßburg"],"c":3,"img":null,"tq":"Avrupa Parlamentosu'nun bir merkezi nerededir?","ta":["Londra","Paris","Berlin","Strazburg"],"exp":"Doğru cevap Strazburg (Straßburg): Fransa'daki bu şehir Avrupa Parlamentosu'nun resmi merkezidir ve genel kurul oturumları burada yapılır. Parlamento ayrıca Brüksel ve Lüksemburg'da çalışır. Londra, Paris ve Berlin'de bir AB kurumunun merkezi yoktur."},{"id":"G235","n":235,"scope":"general","cat":"geschichte","q":"Der damalige französische Staatspräsident François Mitterrand und der damalige deutsche Bundeskanzler Helmut Kohl gedenken in Verdun gemeinsam der Toten beider Weltkriege. Welches Ziel der Europäischen Union wird bei diesem Treffen deutlich?","a":["Freundschaft zwischen England und Deutschland","Reisefreiheit in alle Länder der EU","Frieden und Sicherheit in den Ländern der EU","einheitliche Feiertage in den Ländern der EU"],"c":2,"img":{"kind":"question","urls":[],"note":"Foto: Francois Mitterrand und Helmut Kohl Hand in Hand vor dem Beinhaus von Douaumont, Verdun, 22.9.1984 (© Bundesregierung/Richard Schulze-Vorberg). Kein freies Ersatzbild verifiziert."},"tq":"Dönemin Fransa Cumhurbaşkanı François Mitterrand ve dönemin Almanya Federal Başbakanı (Bundeskanzler) Helmut Kohl, Verdun'de iki dünya savaşının ölülerini birlikte anıyor. Bu buluşmada Avrupa Birliği'nin hangi hedefi belirginleşiyor?","ta":["İngiltere ile Almanya arasındaki dostluk","AB'nin tüm ülkelerine seyahat özgürlüğü","AB ülkelerinde barış ve güvenlik","AB ülkelerinde ortak resmi tatiller"],"exp":"Doğru cevap AB ülkelerinde barış ve güvenliktir. 1984'te Verdun'de Kohl ve Mitterrand'ın el ele durması, eski düşmanlar Almanya ve Fransa'nın barışmasını simgeler. Avrupa'da kalıcı barış, AB'nin en temel hedefidir. Dikkat: Dostluk Fransa ile kuruldu, İngiltere ile değil."},{"id":"G236","n":236,"scope":"general","cat":"geschichte","q":"Wie viele Mitgliedstaaten hat die EU heute?","a":["21","23","25","27"],"c":3,"img":null,"tq":"AB'nin bugün kaç üye devleti vardır?","ta":["21","23","25","27"],"exp":"Doğru cevap 27: Birleşik Krallık'ın 2020'de ayrılmasından (Brexit) beri AB'nin 27 üye devleti vardır. En son katılan ülke 2013'te Hırvatistan oldu. Almanya, 1957'deki altı kurucu üyeden biridir."},{"id":"G237","n":237,"scope":"general","cat":"geschichte","q":"2007 wurde das 50-jährige Jubiläum der \"Römischen Verträge\" gefeiert. Was war der Inhalt der Verträge?","a":["Beitritt Deutschlands zur NATO","Gründung der Europäischen Wirtschaftsgemeinschaft (EWG)","Verpflichtung Deutschlands zu Reparationsleistungen","Festlegung der Oder-Neiße-Linie als Ostgrenze"],"c":1,"img":null,"tq":"2007 yılında \"Roma Antlaşmaları\"nın 50. yıl dönümü kutlandı. Antlaşmaların içeriği neydi?","ta":["Almanya'nın NATO'ya katılması","Avrupa Ekonomik Topluluğu'nun (AET/EWG) kurulması","Almanya'nın savaş tazminatı ödeme yükümlülüğü","Oder-Neisse hattının doğu sınırı olarak belirlenmesi"],"exp":"Doğru cevap Avrupa Ekonomik Topluluğu'nun (EWG) kurulmasıdır. Roma Antlaşmaları 25 Mart 1957'de altı ülke (Almanya, Fransa, İtalya, Belçika, Hollanda, Lüksemburg) tarafından imzalandı ve bugünkü AB'nin temelini attı. 1957 + 50 = 2007 hesabı yıl dönümünü verir."},{"id":"G238","n":238,"scope":"general","cat":"geschichte","q":"An welchen Orten arbeitet das Europäische Parlament?","a":["Paris, London und Den Haag","Straßburg, Luxemburg und Brüssel","Rom, Bern und Wien","Bonn, Zürich und Mailand"],"c":1,"img":null,"tq":"Avrupa Parlamentosu hangi yerlerde çalışır?","ta":["Paris, Londra ve Lahey","Strazburg, Lüksemburg ve Brüksel","Roma, Bern ve Viyana","Bonn, Zürih ve Milano"],"exp":"Doğru cevap Strazburg, Lüksemburg ve Brüksel'dir. Genel kurul oturumları Strazburg'da, komisyon toplantıları çoğunlukla Brüksel'de yapılır; genel sekreterlik Lüksemburg'dadır. Bern ve Zürih İsviçre'de, Londra ise AB dışındadır."},{"id":"G239","n":239,"scope":"general","cat":"geschichte","q":"Durch welche Verträge schloss sich die Bundesrepublik Deutschland mit anderen Staaten zur Europäischen Wirtschaftsgemeinschaft zusammen?","a":["durch die \"Hamburger Verträge\"","durch die \"Römischen Verträge\"","durch die \"Pariser Verträge\"","durch die \"Londoner Verträge\""],"c":1,"img":null,"tq":"Federal Almanya Cumhuriyeti hangi antlaşmalarla diğer devletlerle birleşerek Avrupa Ekonomik Topluluğu'nu oluşturdu?","ta":["\"Hamburg Antlaşmaları\" ile","\"Roma Antlaşmaları\" ile","\"Paris Antlaşmaları\" ile","\"Londra Antlaşmaları\" ile"],"exp":"Doğru cevap Roma Antlaşmaları'dır: 1957'de Roma'da imzalanan bu antlaşmalarla Avrupa Ekonomik Topluluğu (EWG) kuruldu. Hatırlatma: Roma = EWG'nin doğum yeri. Paris Antlaşmaları (1954) ise Almanya'nın egemenliği ve NATO üyeliğiyle ilgilidir."},{"id":"G240","n":240,"scope":"general","cat":"geschichte","q":"Seit wann bezahlt man in Deutschland mit dem Euro in bar?","a":["1995","1998","2002","2005"],"c":2,"img":null,"tq":"Almanya'da ne zamandan beri nakit olarak euro ile ödeme yapılıyor?","ta":["1995","1998","2002","2005"],"exp":"Doğru cevap 2002: Euro banknot ve madeni paraları 1 Ocak 2002'de tedavüle girdi ve Alman Markı'nın yerini aldı. Euro 1999'dan itibaren yalnızca kaydi para (hesap parası) olarak vardı; nakit kullanım 2002'de başladı."},{"id":"G241","n":241,"scope":"general","cat":"gesellschaft","q":"Frau Seger bekommt ein Kind. Was muss sie tun, um Elterngeld zu erhalten?","a":["Sie muss an ihre Krankenkasse schreiben.","Sie muss einen Antrag bei der Elterngeldstelle stellen.","Sie muss nichts tun, denn sie bekommt automatisch Elterngeld.","Sie muss das Arbeitsamt um Erlaubnis bitten."],"c":1,"img":null,"tq":"Bayan Seger'in bir çocuğu oluyor. Ebeveyn parası (Elterngeld) alabilmek için ne yapması gerekir?","ta":["Sağlık sigortasına yazmalıdır.","Elterngeld dairesine (Elterngeldstelle) başvuru yapmalıdır.","Hiçbir şey yapmasına gerek yoktur, çünkü Elterngeld'i otomatik olarak alır.","İş kurumundan (Arbeitsamt) izin istemelidir."],"exp":"Doğru cevap Elterngeldstelle'ye başvuru yapmaktır. Elterngeld (ebeveyn parası) otomatik ödenmez; doğumdan sonra yazılı bir başvuru gerekir. Sağlık sigortası veya iş kurumu bu ödemeden sorumlu değildir. İpucu: Almanya'da sosyal yardımlar genellikle başvuru (Antrag) ile başlar."},{"id":"G242","n":242,"scope":"general","cat":"gesellschaft","q":"Wer entscheidet, ob ein Kind in Deutschland in den Kindergarten geht?","a":["der Staat","die Bundesländer","die Eltern/die Erziehungsberechtigten","die Schulen"],"c":2,"img":null,"tq":"Almanya'da bir çocuğun anaokuluna (Kindergarten) gidip gitmeyeceğine kim karar verir?","ta":["devlet","eyaletler","ebeveynler/veliler","okullar"],"exp":"Doğru cevap ebeveynler/velilerdir. Almanya'da anaokulu zorunlu değildir; çocuğun gidip gitmeyeceğine aile karar verir. Devlet yalnızca 3 yaşından itibaren bir anaokulu yeri hakkı tanır. Zorunlu olan okuldur (Schulpflicht), anaokulu değil."},{"id":"G243","n":243,"scope":"general","cat":"gesellschaft","q":"Maik und Sybille wollen mit Freunden an ihrem deutschen Wohnort eine Demonstration auf der Straße abhalten. Was müssen sie vorher tun?","a":["Sie müssen die Demonstration anmelden.","Sie müssen nichts tun. Man darf in Deutschland jederzeit überall demonstrieren.","Sie können gar nichts tun, denn Demonstrationen sind in Deutschland grundsätzlich verboten.","Maik und Sybille müssen einen neuen Verein gründen, weil nur Vereine demonstrieren dürfen."],"c":0,"img":null,"tq":"Maik ve Sybille, arkadaşlarıyla birlikte Almanya'da yaşadıkları yerde sokakta bir gösteri düzenlemek istiyor. Önceden ne yapmaları gerekir?","ta":["Gösteriyi önceden bildirmeleri (anmelden) gerekir.","Hiçbir şey yapmaları gerekmez. Almanya'da her zaman her yerde gösteri yapılabilir.","Hiçbir şey yapamazlar, çünkü Almanya'da gösteriler ilke olarak yasaktır.","Maik ve Sybille yeni bir dernek kurmalıdır, çünkü yalnızca dernekler gösteri yapabilir."],"exp":"Doğru cevap: gösteriyi önceden bildirmeleri (anmelden) gerekir. Almanya'da toplanma özgürlüğü temel bir haktır (Temel Yasa madde 8), ama açık havadaki bir gösteri genellikle en geç 48 saat önce yetkili makama bildirilir; izin alınmaz, yalnız bildirilir. Gösteriler yasak değildir ve dernek kurmak gerekmez."},{"id":"G244","n":244,"scope":"general","cat":"gesellschaft","q":"Welchen Schulabschluss braucht man normalerweise, um an einer Universität in Deutschland ein Studium zu beginnen?","a":["das Abitur","ein Diplom","die Prokura","eine Gesellenprüfung"],"c":0,"img":null,"tq":"Almanya'da bir üniversitede öğrenime başlamak için normalde hangi okul diplomasına ihtiyaç vardır?","ta":["Abitur","bir diploma (Diplom)","ticari temsil yetkisi (Prokura)","kalfalık sınavı (Gesellenprüfung)"],"exp":"Doğru cevap Abitur'dur: Lise (Gymnasium) bitirme sınavı olan Abitur, genel üniversiteye giriş hakkı (Hochschulreife) verir. Diplom bir üniversite derecesidir, Prokura ticari bir yetki belgesidir, Gesellenprüfung ise meslek eğitimi sonundaki kalfalık sınavıdır."},{"id":"G245","n":245,"scope":"general","cat":"gesellschaft","q":"Wer darf in Deutschland nicht als Paar zusammenleben?","a":["Hans (20 Jahre) und Marie (19 Jahre)","Tom (20 Jahre) und Klaus (45 Jahre)","Sofie (35 Jahre) und Lisa (40 Jahre)","Anne (13 Jahre) und Tim (25 Jahre)"],"c":3,"img":null,"tq":"Almanya'da kimler çift olarak birlikte yaşayamaz?","ta":["Hans (20 yaşında) ve Marie (19 yaşında)","Tom (20 yaşında) ve Klaus (45 yaşında)","Sofie (35 yaşında) ve Lisa (40 yaşında)","Anne (13 yaşında) ve Tim (25 yaşında)"],"exp":"Doğru cevap Anne (13) ve Tim (25): Anne henüz çocuktur; 14 yaşından küçük biriyle ilişki yasaktır ve suçtur. Diğer üç çift yetişkinlerden oluşur. Almanya'da yetişkinler cinsiyet ve yaş farkı fark etmeksizin çift olarak birlikte yaşayabilir."},{"id":"G246","n":246,"scope":"general","cat":"gesellschaft","q":"Ab welchem Alter ist man in Deutschland volljährig?","a":["16","18","19","21"],"c":1,"img":null,"tq":"Almanya'da kaç yaşından itibaren reşit olunur?","ta":["16","18","19","21"],"exp":"Doğru cevap 18: Almanya'da 18 yaşını dolduran herkes reşit (volljährig) sayılır. Reşit olan kişi Bundestag (Federal Meclis) seçimlerinde oy kullanabilir, sözleşme imzalayabilir ve kararlarını kendisi verir. 16 yaş yalnızca bazı eyalet, yerel ve Avrupa seçimlerinde oy yaşıdır."},{"id":"G247","n":247,"scope":"general","cat":"gesellschaft","q":"Eine Frau ist schwanger. Sie ist kurz vor und nach der Geburt ihres Kindes vom Gesetz besonders beschützt. Wie heißt dieser Schutz?","a":["Elternzeit","Mutterschutz","Geburtsvorbereitung","Wochenbett"],"c":1,"img":null,"tq":"Bir kadın hamiledir. Çocuğunun doğumundan kısa süre önce ve sonra yasa tarafından özel olarak korunur. Bu korumanın adı nedir?","ta":["Ebeveyn izni (Elternzeit)","Annelik koruması (Mutterschutz)","Doğuma hazırlık (Geburtsvorbereitung)","Lohusalık dönemi (Wochenbett)"],"exp":"Doğru cevap Mutterschutz (annelik koruması): Yasa, anneyi genellikle doğumdan 6 hafta önce ve 8 hafta sonra korur; bu dönemde çalışması yasaktır ve işten çıkarılamaz. Elternzeit ise doğumdan sonra her iki ebeveynin de alabileceği daha uzun izindir."},{"id":"G248","n":248,"scope":"general","cat":"gesellschaft","q":"Die Erziehung der Kinder ist in Deutschland vor allem Aufgabe …","a":["des Staates.","der Eltern.","der Großeltern.","der Schulen."],"c":1,"img":null,"tq":"Almanya'da çocukların yetiştirilmesi her şeyden önce … görevidir.","ta":["devletin","ebeveynlerin","büyükanne ve büyükbabaların","okulların"],"exp":"Doğru cevap ebeveynlerin: Grundgesetz'in (Temel Yasa) 6. maddesine göre çocukların bakımı ve yetiştirilmesi ebeveynlerin doğal hakkı ve öncelikli görevidir. Devlet yalnızca gözetir; okullar ve büyükanne-büyükbabalar yardımcı olur, ama sorumluluk ailededir."},{"id":"G249","n":249,"scope":"general","cat":"gesellschaft","q":"Wer ist in Deutschland hauptsächlich verantwortlich für die Kindererziehung?","a":["der Staat","die Eltern","die Verwandten","die Schulen"],"c":1,"img":null,"tq":"Almanya'da çocukların yetiştirilmesinden esas olarak kim sorumludur?","ta":["devlet","ebeveynler","akrabalar","okullar"],"exp":"Doğru cevap ebeveynlerdir. Temel Yasa'ya göre çocuk yetiştirme öncelikle anne ve babanın hakkı ve görevidir. Devlet ancak çocuğun iyiliği tehlikeye girerse (örneğin Jugendamt aracılığıyla) müdahale eder. Okullar eğitim verir ama yetiştirme sorumluluğunu üstlenmez."},{"id":"G250","n":250,"scope":"general","cat":"gesellschaft","q":"In Deutschland hat man die besten Chancen auf einen gut bezahlten Arbeitsplatz, wenn man …","a":["katholisch ist.","gut ausgebildet ist.","eine Frau ist.","Mitglied einer Partei ist."],"c":1,"img":null,"tq":"Almanya'da iyi maaşlı bir iş bulma şansı en yüksek olan kişi, … kişidir.","ta":["Katolik olan","iyi eğitim almış olan","kadın olan","bir partiye üye olan"],"exp":"Doğru cevap iyi eğitim almış olmaktır. Almanya'da iş piyasasında belirleyici olan nitelik, diploma ve meslek eğitimidir. Din, cinsiyet veya parti üyeliği nedeniyle avantaj ya da dezavantaj sağlamak Temel Yasa'daki eşitlik ilkesine aykırıdır."},{"id":"G251","n":251,"scope":"general","cat":"gesellschaft","q":"Wenn man in Deutschland ein Kind schlägt, …","a":["geht das niemanden etwas an.","geht das nur die Familie etwas an.","kann man dafür nicht bestraft werden.","kann man dafür bestraft werden."],"c":3,"img":null,"tq":"Almanya'da bir çocuğa vurulursa, …","ta":["bu kimseyi ilgilendirmez.","bu yalnızca aileyi ilgilendirir.","bunun için ceza alınamaz.","bunun için ceza alınabilir."],"exp":"Doğru cevap: bunun için ceza alınabilir. Almanya'da çocukların şiddetsiz yetiştirilme hakkı vardır (Medeni Kanun § 1631); dayak, bedensel ceza ve aşağılama yasaktır. Bu bir aile içi mesele değil, devletin koruduğu bir haktır."},{"id":"G252","n":252,"scope":"general","cat":"gesellschaft","q":"In Deutschland …","a":["darf man zur gleichen Zeit nur mit einer Partnerin/einem Partner verheiratet sein.","kann man mehrere Ehepartnerinnen/Ehepartner gleichzeitig haben.","darf man nicht wieder heiraten, wenn man einmal verheiratet war.","darf eine Frau nicht wieder heiraten, wenn ihr Mann gestorben ist."],"c":0,"img":null,"tq":"Almanya'da …","ta":["aynı anda yalnızca bir eşle evli olunabilir.","aynı anda birden fazla eşe sahip olunabilir.","bir kez evlenmiş olan kişi yeniden evlenemez.","kocası ölen bir kadın yeniden evlenemez."],"exp":"Doğru cevap: aynı anda yalnızca bir eşle evli olunabilir. Almanya'da çok eşlilik (Bigamie) yasaktır ve suçtur. Buna karşılık boşandıktan veya eşi öldükten sonra yeniden evlenmek herkes için serbesttir."},{"id":"G253","n":253,"scope":"general","cat":"gesellschaft","q":"Wo müssen Sie sich anmelden, wenn Sie in Deutschland umziehen?","a":["beim Einwohnermeldeamt","beim Standesamt","beim Ordnungsamt","beim Gewerbeamt"],"c":0,"img":null,"tq":"Almanya'da taşındığınızda nereye kayıt yaptırmanız gerekir?","ta":["Nüfus kayıt dairesine (Einwohnermeldeamt)","Evlendirme dairesine (Standesamt)","Kamu düzeni dairesine (Ordnungsamt)","Ticaret/işyeri dairesine (Gewerbeamt)"],"exp":"Doğru cevap Einwohnermeldeamt'tır (nüfus kayıt dairesi): Yeni adrese taşındıktan sonra genellikle 2 hafta içinde buraya kayıt (Anmeldung) yaptırmak zorunludur. Standesamt evlilik ve doğum gibi medeni hal işleri, Gewerbeamt ise işyeri açma işleri içindir."},{"id":"G254","n":254,"scope":"general","cat":"gesellschaft","q":"In Deutschland dürfen Ehepaare sich scheiden lassen. Meistens müssen sie dazu das \"Trennungsjahr\" einhalten. Was bedeutet das?","a":["Der Scheidungsprozess dauert ein Jahr.","Die Ehegatten sind ein Jahr verheiratet, dann ist die Scheidung möglich.","Das Besuchsrecht für die Kinder gilt ein Jahr.","Die Ehegatten führen mindestens ein Jahr getrennt ihr eigenes Leben. Danach ist die Scheidung möglich."],"c":3,"img":null,"tq":"Almanya'da evli çiftler boşanabilir. Çoğunlukla bunun için \"ayrılık yılını\" (Trennungsjahr) tamamlamaları gerekir. Bu ne anlama gelir?","ta":["Boşanma davası bir yıl sürer.","Eşler bir yıl evli kalır, sonra boşanma mümkündür.","Çocuklar için görüşme hakkı bir yıl geçerlidir.","Eşler en az bir yıl ayrı yaşar ve kendi hayatlarını sürdürür. Bundan sonra boşanma mümkündür."],"exp":"Doğru cevap: Eşler en az bir yıl ayrı yaşar, sonra boşanma mümkündür. Trennungsjahr, evliliğin gerçekten bittiğinin kanıtı sayılan bir bekleme süresidir; eşler bu sürede ayrı hayat sürer. Davanın süresi veya evliliğin yaşı ile ilgisi yoktur."},{"id":"G255","n":255,"scope":"general","cat":"gesellschaft","q":"Bei Erziehungsproblemen können Eltern in Deutschland Hilfe erhalten vom …","a":["Ordnungsamt.","Schulamt.","Jugendamt.","Gesundheitsamt."],"c":2,"img":null,"tq":"Almanya'da çocuk yetiştirme sorunlarında ebeveynler … yardım alabilir.","ta":["kamu düzeni dairesinden (Ordnungsamt)","okul dairesinden (Schulamt)","gençlik dairesinden (Jugendamt)","sağlık dairesinden (Gesundheitsamt)"],"exp":"Doğru cevap Jugendamt'tır (gençlik dairesi): Çocuk ve gençlerin iyiliğinden sorumlu bu belediye kurumu, ailelere eğitim danışmanlığı ve destek sunar. Ordnungsamt kamu düzeniyle, Gesundheitsamt sağlıkla, Schulamt ise okul yönetimiyle ilgilenir."},{"id":"G256","n":256,"scope":"general","cat":"gesellschaft","q":"Ein Ehepaar möchte in Deutschland ein Restaurant eröffnen. Was braucht es dazu unbedingt?","a":["eine Erlaubnis der Polizei","eine Genehmigung einer Partei","eine Genehmigung des Einwohnermeldeamts","eine Gaststättenerlaubnis von der zuständigen Behörde"],"c":3,"img":null,"tq":"Bir evli çift Almanya'da bir restoran açmak istiyor. Bunun için mutlaka neye ihtiyaçları vardır?","ta":["polisten bir izin","bir partiden onay","nüfus kayıt dairesinden (Einwohnermeldeamt) onay","yetkili makamdan bir lokanta işletme ruhsatı (Gaststättenerlaubnis)"],"exp":"Doğru cevap yetkili makamdan alınacak lokanta işletme ruhsatıdır (Gaststättenerlaubnis). Alkol servisi yapan restoranlar için bu ruhsat zorunludur ve genellikle belediyenin ilgili dairesinden alınır. Polis, parti veya nüfus dairesi restoran açma izni vermez."},{"id":"G257","n":257,"scope":"general","cat":"gesellschaft","q":"Eine erwachsene Frau möchte in Deutschland das Abitur nachholen. Das kann sie an …","a":["einer Hochschule.","einem Abendgymnasium.","einer Hauptschule.","einer Privatuniversität."],"c":1,"img":null,"tq":"Yetişkin bir kadın Almanya'da Abitur'u sonradan tamamlamak istiyor. Bunu … yapabilir.","ta":["bir yüksekokulda (Hochschule)","bir akşam lisesinde (Abendgymnasium)","bir Hauptschule'de (temel ortaokul)","bir özel üniversitede"],"exp":"Doğru cevap Abendgymnasium'dur (akşam lisesi): Yetişkinler çalışırken akşam derslerine katılarak burada Abitur yapabilir. Bu yol \"ikinci eğitim yolu\" (zweiter Bildungsweg) olarak bilinir. Yüksekokul ve üniversiteye girmek için zaten Abitur gerekir; Hauptschule ise çocuklar içindir."},{"id":"G258","n":258,"scope":"general","cat":"gesellschaft","q":"Was darf das Jugendamt in Deutschland?","a":["Es entscheidet, welche Schule das Kind besucht.","Es kann ein Kind, das geschlagen wird oder hungern muss, aus der Familie nehmen.","Es bezahlt das Kindergeld an die Eltern.","Es kontrolliert, ob das Kind einen Kindergarten besucht."],"c":1,"img":null,"tq":"Almanya'da Jugendamt (gençlik dairesi) ne yapabilir?","ta":["Çocuğun hangi okula gideceğine karar verir.","Dövülen veya aç bırakılan bir çocuğu aileden alabilir.","Ebeveynlere çocuk parasını (Kindergeld) öder.","Çocuğun anaokuluna gidip gitmediğini denetler."],"exp":"Doğru cevap: Dövülen veya aç bırakılan bir çocuğu aileden alabilir. Jugendamt'ın görevi çocuğun iyiliğini korumaktır; ciddi tehlike durumunda çocuğu koruma altına alır. Kindergeld'i Familienkasse öder, okul seçimi ebeveynlere aittir ve anaokulu zorunlu değildir."},{"id":"G259","n":259,"scope":"general","cat":"gesellschaft","q":"Das Berufsinformationszentrum BIZ bei der Bundesagentur für Arbeit in Deutschland hilft bei der …","a":["Rentenberechnung.","Lehrstellensuche.","Steuererklärung.","Krankenversicherung."],"c":1,"img":null,"tq":"Almanya'da Federal İş Ajansı (Bundesagentur für Arbeit) bünyesindeki Meslek Bilgi Merkezi BIZ, … konusunda yardımcı olur.","ta":["emeklilik hesaplaması","çıraklık/meslek eğitimi yeri arama","vergi beyannamesi","sağlık sigortası"],"exp":"Doğru cevap çıraklık yeri aramadır (Lehrstellensuche). BIZ (Berufsinformationszentrum), gençlere ve iş arayanlara meslek seçimi, eğitim yerleri ve iş olanakları hakkında bilgi verir. Emeklilik, vergi ve sağlık sigortası başka kurumların alanıdır."},{"id":"G260","n":260,"scope":"general","cat":"gesellschaft","q":"In Deutschland hat ein Kind in der Schule …","a":["Recht auf unbegrenzte Freizeit.","Wahlfreiheit für alle Fächer.","Anspruch auf Schulgeld.","Anwesenheitspflicht."],"c":3,"img":null,"tq":"Almanya'da bir çocuğun okulda … vardır.","ta":["sınırsız boş zaman hakkı","tüm dersler için seçme özgürlüğü","okul parası alma hakkı","derslere katılma zorunluluğu"],"exp":"Doğru cevap derslere katılma zorunluluğudur (Anwesenheitspflicht). Almanya'da okul zorunludur (Schulpflicht) ve çocuklar derslere düzenli katılmak zorundadır; mazeretsiz devamsızlık ebeveynler için para cezasına yol açabilir. Dersler çoğunlukla zorunludur, seçmeli dersler sınırlıdır."},{"id":"G261","n":261,"scope":"general","cat":"gesellschaft","q":"Ein Mann möchte mit 30 Jahren in Deutschland sein Abitur nachholen. Wo kann er das tun? An …","a":["einer Hochschule.","einem Abendgymnasium.","einer Hauptschule.","einer Privatuniversität."],"c":1,"img":null,"tq":"Bir adam Almanya'da 30 yaşında Abitur'u sonradan tamamlamak istiyor. Bunu nerede yapabilir? …","ta":["Bir yüksekokulda (Hochschule).","Bir akşam lisesinde (Abendgymnasium).","Bir Hauptschule'de (temel ortaokul).","Bir özel üniversitede."],"exp":"Doğru cevap Abendgymnasium'dur (akşam lisesi): Yetişkinler için tasarlanmış bu okullarda, genellikle işten sonra akşam derslerine giderek Abitur alınabilir. Hochschule ve üniversiteler Abitur'u verenler değil, Abitur'dan sonra gidilen yerlerdir."},{"id":"G262","n":262,"scope":"general","cat":"gesellschaft","q":"Was bedeutet in Deutschland der Grundsatz der Gleichbehandlung?","a":["Niemand darf z.B. wegen einer Behinderung benachteiligt werden.","Man darf andere Personen benachteiligen, wenn ausreichende persönliche Gründe hierfür vorliegen.","Niemand darf gegen Personen klagen, wenn sie benachteiligt wurden.","Es ist für alle Gesetz, benachteiligten Gruppen jährlich Geld zu spenden."],"c":0,"img":null,"tq":"Almanya'da eşit muamele ilkesi (Gleichbehandlung) ne anlama gelir?","ta":["Hiç kimse örneğin bir engeli nedeniyle dezavantajlı duruma düşürülemez.","Yeterli kişisel gerekçe varsa başkalarına ayrımcılık yapılabilir.","Dezavantajlı duruma düşürülen kişiler kimseye dava açamaz.","Dezavantajlı gruplara her yıl para bağışlamak herkes için yasal zorunluluktur."],"exp":"Doğru cevap: Hiç kimse örneğin engeli nedeniyle dezavantajlı duruma düşürülemez. Temel Yasa'nın 3. maddesi herkesin yasa önünde eşit olduğunu söyler; cinsiyet, köken, din, engel gibi nedenlerle ayrımcılık yasaktır. Ayrımcılığa uğrayan kişi dava açabilir."},{"id":"G263","n":263,"scope":"general","cat":"gesellschaft","q":"In Deutschland sind Jugendliche ab 14 Jahren strafmündig. Das bedeutet: Jugendliche, die 14 Jahre und älter sind und gegen Strafgesetze verstoßen, …","a":["werden bestraft.","werden wie Erwachsene behandelt.","teilen die Strafe mit ihren Eltern.","werden nicht bestraft."],"c":0,"img":null,"tq":"Almanya'da gençler 14 yaşından itibaren cezai ehliyete sahiptir. Bu şu anlama gelir: 14 yaş ve üzeri olup ceza yasalarını ihlal eden gençler …","ta":["cezalandırılır.","yetişkinler gibi muamele görür.","cezayı ebeveynleriyle paylaşır.","cezalandırılmaz."],"exp":"Doğru cevap: cezalandırılır. 14 yaşından itibaren gençler işledikleri suçlardan kendileri sorumludur; ancak yetişkinler gibi değil, eğitimi ön planda tutan Gençlik Ceza Hukuku'na (Jugendstrafrecht) göre yargılanırlar. 14 yaş altı çocuklar ceza almaz."},{"id":"G264","n":264,"scope":"general","cat":"gesellschaft","q":"Zu welchem Fest tragen Menschen in Deutschland bunte Kostüme und Masken?","a":["am Rosenmontag","am Maifeiertag","beim Oktoberfest","an Pfingsten"],"c":0,"img":null,"tq":"Almanya'da insanlar hangi bayramda renkli kostümler ve maskeler takar?","ta":["Rosenmontag'da (Karnaval Pazartesisi)","1 Mayıs'ta (Maifeiertag)","Oktoberfest'te","Pfingsten'de (Hamsin Yortusu)"],"exp":"Doğru cevap Rosenmontag'dır: Karnaval (Karneval/Fasching) döneminin doruk noktası olan bu pazartesi günü, özellikle Köln, Düsseldorf ve Mainz'da kostümlü geçit törenleri yapılır. Oktoberfest bir bira festivalidir, Pfingsten ise dini bir bayramdır."},{"id":"G265","n":265,"scope":"general","cat":"gesellschaft","q":"Wohin muss man in Deutschland zuerst gehen, wenn man heiraten möchte?","a":["zum Einwohnermeldeamt","zum Ordnungsamt","zur Agentur für Arbeit","zum Standesamt"],"c":3,"img":null,"tq":"Almanya'da evlenmek isteyen biri önce nereye gitmelidir?","ta":["nüfus kayıt dairesine (Einwohnermeldeamt)","kamu düzeni dairesine (Ordnungsamt)","İş Ajansı'na (Agentur für Arbeit)","evlendirme dairesine (Standesamt)"],"exp":"Doğru cevap Standesamt'tır (evlendirme dairesi): Almanya'da yalnızca Standesamt'ta kıyılan nikah yasal geçerliliğe sahiptir; dini tören isteğe bağlıdır ve resmi nikahın yerine geçmez. Çift önce burada evlenme başvurusu (Anmeldung der Eheschließung) yapar."},{"id":"G266","n":266,"scope":"general","cat":"gesellschaft","q":"Wann beginnt die gesetzliche Nachtruhe in Deutschland?","a":["wenn die Sonne untergeht","wenn die Nachbarn schlafen gehen","um 0 Uhr, Mitternacht","um 22 Uhr"],"c":3,"img":null,"tq":"Almanya'da yasal gece sessizliği (Nachtruhe) ne zaman başlar?","ta":["güneş battığında","komşular uyumaya gittiğinde","saat 00.00'da, gece yarısı","saat 22.00'de"],"exp":"Doğru cevap saat 22.00'dir: Almanya'da gece sessizliği genel olarak 22.00 ile 06.00 arasındadır. Bu saatlerde yüksek sesli müzik, gürültülü iş ve benzeri davranışlardan kaçınılmalıdır. Kural güneşin batışına veya komşuların alışkanlıklarına değil, sabit bir saate bağlıdır."},{"id":"G267","n":267,"scope":"general","cat":"gesellschaft","q":"Eine junge Frau in Deutschland, 22 Jahre alt, lebt mit ihrem Freund zusammen. Die Eltern der Frau finden das nicht gut, weil ihnen der Freund nicht gefällt. Was können die Eltern tun?","a":["Sie müssen die Entscheidung der volljährigen Tochter respektieren.","Sie haben das Recht, die Tochter in die elterliche Wohnung zurückzuholen.","Sie können zur Polizei gehen und die Tochter anzeigen.","Sie suchen einen anderen Mann für die Tochter."],"c":0,"img":null,"tq":"Almanya'da 22 yaşındaki genç bir kadın erkek arkadaşıyla birlikte yaşıyor. Kadının ailesi bunu doğru bulmuyor, çünkü erkek arkadaşı beğenmiyorlar. Aile ne yapabilir?","ta":["Reşit olan kızlarının kararına saygı göstermek zorundadırlar.","Kızlarını aile evine geri getirme hakları vardır.","Polise gidip kızlarını şikayet edebilirler.","Kızları için başka bir erkek ararlar."],"exp":"Doğru cevap: Reşit olan kızlarının kararına saygı göstermek zorundadırlar. 18 yaşını dolduran herkes hayatını kendisi belirler; kiminle yaşayacağına yalnızca kendisi karar verir. Ailenin zorla eve getirme hakkı yoktur ve ortada polise bildirilecek bir suç da yoktur."},{"id":"G268","n":268,"scope":"general","cat":"gesellschaft","q":"Eine junge Frau will den Führerschein machen. Sie hat Angst vor der Prüfung, weil ihre Muttersprache nicht Deutsch ist. Was ist richtig?","a":["Sie muss mindestens zehn Jahre in Deutschland leben, bevor sie den Führerschein machen kann.","Wenn sie kein Deutsch kann, darf sie keinen Führerschein haben.","Sie muss den Führerschein in dem Land machen, in dem man ihre Sprache spricht.","Sie kann die Theorie-Prüfung vielleicht in ihrer Muttersprache machen. Es gibt mehr als zehn Sprachen zur Auswahl."],"c":3,"img":null,"tq":"Genç bir kadın ehliyet almak istiyor. Ana dili Almanca olmadığı için sınavdan korkuyor. Hangisi doğrudur?","ta":["Ehliyet alabilmesi için en az on yıl Almanya'da yaşamış olması gerekir.","Almanca bilmiyorsa ehliyet sahibi olamaz.","Ehliyeti, kendi dilinin konuşulduğu ülkede almalıdır.","Teori sınavını belki kendi ana dilinde yapabilir. Seçilebilecek ondan fazla dil vardır."],"exp":"Doğru cevap: Teori sınavını belki kendi ana dilinde yapabilir; ondan fazla dil seçeneği vardır. Almanya'da ehliyet teori sınavı Türkçe dahil 12 dilde yapılabilir. Ehliyet için Almanca bilme, uzun süre ikamet etme veya başka bir ülkeye gitme şartı yoktur."},{"id":"G269","n":269,"scope":"general","cat":"gesellschaft","q":"In Deutschland haben Kinder ab dem Alter von drei Jahren bis zur Ersteinschulung einen Anspruch auf …","a":["monatliches Taschengeld.","einen Platz in einem Sportverein.","einen Kindergartenplatz.","einen Ferienpass."],"c":2,"img":null,"tq":"Almanya'da çocuklar üç yaşından ilkokula başlayana kadar … hakkına sahiptir.","ta":["aylık harçlık","bir spor kulübünde yer","bir anaokulu yeri","bir tatil kartı (Ferienpass)"],"exp":"Doğru cevap bir anaokulu yeridir (Kindergartenplatz). Yasaya göre 3 yaşını dolduran her çocuğun okula başlayana kadar bir anaokulu yeri hakkı vardır; 2013'ten beri bu hak 1 yaşından itibaren kreş (Kita) yerini de kapsar. Harçlık veya spor kulübü yasal bir hak değildir."},{"id":"G270","n":270,"scope":"general","cat":"gesellschaft","q":"Die Volkshochschule in Deutschland ist eine Einrichtung …","a":["für den Religionsunterricht.","nur für Jugendliche.","zur Weiterbildung.","nur für Rentnerinnen und Rentner."],"c":2,"img":null,"tq":"Almanya'daki Volkshochschule (halk eğitim merkezi) … bir kurumdur.","ta":["din dersi için","yalnızca gençler için","yetişkin eğitimi (Weiterbildung) için","yalnızca emekliler için"],"exp":"Doğru cevap yetişkin eğitimi (Weiterbildung) içindir. Volkshochschule (VHS), her yaştan yetişkine açık, uygun fiyatlı dil, bilgisayar, kültür ve meslek kursları sunar; entegrasyon kursları da çoğunlukla burada yapılır. Belirli bir yaş grubuna veya dine bağlı değildir."},{"id":"G271","n":271,"scope":"general","cat":"gesellschaft","q":"Was ist in Deutschland ein Brauch zu Weihnachten?","a":["bunte Eier verstecken","einen Tannenbaum schmücken","sich mit Masken und Kostümen verkleiden","Kürbisse vor die Tür stellen"],"c":1,"img":null,"tq":"Almanya'da Noel'de (Weihnachten) hangi gelenek vardır?","ta":["renkli yumurtalar saklamak","bir çam ağacı süslemek","maske ve kostümlerle kılık değiştirmek","kapının önüne balkabağı koymak"],"exp":"Doğru cevap bir çam ağacı süslemektir (Tannenbaum). Noel ağacı Almanya'nın en köklü Noel geleneklerinden biridir ve 24 Aralık akşamı hediyeler bu ağacın altına konur. Yumurta saklamak Paskalya, kostüm Karnaval, balkabağı ise Cadılar Bayramı geleneğidir."},{"id":"G272","n":272,"scope":"general","cat":"gesellschaft","q":"Welche Lebensform ist in Deutschland nicht erlaubt?","a":["Mann und Frau sind geschieden und leben mit neuen Partnern zusammen.","Zwei Frauen leben zusammen.","Ein alleinerziehender Vater lebt mit seinen zwei Kindern zusammen.","Ein Mann ist mit zwei Frauen zur selben Zeit verheiratet."],"c":3,"img":null,"tq":"Almanya'da hangi yaşam biçimine izin verilmez?","ta":["Bir erkek ve bir kadın boşanmış, yeni eşleriyle birlikte yaşıyorlar.","İki kadın birlikte yaşıyor.","Bekar bir baba iki çocuğuyla birlikte yaşıyor.","Bir erkek aynı anda iki kadınla evli."],"exp":"Doğru cevap: Bir erkeğin aynı anda iki kadınla evli olması. Almanya'da çok eşlilik yasaktır ve suçtur. Buna karşılık boşanıp yeni partnerle yaşamak, eşcinsel çiftlerin birlikte yaşaması (2017'den beri evlenmesi de) ve tek ebeveynli aileler tamamen yasaldır."},{"id":"G273","n":273,"scope":"general","cat":"gesellschaft","q":"Bei Erziehungsproblemen gehen Sie in Deutschland …","a":["zur Ärztin/zum Arzt.","zum Gesundheitsamt.","zum Einwohnermeldeamt.","zum Jugendamt."],"c":3,
